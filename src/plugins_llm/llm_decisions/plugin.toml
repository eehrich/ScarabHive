# llm_decisions — clients for decision models: a questionnaire in, typed
# answers with probabilities out, no messages and no prose. A library, NOT a
# provider: no `type = ["llm-provider"]` and no `provides`, so the LLM registry
# skips this package — nothing here can serve `chat()`. Whoever wants a
# decision imports the client directly, the way the audio plugins import a TTS
# client. The manifest exists so scripts/aggregate_plugin_deps.py and the
# import-declaration guard (tests/pluginsystem/test_plugin_deps_declared.py)
# cover this package like every other plugin.
#
# Deliberately not inside llm_openrouter: that package declares the OpenRouter
# SDK (`openrouter>=1.1.108`), which pins pydantic<2.13 for the whole
# application. These clients speak plain httpx and must not inherit that.
[plugin]
name = "llm_decisions"
version = "0.1.0"
description = "Clients for decision models (OpenRouter Decisions API / TypeSafe Jev)"
author = "AgentSystem"
type = ["library"]
requires = { agent_system = ">=0.6.0" }
dependencies = []
