tools:
  - type: function
    function:
      name: "{{ name }}_forecast"
      description: Get current weather and multi-day forecasts. weather.gov covers only the US.
      parameters:
        type: object
        properties:
          location:
            type: string
            description: "City or coordinates ('Munich', '48.1351,11.5820'); weather.gov: US street address"
          source:
            type: string
            enum: [wttr.in, weather.gov, met.no]
            default: met.no
          days:
            type: integer
            minimum: 1
            maximum: 7
            default: 3
            description: "Number of forecast days"
          units:
            type: string
            enum: [metric, imperial]
            default: metric
            description: "Units; only wttr.in follows them"
          summary_format:
            type: string
            enum: [daily, hourly]
            default: daily
            description: "hourly adds the time steps"
        required: [location]
        additionalProperties: false

config:
  ssl_verify: true
