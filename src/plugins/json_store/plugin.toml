# json_store plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "json_store"
version = "1.0.0"
description = "Validated JSON working documents for agents (CRUD, code-side deep-merge, key models)"
author = "AgentSystem"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["tool-server"]
category = "tools"
tags = ["json", "data", "workflow"]
requires = { agent_system = ">=0.6.0" }
