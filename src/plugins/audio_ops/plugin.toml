# audio_ops plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "audio_ops"
version = "1.1.0"
description = "Audio file manipulation - cut, merge, mix, and copy segments from FLAC, MP3, WAV files"
author = "Enrico Ehrich"
entrypoint = "server:PLUGIN_FACTORY"
type = ["mcp-server"]
category = "media"
requires = { agent_system = ">=0.6.0" }
dependencies = ["numpy>=1.26", "pydub>=0.25.0"]
