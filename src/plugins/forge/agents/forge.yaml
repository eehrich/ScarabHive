# forge: GitLab and GitHub for the coder (docs/konzept.md).
#
# Hosts, repositories and their tokens are the operator's values and belong in
# config/plugins.yaml under plugins.servers.forge (README, "Configuration").
# This file is merged AFTER that one, so it sets nothing an operator would
# tune -- a value here would silently override theirs. Without a configured
# repository the instance offers no tools, so an installation without GitLab
# or GitHub loses nothing by this being enabled.
plugins:
  servers:

    forge:
      type: forge
      enabled: true
      description: "GitLab/GitHub: issues, merge/pull requests, CI, push and merge for configured repositories"
