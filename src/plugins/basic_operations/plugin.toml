# basic_operations plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "basic_operations"
version = "1.0.0"
description = "Basic utility operations including wait and ping"
author = "Enrico Ehrich"
entrypoint = "server:BasicOperationsServer"
type = ["mcp-server"]
category = "utilities"
requires = { agent_system = ">=0.6.0" }
