tools:
  - type: function
    function:
      name: "{{ name }}_tweets"
      description: Search recent tweets by query and return structured tweet metadata with user info, content, and engagement stats.
      parameters:
        type: object
        properties:
          query:
            type: string
            description: "Search query for tweets (supports hashtags, mentions, keywords)"
          limit:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            description: "Maximum number of tweets to return"
        required: [query]
        additionalProperties: false

