type: function
function:
  name: {{name}}
  description: Search recent tweets by query and return structured tweet metadata.
  parameters:
    type: object
    properties:
      action:
        type: string
        enum: [search]
      query:
        type: string
      limit:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      max_results:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    required: [query]
    additionalProperties: true
