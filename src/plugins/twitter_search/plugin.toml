# twitter_search plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "twitter_search"
version = "1.0.0"
description = "Twitter/X Search via official API v2 with tweepy - requires free API credentials"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["mcp-server"]
category = "tools"
requires = { agent_system = ">=0.6.0" }

# Python package requirements owned by this plugin.
dependencies = ["tweepy>=4.14.0"]
