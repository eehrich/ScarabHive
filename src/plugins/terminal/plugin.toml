# terminal plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "terminal"
version = "1.0.0"
description = "Secure bash command execution with process management"
author = "Enrico Ehrich"
entrypoint = "server:TerminalServer"
type = ["tool-server"]
category = "utilities"
requires = { agent_system = ">=0.6.0" }
