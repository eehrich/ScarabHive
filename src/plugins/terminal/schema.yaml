tools:
  - type: function
    function:
      name: "{{ name }}_execute"
      description: "Execute a shell command either synchronously (wait for completion) or as a background process.{% if whitelisted %} This terminal runs only the commands its configuration allows, in its configured working directory and environment.{% endif %}{{ sandbox_note }}"
      parameters:
        type: object
        properties:
          command:
            type: string
            description: "Shell command to execute"
          background:
            type: boolean
            default: false
            description: "Run as background process (default: false). If true, returns immediately with process_id."
          {% if not whitelisted %}cwd:
            type: string
            description: "Working directory for command execution (defaults to the terminal's configured start directory)"
          {% endif %}timeout:
            type: number
            minimum: 1
            maximum: {{ max_timeout }}
            default: {{ default_timeout }}
            description: "Timeout in seconds for foreground commands (1-{{ max_timeout }}, default: {{ default_timeout }}, ignored for background)"
          {% if not whitelisted %}env_vars:
            type: object
            description: "Environment variables to set (merged with current environment)"
            additionalProperties:
              type: string
          {% endif %}process_id:
            type: string
            description: "Custom process ID for background processes (auto-generated if omitted, only used when background=true)"
          wake:
            type: boolean
            default: false
            description: "Only with background=true: wake this session when the process ends, so you can end your turn instead of polling. When woken, call get_output with the process_id to read the result. The answer says whether the wake is armed; if it is not, poll instead. A wake is best effort even when armed - if you are not woken, fall back to polling."
        required: ["command"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_get_output"
      description: "Get stdout/stderr from a background process."
      parameters:
        type: object
        properties:
          process_id:
            type: string
            description: "process_id from execute with background=true"
          stream:
            type: string
            enum: ["stdout", "stderr", "both"]
            default: "both"
            description: "Which output stream to retrieve (stdout, stderr, or both). Each stream returns at most its last {{ max_output_kb }} KB; truncated: true says the start was cut"
          clear_buffer:
            type: boolean
            default: false
            description: "Clear the returned streams' buffers after reading, so the next call returns only newer output (default: false)"
        required: ["process_id"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_kill_process"
      description: "Terminate a background process."
      parameters:
        type: object
        properties:
          process_id:
            type: string
            description: "Process ID to kill (from execute with background=true)"
          force:
            type: boolean
            default: false
            description: "Use SIGKILL instead of SIGTERM (default: false). Without it a process still running after 5 seconds is killed anyway. On Windows both end the process at once"
        required: ["process_id"]
        additionalProperties: false

# Documentation only: nothing reads this block. The values are the defaults
# server.py applies when the server entry in config/plugins.yaml leaves a key out.
config:
  security:
    # Regexes (case-insensitive, anywhere in the command) refused on top of the
    # built-in hand-brake list in security.py. A hand-brake, not a boundary:
    # another spelling of the same command passes. None by default.
    blacklist: []
    # whitelist: []            # regexes matched at the start; see the guide
    # dangerous_patterns: []   # added to the built-in list
    allow_command_chains: true
    # true: commands also get the variables the server read from its secrets
    # files. Leaving them out is no boundary: the files stay readable.
    pass_secrets_env: false
  limits:
    # Output size matches GitHub Copilot's run_in_terminal limit (60KB)
    max_output_size_kb: 60
    default_timeout_seconds: 300
    max_timeout_seconds: 3600
    # per session; four times it over all sessions of the instance
    max_concurrent_background: 10
  # Process confinement for spawned commands. Omitted = danger-full-access,
  # i.e. exactly the behaviour before this existed. A pattern list can never
  # bound what `bash -c` can do; this hands the kernel a process that cannot
  # reach outside the workspace instead of inspecting the command text.
  #
  # Requires a backend: bubblewrap on Linux, Seatbelt (sandbox-exec) on
  # macOS. Where none is usable - Windows today - a confining mode makes every
  # command fail with SANDBOX_UNAVAILABLE rather than run unconfined.
  sandbox:
    mode: danger-full-access   # read-only | workspace-write | danger-full-access
    # workspace_root: .        # what workspace-write may write to; default = initial_cwd
  platform:
    # 'auto' = automatically detect bash location on system
    # Every command runs in a fresh `bash -c` (executor.py): a `cd` or an
    # `export` does not carry over to the next command.
    bash_path: auto
    # null = the directory the command was started in (relative paths are
    # resolved against the project); this is also the sandbox's workspace root
    initial_cwd: null
