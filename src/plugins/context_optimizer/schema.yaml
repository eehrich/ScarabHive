# Hook definitions for context_optimizer plugin
# Convention: hook name must match method name exactly
hooks:
  - name: optimize_context
    type: pre_llm_call
    enabled: true
    timeout: 30.0
    description: "Optimizes context before LLM calls by removing duplicates, truncating messages, and enforcing token limits"
    category: "context_optimization"
    order:
      after: ["context_engineering", "context_summarization"]
      before: ["prompt_injection"]
    
  - name: log_context_stats
    type: post_llm_call
    enabled: false
    timeout: 5.0
    description: "Logs context statistics after LLM calls (disabled by default)"
    category: "context_optimization"    
    order:
      after: ["begin"]
      before: ["end"]

# Configuration schema for this plugin
config:
  max_context_percentage:
    type: number
    default: 0.80
    description: "Maximum context usage as percentage of LLM context window (0.0-1.0). Triggers optimization when exceeded."
    minimum: 0.1
    maximum: 1.0
  
  max_message_length_tokens:
    type: integer
    default: 8000
    description: "Maximum length of individual messages in tokens (soft limit). Triggers optimization for oversized messages."
    minimum: 100
    maximum: 100000
  
  hard_max_message_length_tokens:
    type: integer
    default: 16000
    description: "Hard limit - force-truncate messages exceeding this token count even if JSON smart-truncation fails"
    minimum: 1000
    maximum: 100000
  
  max_json_string_length:
    type: integer
    default: 5000
    description: "Maximum length for individual strings within JSON tool responses during smart truncation"
    minimum: 100
    maximum: 100000
  
  keep_string_end:
    type: boolean
    default: true
    description: "When truncating strings, keep the end (newest data) instead of beginning"
  
  preserve_system_messages:
    type: boolean
    default: true
    description: "Always preserve system messages during optimization"
  
  preserve_last_n_messages:
    type: integer
    default: 5
    description: "Always preserve the last N messages"
    minimum: 1
    maximum: 100
  
  remove_duplicates:
    type: boolean
    default: true
    description: "Remove duplicate messages during optimization"
  
  truncate_mode:
    type: string
    enum: ["truncate_oldest", "truncate_middle"]
    default: "truncate_oldest"
    description: "Strategy for reducing context size (summarization moved to context_summarizer plugin)"
