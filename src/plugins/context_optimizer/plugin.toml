# context_optimizer plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "context_optimizer"
version = "1.0.0"
description = "Optimizes conversation context before LLM calls by removing redundant information, truncating long messages, and ensuring context stays within token limits.\n"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["hooks"]
category = "hooks"
requires = { agent_system = ">=0.6.0" }
