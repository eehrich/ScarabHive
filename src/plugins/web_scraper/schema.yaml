type: function
function:
  name: {{name}}
  description: >-
    Fetch and read a web page by URL to extract text content and structured data
    (tables, forms, lists). Enhanced with structured data extraction to reduce
    parsing errors and improve data quality.
  parameters:
    type: object
    properties:
      action:
        type: string
        enum: [fetch, links]
        description: "Use 'fetch' to download the page or 'links' to extract anchor hrefs"
      url:
        type: string
      timeout:
        type: number
        default: 20
        description: Request timeout in seconds
      include_html:
        type: boolean
        default: false
        description: Include raw HTML in response
      max_chars:
        type: integer
        default: 0
        description: "If >0, truncate extracted text to this length (0 = unlimited)"
      extract_tables:
        type: boolean
        default: false
      extract_forms:
        type: boolean
        default: false
      extract_lists:
        type: boolean
        default: false
      include_nofollow:
        type: boolean
        default: false
      only_same_domain:
        type: boolean
        default: false
      max_links:
        type: integer
        default: 0
        description: "Maximum number of links to return (0 = unlimited)"
      user_agent:
        type: string
    required: [url]
    additionalProperties: true
