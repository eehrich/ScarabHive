tools:
  - type: function
    function:
      name: scrape_webpage
      description: Scrape web pages to extract text content, structured data (tables, forms, lists), or extract all links. Supports flexible content extraction modes.
      parameters:
        type: object
        properties:
          url:
            type: string
            description: "Target URL to scrape"
          operation:
            type: string
            enum: [content, links]
            default: content
            description: "'content' extracts page content, 'links' extracts all anchor hrefs"
          timeout:
            type: number
            default: 20
            description: "Request timeout in seconds"
          include_html:
            type: boolean
            default: false
            description: "Include raw HTML in response"
          max_chars:
            type: integer
            default: 8000
            description: "Truncate text length (0=unlimited, default 8000 for token efficiency)"
          extract_tables:
            type: boolean
            default: false
            description: "Extract and structure table data"
          extract_forms:
            type: boolean
            default: false
            description: "Extract form elements and inputs"
          extract_lists:
            type: boolean
            default: false
            description: "Extract list structures (ul, ol, li)"
          include_nofollow:
            type: boolean
            default: false
            description: "Include nofollow links (for links operation)"
          only_same_domain:
            type: boolean
            default: false
            description: "Only extract links from same domain (for links operation)"
          max_links:
            type: integer
            default: 0
            description: "Maximum number of links to return (0=unlimited, for links operation)"
          user_agent:
            type: string
            description: "Custom User-Agent header for requests"
          ignore_cache:
            type: boolean
            default: false
            description: "Bypass cache and force fresh request"
          cache_ttl:
            type: integer
            description: "Custom cache TTL in seconds (overrides default)"
        required: [url]
        additionalProperties: false