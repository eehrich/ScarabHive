# TODO Management Plugin - Schema (Tools, Hooks, Config, Web UI)

web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Todos"
    description: "Tasks the agents track in their todo lists"
    icon: list-todo
    category: agents
    keywords: [todo, tasks]
    window: {width: 900, height: 700}
    contexts:
      session: "/plugins/{{ name }}/?session_id={session_id}"

  endpoints:
    - path: "/"
      method: "GET"
      handler: "get_panel"
      response_type: "html"
      description: "The Todos panel"

    - path: "/tasks"
      method: "GET"
      handler: "get_tasks"
      response_type: "json"
      description: "The tasks of a session (session_id)"

    - path: "/tasks/{task_id}/start"
      method: "POST"
      handler: "start_task"
      response_type: "json"
      description: "Start a task (in-progress)"

    - path: "/tasks/{task_id}/complete"
      method: "POST"
      handler: "complete_task"
      response_type: "json"
      description: "Complete a task"

    - path: "/tasks/{task_id}"
      method: "DELETE"
      handler: "delete_task"
      response_type: "json"
      description: "Delete a task no other task depends on"

hooks:
  - name: inject_todo_tasks
    type: pre_llm_call
    enabled: false # default is disabled
    timeout: 5.0
    description: "Append the active TODO tasks to the history before an LLM call"
    category: "prompt_injection"
    order:
      before: ["message_validation"]

config:
  max_tasks:
    type: integer
    default: 20
    description: "Maximum number of tasks listed in the injected block"
    minimum: 1
    maximum: 100
  
  filter_status:
    type: array
    default: ["not-started", "in-progress", "blocked"]
    description: "Task statuses to include in injection (active tasks)"
  
  include_completed:
    type: boolean
    default: false
    description: "Include completed tasks in injection"
  
  format:
    type: string
    default: "markdown"
    description: "Format for task injection: 'markdown' or 'text'"
  
  max_cache_size:
    type: integer
    default: 50
    description: "Maximum number of sessions to cache in memory before evicting oldest (disk fallback)"
    minimum: 10
    maximum: 500

tools:
  - type: function
    function:
      name: "{{ name }}"
      description: |
        Task management tool. Operations: create, update, delete, list, get, summary.
        
        ⚠️ CRITICAL: Task IDs are auto-generated. Always use the returned 'task_id' from responses.
        A title 95% or more like a task not completed returns that task_id (status 'exists'), not a new one.
      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: ["create", "update", "delete", "list", "get", "summary"]
            description: "Required operation: create (new task), update/delete/get (needs task_id), list (filter), summary (stats)"
          
          task_id:
            type: string
            description: "Task ID (format: task_NNN). Required for: get, update, delete. Use returned ID from create responses."
          
          title:
            type: string
            minLength: 1
            maxLength: 200
            description: "Task title (required for create). A title 95% or more like a task not completed returns that task."
          
          description:
            type: string
            maxLength: 2000
            description: "Task description (optional)"
          
          status:
            type: string
            enum: ["not-started", "in-progress", "completed", "blocked", "cancelled"]
            description: "Task status (optional)"
          
          progress:
            type: integer
            minimum: 0
            maximum: 100
            description: "Completion percentage 0-100 (optional)"
          
          priority:
            type: string
            enum: ["low", "medium", "high", "critical"]
            description: "Task priority (optional). create: medium when not given; update: changed only when given"
          
          tags:
            type: array
            items:
              type: string
              maxLength: 50
            maxItems: 20
            description: "Task tags (optional)"
          
          depends_on:
            type: array
            items:
              type: string
              pattern: "^task_\\d{3}$"
            maxItems: 50
            description: "Task dependencies (e.g., ['task_001']). Only use task IDs from actual create responses, not assumed IDs."
          
          allow_duplicates:
            type: boolean
            default: false
            description: "Allow duplicates (create). Default false: a title 95% or more like a task not completed returns that task."
          
          idempotency_key:
            type: string
            maxLength: 100
            description: "Idempotency key (create). Prevents duplicate creation on retries - same key returns existing task."
          
          note:
            type: string
            maxLength: 1000
            description: "Add note to task (for update operation)"
          
          cascade:
            type: boolean
            default: false
            description: "Also delete dependent tasks (for delete operation)"
          
          filter_status:
            type: array
            items:
              type: string
              enum: ["not-started", "in-progress", "completed", "blocked", "cancelled"]
            description: "Filter by status (for list operation)"
          
          filter_priority:
            type: array
            items:
              type: string
              enum: ["low", "medium", "high", "critical"]
            description: "Filter by priority (for list operation)"
          
          filter_tags:
            type: array
            items:
              type: string
            description: "Filter by tags (for list operation)"
          
          only_unblocked:
            type: boolean
            default: false
            description: "Only show unblocked tasks (for list operation)"
          
          limit:
            type: integer
            minimum: 1
            maximum: 1000
            description: "Max results (for list operation; every match when not given)"
          
          offset:
            type: integer
            minimum: 0
            default: 0
            description: "Number of results to skip for pagination (for list operation)"
        
        required: ["operation"]
        additionalProperties: false
