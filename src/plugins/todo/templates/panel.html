{% extends "kit/panel_base.html" %}
{% block title %}Todos{% endblock %}
{% block head %}<link rel="stylesheet" href="/plugins/{{ plugin }}/static/panel.css">{% endblock %}
{% block toolbar %}<pk-session></pk-session><pk-refresh interval="5" auto></pk-refresh>{% endblock %}
{% block content %}
<div class="pk-stats" id="stats"><span class="pk-skeleton"></span></div>
<div class="pk-row">
  <select id="statusFilter" class="pk-select pk-select--sm td-filter" aria-label="Status">
    <option value="">Every status</option>
    <option value="not-started">Not started</option>
    <option value="in-progress">In progress</option>
    <option value="blocked">Blocked</option>
    <option value="completed">Completed</option>
    <option value="cancelled">Cancelled</option>
  </select>
  <select id="priorityFilter" class="pk-select pk-select--sm td-filter" aria-label="Priority">
    <option value="">Every priority</option>
    <option value="critical">Critical</option>
    <option value="high">High</option>
    <option value="medium">Medium</option>
    <option value="low">Low</option>
  </select>
  <span class="pk-muted" id="shown"></span>
</div>
<div id="tasks" class="pk-stack"><span class="pk-skeleton"></span></div>
{% endblock %}
{% block scripts %}<script type="module" src="/plugins/{{ plugin }}/static/panel.js"></script>{% endblock %}
