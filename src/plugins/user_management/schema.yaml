# User Management Plugin Schema
# This plugin provides no tools - it's a web-only admin interface

tools: []

# Web UI configuration
web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Users"
    description: "User accounts, roles and permissions"
    icon: users
    category: admin
    keywords: [accounts, roles, permissions]
    window: {width: 960, height: 680}

  # Every data endpoint checks for an active admin itself (endpoints.py), on top of the route rules in config/security.yaml.
  endpoints:
    - path: "/"
      method: "GET"
      handler: "render_panel"
      response_type: "html"
      description: "The Users panel"

    - path: "/users"
      method: "GET"
      handler: "list_users"
      response_type: "json"
      description: "Every account, without credentials, and the requesting admin's id"

    - path: "/users"
      method: "POST"
      handler: "create_user"
      response_type: "json"
      description: "Create an account"

    - path: "/users/{user_id}"
      method: "PUT"
      handler: "update_user"
      response_type: "json"
      description: "Change email, full name, role, active state or password; only the fields sent"

    - path: "/users/{user_id}"
      method: "DELETE"
      handler: "delete_user"
      response_type: "json"
      description: "Delete an account"
