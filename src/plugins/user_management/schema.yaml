# User Management Plugin Schema
# This plugin provides no MCP tools - it's a web-only admin interface

tools: []

# Web UI configuration
web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Users"
    description: "User accounts, roles and permissions"
    icon: users
    category: admin
    keywords: [accounts, roles, permissions]
    window: {width: 960, height: 680}

  endpoints:
    - path: "/"
      method: "GET"
      handler: "user_management_home"
      response_type: "html"
      description: "Main user management dashboard UI"
    
    - path: "/users/list"
      method: "GET"
      handler: "list_users"
      response_type: "json"
      description: "List all users (admin only)"
    
    - path: "/users"
      method: "POST"
      handler: "create_user"
      response_type: "json"
      description: "Create new user (admin only)"
    
    - path: "/users/{user_id}"
      method: "GET"
      handler: "get_user"
      response_type: "json"
      description: "Get user details (admin only)"
    
    - path: "/users/{user_id}"
      method: "PUT"
      handler: "update_user"
      response_type: "json"
      description: "Update user details (admin only)"
    
    - path: "/users/{user_id}/toggle-active"
      method: "POST"
      handler: "toggle_user_active"
      response_type: "json"
      description: "Toggle user active status (admin only)"
    
    - path: "/users/{user_id}/change-role"
      method: "POST"
      handler: "change_user_role"
      response_type: "json"
      description: "Change user role (admin only)"
    
    - path: "/users/{user_id}"
      method: "DELETE"
      handler: "delete_user"
      response_type: "json"
      description: "Delete user (admin only)"
    
    - path: "/stats"
      method: "GET"
      handler: "get_stats"
      response_type: "json"
      description: "Get user statistics (admin only)"
    
    - path: "/static/{file_path:path}"
      method: "GET"
      handler: "serve_static"
      response_type: "response"
      description: "Static assets (CSS, JS, images)"

config:
  items_per_page: 20
  allow_self_delete: false
  show_api_keys: true
