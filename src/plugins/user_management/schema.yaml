# User Management Plugin Schema
# This plugin provides no MCP tools - it's a web-only admin interface

tools: []

# Web UI configuration
web_ui:
  # Header button configuration (optional)
  button:
    enabled: false  # Don't create a header button - only dropdown menu
    text: "User Management"
    icon: "👥"
    tooltip: "User administration dashboard"
  
  # Dropdown menu integration (optional)
  menu:
    enabled: true  # Add items to dropdown menus
    items:
      - id: "manage_users"
        menu_id: "user"  # Add to user dropdown
        section: "admin"  # Admin section within user menu
        label: "Manage Users"
        action: "openPanel"
        panel_id: "user_management"
        icon: "👥"
        requires_admin: true
        order: 50
        tooltip: "User administration dashboard"
  
  # Panel configuration
  panel:
    enabled: true
    title: "User Management"
    panel_id: "user_management"
    endpoint: "/plugins/user_management/"
    type: "iframe"  # Load as iframe - X-Frame-Options set to SAMEORIGIN in endpoints.py
    description: "Admin dashboard for managing user accounts, roles, and permissions"
  
  # Access control
  requires_auth: true
  requires_role: "admin"
  
  endpoints:
    - path: "/"
      method: "GET"
      handler: "user_management_home"
      response_type: "html"
      description: "Main user management dashboard UI"
    
    - path: "/users/list"
      method: "GET"
      handler: "list_users"
      response_type: "json"
      description: "List all users (admin only)"
    
    - path: "/users"
      method: "POST"
      handler: "create_user"
      response_type: "json"
      description: "Create new user (admin only)"
    
    - path: "/users/{user_id}"
      method: "GET"
      handler: "get_user"
      response_type: "json"
      description: "Get user details (admin only)"
    
    - path: "/users/{user_id}"
      method: "PUT"
      handler: "update_user"
      response_type: "json"
      description: "Update user details (admin only)"
    
    - path: "/users/{user_id}/toggle-active"
      method: "POST"
      handler: "toggle_user_active"
      response_type: "json"
      description: "Toggle user active status (admin only)"
    
    - path: "/users/{user_id}/change-role"
      method: "POST"
      handler: "change_user_role"
      response_type: "json"
      description: "Change user role (admin only)"
    
    - path: "/users/{user_id}"
      method: "DELETE"
      handler: "delete_user"
      response_type: "json"
      description: "Delete user (admin only)"
    
    - path: "/stats"
      method: "GET"
      handler: "get_stats"
      response_type: "json"
      description: "Get user statistics (admin only)"
    
    - path: "/static/{file_path:path}"
      method: "GET"
      handler: "serve_static"
      response_type: "response"
      description: "Static assets (CSS, JS, images)"

config:
  items_per_page: 20
  allow_self_delete: false
  show_api_keys: true
