name: user_management
version: "1.0.0"
summary: "Web UI for user administration with multi-user authentication"
homepage: "https://github.com/yourorg/agent-system"
authors:
  - "AgentSystem Team"
capabilities:
  - web_ui
  - admin_tools

mcp:
  enabled: false  # This plugin only provides web UI, no MCP tools

description: Provides a comprehensive web interface for user management.


configuration:
  items_per_page: 20
  allow_self_delete: false
  show_api_keys: true
  require_email_validation: false
