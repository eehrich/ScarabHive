<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Engineer - Statistics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #3e3e42;
        }

        .header h1 {
            color: #569cd6;
            font-size: 24px;
            font-weight: 600;
        }

        .stats-summary {
            display: flex;
            gap: 30px;
            font-size: 13px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-label {
            color: #858585;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            color: #4ec9b0;
            font-size: 18px;
            font-weight: 600;
            margin-top: 2px;
        }

        .stat-value.tokens {
            color: #dcdcaa;
        }

        /* Controls */
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: #1177bb;
        }

        button.icon-only {
            padding: 8px;
            width: 36px;
            height: 36px;
            justify-content: center;
        }

        button.icon-only.active {
            background: #16825d;
        }

        button.icon-only.active:hover {
            background: #1a9970;
        }

        #lastUpdate {
            color: #858585;
            font-size: 12px;
            margin-left: 10px;
        }

        /* Tab Controls */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #3e3e42;
            padding-bottom: 10px;
        }

        .tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #858585;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            border-radius: 4px 4px 0 0;
        }

        .tab:hover {
            color: #d4d4d4;
            background: #2d2d30;
        }

        .tab.active {
            color: #569cd6;
            background: #252526;
            border: 1px solid #3e3e42;
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 15px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* History Table */
        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th,
        .history-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #2d2d2d;
        }

        .history-table th {
            color: #569cd6;
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #1e1e1e;
        }

        .history-table tr:hover {
            background: #2d2d30;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge-layer1 {
            background: #1b5e20;
            color: #a5d6a7;
        }

        .badge-layer2 {
            background: #e65100;
            color: #ffcc80;
        }

        .badge-layer3 {
            background: #b71c1c;
            color: #ef9a9a;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 15px;
        }

        .stat-card h3 {
            color: #858585;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            color: #4ec9b0;
            font-size: 24px;
            font-weight: 600;
        }

        .stat-card .subvalue {
            color: #dcdcaa;
            font-size: 12px;
            margin-top: 4px;
        }

        /* Core Memory */
        .fact-list {
            list-style: none;
        }

        .fact-item {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .fact-item .category {
            color: #569cd6;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .fact-item .content {
            color: #d4d4d4;
        }

        .fact-item .meta {
            color: #858585;
            font-size: 11px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* Variables Table */
        .var-table {
            width: 100%;
            border-collapse: collapse;
        }

        .var-table th,
        .var-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #3e3e42;
        }

        .var-table th {
            background: #1e1e1e;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            color: #858585;
        }

        .var-table tr:last-child td {
            border-bottom: none;
        }

        .var-table tr:hover td {
            background: #2a2d2e;
        }

        .var-name {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #a371f7;
            font-weight: 500;
        }

        .var-preview {
            color: #858585;
            font-size: 12px;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge-text {
            background: rgba(206, 145, 120, 0.2);
            color: #ce9178;
        }

        .badge-json {
            background: rgba(86, 156, 214, 0.2);
            color: #569cd6;
        }

        .badge-other {
            background: rgba(133, 133, 133, 0.2);
            color: #858585;
        }

        .token-count {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #dcdcaa;
            font-weight: 600;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #858585;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #858585;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #3c3c3c;
            border-top-color: #007acc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Context Engineer</h1>
            <div class="stats-summary">
                <div class="stat-item">
                    <span class="stat-label">Total Compactions</span>
                    <span class="stat-value" id="total-compactions">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tokens Saved</span>
                    <span class="stat-value tokens" id="total-tokens-saved">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Avg Reduction</span>
                    <span class="stat-value" id="avg-reduction">-</span>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="icon-only" onclick="refreshAll()" title="Refresh">
                🔄
            </button>
            <button class="icon-only active" id="autoRefreshBtn" onclick="toggleAutoRefresh()" title="Auto-Refresh (30s) - Active">
                ⏱️
            </button>
            <span id="lastUpdate"></span>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="history">Compaction History</button>
            <button class="tab" data-tab="storage">Storage Stats</button>
            <button class="tab" data-tab="memory">Core Memory</button>
            <button class="tab" data-tab="variables">Variables</button>
        </div>

        <div class="content">
            <!-- History Tab -->
            <div class="tab-content active" id="tab-history">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Agent</th>
                            <th>Session</th>
                            <th>Before</th>
                            <th>After</th>
                            <th>Saved</th>
                            <th>Reduction</th>
                            <th>Layers</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr><td colspan="8" class="loading"><div class="spinner"></div>Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Storage Stats Tab -->
            <div class="tab-content" id="tab-storage">
                <div class="stats-grid" id="storage-stats">
                    <div class="loading"><div class="spinner"></div>Loading...</div>
                </div>
            </div>

            <!-- Core Memory Tab -->
            <div class="tab-content" id="tab-memory">
                <ul class="fact-list" id="memory-list">
                    <li class="loading"><div class="spinner"></div>Loading...</li>
                </ul>
            </div>

            <!-- Variables Tab -->
            <div class="tab-content" id="tab-variables">
                <table class="var-table">
                    <thead>
                        <tr>
                            <th>Variable Name</th>
                            <th>Type</th>
                            <th>Preview</th>
                            <th style="text-align: right;">Tokens</th>
                        </tr>
                    </thead>
                    <tbody id="var-list">
                        <tr><td colspan="4" class="loading"><div class="spinner"></div>Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const basePath = '/plugins/{{ plugin_name }}';
        
        // Get current session ID from multiple sources
        function getCurrentSessionId() {
            // Try to get from parent window's sessionManager
            try {
                if (window.parent && window.parent !== window && window.parent.sessionManager) {
                    const sessionId = window.parent.sessionManager.getCurrentSessionId();
                    if (sessionId) return sessionId;
                }
            } catch (e) {
                console.log('[Context Engineer] Cannot access parent sessionManager:', e.message);
            }
            
            // Parse from parent's DOM (header element)
            try {
                if (window.parent && window.parent !== window) {
                    const headerEl = window.parent.document.getElementById('headerSessionId');
                    if (headerEl && headerEl.textContent && headerEl.textContent !== '--') {
                        return headerEl.textContent;
                    }
                }
            } catch (e) {
                console.log('[Context Engineer] Cannot access parent DOM:', e.message);
            }
            
            // URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const urlSessionId = urlParams.get('session_id');
            if (urlSessionId) return urlSessionId;
            
            // LocalStorage fallback
            const storedSessionId = localStorage.getItem('currentSessionId');
            if (storedSessionId) return storedSessionId;
            
            return 'default';
        }
        
        let sessionId = getCurrentSessionId();
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
            });
        });

        // Format number with commas
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // Format timestamp with relative time
        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            const now = new Date();
            const diffMs = now - date;
            const diffSecs = Math.floor(diffMs / 1000);
            const diffMins = Math.floor(diffSecs / 60);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            // Relative time for recent events
            if (diffSecs < 60) {
                return 'just now';
            } else if (diffMins < 60) {
                return `${diffMins}m ago`;
            } else if (diffHours < 24) {
                return `${diffHours}h ago`;
            } else if (diffDays < 7) {
                return `${diffDays}d ago`;
            }
            
            // Absolute date for older events
            const options = { 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit'
            };
            return date.toLocaleString('en-US', options);
        }

        // Render layer badges
        function renderLayers(layers) {
            return layers.map(l => `<span class="badge badge-layer${l}">L${l}</span>`).join(' ');
        }

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch(`${basePath}/stats`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('total-compactions').textContent = formatNumber(data.total_events);
                    document.getElementById('total-tokens-saved').textContent = formatNumber(data.total_tokens_saved);
                    document.getElementById('avg-reduction').textContent = data.average_reduction_percent + '%';
                }
            } catch (e) {
                console.error('Error loading stats:', e);
            }
        }

        // Load history
        async function loadHistory() {
            try {
                const response = await fetch(`${basePath}/history?limit=50`);
                const data = await response.json();
                
                const tbody = document.getElementById('history-body');
                
                if (!data.success || !data.events || data.events.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="empty-state">No compaction events yet</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.events.map(event => `
                    <tr>
                        <td>${formatTime(event.timestamp)}</td>
                        <td style="color: #4fc3f7">${event.agent_name || '-'}</td>
                        <td>${event.session_id || '-'}</td>
                        <td>${formatNumber(event.original_tokens)}</td>
                        <td>${formatNumber(event.final_tokens)}</td>
                        <td style="color: #6ee56e">${formatNumber(event.tokens_saved)}</td>
                        <td>${event.reduction_percent.toFixed(1)}%</td>
                        <td>${renderLayers(event.layers_applied || [])}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Error loading history:', e);
                document.getElementById('history-body').innerHTML = 
                    `<tr><td colspan="8" class="empty-state">Error loading history</td></tr>`;
            }
        }

        // Load session details (storage stats)
        async function loadSessionDetails() {
            try {
                const url = `${basePath}/session_details${sessionId ? '?session_id=' + sessionId : ''}`;
                const response = await fetch(url);
                const data = await response.json();
                
                const container = document.getElementById('storage-stats');
                
                if (!data.success) {
                    container.innerHTML = `<div class="empty-state">No session data available</div>`;
                    return;
                }

                const toolResults = data.tool_results || {};
                const variables = data.variables || {};
                const coreMemory = data.core_memory || {};
                const archival = data.archival_memory || {};

                container.innerHTML = `
                    <div class="stat-card">
                        <h3>Tool Results</h3>
                        <div class="value">${formatNumber(toolResults.total_entries || 0)}</div>
                        <div class="subvalue">${formatNumber(toolResults.total_tokens_stored || 0)} tokens stored</div>
                    </div>
                    <div class="stat-card">
                        <h3>Variables</h3>
                        <div class="value">${formatNumber(variables.total_variables || 0)}</div>
                        <div class="subvalue">${formatNumber(variables.total_tokens || 0)} tokens</div>
                    </div>
                    <div class="stat-card">
                        <h3>Core Memory</h3>
                        <div class="value">${formatNumber(coreMemory.facts || 0)} facts</div>
                        <div class="subvalue">${formatNumber(coreMemory.token_usage || 0)} / 2000 tokens</div>
                    </div>
                    <div class="stat-card">
                        <h3>Archived Messages</h3>
                        <div class="value">${formatNumber(archival.total_messages || 0)}</div>
                        <div class="subvalue">${formatNumber(archival.total_tokens || 0)} tokens archived</div>
                    </div>
                `;
            } catch (e) {
                console.error('Error loading session details:', e);
                document.getElementById('storage-stats').innerHTML = 
                    `<div class="empty-state">Error loading storage stats</div>`;
            }
        }

        // Load core memory facts
        async function loadMemory() {
            try {
                const url = `${basePath}/session_details${sessionId ? '?session_id=' + sessionId : ''}`;
                const response = await fetch(url);
                const data = await response.json();
                
                const container = document.getElementById('memory-list');
                
                if (!data.success || !data.core_memory || !data.core_memory.facts_count) {
                    container.innerHTML = `<li class="empty-state">No core memory facts stored${sessionId ? ' for this session' : ''}.</li>`;
                    return;
                }
                
                const memory = data.core_memory;
                container.innerHTML = `
                    <li class="empty-state">
                        <strong>${memory.facts_count || 0}</strong> facts stored<br>
                        <strong>${memory.token_usage || 0}</strong> / 2000 tokens used<br>
                        <em>Facts are organized by category and stored in memory persistence files.</em>
                    </li>
                `;
            } catch (e) {
                console.error('Error loading memory:', e);
                document.getElementById('memory-list').innerHTML = 
                    `<li class="empty-state">Error loading memory data</li>`;
            }
        }

        // Load variables
        async function loadVariables() {
            try {
                const url = `${basePath}/session_details${sessionId ? '?session_id=' + sessionId : ''}`;
                const response = await fetch(url);
                const data = await response.json();
                
                const container = document.getElementById('var-list');
                
                if (!data.success || !data.variables || !data.variables.total_variables) {
                    container.innerHTML = `<tr><td colspan="4" class="empty-state" style="text-align: center; padding: 40px 20px; color: #858585;">No variables stored${sessionId ? ' for this session' : ''}.</td></tr>`;
                    return;
                }
                
                const vars = data.variables;
                const varDetails = vars.variables || [];
                
                if (varDetails.length === 0) {
                    container.innerHTML = `<tr><td colspan="4" class="empty-state" style="text-align: center; padding: 40px 20px; color: #858585;">No variable details available.</td></tr>`;
                    return;
                }
                
                function getBadgeClass(contentType) {
                    const type = contentType.toLowerCase();
                    if (type.includes('json')) return 'badge-json';
                    if (type.includes('text')) return 'badge-text';
                    return 'badge-other';
                }
                
                container.innerHTML = varDetails.map(v => `
                    <tr>
                        <td><span class="var-name">${v.name}</span></td>
                        <td><span class="badge ${getBadgeClass(v.content_type)}">${v.content_type}</span></td>
                        <td><div class="var-preview">${v.preview || 'No preview available'}</div></td>
                        <td style="text-align: right;"><span class="token-count">${formatNumber(v.tokens)}</span></td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Error loading variables:', e);
                document.getElementById('var-list').innerHTML = 
                    `<li class="empty-state">Error loading variables</li>`;
            }
        }

        // Refresh all data
        function refreshAll() {
            loadStats();
            loadHistory();
            loadSessionDetails();
            loadMemory();
            loadVariables();
            document.getElementById('lastUpdate').textContent = 
                'Updated: ' + new Date().toLocaleTimeString();
        }

        // Auto-refresh management
        let autoRefreshInterval = null;
        let autoRefreshEnabled = true;

        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            const btn = document.getElementById('autoRefreshBtn');
            
            if (autoRefreshEnabled) {
                btn.classList.add('active');
                btn.title = 'Auto-Refresh (30s) - Active';
                startAutoRefresh();
            } else {
                btn.classList.remove('active');
                btn.title = 'Auto-Refresh (30s) - Paused';
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) return;
            autoRefreshInterval = setInterval(refreshAll, 30000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // Initial load
        refreshAll();
        startAutoRefresh();
    </script>
</body>
</html>
