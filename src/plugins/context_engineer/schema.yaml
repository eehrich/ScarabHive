# Hook definitions for context_engineer plugin
# Convention: hook name must match method name exactly

hooks:
  - name: engineer_context
    type: pre_llm_call
    enabled: false
    timeout: 60.0
    description: "Context engineering: external storage for tool results and large content blocks (reversible optimizations only)"
    category: "context_engineering"
    order:
      after: ["begin"]
      before: ["context_summarization", "prompt_injection"]

# Tools - Manual context management controls
#
# The browsing surface is list / read — the verbs every model already uses for
# files, pointed at YOUR OWN conversation instead. They replaced `recall`, a
# single tool that guessed from the query which store was meant.
tools:
  - type: function
    function:
      name: "{{ name }}_list"
      description: |
        Browse or search YOUR OWN older context — the parts of this conversation
        that were moved out of it. NOT files on disk.

        Returns one line per item: its ref, size and a summary. With 'filter' the
        same lines come back narrowed to what matches, each carrying the matching
        excerpt — which is often already the whole answer. Bodies are never
        returned; use read on a ref when you need more of one item.

        Offsets work like reading a file: no offset gives you the END (what
        just left your context), a negative one counts back from there, 0 is
        the very beginning.

        - list()                        → the 20 most recent archived messages
        - list(offset=-50)              → 50 back from the end
        - list(offset=0)                → the oldest, from the start
        - list(section="tool_results")  → tool outputs and files stored away
        - list(filter="QS-4711")        → search everything, with excerpts
        - list(filter="blitter", section="tool_results")

        Without a filter this pages through ONE store, so 'section' defaults to
        the conversation. With a filter it searches all of them.
      parameters:
        type: object
        properties:
          filter:
            type: string
            description: "Words to look for. Omit to browse instead of search."
          section:
            type: string
            enum: ["all", "history", "tool_results", "facts"]
            description: "Which store. Defaults to 'history' when browsing, 'all' when filtering. 'all' requires a filter."
          offset:
            type: integer
            description: "Browsing only. Omit for the newest entries; negative counts back from the end; 0 or more is an absolute position. Use next_offset to walk forward."
          limit:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            description: "Entries per page (per store when filtering)."
          role:
            type: string
            description: "Only for section='history': filter by message role (user/assistant/tool)."
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_read"
      description: |
        Read ONE stored item by its ref. Always bounded — the answer says how
        much is left (next_offset) so you can continue.

        Refs come from list, or from the placeholder left where the
        content used to be in this conversation:
        - arch_… an archived message
        - TR_…   a stored tool result (also attached files)
        - a media file path to restore an image/audio back into context

        For a large item, use find= to get only the parts that mention
        something, instead of paging through all of it.

        - read(ref="TR_abc123")                       → first 2000 chars
        - read(ref="TR_abc123", offset=2000)          → the next piece
        - read(ref="TR_abc123", offset=-2000)         → the LAST 2000 chars
        - read(ref="TR_abc123", find="Kapitel 3")     → just the matching parts

        Reading a whole large item front to back puts it right back into the
        context it was removed from. Reach for find= or a negative offset.
      parameters:
        type: object
        properties:
          ref:
            type: string
            description: "The reference to read: arch_…, TR_… or a media path."
          offset:
            type: integer
            default: 0
            description: "Start position in characters. Negative counts back from the end (-2000 = the last 2000). Use next_offset to continue forward."
          limit:
            type: integer
            minimum: 1
            maximum: 5000
            default: 2000
            description: "Max characters to return."
          find:
            type: string
            description: "Return only the parts containing this text (with surrounding context), instead of a chunk."
        required:
          - ref
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_store_fact"
      description: |
        Store a key decision, user preference or project fact in core memory; it stays in view after compaction.
        Facts share a token budget: less important ones are evicted, and a fact that does not fit is refused.
      parameters:
        type: object
        properties:
          fact:
            type: string
            description: "Concise fact or decision"
          category:
            type: string
            enum: ["decisions", "preferences", "facts", "context", "tasks"]
            default: "facts"
          importance:
            type: number
            minimum: 0.0
            maximum: 1.0
            default: 0.5
            description: "Higher = less likely evicted"
        required:
          - fact
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_compact"
      description: |
        Compact the conversation if it has outgrown the automatic limits; below them it
        changes nothing, so don't call it ahead of time. Above them large tool results and
        files are stored externally with references and inline media is evicted
        (restorable with read).
      parameters:
        type: object
        properties: {}
        additionalProperties: false

# Slash commands — what a PERSON can trigger at the chat prompt, as opposed to
# the tools above, which the model calls. Each one runs one of these very
# tools, so it inherits the agent's allowlist: an agent without
# context_engineer_compact never sees /compact.
commands:
  - name: compact
    description: "shrink this conversation now — externalize tool results and media, no token threshold"
    tool: "{{ name }}_compact"

# Web UI configuration
web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Context Engineer"
    description: "Compactions, stored context and core memory facts of the context engineering"
    icon: brain
    category: context
    keywords: [compaction, memory, tokens]
    window: {width: 980, height: 700}
    contexts:
      session: "/plugins/{{ name }}/?session_id={session_id}"

  endpoints:
    - path: "/"
      method: "GET"
      handler: "get_panel"
      response_type: "html"
      description: "The Context Engineer panel"
    - path: "/history"
      method: "GET"
      handler: "get_history"
      response_type: "json"
      description: "The newest compactions of a session (session_id) or of all, and their figures"
    - path: "/session"
      method: "GET"
      handler: "get_session"
      response_type: "json"
      description: "What a session's stores hold (session_id): tool results, archived messages, core memory facts"

# Configuration schema for this plugin
config:
  # Tool Result Storage Settings
  tool_result_min_size:
    type: integer
    default: 500
    minimum: 10
    description: "Minimum token count to store tool results externally"

  tool_result_keep_last:
    type: integer
    default: 3
    minimum: 0
    maximum: 20
    description: "Keep last N tool results inline (unless they exceed max_inline_size)"

  tool_result_max_inline_size:
    type: integer
    default: 5000
    minimum: 1000
    maximum: 50000
    description: "Maximum token size for inline tool results. From layer1_threshold on, results exceeding this are archived even if in last N."

  tool_result_max_window_share:
    type: number
    default: 0.25
    minimum: 0.0
    maximum: 1.0
    description: "A NEW tool result larger than this share of the model's context window is stored on arrival, below every threshold and hysteresis (Pre-Layer T). Only the current round is touched: messages a request already carried stay as sent. 0 disables it."

  tool_result_summary_from:
    type: integer
    default: 0
    minimum: 0
    description: "A NEW tool result of this many tokens is stored on arrival AND a cheap model writes what it says into the placeholder the conversation keeps -- for hand-overs to an expensive agent, which pays for every token of a long answer it was handed. The full text stays in the store and is read back with the read tool. 0 disables it; a structured (JSON) result is never summarized, a wrapper around prose is summarized by its prose. Per agent via hooks.overrides."

  tool_result_summary_profile:
    type: string
    default: "summarizer"
    description: "The llm_profile that writes those summaries -- a NAME from config/llm.yaml, which is where the model behind it is chosen and changed. 'summarizer' ships as a cheap fast profile. Empty: nothing is summarized, whatever tool_result_summary_from says. Every summarized result goes to that profile's provider, file contents included -- pick one you trust with what the agent reads."

  tool_result_summary_tools:
    type: array
    default: []
    description: "Which tools' results may be summarized, as name patterns (fnmatch, e.g. [\"*_manage_sub_agent\", \"coding_cli_*\"]). The tool name starts with the instance name: coder_sam_manage_sub_agent. A key left blank per agent keeps the plugin value. Empty (default) means every tool -- right for an agent that only takes hand-overs, wrong for one that also reads files with the same hook, because a long file would arrive as a summary it has to read back. Per agent via hooks.overrides."

  # Tool Result Clearing (Legacy - kept for compatibility)

  # Memory Management
  session_ttl_seconds:
    type: integer
    default: 7200
    description: "Time in seconds before inactive sessions are cleaned up (default: 2 hours)"
    minimum: 60
    maximum: 86400

  max_tracked_sessions:
    type: integer
    default: 100
    description: "Maximum number of sessions to track before LRU eviction"
    minimum: 10
    maximum: 1000

  session_data_ttl_days:
    type: integer
    default: 0
    description: "Delete a session's on-disk data (archive, tool results, media) and its vectors after this many days without activity. 0 (default) keeps the sweep off — it only runs where the operator's config turns it on; config/plugins.yaml ships 14"
    minimum: 0
    maximum: 3650



  # Core Memory

  core_memory_max_tokens:
    type: integer
    default: 2000
    minimum: 500
    maximum: 10000
    description: "Maximum tokens for core memory section"


  # Archival Memory


  # Media Deduplication and Compaction
  deduplicate_media:
    type: boolean
    default: true
    description: "Auto-compact older duplicate media files (by file hash). Keeps only the newest occurrence of each media item."

  compact_media_after_user_message:
    type: boolean
    default: false
    description: "Compact all media from previous messages when a new user message arrives. Keeps only media in the most recent message."

  compact_media_after_final_response:
    type: boolean
    default: false
    description: "Has no effect: the hook runs before LLM calls only, and nothing hands it a final response. compact_media_after_user_message covers the next turn."

  always_compact_media_keep_last:
    type: integer
    default: 0
    minimum: 0
    description: "Always compact media regardless of token count. Keeps only the last N messages that contain media, plus what arrived since the model's last answer (a round of parallel tool calls may bring several images; the model sees each of them once). Set to 0 to disable, 5 to keep last 5 messages with media."

  always_compact_media_headroom:
    type: integer
    default: 0
    minimum: 0
    description: "How far below always_compact_media_keep_last an eviction goes. Nothing is evicted while at most keep_last messages carry media; once more do, only the newest max(1, keep_last - headroom) keep theirs. Each eviction rewrites an old message and breaks the provider prompt cache from there; with headroom that many new media messages arrive without a break after each one (one break per headroom+1 while keep_last - headroom >= 1), at the cost of fewer visible media right after it. keep_last stays the most the context carries, except for media the model has not seen yet. 0 = evict down to keep_last on every new media message."

  # Pre-Layer P: message limit
  max_messages:
    type: integer
    default: 0
    minimum: 0
    description: "Maximum message count before pruning oldest messages. Set to 0 to disable. Runs BEFORE token-based layers and whatever the token count: over the limit the hook runs on its own. Preserves tool call/result pairs."

  max_messages_prune_to:
    type: integer
    default: 0
    minimum: 0
    description: "How many messages a prune keeps (the hysteresis: max_messages 200, prune_to 100 = over 200, drop to 100). Each prune breaks the prompt cache; the next comes about max_messages - prune_to messages later (min_tokens_between_compactions can hold it longer), so deeper is rarer. Equal to max_messages prunes whenever the list is over the limit. 0, or above max_messages, = half of max_messages."

  # Cache-Hysterese: Mindest-Wachstum zwischen prefix-brechenden Kompaktionen
  # (jede History-Mutation bricht das Provider-Prompt-Caching komplett —
  # selten und tief kuerzen)
  min_tokens_between_compactions:
    type: integer
    default: 20000
    minimum: 0
    description: "Tokens the context must grow after a compaction before the message-rewriting layers (P, 1, 2, 3) run again, unless a deeper layer has become due since. Not for /compact or the byte limit; media passes are not held. Per agent overridable."

  # Compaction Strategy

  # Layered thresholds (percentage of context window)


  # Storage paths (relative to data_dir)