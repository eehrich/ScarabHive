# Hook definitions for context_engineer plugin
# Convention: hook name must match method name exactly

hooks:
  - name: engineer_context
    type: pre_llm_call
    enabled: false
    timeout: 60.0
    description: "Context engineering: external storage for tool results and large content blocks (reversible optimizations only)"
    category: "context_engineering"
    order:
      after: ["begin"]
      before: ["context_summarization", "context_optimization", "prompt_injection"]

# MCP Tools - Manual context management controls
#
# The browsing surface is list / search / read — the three verbs every model
# already uses for files, pointed at YOUR OWN conversation instead. `recall`
# below is the older single tool that guessed from the query which of five
# stores was meant; it still works but the three verbs are what to reach for.
tools:
  - type: function
    function:
      name: "{{ name }}_list"
      description: |
        Browse YOUR OWN older context that was moved out of the conversation.
        NOT files on disk — this is your archived history, tool outputs and
        stored blocks.

        Returns one line per item: its ref, size and a summary. Never content —
        pick a ref and use read on it.

        Start here when you know something happened earlier but not what it was
        called. Paginated: pass the returned next_offset to continue.

        - list() → the archived conversation, oldest first
        - list(section="tool_results") → tool outputs that were stored away
        - list(section="history", role="tool", limit=50) → only tool messages
      parameters:
        type: object
        properties:
          section:
            type: string
            enum: ["history", "tool_results", "variables", "facts"]
            default: "history"
            description: "Which store to browse. 'history' = archived messages."
          offset:
            type: integer
            minimum: 0
            default: 0
            description: "Skip this many entries. Use next_offset from the previous page."
          limit:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            description: "Entries per page."
          role:
            type: string
            description: "Only for section='history': filter by message role (user/assistant/tool)."
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_search"
      description: |
        Search YOUR OWN older context by keyword. NOT files on disk.

        Returns matching items as refs plus the matching snippet — never the
        full content. Read a ref afterwards to get the actual text.

        Use this when you have words to go on; use list when you do not.

        - search(query="chapter 3 assertions")
        - search(query="blitter", section="tool_results")
      parameters:
        type: object
        properties:
          query:
            type: string
            description: "Words to look for in archived messages, tool outputs and facts."
          section:
            type: string
            enum: ["all", "history", "tool_results", "facts"]
            default: "all"
            description: "Restrict the search to one store."
          limit:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
            description: "Max hits per store."
        required:
          - query
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_read"
      description: |
        Read ONE stored item by its ref. Always bounded — the answer says how
        much is left (next_offset) so you can continue.

        Refs come from list/search, or from the placeholder left where the
        content used to be in this conversation:
        - arch_… an archived message
        - TR_…   a stored tool result
        - $VAR_n a stored content block
        - a media file path to restore an image/audio

        For a large item, use find= to get only the parts that mention
        something, instead of paging through all of it.

        - read(ref="TR_abc123")                       → first 2000 chars
        - read(ref="TR_abc123", offset=2000)          → the next piece
        - read(ref="TR_abc123", find="Kapitel 3")     → just the matching parts
      parameters:
        type: object
        properties:
          ref:
            type: string
            description: "The reference to read: arch_…, TR_…, $VAR_n or a media path."
          offset:
            type: integer
            minimum: 0
            default: 0
            description: "Start position in characters. Use next_offset from the previous read."
          limit:
            type: integer
            minimum: 1
            maximum: 5000
            default: 2000
            description: "Max characters to return."
          find:
            type: string
            description: "Return only the parts containing this text (with surrounding context), instead of a chunk."
        required:
          - ref
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_recall"
      description: |
        DEPRECATED - prefer list / search / read, which say what they do and
        always answer in the same shape. Kept so existing agents keep working.

        Universal recall tool - retrieve ANY compacted/stored content from context.
        
        This single tool handles ALL content retrieval:
        1. Archived messages - search conversation history + core memory facts
        2. Variables ($VAR_N) - retrieve stored content blocks  
        3. Tool results (TR_xxx) - retrieve stored tool outputs
        4. Media files - restore compacted audio/image/video
        5. Core memory - search facts stored via store_fact
        
        The tool auto-detects what you need based on the query:
        - Plain text query → searches archived messages AND core memory facts
        - "$VAR_1" or "VAR_1" → retrieves that variable
        - "TR_abc123" or hash → retrieves that tool result
        - File path ending in media extension → restores media
        
        Examples:
        - recall(query="book_id phase blocker") → searches archive + core memory facts
        - recall(query="$VAR_1") → get variable content
        - recall(query="TR_abc123") → get tool result
        - recall(query="/path/to/audio.wav") → restore media file
        - recall(query="something I need to remember", mode="core_memory") → search only stored facts
      parameters:
        type: object
        properties:
          query:
            type: string
            description: "What to recall: search text, $VAR_N, TR_xxx reference, or file path for media"
          mode:
            type: string
            enum: ["auto", "archive", "variable", "tool_result", "media", "core_memory"]
            default: "auto"
            description: "Force specific recall type (default: auto-detect from query). Use 'core_memory' to search only facts stored via store_fact."
          limit:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
            description: "Max results for archive search"
        required:
          - query
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_store_fact"
      description: |
        Store an important fact or decision in core memory for persistent context.
        
        Core memory facts are always included in the system prompt, ensuring
        important information is never lost during context compaction.
        
        Use this for:
        - Key decisions made during conversation
        - Important user preferences discovered
        - Critical project facts to remember
        
        Facts are organized by category and limited to ~2000 tokens total.
        Lower importance facts are evicted when limit is reached.
      parameters:
        type: object
        properties:
          fact:
            type: string
            description: "The fact or decision to store (keep concise)"
          category:
            type: string
            enum: ["decisions", "preferences", "facts", "context", "tasks"]
            default: "facts"
            description: "Category to organize the fact under"
          importance:
            type: number
            minimum: 0.0
            maximum: 1.0
            default: 0.5
            description: "Importance score (0.0-1.0). Higher = less likely to be evicted"
        required:
          - fact
        additionalProperties: false

  # NOTE: get_variable, get_tool_result, and restore_multimodal are now unified 
  # into the recall tool above. The recall tool auto-detects query type.

  - type: function
    function:
      name: "{{ name }}_compact"
      description: |
        Manually trigger context engineering optimizations.        
        Use this to proactively reduce token usage before context gets too large.
        
        Applies reversible optimizations:
        - Store large tool results externally with references
        - Create variables ($VAR_N) for large content blocks
      parameters:
        type: object
        properties: {}
        additionalProperties: false

  # NOTE: restore_multimodal is now part of the unified recall tool.
  # Use recall(query="/path/to/file.wav") to restore media.

# Web UI configuration
web_ui:
  # Header button configuration
  button:
    enabled: true
    text: "{{ name }}"
    icon: "🔧"
    tooltip: "View context engineering statistics and optimization history"

  # Dropdown menu integration
  menu:
    enabled: true
    items:
      - id: "context_engineer"
        menu_id: "user"
        section: "Context Management"
        label: "Context Engineer"
        action: "openPanel"
        panel_id: "{{ name }}"
        icon: "🔧"
        requires_admin: false
        order: 110
        tooltip: "Context Engineer - Advanced context optimization"

  # Panel configuration
  panel:
    enabled: true
    title: "Context Engineer"
    panel_id: "{{ name }}"
    endpoint: "/plugins/{{ name }}/"
    type: "iframe"
    description: "View context engineering statistics including compaction history, core memory, and token savings"

  # API endpoints
  endpoints:
    - path: "/"
      methods: ["GET"]
      handler: "get_panel"
      response_type: "html"
      description: "Context engineer dashboard panel"
    - path: "/history"
      methods: ["GET"]
      handler: "get_history"
      response_type: "json"
      description: "Get compaction event history with token savings"
    - path: "/stats"
      methods: ["GET"]
      handler: "get_stats"
      response_type: "json"
      description: "Get aggregated context engineering statistics"
    - path: "/session_details"
      methods: ["GET"]
      handler: "get_session_details"
      response_type: "json"
      description: "Get detailed statistics for a specific session"

# Configuration schema for this plugin
config:
  # Tool Result Storage Settings
  tool_result_min_size:
    type: integer
    default: 500
    minimum: 10
    description: "Minimum token count to store tool results externally"

  tool_result_keep_last:
    type: integer
    default: 3
    minimum: 0
    maximum: 20
    description: "Keep last N tool results inline (unless they exceed max_inline_size)"

  tool_result_max_inline_size:
    type: integer
    default: 5000
    minimum: 1000
    maximum: 50000
    description: "Maximum token size for inline tool results. Results exceeding this are ALWAYS archived, even if in last N."

  # Tool Result Clearing (Legacy - kept for compatibility)
  tool_result_clearing_enabled:
    type: boolean
    default: true
    description: "Enable automatic tool result clearing for old tool outputs"

  # Memory Management
  session_ttl_seconds:
    type: integer
    default: 7200
    description: "Time in seconds before inactive sessions are cleaned up (default: 2 hours)"
    minimum: 60
    maximum: 86400

  max_tracked_sessions:
    type: integer
    default: 100
    description: "Maximum number of sessions to track before LRU eviction"
    minimum: 10
    maximum: 1000

  keep_recent_tools:
    type: integer
    default: 5
    minimum: 1
    maximum: 50
    description: "Number of recent tool results to keep uncleared"

  min_tool_result_size:
    type: integer
    default: 100
    minimum: 10
    description: "Minimum character count to trigger tool result clearing"

  # Variable Substitution
  variable_substitution_enabled:
    type: boolean
    default: true
    description: "Enable automatic variable substitution for large content"

  min_content_for_variable:
    type: integer
    default: 500
    minimum: 100
    description: "Minimum token count to trigger variable creation"

  # Core Memory
  core_memory_enabled:
    type: boolean
    default: true
    description: "Enable core memory for persistent facts"

  core_memory_max_tokens:
    type: integer
    default: 2000
    minimum: 500
    maximum: 10000
    description: "Maximum tokens for core memory section"

  auto_extract_decisions:
    type: boolean
    default: true
    description: "Automatically extract decisions from assistant messages"

  # Archival Memory
  archival_enabled:
    type: boolean
    default: true
    description: "Enable archival memory for old messages"

  archival_semantic_search:
    type: boolean
    default: false
    description: "Use ChromaDB for semantic search (requires chromadb)"

  # Media Deduplication and Compaction
  deduplicate_media:
    type: boolean
    default: true
    description: "Auto-compact older duplicate media files (by file hash). Keeps only the newest occurrence of each media item."

  compact_media_after_user_message:
    type: boolean
    default: false
    description: "Compact all media from previous messages when a new user message arrives. Keeps only media in the most recent message."

  compact_media_after_final_response:
    type: boolean
    default: false
    description: "Compact all media when the agent sends a final response (no tool calls). Useful for long-running sessions with lots of media."

  always_compact_media_keep_last:
    type: integer
    default: 0
    minimum: 0
    description: "Always compact media regardless of token count. Keeps only the last N messages that contain media. Set to 0 to disable, 5 to keep last 5 messages with media."

  # Pre-Layer P: Hard message limit
  max_messages:
    type: integer
    default: 0
    minimum: 0
    description: "Maximum message count before pruning oldest messages. Set to 0 to disable. Runs BEFORE token-based layers. Preserves tool call/result pairs."

  # Cache-Hysterese: Mindestabstand zwischen prefix-brechenden Kompaktionen
  # (jede History-Mutation bricht das Provider-Prompt-Caching komplett —
  # selten und tief kuerzen, docs/prompt_cache_design.md par. 3.5)
  min_time_between_compactions:
    type: number
    default: 120.0
    minimum: 0
    description: "Minimum seconds between compaction runs per session (anti-thrash; each run breaks the prompt-cache prefix)"

  # Compaction Strategy
  compaction_strategy:
    type: string
    enum: ["none", "layered", "aggressive"]
    default: "layered"
    description: "Compaction strategy: none, layered (progressive), aggressive"

  # Layered thresholds (percentage of context window)
  layer_tool_clearing:
    type: number
    default: 0.40
    minimum: 0.1
    maximum: 0.9
    description: "Trigger tool result clearing at this context usage"

  layer_variable_sub:
    type: number
    default: 0.50
    minimum: 0.1
    maximum: 0.9
    description: "Trigger variable substitution at this context usage"

  layer_archival_paging:
    type: number
    default: 0.60
    minimum: 0.1
    maximum: 0.9
    description: "Trigger archival paging at this context usage"

  # Storage paths (relative to data_dir)
  storage_dir:
    type: string
    default: "context_engineer"
    description: "Directory for storing context data (relative to data_dir)"
