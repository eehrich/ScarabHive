# context_engineer plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "context_engineer"
version = "1.0.0"
description = "Advanced context management with tool result clearing, variable substitution, core memory, and archival storage"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["mcp-server", "hooks", "web"]
category = "hooks"
requires = { agent_system = ">=0.7.0" }
