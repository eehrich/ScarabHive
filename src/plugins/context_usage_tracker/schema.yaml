# Hook definitions for context_usage_tracker plugin
hooks:
  - name: track_usage
    type: post_llm_call
    enabled: true
    timeout: 5.0
    description: "Records context usage statistics after each LLM call"
    order:
      after: ["begin"]
      before: ["end"]

web_ui:
  button:
    enabled: true
    icon: "📊"
    label: "Context Usage"
    tooltip: "View context and token usage statistics"
    
  panel:
    enabled: true
    title: "Context Usage Debug"
    panel_id: "{{ name }}"
    endpoint: "/plugins/{{ name }}/"
    type: "iframe"
    default_height: 600
    
  endpoints:
    - path: "/"
      method: "GET"
      handler: "get_panel"
      response_type: "html"
      description: "Render the context usage debug panel"
    - path: "/usage"
      method: "GET"
      handler: "get_usage"
      response_type: "json"
      description: "Get current usage statistics"
    - path: "/history"
      method: "GET"
      handler: "get_history"
      response_type: "json"
      description: "Get historical usage data"
    - path: "/clear"
      method: "POST"
      handler: "clear_history"
      response_type: "json"
      description: "Clear usage history"
