# Hook definitions for context_usage_tracker plugin
hooks:
  - name: track_usage
    type: post_llm_call
    enabled: true
    timeout: 5.0
    description: "Records context usage statistics after each LLM call"
    order:
      after: ["begin"]
      before: ["end"]

  # The client-level twin: the decisions client calls a provider with no agent
  # around it, so the hook above never sees it. It counts ONLY agent-less calls
  # -- post_llm_response fires for chat too, and counting those here would book
  # every chat call twice. TTS is not covered: its notification carries no
  # token usage at all (see the hook's docstring).
  - name: track_non_agent_usage
    type: post_llm_response
    enabled: true
    timeout: 5.0
    description: "Records what a client without an agent spends (decisions calls)"

web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Context & Cost Usage"
    description: "Context, token and cost usage per agent and per call"
    icon: chart-column
    category: context
    keywords: [tokens, cost, usage]
    window: {width: 900, height: 760}
    contexts:
      session: "/plugins/{{ name }}/?session_id={session_id}"

  endpoints:
    - path: "/"
      method: "GET"
      handler: "get_panel"
      response_type: "html"
      description: "Render the context usage debug panel"
    - path: "/usage"
      method: "GET"
      handler: "get_usage"
      response_type: "json"
      description: "Get current usage statistics"
    - path: "/history"
      method: "GET"
      handler: "get_history"
      response_type: "json"
      description: "Get historical usage data"
    - path: "/clear"
      method: "POST"
      handler: "clear_history"
      response_type: "json"
      description: "Clear usage history"
