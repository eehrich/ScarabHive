{% extends "kit/panel_base.html" %}
{% from "kit/macros.html" import icon %}
{% block title %}Context & Cost Usage{% endblock %}
{% block head %}<link rel="stylesheet" href="/plugins/{{ plugin }}/static/panel.css">{% endblock %}
{% block toolbar %}
<pk-session all></pk-session>
<pk-refresh interval="5" auto></pk-refresh>
<button id="clearButton" type="button" class="pk-btn pk-btn--ghost pk-btn--icon pk-btn--sm" aria-label="Clear the usage history" title="Clear the usage history">{{ icon('trash-2') }}</button>
{% endblock %}
{% block content %}
<div class="pk-stats" id="stats"><span class="pk-skeleton"></span></div>

<div class="pk-tabs" role="tablist" data-pk-tabs>
  <button class="pk-tab" role="tab" aria-selected="true" aria-controls="tab-overview" data-tab="overview">Overview</button>
  <button class="pk-tab" role="tab" aria-selected="false" aria-controls="tab-agents" data-tab="agents">Agents <span class="pk-tab-count" id="agentsCount"></span></button>
  <button class="pk-tab" role="tab" aria-selected="false" aria-controls="tab-llms" data-tab="llms">LLMs <span class="pk-tab-count" id="llmsCount"></span></button>
  <button class="pk-tab" role="tab" aria-selected="false" aria-controls="tab-calls" data-tab="calls">Calls <span class="pk-tab-count" id="callsCount"></span></button>
</div>
<section id="tab-overview" class="pk-stack" role="tabpanel">
  <div class="pk-row">
    <select id="chartAgent" class="pk-select pk-select--sm cu-filter" aria-label="Agent"><option value="">All agents</option></select>
    <span class="pk-muted">the newest 60 calls</span>
  </div>
  <div class="pk-card cu-chart"><canvas id="chart" role="img" aria-label="Tokens and cost per call"></canvas></div>
  <div id="overview"></div>
</section>
<section id="tab-agents" role="tabpanel" hidden><div id="agents"></div></section>
<section id="tab-llms" role="tabpanel" hidden><div id="llms"></div></section>
<section id="tab-calls" class="pk-stack" role="tabpanel" hidden>
  <div class="pk-row">
    <select id="callAgent" class="pk-select pk-select--sm cu-filter" aria-label="Agent"><option value="">All agents</option></select>
    <select id="callLimit" class="pk-select pk-select--sm cu-filter" aria-label="Calls shown">
      <option value="50">Newest 50</option>
      <option value="100" selected>Newest 100</option>
      <option value="250">Newest 250</option>
      <option value="500">Newest 500</option>
    </select>
    <span class="pk-muted" id="callsShown"></span>
  </div>
  <div id="calls"></div>
</section>

<dialog id="detail" class="pk-dialog pk-drawer" aria-labelledby="detailTitle">
  <div class="pk-dialog-head">
    <h2 id="detailTitle" class="pk-dialog-title pk-grow">Call</h2>
    <button type="button" class="pk-btn pk-btn--ghost pk-btn--icon pk-btn--sm" data-close aria-label="Close" title="Close">{{ icon('x') }}</button>
  </div>
  <div id="detailBody" class="pk-dialog-body"></div>
</dialog>
{% endblock %}
{% block scripts %}
<script src="/static/vendor/chartjs/chart.umd.min.js"></script>
<script type="module" src="/plugins/{{ plugin }}/static/panel.js"></script>
{% endblock %}
