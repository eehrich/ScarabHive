<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Context &amp; Cost Usage</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  /* VS Code dark theme — panel design standard (see message_debugger) */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1e1e1e; color: #d4d4d4; font-size: 13px; }
  .container { padding: 12px; max-width: 100%; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .header h1 { font-size: 16px; color: #569cd6; font-weight: 600; }
  .header-actions { display: flex; gap: 6px; }
  button { background: #0e639c; color: #fff; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  button:hover { background: #1177bb; }
  button.icon-only { background: #2d2d30; border: 1px solid #3e3e42; color: #d4d4d4; }
  button.icon-only:hover { background: #3e3e42; }
  button.icon-only.active { background: #16825d; border-color: #16825d; color: #fff; }
  button.danger { background: #5a1d1d; }
  button.danger:hover { background: #7a2727; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .stat-card { background: #252526; border: 1px solid #3e3e42; border-radius: 6px; padding: 10px 12px; }
  .stat-card .label { color: #858585; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat-card .value { font-size: 18px; font-weight: 600; margin-top: 3px; color: #d4d4d4; }
  .stat-card .sub { font-size: 11px; color: #858585; margin-top: 2px; }
  .stat-card.green .value { color: #4ec9b0; }
  .stat-card.blue .value { color: #569cd6; }
  .stat-card.orange .value { color: #ce9178; }
  .stat-card.purple .value { color: #c586c0; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid #3e3e42; margin-bottom: 10px; }
  .tab { background: transparent; color: #858585; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 7px 14px; font-size: 13px; }
  .tab:hover { background: #2d2d30; color: #d4d4d4; }
  .tab.active { color: #569cd6; border-bottom-color: #569cd6; background: transparent; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .filters { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .filters label { color: #858585; font-size: 12px; }
  select { background: #2d2d30; color: #d4d4d4; border: 1px solid #3e3e42; border-radius: 4px; padding: 4px 6px; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: right; color: #858585; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #3e3e42; white-space: nowrap; cursor: pointer; user-select: none; }
  th:first-child, td:first-child { text-align: left; }
  th.left { text-align: left; } /* headers over left-aligned text columns (Agent, Model) */
  th.sorted { color: #569cd6; }
  td { padding: 5px 8px; border-bottom: 1px solid #2d2d30; text-align: right; white-space: nowrap; }
  td.name { text-align: left; color: #9cdcfe; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  td.model { text-align: left; color: #858585; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  tr:hover td { background: #2a2d2e; }
  tr.clickable { cursor: pointer; }
  .cost { color: #4ec9b0; }
  .cost-est { color: #ce9178; } /* estimated from llm_pricing.yaml — not a billed price */
  .cached { color: #c586c0; }
  .muted { color: #858585; }
  .pct-bar { display: inline-block; min-width: 46px; }

  .chart-box { background: #252526; border: 1px solid #3e3e42; border-radius: 6px; padding: 10px; margin-bottom: 10px; height: 390px; }
  .empty { color: #858585; text-align: center; padding: 28px 0; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #252526; border: 1px solid #3e3e42; border-radius: 8px; padding: 16px; min-width: 340px; max-width: 90%; max-height: 80%; overflow: auto; }
  .modal h2 { font-size: 14px; color: #569cd6; margin-bottom: 10px; }
  .modal .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12px; }
  .modal .kv .k { color: #858585; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📊 Context &amp; Cost Usage</h1>
    <div class="header-actions">
      <button id="scopeBtn" class="icon-only active" title="Scope: current session / all sessions">🎯 Session</button>
      <button id="refreshBtn" class="icon-only" title="Refresh now">🔄</button>
      <button id="autoBtn" class="icon-only active" title="Auto-refresh (5s)">⏱ Auto</button>
      <button id="clearBtn" class="icon-only danger" title="Clear history">🗑</button>
    </div>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="agents">Agents</button>
    <button class="tab" data-tab="calls">Calls</button>
  </div>

  <div class="tab-content active" id="tab-overview">
    <div class="filters">
      <label>Agent</label>
      <select id="chartAgentFilter"><option value="">all</option></select>
    </div>
    <div class="chart-box"><canvas id="usageChart"></canvas></div>
    <div id="overviewStats"></div>
  </div>

  <div class="tab-content" id="tab-agents">
    <div id="agentsTable"></div>
  </div>

  <div class="tab-content" id="tab-calls">
    <div class="filters">
      <label>Agent</label>
      <select id="callAgentFilter"><option value="">all</option></select>
      <label>Show</label>
      <select id="callLimit">
        <option>50</option><option selected>100</option><option>250</option><option>500</option>
      </select>
      <span class="muted" id="callCount"></span>
    </div>
    <div id="callsTable"></div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h2>Call Detail</h2>
    <div class="kv" id="detailBody"></div>
    <div class="actions"><button onclick="panel.closeModals()">Close</button></div>
  </div>
</div>

<div class="modal-overlay" id="clearModal">
  <div class="modal">
    <h2>Clear history?</h2>
    <div>This removes all recorded calls and agent statistics.</div>
    <div class="actions">
      <button class="icon-only" onclick="panel.closeModals()">Cancel</button>
      <button class="danger" onclick="panel.doClear()">Clear</button>
    </div>
  </div>
</div>

<script>
const panel = {
  base: '/plugins/context_usage_tracker',
  scopeSession: true,
  autoTimer: null,
  chart: null,
  history: [],       // snapshots (scope-filtered by the server)
  agents: {},
  statistics: {},
  latest: null,
  agentSort: { key: 'total_cost', dir: -1 },

  // ---- session resolution (iframe -> parent bridges, same as before) ----
  getCurrentSessionId() {
    try {
      if (window.parent && window.parent !== window && window.parent.sessionManager) {
        const sid = window.parent.sessionManager.getCurrentSessionId();
        if (sid) return sid;
      }
    } catch (e) { /* cross-frame access denied */ }
    try {
      if (window.parent && window.parent !== window && window.parent.chatModule) {
        const sid = window.parent.chatModule.getCurrentSessionId?.();
        if (sid) return sid;
      }
    } catch (e) { /* ignore */ }
    try {
      if (window.parent && window.parent !== window) {
        const el = window.parent.document.getElementById('headerSessionId');
        if (el && el.textContent && el.textContent !== '--') return el.textContent;
      }
    } catch (e) { /* ignore */ }
    const url = new URLSearchParams(window.location.search).get('session_id');
    if (url) return url;
    return localStorage.getItem('currentSessionId') || null;
  },

  // ---- formatting ----
  esc(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; },
  n(x) { return (x ?? 0).toLocaleString('en-US'); },
  usd(c, dashIfNull = true) {
    if (c === null || c === undefined) return dashIfNull ? '<span class="muted">–</span>' : '$0';
    const v = Number(c);
    return '$' + (v >= 0.1 ? v.toFixed(3) : v.toFixed(4));
  },
  t(ts) { return new Date(ts * 1000).toLocaleTimeString(); },
  dt(ts) { const d = new Date(ts * 1000); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString(); },
  pct(x) { return (x ?? 0).toFixed(1) + '%'; },

  // ---- data ----
  async refresh() {
    const sid = this.scopeSession ? this.getCurrentSessionId() : null;
    const q = sid ? `?session_id=${encodeURIComponent(sid)}` : '';
    const qh = sid ? `&session_id=${encodeURIComponent(sid)}` : '';
    try {
      const [usage, hist] = await Promise.all([
        fetch(`${this.base}/usage${q}`, { cache: 'no-store' }).then(r => r.json()),
        fetch(`${this.base}/history?last_n=1000${qh}`, { cache: 'no-store' }).then(r => r.json()),
      ]);
      this.latest = usage.latest && Object.keys(usage.latest).length ? usage.latest : null;
      this.agents = usage.agents || {};
      this.statistics = usage.statistics || {};
      this.history = hist.history || [];
      this.renderAll();
    } catch (e) {
      console.error('[usage panel] refresh failed', e);
    }
  },

  renderAll() {
    // Tables first, chart last and isolated: a Chart.js failure (e.g. blocked
    // CDN) must not blank the Agents/Calls tabs — the data matters more than
    // the decoration.
    this.renderCards();
    this.renderOverviewStats();
    this.renderAgents();
    this.renderCalls();
    try {
      this.renderChart();
    } catch (e) {
      console.error('[usage panel] chart render failed', e);
      const box = document.querySelector('.chart-box');
      if (box && !box.dataset.failed) {
        box.dataset.failed = '1';
        box.innerHTML = '<div class="empty">Chart unavailable (Chart.js failed to load)</div>';
      }
    }
  },

  // ---- stat cards ----
  renderCards() {
    const tot = this.statistics.totals || {};
    const l = this.latest;
    const calls = this.history.length;
    const cacheSub = tot.prompt_tokens
      ? `${this.pct(tot.cache_hit_rate)} of ${this.n(tot.prompt_tokens)} prompt`
      : '';
    // Honest labeling: estimates (pricing table) are counted separately —
    // "billed" must only claim what the provider actually billed.
    const estN = tot.cost_estimated_calls || 0;
    const billedN = (tot.cost_known_calls || 0) - estN;
    const costSub = tot.cost_known_calls !== undefined && calls
      ? (estN > 0 ? `${billedN} billed · ~${estN} estimated` : `${billedN}/${calls} calls billed`)
      : '';
    const costPrefix = estN > 0 ? '~' : '';
    const ctxVal = l ? this.n(l.total_tokens) : '–';
    const ctxSub = l ? `${this.pct(l.usage_percentage)} of ${this.n(l.context_window)}${l.is_stale ? ' · stale' : ''}` : '';
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card green"><div class="label">Total Cost</div>
        <div class="value">${costPrefix}${this.usd(tot.cost ?? 0, false)}</div><div class="sub">${costSub}</div></div>
      <div class="stat-card blue"><div class="label">Calls</div>
        <div class="value">${this.n(calls)}</div><div class="sub">${this.scopeSession ? 'this session' : 'all sessions'}</div></div>
      <div class="stat-card"><div class="label">Output Tokens</div>
        <div class="value">${this.n(tot.completion_tokens ?? 0)}</div><div class="sub">prompt ${this.n(tot.prompt_tokens ?? 0)}</div></div>
      <div class="stat-card purple"><div class="label">Cached</div>
        <div class="value">${this.n(tot.cached_tokens ?? 0)}</div><div class="sub">${cacheSub}</div></div>
      <div class="stat-card orange"><div class="label">Cache Writes</div>
        <div class="value">${this.n(tot.cache_write_tokens ?? 0)}</div><div class="sub"></div></div>
      <div class="stat-card"><div class="label">Context Now</div>
        <div class="value">${ctxVal}</div><div class="sub">${ctxSub}</div></div>`;
  },

  // Keep an agent <select> in sync with the agents present in the data,
  // preserving the current selection (used by the chart and the calls tab).
  // Rebuild ONLY when the option set actually changed and the user is not
  // interacting with it — the 5s auto-refresh would otherwise collapse the
  // open native dropdown under the cursor.
  syncAgentSelect(sel) {
    if (document.activeElement === sel) return;
    const names = [...new Set(this.history.map(s => s.agent_name))].sort();
    const want = names.join('\x1f');
    if (sel.dataset.opts === want) return;
    const current = sel.value;
    sel.innerHTML = '<option value="">all</option>' +
      names.map(n => `<option${n === current ? ' selected' : ''}>${this.esc(n)}</option>`).join('');
    sel.dataset.opts = want;
  },

  // ---- overview chart ----
  renderChart() {
    const sel = document.getElementById('chartAgentFilter');
    this.syncAgentSelect(sel);
    let rows = this.history;
    if (sel.value) rows = rows.filter(s => s.agent_name === sel.value);
    const data = rows.slice(-60);
    const labels = data.map(s => this.t(s.timestamp));
    const ds = (label, key, color, dash) => ({
      label, data: data.map(s => s[key] ?? 0), borderColor: color, backgroundColor: color,
      borderWidth: 1.5, pointRadius: 0, tension: .25, borderDash: dash || [], yAxisID: 'y',
    });
    const cost = {
      label: 'cost $', data: data.map(s => s.cost ?? null), borderColor: '#4ec9b0', backgroundColor: '#4ec9b0',
      borderWidth: 1.5, pointRadius: 2, tension: .25, yAxisID: 'y2', spanGaps: true,
    };
    const cfg = {
      type: 'line',
      data: { labels, datasets: [
        ds('total', 'total_tokens', '#569cd6'),
        ds('prompt', 'prompt_tokens', '#ce9178', [4, 3]),
        ds('output', 'completion_tokens', '#d4d4d4', [2, 2]),
        ds('cached', 'cached_tokens', '#c586c0', [6, 3]),
        cost,
      ]},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { labels: { color: '#858585', boxWidth: 14, font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: '#858585', maxTicksLimit: 10, font: { size: 10 } }, grid: { color: '#2d2d30' } },
          y: { ticks: { color: '#858585', font: { size: 10 } }, grid: { color: '#2d2d30' } },
          y2: { position: 'right', ticks: { color: '#4ec9b0', font: { size: 10 } }, grid: { drawOnChartArea: false } },
        },
      },
    };
    if (this.chart) { this.chart.data = cfg.data; this.chart.update(); return; }
    this.chart = new Chart(document.getElementById('usageChart'), cfg);
  },

  renderOverviewStats() {
    const s = this.statistics;
    const el = document.getElementById('overviewStats');
    if (!s || !s.tokens) { el.innerHTML = '<div class="empty">No data yet</div>'; return; }
    el.innerHTML = `<table>
      <tr><th></th><th>current</th><th>min</th><th>max</th><th>avg</th></tr>
      <tr><td class="name">Context tokens</td><td>${this.n(s.tokens.current)}</td><td>${this.n(s.tokens.min)}</td>
          <td>${this.n(s.tokens.max)}</td><td>${this.n(Math.round(s.tokens.avg))}</td></tr>
      <tr><td class="name">Context usage</td><td>${this.pct(s.usage_percentage.current)}</td><td>${this.pct(s.usage_percentage.min)}</td>
          <td>${this.pct(s.usage_percentage.max)}</td><td>${this.pct(s.usage_percentage.avg)}</td></tr>
    </table>`;
  },

  // ---- agents tab ----
  sortAgents(key) {
    if (this.agentSort.key === key) this.agentSort.dir *= -1;
    else this.agentSort = { key, dir: -1 };
    this.renderAgents();
  },
  renderAgents() {
    const el = document.getElementById('agentsTable');
    const rows = Object.values(this.agents);
    if (!rows.length) { el.innerHTML = '<div class="empty">No agent activity yet</div>'; return; }
    const { key, dir } = this.agentSort;
    const sortVal = (a) => key === 'avg_cost'
      ? (a.cost_known_calls ? (a.total_cost ?? 0) / a.cost_known_calls : 0)
      : (a[key] ?? 0);
    rows.sort((a, b) => {
      const av = sortVal(a), bv = sortVal(b);
      const cmp = (typeof av === 'string' || typeof bv === 'string')
        ? String(av).localeCompare(String(bv))
        : av - bv;
      return dir === -1 ? -cmp : cmp;
    });
    const th = (label, k) =>
      `<th class="${key === k ? 'sorted' : ''}" onclick="panel.sortAgents('${k}')">${label}${key === k ? (dir === -1 ? ' ↓' : ' ↑') : ''}</th>`;
    el.innerHTML = `<table>
      <tr>
        ${th('Agent', 'agent_name')}${th('Calls', 'total_calls')}${th('Σ Tokens', 'total_tokens')}
        ${th('Σ Prompt', 'total_prompt_tokens')}${th('Σ Output', 'total_completion_tokens')}
        ${th('Σ Cached', 'total_cached_tokens')}${th('Σ Write', 'total_cache_write_tokens')}
        ${th('Σ Cost', 'total_cost')}${th('Ø $/Call', 'avg_cost')}${th('Peak', 'peak_tokens')}${th('Last', 'last_activity')}
      </tr>
      ${rows.map(a => {
        const hit = a.total_prompt_tokens ? (a.total_cached_tokens / a.total_prompt_tokens * 100) : 0;
        const avg = a.cost_known_calls ? a.total_cost / a.cost_known_calls : null;
        return `<tr>
          <td class="name" title="${this.esc(a.agent_id)}">${this.esc(a.agent_name)}</td>
          <td>${this.n(a.total_calls)}</td>
          <td>${this.n(a.total_tokens)}</td>
          <td>${this.n(a.total_prompt_tokens ?? 0)}</td>
          <td>${this.n(a.total_completion_tokens ?? 0)}</td>
          <td class="cached">${this.n(a.total_cached_tokens)} <span class="muted">(${hit.toFixed(0)}%)</span></td>
          <td>${this.n(a.total_cache_write_tokens ?? 0)}</td>
          <td class="${a.cost_estimated_calls ? 'cost-est' : 'cost'}"${a.cost_estimated_calls ? ' title="includes pricing-table estimates"' : ''}>${a.cost_estimated_calls ? '~' : ''}${this.usd(a.total_cost ?? 0, false)}</td>
          <td class="${a.cost_estimated_calls ? 'cost-est' : 'cost'}">${avg === null ? '<span class="muted">–</span>' : (a.cost_estimated_calls ? '~' : '') + this.usd(avg, false)}</td>
          <td>${this.n(a.peak_tokens)}</td>
          <td class="muted">${a.last_activity ? this.t(a.last_activity) : '–'}</td>
        </tr>`;
      }).join('')}
    </table>`;
  },

  // ---- calls tab ----
  renderCalls() {
    const el = document.getElementById('callsTable');
    const agentFilter = document.getElementById('callAgentFilter');
    const limit = parseInt(document.getElementById('callLimit').value, 10) || 100;

    // keep the agent filter options in sync with the data
    this.syncAgentSelect(agentFilter);

    let rows = this.history;
    if (agentFilter.value) rows = rows.filter(s => s.agent_name === agentFilter.value);
    document.getElementById('callCount').textContent = `${Math.min(limit, rows.length)} of ${rows.length}`;
    rows = rows.slice(-limit).reverse(); // newest first

    if (!rows.length) { el.innerHTML = '<div class="empty">No calls recorded</div>'; return; }
    // In session scope, calls from sub-sessions (sub-/sub-sub-agents pulled in
    // via the request-id tree) get a ↳ marker.
    const scopeSid = this.scopeSession ? this.getCurrentSessionId() : null;
    el.innerHTML = `<table>
      <tr><th>Time</th><th class="left">Agent</th><th class="left">Model</th><th>Prompt</th><th>Output</th>
          <th>Cached</th><th>Write</th><th>Ctx&nbsp;%</th><th>$</th></tr>
      ${rows.map((s, i) => `<tr class="clickable" onclick="panel.showDetail(${i})" data-i="${i}">
        <td class="name muted">${this.t(s.timestamp)}</td>
        <td class="name">${scopeSid && s.session_id !== scopeSid ? '<span class="muted" title="sub-agent call">↳ </span>' : ''}${this.esc(s.agent_name)}</td>
        <td class="model" title="${this.esc(s.model || '')}">${this.esc(s.model || '–')}</td>
        <td>${this.n(s.prompt_tokens)}</td>
        <td>${this.n(s.completion_tokens)}</td>
        <td class="cached">${this.n(s.cached_tokens)}</td>
        <td>${this.n(s.cache_write_tokens ?? 0)}</td>
        <td class="muted">${this.pct(s.usage_percentage)}</td>
        <td class="${s.cost_is_estimate ? 'cost-est' : 'cost'}"${s.cost_is_estimate ? ' title="estimated via llm_pricing.yaml — no billed cost from the provider"' : ''}>${s.cost_is_estimate ? '~' : ''}${this.usd(s.cost)}</td>
      </tr>`).join('')}
    </table>`;
    this._callRows = rows;
  },

  showDetail(i) {
    const s = (this._callRows || [])[i];
    if (!s) return;
    const kv = [
      ['Time', this.dt(s.timestamp)], ['Agent', s.agent_name], ['Agent id', s.agent_id],
      ['Model', s.model || '–'], ['Session', s.session_id], ['Request', s.request_id || '–'],
      ['Prompt tokens', this.n(s.prompt_tokens)], ['Output tokens', this.n(s.completion_tokens)],
      ['Total tokens', this.n(s.total_tokens)], ['Cached (read)', this.n(s.cached_tokens)],
      ['Cache write', this.n(s.cache_write_tokens ?? 0)], ['Tool-def tokens', this.n(s.tool_definition_tokens ?? 0)],
      ['Messages', this.n(s.message_count)],
      ['Context', `${this.n(s.total_tokens)} / ${this.n(s.context_window)} (${this.pct(s.usage_percentage)})`],
      ['Cost', s.cost === null || s.cost === undefined ? '–'
        : (s.cost_is_estimate ? '~$' + Number(s.cost).toFixed(6) + '  (estimated, llm_pricing.yaml)'
                              : '$' + Number(s.cost).toFixed(6))],
    ];
    document.getElementById('detailBody').innerHTML =
      kv.map(([k, v]) => `<div class="k">${k}</div><div>${this.esc(v)}</div>`).join('');
    document.getElementById('detailModal').classList.add('open');
  },

  // ---- actions ----
  closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open')); },
  async doClear() {
    this.closeModals();
    try { await fetch(`${this.base}/clear`, { method: 'POST' }); } catch (e) { console.error(e); }
    this.refresh();
  },
  toggleScope() {
    this.scopeSession = !this.scopeSession;
    const b = document.getElementById('scopeBtn');
    b.classList.toggle('active', this.scopeSession);
    b.textContent = this.scopeSession ? '🎯 Session' : '🌐 All';
    this.refresh();
  },
  toggleAuto() {
    const b = document.getElementById('autoBtn');
    if (this.autoTimer) { clearInterval(this.autoTimer); this.autoTimer = null; b.classList.remove('active'); }
    else { this.autoTimer = setInterval(() => this.refresh(), 5000); b.classList.add('active'); }
  },
  switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + name));
  },

  init() {
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => this.switchTab(t.dataset.tab)));
    document.getElementById('refreshBtn').addEventListener('click', () => this.refresh());
    document.getElementById('scopeBtn').addEventListener('click', () => this.toggleScope());
    document.getElementById('autoBtn').addEventListener('click', () => this.toggleAuto());
    document.getElementById('clearBtn').addEventListener('click', () => document.getElementById('clearModal').classList.add('open'));
    document.getElementById('callAgentFilter').addEventListener('change', () => this.renderCalls());
    document.getElementById('callLimit').addEventListener('change', () => this.renderCalls());
    document.getElementById('chartAgentFilter').addEventListener('change', () => this.renderChart());
    document.querySelectorAll('.modal-overlay').forEach(m =>
      m.addEventListener('click', e => { if (e.target === m) this.closeModals(); }));
    this.autoTimer = setInterval(() => this.refresh(), 5000);
    this.refresh();
  },
};
panel.init();
</script>
</body>
</html>
