# Hook definitions for context_summarizer plugin
# Convention: hook name must match method name exactly
hooks:
  - name: summarize_context
    type: pre_llm_call
    enabled: true
    timeout: 900.0
    description: "Intelligently summarizes older messages using LLM to reduce context size while preserving key information"
    category: "context_summarization"
    order:
      after: ["context_engineering"]

# Tools - Manual summarization controls
tools:
  - type: function
    function:
      name: "{{ name }}_summarize"
      description: |
        Manually trigger context summarization when conversation history becomes too long or irrelevant.

        Use this when:
        - You notice the conversation is getting very long
        - Old information is no longer needed for current task
        - You want to reduce token usage
        - Context window is approaching limits

        The summarization will:
        - Preserve recent messages (default: last 10)
        - Preserve all system messages
        - Create concise summaries of older message blocks
        - Update the conversation with summarized version

        Example: If context feels cluttered with old discussion, call this to compress history.
      parameters:
        type: object
        properties:
          reason:
            type: string
            description: "Optional reason for summarization (for logging). Example: 'long planning discussion complete', 'switching topics'"
          chunk_size:
            type: integer
            minimum: 2
            maximum: 50
            default: 10
            description: "Number of older messages to summarize together. Larger = more aggressive compression."
          preserve_recent:
            type: integer
            minimum: 2
            maximum: 100
            default: 10
            description: "Number of recent messages to keep untouched. Increase if you need more recent context."
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_check_stats"
      description: |
        Check current conversation context statistics to decide if summarization is needed.

        Returns:
        - Total message count
        - Estimated token usage
        - Context window utilization percentage
        - Recommendation (summarize vs ok)

        Use this to assess if manual summarization would be beneficial before calling summarize.
      parameters:
        type: object
        properties: {}
        additionalProperties: false

# Slash commands — what a PERSON can trigger at the chat prompt. Each one runs
# one of the tools above through the agent's own dispatch, so it inherits the
# allowlist: an agent without these tools never sees the commands.
commands:
  - name: summarize
    description: "summarize older messages now to shrink this conversation"
    tool: "{{ name }}_summarize"
    argument: reason
    argument_hint: "[reason]"
  - name: stats
    description: "show context usage — message count, tokens, utilization"
    tool: "{{ name }}_check_stats"

# Configuration schema for this plugin
config:
  summarization_trigger_percentage:
    type: number
    default: 0.60
    description: "Start summarization when context exceeds this percentage of LLM context window (0.0-1.0)"
    minimum: 0.1
    maximum: 0.95

  max_messages:
    type: integer
    default: 0
    description: "Trigger summarization when message count exceeds this limit (0 = disabled, token-based only). When both max_messages and token threshold are configured, summarization triggers when EITHER condition is met."
    minimum: 0
    maximum: 10000

  summarization_chunk_size:
    type: integer
    default: 10
    description: "Number of older messages to summarize in one batch"
    minimum: 2
    maximum: 50

  max_chunks:
    type: integer
    default: 10
    description: "Maximum number of parallel chunks to process. If message count would exceed this, chunk_size is automatically increased. Set to 0 to disable limit."
    minimum: 0
    maximum: 100

  preserve_recent_count:
    type: integer
    default: 10
    description: "Always preserve the last N messages without summarization"
    minimum: 2
    maximum: 100

  preserve_system_messages:
    type: boolean
    default: true
    description: "Always preserve system messages during summarization"

  llm_profile:
    type: string
    default: "turbo"
    description: "LLM profile for summarization. config/plugins.yaml picks the effective one; this default only applies when it does not."
    enum: ["turbo", "normal", "chat", "chat-nostream", "or-deepseek-flash", "think"]

  max_tracked_sessions:
    type: integer
    default: 200
    description: "Maximum number of sessions to track for summarization timestamps (LRU eviction)"
    minimum: 50
    maximum: 1000

  summary_prompt_template:
    type: string
    default: |
      Summarize the following conversation messages concisely while preserving all key information, decisions, and context.
      Focus on facts, actions, and important details. Keep the summary clear and structured.

      Messages to summarize:
      {messages}

      Provide a concise summary:
    description: "Template for the summarization prompt. Use {messages} placeholder for message content."

  min_summary_reduction:
    type: number
    default: 0.3
    description: "Minimum reduction ratio (0-1) to accept summary. If summary doesn't reduce by at least this much, keep original."
    minimum: 0.1
    maximum: 0.9

  store_original_metadata:
    type: boolean
    default: true
    description: "Store original messages in metadata for audit trail and debugging"

  summary_marker_format:
    type: string
    default: "[Summary of {count} messages from {start_time} to {end_time}]"
    description: "Format for summary marker. Placeholders: {count}, {start_time}, {end_time}"

  min_time_between_summarizations:
    type: number
    default: 200.0
    description: "Minimum time in seconds between summarizations for the same session (prevents endless loops)"
    minimum: 10.0
    maximum: 3600.0

# Web UI configuration
web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Context Summarizer"
    description: "Summarization events with message counts and token savings"
    icon: scroll-text
    category: context
    keywords: [summary, tokens]
    window: {width: 980, height: 700}
    contexts:
      session: "/plugins/{{ name }}/?session_id={session_id}"

  endpoints:
    - path: "/"
      method: "GET"
      handler: "render_panel"
      response_type: "html"
      description: "The Context Summarizer panel"
    - path: "/history"
      method: "GET"
      handler: "get_history"
      response_type: "json"
      description: "The newest events of a session (session_id) or of all, without their messages, and their figures"
    - path: "/events/{event_id}"
      method: "GET"
      handler: "get_event"
      response_type: "json"
      description: "One event with the messages it removed and the summaries that replaced them"
    - path: "/clear"
      method: "POST"
      handler: "clear_history"
      response_type: "json"
      description: "Forget every event of every session"
