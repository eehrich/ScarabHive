<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Summarization History</title>    <link rel="stylesheet" href="/static/css/scrollbar.css">    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #569cd6;
            font-size: 24px;
            font-weight: 400;
        }

        .stats-summary {
            display: flex;
            gap: 30px;
            font-size: 13px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-label {
            color: #858585;
            font-size: 11px;
        }

        .stat-value {
            color: #4ec9b0;
            font-size: 18px;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button.icon-only {
            padding: 8px;
            width: 36px;
            height: 36px;
            justify-content: center;
        }

        button.icon-only.active {
            background: #16825d;
        }

        button.icon-only.active:hover {
            background: #1a9970;
        }

        /* History List */
        .history-container {
            flex: 1;
            overflow-y: auto;
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 15px;
        }

        .history-item {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: #2a2a2a;
            border-color: #569cd6;
        }

        .history-item.expanded {
            border-color: #569cd6;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-timestamp {
            color: #569cd6;
            font-weight: 500;
            font-size: 14px;
        }

        .item-session {
            color: #858585;
            font-size: 12px;
            margin-left: 10px;
        }

        .item-stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
        }

        .item-stat {
            display: flex;
            flex-direction: column;
        }

        .item-stat-label {
            color: #858585;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .item-stat-value {
            color: #d4d4d4;
            font-weight: 500;
        }

        .item-stat-value.positive {
            color: #4ec9b0;
        }

        .item-stat-value.reduction {
            color: #569cd6;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.success {
            background: #1e3e1e;
            color: #4ec9b0;
            border: 1px solid #2d6a2f;
        }

        .status-badge.rejected {
            background: #3e3e1e;
            color: #dcdcaa;
            border: 1px solid #6b5a2d;
        }

        .status-badge.skipped {
            background: #2d2d30;
            color: #858585;
            border: 1px solid #3e3e42;
        }

        /* Expandable Details */
        .item-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #3e3e42;
        }

        .item-details.visible {
            display: block;
        }

        .messages-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .message-column {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 12px;
        }

        .message-column-title {
            color: #569cd6;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .message-item {
            background: #1e1e1e;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 12px;
            border-left: 3px solid #569cd6;
        }

        .message-role {
            color: #569cd6;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .message-content {
            color: #d4d4d4;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #858585;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
        }

        /* Scrollbar styling */
        .history-container::-webkit-scrollbar {
            width: 10px;
        }

        .history-container::-webkit-scrollbar-track {
            background: #252526;
        }

        .history-container::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 5px;
        }

        .history-container::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }

        /* Loading indicator */
        .loading {
            text-align: center;
            padding: 20px;
            color: #858585;
        }

        .spinner {
            border: 3px solid #3e3e42;
            border-top: 3px solid #569cd6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with stats -->
        <div class="header">
            <h1>🧠 Context Summarization History</h1>
            <div class="stats-summary">
                <div class="stat-item">
                    <span class="stat-label">Total Events</span>
                    <span class="stat-value" id="total-events">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tokens Saved</span>
                    <span class="stat-value" id="total-tokens-saved">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Avg Reduction</span>
                    <span class="stat-value" id="avg-reduction">0%</span>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="icon-only" onclick="refreshHistory()" title="Refresh">🔄</button>
            <button class="icon-only" onclick="clearHistory()" title="Clear History" style="margin-left: auto;">🗑️</button>
            <span style="color: #858585; margin-left: 10px; font-size: 12px;" id="last-updated">
                Last updated: Never
            </span>
        </div>

        <!-- History Container -->
        <div class="history-container" id="history-container">
            <div class="loading">
                <div class="spinner"></div>
                <div>Loading summarization history...</div>
            </div>
        </div>
    </div>

    <script>
        // Prevent parent page scroll when scrolling in this panel
        document.addEventListener('wheel', function(e) {
            const scrollable = document.scrollingElement || document.documentElement;
            const atTop = scrollable.scrollTop === 0;
            const atBottom = scrollable.scrollHeight - scrollable.scrollTop === scrollable.clientHeight;
            
            if ((atTop && e.deltaY < 0) || (atBottom && e.deltaY > 0)) {
                e.preventDefault();
            }
        }, { passive: false });

        let currentEvents = [];

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            refreshHistory();
            // Auto-refresh disabled - manually refresh with button to preserve expanded state
        });

        async function refreshHistory() {
            try {
                // Use dynamic plugin name from template context
                const pluginName = '{{ plugin_name }}';
                const [historyResponse, statsResponse] = await Promise.all([
                    fetch(`/plugins/${pluginName}/history?limit=100`),
                    fetch(`/plugins/${pluginName}/stats`)
                ]);

                const historyData = await historyResponse.json();
                const statsData = await statsResponse.json();

                if (historyData.success) {
                    currentEvents = historyData.events;
                    renderHistory();
                }

                if (statsData.success) {
                    updateStats(statsData);
                }

                updateLastUpdated();
            } catch (error) {
                console.error('Error fetching history:', error);
                showError('Failed to load summarization history: ' + error.message);
            }
        }

        function updateStats(stats) {
            document.getElementById('total-events').textContent = stats.total_events.toLocaleString();
            document.getElementById('total-tokens-saved').textContent = stats.total_tokens_saved.toLocaleString();
            document.getElementById('avg-reduction').textContent = 
                (stats.average_reduction_ratio * 100).toFixed(1) + '%';
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            
            if (currentEvents.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-text">No summarization events yet</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = currentEvents.map((event, index) => {
                const timestamp = new Date(event.timestamp).toLocaleString();
                const reduction = (event.reduction_ratio * 100).toFixed(1);
                const status = event.status || 'success';  // Default to success for old events
                const reason = event.reason || '';
                
                // Status badge HTML
                const statusBadge = `<span class="status-badge ${status}">${status}</span>`;
                
                // Show reason if status is not success
                const reasonText = (status !== 'success' && reason) 
                    ? `<span class="item-session" style="color: #f5d76e;">Reason: ${reason}</span>` 
                    : '';
                
                return `
                    <div class="history-item" onclick="toggleDetails(${index})">
                        <div class="item-header">
                            <div>
                                <span class="item-timestamp">${timestamp}</span>
                                ${statusBadge}
                                <span class="item-session">Session: ${event.session_id.substring(0, 8)}...</span>
                                ${reasonText}
                            </div>
                        </div>
                        <div class="item-stats">
                            <div class="item-stat">
                                <span class="item-stat-label">Strategy</span>
                                <span class="item-stat-value">LLM Summarization</span>
                            </div>
                            <div class="item-stat">
                                <span class="item-stat-label">Messages</span>
                                <span class="item-stat-value">${event.original_message_count} → ${event.summarized_message_count}</span>
                            </div>
                            <div class="item-stat">
                                <span class="item-stat-label">Tokens Saved</span>
                                <span class="item-stat-value positive">${event.tokens_saved.toLocaleString()}</span>
                            </div>
                            <div class="item-stat">
                                <span class="item-stat-label">Reduction</span>
                                <span class="item-stat-value reduction">${reduction}%</span>
                            </div>
                            <div class="item-stat">
                                <span class="item-stat-label">Summaries Created</span>
                                <span class="item-stat-value">${event.summary_count}</span>
                            </div>
                        </div>
                        <div class="item-details" id="details-${index}">
                            <div class="messages-comparison">
                                <div class="message-column">
                                    <div class="message-column-title">Before (${event.before_messages.length} messages)</div>
                                    ${renderMessages(event.before_messages)}
                                </div>
                                <div class="message-column">
                                    <div class="message-column-title">After (${event.after_messages.length} messages)</div>
                                    ${renderMessages(event.after_messages)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMessages(messages) {
            if (!messages || messages.length === 0) {
                return '<div style="color: #858585; font-size: 12px; padding: 8px;">No messages</div>';
            }

            return messages.map(msg => `
                <div class="message-item">
                    <div class="message-role">${msg.role.toUpperCase()}</div>
                    <div class="message-content">${escapeHtml(msg.content)}</div>
                </div>
            `).join('');
        }

        function toggleDetails(index) {
            const details = document.getElementById(`details-${index}`);
            const item = details.parentElement;
            
            if (details.classList.contains('visible')) {
                details.classList.remove('visible');
                item.classList.remove('expanded');
            } else {
                // Close all other details
                document.querySelectorAll('.item-details').forEach(d => {
                    d.classList.remove('visible');
                    d.parentElement.classList.remove('expanded');
                });
                // Open this one
                details.classList.add('visible');
                item.classList.add('expanded');
            }
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear the summarization history?')) {
                currentEvents = [];
                renderHistory();
                updateStats({
                    total_events: 0,
                    total_tokens_saved: 0,
                    average_reduction_ratio: 0
                });
            }
        }

        function updateLastUpdated() {
            const now = new Date().toLocaleTimeString();
            document.getElementById('last-updated').textContent = `Last updated: ${now}`;
        }

        function showError(message) {
            const container = document.getElementById('history-container');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⚠️</div>
                    <div class="empty-state-text">${escapeHtml(message)}</div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
