{% extends "kit/panel_base.html" %}
{% from "kit/macros.html" import icon %}
{% block title %}Context Summarizer{% endblock %}
{% block head %}<link rel="stylesheet" href="/plugins/{{ plugin }}/static/panel.css">{% endblock %}
{% block toolbar %}
<div class="pk-row" role="group" aria-label="Scope">
  <button type="button" class="pk-btn pk-btn--sm" data-scope="session" aria-pressed="true">This session</button>
  <button type="button" class="pk-btn pk-btn--sm" data-scope="all" aria-pressed="false">All sessions</button>
</div>
<pk-refresh interval="5" auto></pk-refresh>
<button id="clearButton" type="button" class="pk-btn pk-btn--ghost pk-btn--icon pk-btn--sm" aria-label="Clear the summarization history" title="Clear the summarization history">{{ icon('trash-2') }}</button>
{% endblock %}
{% block content %}
<div class="pk-stats" id="stats"><span class="pk-skeleton"></span></div>
<div class="pk-muted" id="shown" hidden></div>
<div id="events"></div>

<dialog id="detail" class="pk-dialog pk-drawer cs-drawer" aria-labelledby="detailTitle">
  <div class="pk-dialog-head">
    <h2 id="detailTitle" class="pk-dialog-title pk-grow">Event</h2>
    <button type="button" class="pk-btn pk-btn--ghost pk-btn--icon pk-btn--sm" data-close aria-label="Close" title="Close">{{ icon('x') }}</button>
  </div>
  <div id="detailBody" class="pk-dialog-body"></div>
</dialog>
{% endblock %}
{% block scripts %}<script type="module" src="/plugins/{{ plugin }}/static/panel.js"></script>{% endblock %}
