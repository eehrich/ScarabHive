tools:
  - type: function
    function:
      name: "{{ name }}_web_search"
      description: "Search the web with DuckDuckGo. Returns titles, URLs and snippets; no account needed. Snippets are short -- read a promising page with the scraper afterwards."
      parameters:
        type: object
        properties:
          query:
            type: string
            description: "Search terms. Keywords work better than full sentences."
          max_results:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
          ignore_cache:
            type: boolean
            default: false
            description: "Bypass the cache and query DuckDuckGo again"
          cache_ttl:
            type: integer
            minimum: 0
            description: "Cache lifetime for this result in seconds (default from config)"
        required: [query]
        additionalProperties: false

config:
  cache_ttl: 900
  cache_enabled: true
