tools:
  - type: function
    function:
      name: web_search
      description: Search the web using DuckDuckGo search engine. Returns search results with titles, URLs, and snippets.
      parameters:
        type: object
        properties:
          query:
            type: string
            description: "Search query terms"
          max_results:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
            description: "Maximum number of search results to return"
          ignore_cache:
            type: boolean
            default: false
            description: "If true, bypass cache and fetch fresh results"
          cache_ttl:
            type: integer
            minimum: 0
            description: "Custom cache TTL in seconds (overrides default)"
        required: [query]
        additionalProperties: false
