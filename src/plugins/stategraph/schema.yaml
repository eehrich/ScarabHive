# Jinja2 variables: {{ name }}
# stategraph: agent workflows as UML-style state machines (docs/stategraph_design.md).
# Tools that validate, save, run or control machines require an admin user (§8.3):
# machines contain Python and run agents and tools.
tools:
  - type: function
    function:
      name: "{{ name }}_catalog"
      description: "What a machine may use: activity kinds with their fields, the agents the SAM may spawn, the tools the runner may call, decision profiles, example machine ids. Use only what this lists."
      parameters:
        type: object
        properties:
          sam: {type: string, description: "SAM instance the machine will use; default: the plugin's"}
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_list_machines"
      description: "Machines in the machine roots: id, title, file, whether it is writable, whether it validates."
      parameters: {type: object, properties: {}, additionalProperties: false}

  - type: function
    function:
      name: "{{ name }}_get_machine"
      description: "A machine as its file tree: files {relative path: text} (the YAML, its companion .py, imported machines in the same root), versions {path: version} to pass back when saving, and its validation problems."
      parameters:
        type: object
        properties:
          machine_id: {type: string, description: "id of the machine (its file is <machine_id>.yaml)"}
        required: [machine_id]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_validate_machine"
      description: "Check a machine without saving: format, graph, Python (compiles, names exist, purity), activities, submachine parameters, and whether the configuration can run it (agents the SAM may spawn, tools the runner may call). Pass the whole tree as files, root file first, or a single yaml."
      parameters:
        type: object
        properties:
          files: {type: object, additionalProperties: {type: string}, description: "relative path -> text; the root machine is <machine_id>.yaml"}
          yaml: {type: string, description: "a single machine file instead of files"}
          machine_id: {type: string, description: "id of the root machine (default: the id in the YAML)"}
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_save_machine"
      description: "Validate, then write the machine tree into the writable machine root. Refused if validation finds errors, or if a file changed since the versions you read (pass expected_versions from get_machine; omit for new files)."
      parameters:
        type: object
        properties:
          files: {type: object, additionalProperties: {type: string}, description: "relative path -> text: <machine_id>.yaml, its companion .py, imported machines"}
          machine_id: {type: string, description: "id of the root machine (default: the id in <id>.yaml)"}
          expected_versions: {type: object, additionalProperties: {type: string}, description: "relative path -> version from get_machine, for every existing file you change"}
        required: [files]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_run_machine"
      description: "Run a machine. mocks {state path: out} answer instead of the activity ({\"$visits\": [out1, out2]} per use of the path in the run, {\"$error\": {type, message}} to fail it); mock_only refuses every unmocked agent, tool or decision. With wait=finish the call returns when the run ends, pauses at a breakpoint or waits for an event (at most max_wait seconds). run_key attaches to an unfinished run with the same key instead of starting a second one."
      parameters:
        type: object
        properties:
          machine_id: {type: string, description: "id of the machine to run"}
          params: {type: object, description: "the machine's params (run input)"}
          mocks: {type: object, description: "state path -> out; {\"$visits\": [...]} per visit; {\"$error\": {type, message}} to fail"}
          mock_only: {type: boolean, default: false, description: "refuse every unmocked agent, tool or decision"}
          breakpoints: {type: array, items: {}, description: "state names, 'state@exit', or {state, at, condition}"}
          watchpoints: {type: array, items: {}, description: "Python expressions over the scope, or {expr, condition}"}
          run_key: {type: string, description: "attach to (or resume) an unfinished run with this key instead of starting another"}
          wait: {type: string, enum: ["finish", "background"], default: "finish", description: "finish: return when the run ends, pauses or waits; background: return at once"}
          max_wait: {type: number, default: 600, description: "seconds to wait with wait=finish before returning status running"}
        required: [machine_id]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_get_run"
      description: "A run's status, frames (active states, context), output or error, what it waits for, and its last journal rows."
      parameters:
        type: object
        properties:
          run_id: {type: string, description: "id from run_machine"}
          steps: {type: integer, minimum: 1, maximum: 200, default: 30, description: "how many of the last journal rows to return"}
        required: [run_id]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_control_run"
      description: "Debugger and lifecycle: pause, continue, step, run_to (state), terminate, resume (an interrupted run), fork (from top-level step at_step), set_breakpoints, set_watchpoints, evaluate (expr, read-only), set (path, expr; only while paused)."
      parameters:
        type: object
        properties:
          run_id: {type: string, description: "id of the run"}
          action: {type: string, enum: ["pause", "continue", "step", "run_to", "terminate", "resume", "fork", "set_breakpoints", "set_watchpoints", "evaluate", "set"], description: "what to do"}
          state: {type: string, description: "run_to: the state to stop at"}
          machine: {type: string, description: "run_to: the machine that state belongs to (default: any frame)"}
          at_step: {type: integer, minimum: 0, description: "fork: the top-level step to fork from"}
          definition: {type: string, enum: ["snapshot", "current"], default: "snapshot", description: "fork: the run's own definition, or the machine as it is now"}
          breakpoints: {type: array, items: {}, description: "set_breakpoints: 'state', 'state@exit', or {state, at, condition}"}
          watchpoints: {type: array, items: {}, description: "set_watchpoints: Python expressions, or {expr, condition}"}
          expr: {type: string, description: "evaluate / set: a read-only Python expression over the paused scope"}
          path: {type: string, description: "set: the ctx path to assign, e.g. ctx.draft"}
        required: [run_id, action]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_send_event"
      description: "Send a declared event to a run. It goes to the frame whose active states accept it; name frame when several do. An event nobody accepts yet waits in the run's inbox."
      parameters:
        type: object
        properties:
          run_id: {type: string, description: "id of the run"}
          name: {type: string, description: "a declared event name"}
          data: {type: [object, array, string, number, boolean, "null"], description: "payload; checked against the event's declared data schema"}
          frame: {type: string, description: "frame prefix (from get_run accepts) when several frames accept the event"}
        required: [run_id, name]
        additionalProperties: false

commands:
  - name: stategraph-run
    description: "run a state machine in the background"
    tool: "{{ name }}_run_machine"
    argument: machine_id
    argument_hint: "<machine id>"
    params: {wait: background}

web_ui:
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "State Graph"
    description: "Model agent workflows as UML state machines, run and debug them"
    icon: workflow
    category: agents
    keywords: [state machine, statechart, workflow, uml, debugger, breakpoints, watchpoints]
    window: {width: 1320, height: 880}
  endpoints:
    - {path: "/", method: GET, handler: render_panel, response_type: html, description: "The State Graph panel"}
    - {path: "/api/machines", method: GET, handler: api_list_machines, response_type: json}
    - {path: "/api/machines", method: POST, handler: api_create_machine, response_type: json}
    - {path: "/api/machines/{machine_id}", method: GET, handler: api_get_machine, response_type: json}
    - {path: "/api/machines/{machine_id}", method: PUT, handler: api_save_machine, response_type: json}
    - {path: "/api/machines/{machine_id}/edit", method: POST, handler: api_edit_machine, response_type: json}
    - {path: "/api/machines/{machine_id}/layout", method: PUT, handler: api_save_layout, response_type: json}
    - {path: "/api/validate", method: POST, handler: api_validate, response_type: json}
    - {path: "/api/kinds", method: GET, handler: api_kinds, response_type: json}
    - {path: "/api/runs", method: GET, handler: api_list_runs, response_type: json}
    - {path: "/api/runs", method: POST, handler: api_start_run, response_type: json}
    - {path: "/api/runs/{run_id}", method: GET, handler: api_get_run, response_type: json}
    - {path: "/api/runs/{run_id}/journal", method: GET, handler: api_run_journal, response_type: json}
    - {path: "/api/runs/{run_id}/control", method: POST, handler: api_control_run, response_type: json}
    - {path: "/api/runs/{run_id}/events", method: POST, handler: api_send_event, response_type: json}
