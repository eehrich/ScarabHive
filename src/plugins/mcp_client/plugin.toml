# mcp_client plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements go in a
# `dependencies = [...]` line and are aggregated by scripts/aggregate_plugin_deps.py.
[plugin]
name = "mcp_client"
version = "1.0.0"
description = "Connects to external MCP servers via the official MCP SDK and federates their tools"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["tool-server"]
category = "integration"
requires = { agent_system = ">=0.6.0" }
dependencies = ["mcp>=2.2,<3"]
