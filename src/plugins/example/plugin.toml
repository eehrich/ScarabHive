# example plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "example"
version = "1.0.0"
description = "Reference implementation demonstrating plugin best practices with calculator, formatter, and status tools"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["tool-server"]
category = "tools"
tags = ["example", "reference", "calculator", "formatter", "demo"]
requires = { python = ">=3.8", agent_system = ">=0.6.0" }
