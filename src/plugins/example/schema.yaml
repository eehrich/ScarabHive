tools:
  - type: function
    function:
      name: "{{ name }}_calculator"
      description: Perform basic arithmetic operations on two numbers.
      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: [add, subtract, multiply, divide]
            description: "Arithmetic operation to perform"
          a:
            type: number
            description: "First number"
          b:
            type: number
            description: "Second number"
        required: ["operation", "a", "b"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_formatter"
      description: Format text using various transformations.
      parameters:
        type: object
        properties:
          text:
            type: string
            description: "Text to format"
          format:
            type: string
            enum: [uppercase, lowercase, title, reverse]
            description: "Format transformation to apply"
        required: ["text", "format"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_status"
      description: Get server status and settings.
      parameters:
        type: object
        properties:
          verbose:
            type: boolean
            default: false
            description: "Include detailed status information"
        additionalProperties: false

config:
  precision: 2
  max_text_length: 1000
