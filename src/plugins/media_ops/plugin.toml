# media_ops plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py. This plugin needs none — stdlib only.
[plugin]
name = "media_ops"
version = "1.0.0"
description = "Load image/audio/video files from disk into the agent's context, and save context media back to disk"
author = "Enrico Ehrich"
entrypoint = "server:PLUGIN_FACTORY"
type = ["mcp-server"]
category = "media"
requires = { agent_system = ">=0.6.0" }
