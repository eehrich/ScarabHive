# TODO Management Plugin - Tool Schema (OpenAI Function Format)

tools:
  - type: function
    function:
      name: "todo"
      description: "TODO task manager. CREATE: title required. UPDATE: task_id+fields. DELETE: task_id+delete=true. LIST: use filters. GET: task_id only. SUMMARY: task_id='SUMMARY'"
      parameters:
        type: object
        properties:
          task_id:
            type: string
            description: "Task ID or 'SUMMARY'"
          
          title:
            type: string
            minLength: 1
            maxLength: 200
            description: "Task title"
          
          description:
            type: string
            maxLength: 2000
            description: "Task description"
          
          status:
            type: string
            enum: ["not-started", "in-progress", "completed", "blocked", "cancelled"]
            description: "Task status"
          
          progress:
            type: integer
            minimum: 0
            maximum: 100
            description: "Completion %"
          
          priority:
            type: string
            enum: ["low", "medium", "high", "critical"]
            default: "medium"
            description: "Priority"
          
          tags:
            type: array
            items:
              type: string
              maxLength: 50
            maxItems: 20
            description: "Tags"
          
          depends_on:
            type: array
            items:
              type: string
              pattern: "^task_\\d{3}$"
            maxItems: 50
            description: "Task dependencies"
          
          note:
            type: string
            maxLength: 1000
            description: "Add note"
          
          delete:
            type: boolean
            default: false
            description: "Delete task mode"
          
          cascade:
            type: boolean
            default: false
            description: "Also delete dependents"
          
          filter_status:
            type: array
            items:
              type: string
              enum: ["not-started", "in-progress", "completed", "blocked", "cancelled"]
            description: "Filter by status"
          
          filter_priority:
            type: array
            items:
              type: string
              enum: ["low", "medium", "high", "critical"]
            description: "Filter by priority"
          
          only_unblocked:
            type: boolean
            default: false
            description: "Only unblocked tasks"
          
          limit:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            description: "Max results"
        
        additionalProperties: false
