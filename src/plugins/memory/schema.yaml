# Memory Plugin - Schema (Tools, Hooks, Config, Web UI)

web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Memory"
    description: "Long-term memories of the agents"
    icon: database
    category: context
    keywords: [memory, recall]
    window: {width: 1000, height: 760}
    contexts:
      session: "/plugins/{{ name }}/?session_id={session_id}"

  endpoints:
    - path: "/"
      method: "GET"
      handler: "get_panel"
      response_type: "html"
      description: "The Memory panel"

    - path: "/memories"
      method: "GET"
      handler: "get_memories"
      response_type: "json"
      description: "The 100 most recently accessed memories of a session (session_id) and their total"

    - path: "/stats"
      method: "GET"
      handler: "get_stats"
      response_type: "json"
      description: "Count, average importance and accesses of a session's memories (session_id)"

    - path: "/memories/search"
      method: "POST"
      handler: "search_memories"
      response_type: "json"
      description: "Semantic search in a session's memories (session_id), the 20 closest"

    - path: "/memories/{memory_id}"
      method: "DELETE"
      handler: "delete_memory"
      response_type: "json"
      description: "Delete a memory of a session (session_id)"

hooks:
  - name: inject_memory_context
    type: pre_llm_call
    enabled: false  # default is disabled
    timeout: 5.0
    description: "Inject relevant memory titles into system prompt before LLM calls"
    category: "prompt_injection"
    order:
      before: ["message_validation"]

config:
  storage_path:
    type: string
    default: "data/memories"
    description: "Directory path for storing memory metadata and vector embeddings"

  max_memories:
    type: integer
    default: 10
    description: "Maximum number of memories to inject into system prompt"
    minimum: 1
    maximum: 50

  max_memories_per_session:
    type: integer
    default: 5000
    description: "Maximum memories allowed per session"
    minimum: 10
    maximum: 10000

  auto_extract_keywords:
    type: boolean
    default: true
    description: "Automatically extract keywords from content if not provided"

  # Used for search operation - returns top N results by vector similarity
  # Requires ChromaDB Python package for vector embeddings
  search_n_results:
    type: integer
    default: 5
    description: "Default number of search results to return"
    minimum: 1
    maximum: 20

  # When enabled, inject_memory_context hook uses vector similarity to find relevant memories
  # When disabled, injects most recently accessed memories
  use_semantic_injection:
    type: boolean
    default: true
    description: "Use semantic search to inject relevant memories (vs just recent)"

tools:
  - type: function
    function:
      name: "{{ name }}"
      description: |
        Unified memory tool for storing and retrieving information.
        Supports semantic search via vector embeddings.
      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: ["store", "recall", "search", "list", "delete", "update"]
            description: |
              Operations:
              - store: Save a new memory with title and content
              - recall: Get memory by ID (also updates access count)
              - search: Semantic search by query string (returns results with similarity score 0.0-1.0, 1.0 = perfect match)
              - list: Show all memories
              - delete: Remove a memory
              - update: Edit an existing memory (partial update supported - only provide fields to change)

          # For store operation
          title:
            type: string
            minLength: 1
            maxLength: 200
            description: "Memory title (required for store, optional for update)"

          content:
            type: string
            minLength: 1
            maxLength: 5000
            description: "Memory content (required for store, optional for update)"

          keywords:
            type: array
            items:
              type: string
              maxLength: 50
            maxItems: 20
            description: "Keywords for categorization (optional for store/update, auto-extracted if not provided)"

          importance:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
            description: "Importance level 1-10 (optional for store/update, default: 5)"

          tags:
            type: array
            items:
              type: string
              maxLength: 50
            maxItems: 20
            description: "Tags for categorization (optional for store/update)"

          # For recall/delete/update operations
          memory_id:
            type: string
            pattern: "^mem_[0-9]{3,8}(_[0-9]{6}_[a-f0-9]{8})?$"
            description: "Memory ID (required for recall/delete/update operations)"

          # For search operation
          query:
            type: string
            minLength: 1
            maxLength: 500
            description: "Search query for semantic search (required for search operation)"

          n_results:
            type: integer
            minimum: 1
            maximum: 20
            default: 3
            description: "Number of search results to return (for search operation)"

          # For list operation
          limit:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            description: "Maximum results to return (for list operation)"

          offset:
            type: integer
            minimum: 0
            default: 0
            description: "Number of results to skip for pagination (for list operation)"

          sort_by:
            type: string
            enum: ["created", "updated", "accessed", "importance"]
            default: "accessed"
            description: "Sort criterion for list operation"

          sort_order:
            type: string
            enum: ["asc", "desc"]
            default: "desc"
            description: "Sort order for list operation"

        required: ["operation"]
        additionalProperties: false
