# Memory Plugin - Schema (Tools, Hooks, Config, Web UI)

web_ui:
  button:
    enabled: true
    text: "Memories"
    icon: "💾"
  
  panel:
    enabled: true
    title: "Memory Manager"
    endpoint: "/plugins/{{ name }}/panel"
    type: "iframe"
    width: "1000px"
    height: "800px"

hooks:
  - name: inject_memory_context
    type: pre_llm_call
    enabled: false  # default is disabled
    timeout: 5.0
    description: "Inject relevant memory titles into system prompt before LLM calls"
    category: "prompt_injection"
    order:
      after: ["context_optimization"]
      before: ["message_validation"]

config:
  max_memories:
    type: integer
    default: 10
    description: "Maximum number of memories to inject into system prompt"
    minimum: 1
    maximum: 50
  
  max_memories_per_session:
    type: integer
    default: 1000
    description: "Maximum memories allowed per session"
    minimum: 10
    maximum: 10000
  
  auto_extract_keywords:
    type: boolean
    default: true
    description: "Automatically extract keywords from content if not provided"
  
  search_n_results:
    type: integer
    default: 5
    description: "Default number of search results to return"
    minimum: 1
    maximum: 20
  
  use_semantic_injection:
    type: boolean
    default: true
    description: "Use semantic search to inject relevant memories (vs just recent)"

tools:
  - type: function
    function:
      name: "{{ name }}"
      description: |
        Unified memory management tool for storing and retrieving important information.
        Supports semantic search via vector embeddings.
      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: ["store", "recall", "search", "list", "delete"]
            description: |
              Operation to perform:
              - store: Save a new memory with title and content
              - recall: Get memory by ID (also updates access count)
              - search: Semantic search by query string (returns results with similarity score 0.0-1.0, where 1.0 = perfect match)
              - list: Show all memories for current session
              - delete: Remove a memory permanently
          
          # For store operation
          title:
            type: string
            minLength: 1
            maxLength: 200
            description: "Memory title (required for store operation)"
          
          content:
            type: string
            minLength: 1
            maxLength: 5000
            description: "Memory content (required for store operation)"
          
          keywords:
            type: array
            items:
              type: string
              maxLength: 50
            maxItems: 20
            description: "Keywords for categorization (optional, auto-extracted if not provided)"
          
          importance:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
            description: "Importance level 1-10 (optional, default: 5)"
          
          tags:
            type: array
            items:
              type: string
              maxLength: 50
            maxItems: 20
            description: "Tags for categorization (optional)"
          
          # For recall/delete operations
          memory_id:
            type: string
            pattern: "^mem_[0-9]{8}_[0-9]{6}_[a-f0-9]{8}$"
            description: "Memory ID (required for recall/delete operations)"
          
          # For search operation
          query:
            type: string
            minLength: 1
            maxLength: 500
            description: "Search query for semantic search (required for search operation)"
          
          n_results:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
            description: "Number of search results to return (for search operation)"
          
          # For list operation
          limit:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            description: "Maximum results to return (for list operation)"
          
          offset:
            type: integer
            minimum: 0
            default: 0
            description: "Number of results to skip for pagination (for list operation)"
          
          sort_by:
            type: string
            enum: ["created", "updated", "accessed", "importance"]
            default: "accessed"
            description: "Sort criterion for list operation"
          
          sort_order:
            type: string
            enum: ["asc", "desc"]
            default: "desc"
            description: "Sort order for list operation"
        
        required: ["operation"]
        additionalProperties: false
