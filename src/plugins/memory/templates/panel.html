<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Manager</title>
    <link rel="stylesheet" href="/static/css/scrollbar.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #569cd6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        button {
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #1177bb;
        }
        
        button.icon-only {
            padding: 8px;
            width: 36px;
            height: 36px;
            justify-content: center;
        }
        
        button.icon-only.active {
            background: #16825d;
        }
        
        button.icon-only.active:hover {
            background: #1a9970;
        }
        
        button.danger {
            background: #c72e2e;
        }
        
        button.danger:hover {
            background: #e81123;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 15px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #858585;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #4ec9b0;
        }
        
        .search-section {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .search-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #dcdcaa;
        }
        
        .search-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .search-bar input {
            flex: 1;
            background: #3e3e42;
            color: #d4d4d4;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 10px;
            font-size: 14px;
        }
        
        .search-bar input:focus {
            outline: none;
            border-color: #569cd6;
        }
        
        .memories-section {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .memories-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #ce9178;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .memory-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .memory-card {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 15px;
            transition: border-color 0.2s;
        }
        
        .memory-card:hover {
            border-color: #569cd6;
        }
        
        .memory-card.expanded {
            border-color: #4ec9b0;
        }
        
        .memory-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .memory-icon {
            font-size: 20px;
        }
        
        .memory-id {
            font-family: 'Consolas', monospace;
            color: #858585;
            font-size: 13px;
        }
        
        .memory-title {
            font-weight: 500;
            color: #d4d4d4;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .importance-badge {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .importance-high {
            background: #f48771;
            color: #000;
        }
        
        .importance-medium {
            background: #dcdcaa;
            color: #000;
        }
        
        .importance-low {
            background: #858585;
            color: #fff;
        }
        
        .memory-meta {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #858585;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .memory-content {
            display: none;
            font-size: 13px;
            color: #cccccc;
            margin-bottom: 12px;
            padding: 12px;
            background: #2d2d30;
            border-left: 3px solid #4ec9b0;
            border-radius: 3px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .memory-card.expanded .memory-content {
            display: block;
        }
        
        .memory-keywords {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        
        .keyword-tag {
            background: #3e3e42;
            color: #569cd6;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
        }
        
        .memory-actions {
            display: none;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .memory-card.expanded .memory-actions {
            display: flex;
        }
        
        .memory-actions button {
            font-size: 13px;
            padding: 6px 12px;
        }
        
        .error {
            color: #f48771;
            padding: 10px;
            background: #3e1e1e;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .no-data {
            color: #858585;
            text-align: center;
            padding: 40px;
        }
        
        .loading {
            color: #858585;
            text-align: center;
            padding: 20px;
        }
        
        .top-keywords {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .keyword-bubble {
            background: #2d2d30;
            border: 1px solid #4ec9b0;
            color: #4ec9b0;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💾 Memory Manager</h1>
        
        <div class="controls">
            <button class="icon-only" onclick="refreshData()" title="Refresh">
                🔄
            </button>
            <button class="icon-only active" id="auto-refresh-btn" onclick="toggleAutoRefresh()" title="Auto-Refresh (5s) - Active">
                ⏱️
            </button>
        </div>
        
        <div id="error-container"></div>
        
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Memories</div>
                <div class="stat-value" id="total-memories">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Importance</div>
                <div class="stat-value" id="avg-importance">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Accesses</div>
                <div class="stat-value" id="total-accesses">0</div>
            </div>
        </div>
        
        <div class="search-section">
            <h2>🔍 Semantic Search</h2>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search memories by meaning..." onkeypress="handleSearchKey(event)">
                <button onclick="performSearch()">Search</button>
                <button onclick="clearSearch()">Clear</button>
            </div>
        </div>
        
        <div class="memories-section">
            <h2>
                🧠 Memories
                <span id="memory-count" style="font-size: 14px; color: #858585; font-weight: normal;">0 memories</span>
            </h2>
            
            <div class="memory-list" id="memory-list">
                <div class="loading">Loading memories...</div>
            </div>
        </div>
    </div>
    
    <script>
        let autoRefreshInterval = null;
        let allMemories = [];
        let currentSearchQuery = null;
        let searchSession = null;  // the session the search shown was made in
        
        function getCurrentSessionId() {
            // Try to get from parent window's sessionManager
            try {
                if (window.parent && window.parent !== window && window.parent.sessionManager) {
                    const sessionId = window.parent.sessionManager.getCurrentSessionId();
                    if (sessionId) return sessionId;
                }
            } catch (e) {
                console.log('[Memory Manager] Cannot access parent sessionManager:', e.message);
            }
            
            // URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const urlSessionId = urlParams.get('session_id');
            if (urlSessionId) return urlSessionId;
            
            return 'default';
        }
        
        function getImportanceClass(importance) {
            if (importance >= 8) return 'importance-high';
            if (importance >= 5) return 'importance-medium';
            return 'importance-low';
        }
        
        function getImportanceLabel(importance) {
            if (importance >= 8) return `⭐ ${importance}/10`;
            if (importance >= 5) return `✨ ${importance}/10`;
            return `📌 ${importance}/10`;
        }
        
        async function refreshData() {
            try {
                const sessionId = getCurrentSessionId();
                const json = (url) => fetch(url).then((response) => response.json());
                // the stats, and the memories unless a search shows its own
                const [stats, memoriesData] = await Promise.all([
                    json(`/plugins/{{ name }}/stats?session_id=${sessionId}`),
                    currentSearchQuery ? null : json(`/plugins/{{ name }}/memories?session_id=${sessionId}&limit=100&sort_by=accessed&sort_order=desc`),
                ]);
                // the session switched to meanwhile has its own refresh on the way
                if (getCurrentSessionId() !== sessionId) return;

                // Update stats
                document.getElementById('total-memories').textContent = stats.total_memories || 0;
                document.getElementById('avg-importance').textContent = stats.avg_importance?.toFixed(1) || '0.0';
                document.getElementById('total-accesses').textContent = stats.total_accesses || 0;

                // a search shown meanwhile keeps its results
                if (memoriesData && !currentSearchQuery) allMemories = memoriesData.memories || [];

                renderMemories();
                
                document.getElementById('error-container').innerHTML = '';
                
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('error-container').innerHTML = 
                    `<div class="error">Error loading data: ${error.message}</div>`;
            }
        }
        
        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        async function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) {
                showError('Please enter a search query');
                return;
            }
            
            try {
                const sessionId = getCurrentSessionId();
                const searchUrl = `/plugins/{{ name }}/memories/search?session_id=${sessionId}`;
                
                const resp = await fetch(searchUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, n_results: 20 })
                });
                
                if (!resp.ok) {
                    const err = await resp.text();
                    throw new Error(err || `HTTP ${resp.status}`);
                }
                
                const searchData = await resp.json();
                // the session switched to meanwhile: the search was for the one before
                if (getCurrentSessionId() !== sessionId) return;
                currentSearchQuery = query;
                searchSession = sessionId;
                
                // Convert search results to memory format
                allMemories = searchData.results.map(r => ({
                    memory_id: r.memory_id,
                    title: r.title,
                    content: r.content,
                    keywords: r.keywords,
                    importance: r.importance,
                    access_count: r.access_count,
                    similarity: r.similarity,  // 0.0-1.0, higher = better
                    created_at: new Date().toISOString(),
                    accessed_at: new Date().toISOString()
                }));
                
                renderMemories();
                
            } catch (error) {
                console.error('Error searching memories:', error);
                showError('Search failed: ' + error.message);
            }
        }
        
        function clearSearch() {
            currentSearchQuery = null;
            document.getElementById('search-input').value = '';
            refreshData();
        }
        
        function handleSearchKey(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }
        
        function renderMemories() {
            const memoryList = document.getElementById('memory-list');
            const memoryCount = document.getElementById('memory-count');
            
            memoryCount.textContent = `${allMemories.length} memor${allMemories.length !== 1 ? 'ies' : 'y'}`;
            
            if (allMemories.length === 0) {
                memoryList.innerHTML = '<div class="no-data">No memories found</div>';
                return;
            }
            
            memoryList.innerHTML = allMemories.map(memory => {
                const accessedDate = new Date(memory.accessed_at);
                const timeAgo = getTimeAgo(accessedDate);
                
                return `
                    <div class="memory-card" id="memory-${memory.memory_id}">
                        <div class="memory-header" onclick="toggleMemory('${memory.memory_id}')">
                            <span class="memory-icon">💾</span>
                            <span class="memory-id">${memory.memory_id}</span>
                            <span class="memory-title">${escapeHtml(memory.title)}</span>
                            <span class="importance-badge ${getImportanceClass(memory.importance)}">${getImportanceLabel(memory.importance)}</span>
                        </div>
                        
                        <div class="memory-meta">
                            <span>📅 Accessed: ${timeAgo}</span>
                            <span>👁️ ${memory.access_count} time${memory.access_count !== 1 ? 's' : ''}</span>
                            ${memory.similarity !== undefined ? `<span>🎯 Match: ${(memory.similarity * 100).toFixed(0)}%</span>` : ''}
                        </div>
                        
                        ${memory.keywords && memory.keywords.length > 0 ? `
                            <div class="memory-keywords">
                                ${memory.keywords.map(kw => `<span class="keyword-tag">${escapeHtml(kw)}</span>`).join('')}
                            </div>
                        ` : ''}
                        
                        <div class="memory-content">${escapeHtml(memory.content || 'No content available')}</div>
                        
                        <div class="memory-actions">
                            <button onclick="recallMemory('${memory.memory_id}')">👁️ Recall</button>
                            <button class="danger" onclick="deleteMemory('${memory.memory_id}')">🗑 Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function toggleMemory(memoryId) {
            const card = document.getElementById(`memory-${memoryId}`);
            card.classList.toggle('expanded');
        }
        
        async function recallMemory(memoryId) {
            try {
                const sessionId = getCurrentSessionId();
                const url = `/plugins/{{ name }}/memories/${memoryId}?session_id=${sessionId}`;
                const resp = await fetch(url);
                
                if (!resp.ok) {
                    const err = await resp.text();
                    throw new Error(err || `HTTP ${resp.status}`);
                }
                
                await refreshData();
                
                // Expand the memory card
                const card = document.getElementById(`memory-${memoryId}`);
                if (card) {
                    card.classList.add('expanded');
                }
                
            } catch (error) {
                console.error('Error recalling memory:', error);
                showError('Error recalling memory: ' + error.message);
            }
        }
        
        async function deleteMemory(memoryId) {
            // Direct delete without confirmation (iframe doesn't show confirm dialogs)
            try {
                const sessionId = getCurrentSessionId();
                const url = `/plugins/{{ name }}/memories/${memoryId}?session_id=${sessionId}`;
                const resp = await fetch(url, { method: 'DELETE' });
                
                if (!resp.ok) {
                    const err = await resp.text();
                    throw new Error(err || `HTTP ${resp.status}`);
                }
                
                await refreshData();
                
            } catch (error) {
                console.error('Error deleting memory:', error);
                showError('Error deleting memory: ' + error.message);
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            
            if (seconds < 60) return `${seconds}s ago`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }
        
        function toggleAutoRefresh() {
            const btn = document.getElementById('auto-refresh-btn');
            const isActive = btn.classList.contains('active');
            
            if (isActive) {
                btn.classList.remove('active');
                btn.title = 'Auto-Refresh (5s) - Inactive';
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
                // Save state to localStorage
                localStorage.setItem('memoryPanelAutoRefresh', 'false');
            } else {
                btn.classList.add('active');
                btn.title = 'Auto-Refresh (5s) - Active';
                autoRefreshInterval = setInterval(refreshData, 5000);
                // Save state to localStorage
                localStorage.setItem('memoryPanelAutoRefresh', 'true');
            }
        }
        
        // Initialize - restore auto-refresh state from localStorage
        refreshData();
        const savedAutoRefresh = localStorage.getItem('memoryPanelAutoRefresh');
        if (savedAutoRefresh === 'false') {
            // User had it turned off, disable it
            const btn = document.getElementById('auto-refresh-btn');
            btn.classList.remove('active');
            btn.title = 'Auto-Refresh (5s) - Inactive';
        } else {
            // Default: enabled (or no saved preference)
            autoRefreshInterval = setInterval(refreshData, 5000);
        }

        // the shell names its session on every change, after a reload a moment after this panel
        // loaded; a search shown for the session before goes with it
        window.addEventListener('message', (event) => {
            if (event.source !== window.parent || event.origin !== window.location.origin
                || event.data?.type !== 'pk:session') return;
            if (currentSearchQuery && searchSession !== getCurrentSessionId()) clearSearch();
            else refreshData();
        });
    </script>
</body>
</html>
