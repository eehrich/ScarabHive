{% extends "kit/panel_base.html" %}
{% from "kit/macros.html" import icon %}
{% block title %}Memory{% endblock %}
{% block head %}<link rel="stylesheet" href="/plugins/{{ plugin }}/static/panel.css">{% endblock %}
{% block toolbar %}<pk-session></pk-session><pk-refresh interval="5" auto></pk-refresh>{% endblock %}
{% block content %}
<div class="pk-stats" id="stats"><span class="pk-skeleton"></span></div>
<form id="searchForm" class="pk-row" hidden>
  <label class="pk-search pk-grow">{{ icon('search') }}<input id="query" class="pk-input pk-input--sm" type="search" maxlength="500" placeholder="Search memories by meaning" aria-label="Search" required></label>
  <button type="submit" class="pk-btn pk-btn--sm">Search</button>
  <button type="button" id="clearSearch" class="pk-btn pk-btn--sm pk-btn--ghost" hidden>Clear</button>
</form>
<div class="pk-muted" id="shown" hidden></div>
<div id="memories"></div>

<dialog id="detail" class="pk-dialog pk-drawer mm-drawer" aria-labelledby="detailTitle">
  <div class="pk-dialog-head">
    <h2 id="detailTitle" class="pk-dialog-title pk-grow">Memory</h2>
    <button type="button" class="pk-btn pk-btn--ghost pk-btn--icon pk-btn--sm" data-close aria-label="Close" title="Close">{{ icon('x') }}</button>
  </div>
  <div id="detailBody" class="pk-dialog-body"></div>
  <div class="pk-dialog-actions">
    <button type="button" id="deleteButton" class="pk-btn pk-btn--danger">{{ icon('trash-2', size='sm') }} Delete</button>
  </div>
</dialog>
{% endblock %}
{% block scripts %}<script type="module" src="/plugins/{{ plugin }}/static/panel.js"></script>{% endblock %}
