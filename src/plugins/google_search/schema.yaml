type: function
function:
  name: {{name}}
  description: Search the web using Google Custom Search API. Returns search results with titles, URLs, and snippets.
  parameters:
    type: object
    properties:
      action:
        type: string
        enum: [search]
      query:
        type: string
      max_results:
        type: integer
        minimum: 1
        maximum: 10
        default: 5
    required: [query]
    additionalProperties: true
