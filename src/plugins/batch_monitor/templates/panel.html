<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Queue Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #569cd6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .refresh-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        button {
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #1177bb;
        }
        
        button:disabled {
            background: #3c3c3c;
            cursor: not-allowed;
        }
        
        button.icon-only {
            padding: 8px;
            width: 36px;
            height: 36px;
            justify-content: center;
        }
        
        button.icon-only.active {
            background: #16825d;
        }
        
        button.icon-only.active:hover {
            background: #1a9970;
        }
        
        .last-update {
            margin-left: auto;
            color: #858585;
            font-size: 13px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 12px 15px;
        }
        
        .stat-label {
            font-size: 11px;
            color: #858585;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #4ec9b0;
        }
        
        .stat-value.warning {
            color: #ffcc00;
        }
        
        .stat-value.error {
            color: #e57373;
        }
        
        .stat-multi {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }
        
        .stat-item {
            flex: 1;
        }
        
        .stat-item-label {
            font-size: 10px;
            color: #858585;
            margin-bottom: 2px;
        }
        
        .stat-item-value {
            font-size: 18px;
            font-weight: 600;
            color: #4ec9b0;
        }
        
        .stat-item-value.warning {
            color: #ffcc00;
        }
        
        .stat-item-value.error {
            color: #e57373;
        }
        
        .queue-list {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .queue-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .queue-table th {
            background: #1e1e1e;
            padding: 10px 12px;
            text-align: left;
            font-size: 11px;
            color: #858585;
            text-transform: uppercase;
            font-weight: 600;
            border-bottom: 1px solid #3e3e42;
        }
        
        .queue-table td {
            padding: 12px;
            border-bottom: 1px solid #2d2d30;
        }
        
        .queue-table tr:last-child td {
            border-bottom: none;
        }
        
        .queue-table tr:hover {
            background: #2a2a2a;
        }
        
        .queue-key {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: 600;
            color: #dcdcaa;
        }
        
        .queue-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-idle {
            background: #3a3a3a;
            color: #858585;
        }
        
        .status-pending {
            background: #4d3800;
            color: #ffcc00;
        }
        
        .status-submitted {
            background: #1a4a5c;
            color: #4fc3f7;
        }
        
        .status-validating {
            background: #4a3a00;
            color: #ffd54f;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-in-progress {
            background: #0d47a1;
            color: #64b5f6;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-finalizing {
            background: #1a237e;
            color: #9fa8da;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-completed {
            background: #1b5e20;
            color: #81c784;
        }
        
        .status-failed {
            background: #b71c1c;
            color: #e57373;
        }
        
        .status-expired {
            background: #5d4037;
            color: #bcaaa4;
        }
        
        .status-cancelled {
            background: #424242;
            color: #9e9e9e;
        }
        
        .status-cancelling {
            background: #4a148c;
            color: #ce93d8;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        .job-id {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #858585;
        }
        
        .progress-text {
            color: #d4d4d4;
        }
        
        .error-count {
            color: #e57373;
            font-weight: 600;
        }
        
        .elapsed-time {
            color: #9e9e9e;
            font-size: 12px;
        }
        
        .queue-info {
            color: #858585;
            font-size: 12px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #858585;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .error-state {
            background: #3c1f1f;
            border: 1px solid #5c3030;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            color: #e57373;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #858585;
        }
        
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #3c3c3c;
            border-top: 3px solid #569cd6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Batch Queue Monitor</h1>
        
        <div class="refresh-controls">
            <button class="icon-only" onclick="refresh()" title="Refresh">
                🔄
            </button>
            <button class="icon-only" id="autoRefreshBtn" onclick="toggleAutoRefresh()" title="Auto-Refresh (5s) - Inactive">
                ⏱️
            </button>
            <div class="last-update" id="lastUpdate">Never</div>
        </div>
        
        <div class="stats-grid" id="statsGrid" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">System</div>
                <div class="stat-multi">
                    <div class="stat-item">
                        <div class="stat-item-label">Queues</div>
                        <div class="stat-item-value" id="totalQueues">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-item-label">Jobs Running</div>
                        <div class="stat-item-value" id="activeJobs">0</div>
                    </div>
                </div>
            </div>
            <div class="stat-card" title="Completed/Failed: Total across all batches">
                <div class="stat-label">Requests</div>
                <div class="stat-multi">
                    <div class="stat-item">
                        <div class="stat-item-label">Completed</div>
                        <div class="stat-item-value" id="totalCompleted">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-item-label">Failed</div>
                        <div class="stat-item-value error" id="totalFailed">0</div>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">⏱️ Processing Time</div>
                <div class="stat-multi">
                    <div class="stat-item">
                        <div class="stat-item-label">Min</div>
                        <div class="stat-item-value" id="timeMin">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-item-label">Mean</div>
                        <div class="stat-item-value" id="timeMean">—</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-item-label">Max</div>
                        <div class="stat-item-value" id="timeMax">—</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="queueList">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px;">Loading batch queues...</p>
            </div>
        </div>
    </div>
    
    <script>
        let autoRefreshInterval = null;
        let metrics = null;
        
        async function refresh() {
            try {
                // Fetch queues
                const response = await fetch('/plugins/batch_monitor/queues');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Fetch metrics
                try {
                    const metricsResponse = await fetch('/plugins/batch_monitor/metrics');
                    if (metricsResponse.ok) {
                        metrics = await metricsResponse.json();
                    }
                } catch (e) {
                    console.warn('Failed to fetch metrics:', e);
                }
                
                renderQueues(data, metrics);
                updateLastUpdate();
                
            } catch (error) {
                console.error('Failed to refresh:', error);
                renderError(error.message);
            }
        }
        
        function renderQueues(data, metricsData) {
            const queueList = document.getElementById('queueList');
            const statsGrid = document.getElementById('statsGrid');
            
            if (data.status === 'unavailable') {
                queueList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h2>Batch System Unavailable</h2>
                        <p>${data.message || 'Batch queue manager not initialized'}</p>
                        <p style="margin-top: 10px; font-size: 13px;">Enable batch processing in llm.yaml</p>
                    </div>
                `;
                statsGrid.style.display = 'none';
                return;
            }
            
            // Update stats
            document.getElementById('totalQueues').textContent = data.queue_count || 0;
            // Count only truly running jobs (exclude completed/failed)
            const runningStatuses = ['submitted', 'validating', 'in_progress', 'finalizing', 'cancelling'];
            const activeCount = data.queues.reduce((sum, q) => {
                const runningJobs = (q.active_jobs || []).filter(job => runningStatuses.includes(job.status));
                return sum + runningJobs.length;
            }, 0);
            document.getElementById('activeJobs').textContent = activeCount;
            
            if (metricsData && metricsData.status === 'success') {
                document.getElementById('totalCompleted').textContent = metricsData.total_completed_requests || 0;
                document.getElementById('totalFailed').textContent = metricsData.total_failed_requests || 0;
                
                // Processing time stats
                const pt = metricsData.processing_time;
                if (pt && pt.sample_count > 0) {
                    document.getElementById('timeMin').textContent = formatDuration(pt.min);
                    document.getElementById('timeMean').textContent = formatDuration(pt.mean);
                    document.getElementById('timeMax').textContent = formatDuration(pt.max);
                } else {
                    document.getElementById('timeMin').textContent = '—';
                    document.getElementById('timeMean').textContent = '—';
                    document.getElementById('timeMax').textContent = '—';
                }
            }
            
            statsGrid.style.display = 'grid';
            
            // Render queue table
            if (data.queues.length === 0) {
                queueList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <h2>No Batch Queues</h2>
                        <p>No batch queues are currently configured</p>
                    </div>
                `;
                return;
            }
            
            queueList.innerHTML = renderQueueTable(data.queues, data.collection_window_seconds);
        }
        
        function renderQueueTable(queues, collectionWindow) {
            let rows = '';
            
            for (const queue of queues) {
                const statusClass = `status-${queue.status.replace('_', '-')}`;
                const statusIcon = getStatusIcon(queue.status);
                const activeJobs = queue.active_jobs || [];
                
                if (activeJobs.length > 0) {
                    // One row per job
                    for (let i = 0; i < activeJobs.length; i++) {
                        const job = activeJobs[i];
                        const jobStatusClass = `status-${job.status.replace('_', '-')}`;
                        const jobStatusIcon = getStatusIcon(job.status);
                        let progress = job.total_requests > 0
                            ? `${job.completed_count} / ${job.total_requests}`
                            : '—';
                        
                        // Add failed count to progress if any
                        if (job.failed_count > 0) {
                            progress += ` <span class="error-count">(${job.failed_count} ✗)</span>`;
                        }
                        
                        const elapsed = formatDuration(job.elapsed_seconds);
                        
                        rows += `
                            <tr>
                                <td><span class="queue-key">${escapeHtml(queue.queue_key)}</span></td>
                                <td><span class="job-id">${escapeHtml(job.job_id)}</span></td>
                                <td><span class="queue-status-badge ${jobStatusClass}">${jobStatusIcon} ${job.status}</span></td>
                                <td><span class="progress-text">${progress}</span></td>
                                <td><span class="elapsed-time">${elapsed}</span></td>
                            </tr>
                        `;
                    }
                    
                    // Also show pending requests row if there are any (requests waiting to be batched)
                    if (queue.pending_requests > 0) {
                        rows += `
                            <tr>
                                <td><span class="queue-key">${escapeHtml(queue.queue_key)}</span></td>
                                <td><span class="queue-info">—</span></td>
                                <td><span class="queue-status-badge status-pending">◐ pending</span></td>
                                <td colspan="2"><span class="queue-info">${queue.pending_requests} pending (batching in ~${collectionWindow}s)</span></td>
                            </tr>
                        `;
                    }
                } else {
                    // Queue with no active jobs
                    const info = queue.pending_requests > 0
                        ? `<span class="queue-info">${queue.pending_requests} pending (batching in ~${collectionWindow}s)</span>`
                        : `<span class="queue-info">—</span>`;
                    
                    rows += `
                        <tr>
                            <td><span class="queue-key">${escapeHtml(queue.queue_key)}</span></td>
                            <td><span class="queue-info">—</span></td>
                            <td><span class="queue-status-badge ${statusClass}">${statusIcon} ${queue.status}</span></td>
                            <td colspan="2">${info}</td>
                        </tr>
                    `;
                }
            }
            
            return `
                <div class="queue-list">
                    <table class="queue-table">
                        <thead>
                            <tr>
                                <th>Queue</th>
                                <th>Job ID</th>
                                <th>Status</th>
                                <th>Progress</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        }
        
        function getStatusIcon(status) {
            const icons = {
                'idle': '○',
                'pending': '◐',
                'submitted': '◑',
                'validating': '◔',
                'in_progress': '●',
                'finalizing': '◕',
                'completed': '✓',
                'failed': '✗',
                'expired': '⏱',
                'cancelled': '⊘',
                'cancelling': '⊗',
            };
            return icons[status] || '?';
        }
        
        function formatDuration(seconds) {
            if (seconds === null || seconds === undefined) return '—';
            if (seconds < 60) return `${seconds.toFixed(1)}s`;
            if (seconds < 3600) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.round(seconds % 60);
                return `${mins}m ${secs}s`;
            }
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            return `${hours}h ${mins}m`;
        }
        
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        function renderError(message) {
            const queueList = document.getElementById('queueList');
            queueList.innerHTML = `
                <div class="error-state">
                    <h2>⚠️ Error Loading Queues</h2>
                    <p style="margin-top: 10px;">${escapeHtml(message)}</p>
                </div>
            `;
            document.getElementById('statsGrid').style.display = 'none';
        }
        
        function updateLastUpdate() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            document.getElementById('lastUpdate').textContent = `Last update: ${timeStr}`;
        }
        
        function toggleAutoRefresh() {
            const btn = document.getElementById('autoRefreshBtn');
            
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                btn.classList.remove('active');
                btn.title = 'Auto-Refresh (5s) - Inactive';
            } else {
                autoRefreshInterval = setInterval(refresh, 5000);
                btn.classList.add('active');
                btn.title = 'Auto-Refresh (5s) - Active';
            }
        }
        
        // Initial load
        refresh();
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
