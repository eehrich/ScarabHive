<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Queue Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #569cd6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .refresh-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        button {
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #1177bb;
        }
        
        button:disabled {
            background: #3c3c3c;
            cursor: not-allowed;
        }
        
        button.icon-only {
            padding: 8px;
            min-width: 36px;
            justify-content: center;
            font-size: 18px;
            background: #3c3c3c;
        }
        
        button.icon-only:hover {
            background: #505050;
        }
        
        button.icon-only.active {
            background: #0e639c;
        }
        
        button.icon-only.active:hover {
            background: #1177bb;
        }
        
        .last-update {
            margin-left: auto;
            color: #858585;
            font-size: 13px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 12px 15px;
        }
        
        .stat-label {
            font-size: 11px;
            color: #858585;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #4ec9b0;
        }
        
        .stat-value.warning {
            color: #ffcc00;
        }
        
        .stat-value.error {
            color: #e57373;
        }
        
        .queue-list {
            display: grid;
            gap: 15px;
        }
        
        .queue-card {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 6px;
            padding: 20px;
            transition: border-color 0.2s;
        }
        
        .queue-card:hover {
            border-color: #569cd6;
        }
        
        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .queue-key {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: 600;
            color: #dcdcaa;
        }
        
        .queue-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-idle {
            background: #3a3a3a;
            color: #858585;
        }
        
        .status-pending {
            background: #4d3800;
            color: #ffcc00;
        }
        
        .status-submitted {
            background: #1a4a5c;
            color: #4fc3f7;
        }
        
        .status-validating {
            background: #4a3a00;
            color: #ffd54f;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-in_progress {
            background: #0d47a1;
            color: #64b5f6;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-finalizing {
            background: #1a237e;
            color: #9fa8da;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status-completed {
            background: #1b5e20;
            color: #81c784;
        }
        
        .status-failed {
            background: #b71c1c;
            color: #e57373;
        }
        
        .status-expired {
            background: #5d4037;
            color: #bcaaa4;
        }
        
        .status-cancelled {
            background: #424242;
            color: #9e9e9e;
        }
        
        .status-cancelling {
            background: #4a148c;
            color: #ce93d8;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        .queue-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .detail-item {
            padding: 12px;
            background: #1e1e1e;
            border-radius: 4px;
        }
        
        .detail-label {
            font-size: 11px;
            color: #858585;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .detail-value {
            font-size: 14px;
            color: #d4d4d4;
            font-weight: 500;
        }
        
        .detail-value.monospace {
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .error-count {
            color: #e57373;
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #858585;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .error-state {
            background: #3c1f1f;
            border: 1px solid #5c3030;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            color: #e57373;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #858585;
        }
        
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #3c3c3c;
            border-top: 3px solid #569cd6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Batch Queue Monitor</h1>
        
        <div class="refresh-controls">
            <button class="icon-only" onclick="refresh()" title="Refresh">
                🔄
            </button>
            <button class="icon-only" id="autoRefreshBtn" onclick="toggleAutoRefresh()" title="Auto-Refresh (5s) - Inactive">
                ⏱️
            </button>
            <div class="last-update" id="lastUpdate">Never</div>
        </div>
        
        <div class="stats-grid" id="statsGrid" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">Queues</div>
                <div class="stat-value" id="totalQueues">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Jobs</div>
                <div class="stat-value" id="activeJobs">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Queued</div>
                <div class="stat-value warning" id="pendingRequests">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="totalCompleted">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Failed</div>
                <div class="stat-value error" id="totalFailed">0</div>
            </div>
        </div>
        
        <div id="queueList">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px;">Loading batch queues...</p>
            </div>
        </div>
    </div>
    
    <script>
        let autoRefreshInterval = null;
        let metrics = null;
        
        async function refresh() {
            try {
                // Fetch queues
                const response = await fetch('/plugins/batch_monitor/queues');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Fetch metrics
                try {
                    const metricsResponse = await fetch('/plugins/batch_monitor/metrics');
                    if (metricsResponse.ok) {
                        metrics = await metricsResponse.json();
                    }
                } catch (e) {
                    console.warn('Failed to fetch metrics:', e);
                }
                
                renderQueues(data, metrics);
                updateLastUpdate();
                
            } catch (error) {
                console.error('Failed to refresh:', error);
                renderError(error.message);
            }
        }
        
        function renderQueues(data, metricsData) {
            const queueList = document.getElementById('queueList');
            const statsGrid = document.getElementById('statsGrid');
            
            if (data.status === 'unavailable') {
                queueList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h2>Batch System Unavailable</h2>
                        <p>${data.message || 'Batch queue manager not initialized'}</p>
                        <p style="margin-top: 10px; font-size: 13px;">Enable batch processing in llm.yaml</p>
                    </div>
                `;
                statsGrid.style.display = 'none';
                return;
            }
            
            // Update stats
            document.getElementById('totalQueues').textContent = data.queue_count || 0;
            const activeCount = data.queues.filter(q => q.active_job).length;
            document.getElementById('activeJobs').textContent = activeCount;
            
            // Calculate pending from queues data
            const pendingCount = data.queues.reduce((sum, q) => sum + (q.pending_requests || 0), 0);
            document.getElementById('pendingRequests').textContent = pendingCount;
            
            if (metricsData && metricsData.status === 'success') {
                document.getElementById('totalCompleted').textContent = metricsData.total_completed_requests || 0;
                document.getElementById('totalFailed').textContent = metricsData.total_failed_requests || 0;
            }
            
            statsGrid.style.display = 'grid';
            
            // Render queue cards
            if (data.queues.length === 0) {
                queueList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <h2>No Batch Queues</h2>
                        <p>No batch queues are currently configured</p>
                    </div>
                `;
                return;
            }
            
            queueList.innerHTML = data.queues.map(queue => renderQueueCard(queue, data.collection_window_seconds)).join('');
        }
        
        function renderQueueCard(queue, collectionWindow) {
            const statusClass = `status-${queue.status.replace('_', '-')}`;
            const statusIcon = getStatusIcon(queue.status);
            const activeJobs = queue.active_jobs || [];
            const jobCount = activeJobs.length;
            
            let detailsHTML = '';
            
            // Show pending requests info if any
            if (queue.pending_requests > 0) {
                detailsHTML += `
                    <div class="queue-details" style="margin-bottom: 10px;">
                        <div class="detail-item">
                            <div class="detail-label">Queued Requests</div>
                            <div class="detail-value">${queue.pending_requests}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Next Submit</div>
                            <div class="detail-value">~${collectionWindow}s</div>
                        </div>
                    </div>
                `;
            }
            
            // Show all active jobs
            if (jobCount > 0) {
                for (let i = 0; i < activeJobs.length; i++) {
                    const job = activeJobs[i];
                    const elapsed = formatDuration(job.elapsed_seconds);
                    const progress = job.total_requests > 0
                        ? `${job.completed_count} / ${job.total_requests}`
                        : '—';
                    const jobStatusClass = `status-${job.status.replace('_', '-')}`;
                    const jobStatusIcon = getStatusIcon(job.status);
                    
                    detailsHTML += `
                        <div class="job-section" style="${i > 0 ? 'margin-top: 12px; padding-top: 12px; border-top: 1px solid #3e3e42;' : ''}">
                            ${jobCount > 1 ? `<div style="font-size: 11px; color: #858585; margin-bottom: 8px;">Job ${i + 1} of ${jobCount} <span class="queue-status-badge ${jobStatusClass}" style="font-size: 10px; padding: 2px 6px;">${jobStatusIcon} ${job.status}</span></div>` : ''}
                            <div class="queue-details">
                                <div class="detail-item">
                                    <div class="detail-label">Job ID</div>
                                    <div class="detail-value monospace">${escapeHtml(job.job_id)}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Progress</div>
                                    <div class="detail-value">${progress}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Elapsed Time</div>
                                    <div class="detail-value">${elapsed}</div>
                                </div>
                                ${job.failed_count > 0 ? `
                                <div class="detail-item">
                                    <div class="detail-label">Failed</div>
                                    <div class="detail-value error-count">${job.failed_count}</div>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            } else if (queue.status === 'idle' && queue.pending_requests === 0) {
                detailsHTML = `
                    <div class="queue-details">
                        <div class="detail-item">
                            <div class="detail-label">Status</div>
                            <div class="detail-value">No active jobs</div>
                        </div>
                    </div>
                `;
            }
            
            // Show job count in header if multiple
            const jobCountBadge = jobCount > 1 ? `<span style="font-size: 12px; color: #858585; margin-left: 10px;">(${jobCount} jobs)</span>` : '';
            
            return `
                <div class="queue-card">
                    <div class="queue-header">
                        <div class="queue-key">${escapeHtml(queue.queue_key)}${jobCountBadge}</div>
                        <span class="queue-status-badge ${statusClass}">${statusIcon} ${queue.status}</span>
                    </div>
                    ${detailsHTML}
                </div>
            `;
        }
        
        function getStatusIcon(status) {
            const icons = {
                'idle': '○',
                'pending': '◐',
                'submitted': '◑',
                'validating': '◔',
                'in_progress': '●',
                'finalizing': '◕',
                'completed': '✓',
                'failed': '✗',
                'expired': '⏱',
                'cancelled': '⊘',
                'cancelling': '⊗',
            };
            return icons[status] || '?';
        }
        
        function formatDuration(seconds) {
            if (!seconds) return '—';
            if (seconds < 60) return `${seconds}s`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            return `${hours}h ${mins}m`;
        }
        
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        function renderError(message) {
            const queueList = document.getElementById('queueList');
            queueList.innerHTML = `
                <div class="error-state">
                    <h2>⚠️ Error Loading Queues</h2>
                    <p style="margin-top: 10px;">${escapeHtml(message)}</p>
                </div>
            `;
            document.getElementById('statsGrid').style.display = 'none';
        }
        
        function updateLastUpdate() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            document.getElementById('lastUpdate').textContent = `Last update: ${timeStr}`;
        }
        
        function toggleAutoRefresh() {
            const btn = document.getElementById('autoRefreshBtn');
            
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                btn.classList.remove('active');
                btn.title = 'Auto-Refresh (5s) - Inactive';
            } else {
                autoRefreshInterval = setInterval(refresh, 5000);
                btn.classList.add('active');
                btn.title = 'Auto-Refresh (5s) - Active';
            }
        }
        
        // Initial load
        refresh();
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
