# Web UI configuration for Batch Monitor Plugin

web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Batch Queues"
    description: "Queue status of batched LLM requests"
    icon: layers
    category: system
    keywords: [batch, queue, llm]
    window: {width: 900, height: 600}

  endpoints:
    - path: "/"
      method: "GET"
      handler: "get_panel"
      response_type: "html"
      description: "Batch queue monitoring panel"
    - path: "/queues"
      method: "GET"
      handler: "get_queues"
      response_type: "json"
      description: "Get all queue statuses as JSON"
    - path: "/queues/{queue_key}"
      method: "GET"
      handler: "get_queue_detail"
      response_type: "json"
      description: "Get detailed status of specific queue"
    - path: "/metrics"
      method: "GET"
      handler: "get_metrics"
      response_type: "json"
      description: "Get overall batch system metrics"

