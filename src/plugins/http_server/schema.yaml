tools:
  - type: function
    function:
      name: "{{ name }}_ops"
      description: HTTP adapter for tool servers - health checks and proxied tool calls via REST API endpoints.
      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: [health, call]
            description: "'health' for server status, 'call' to proxy tool calls via HTTP"
          tool:
            type: string
            description: "tool name to call (required for 'call' operation)"
          params:
            type: object
            description: "Parameters for tool call (for 'call' operation)"
        required: [operation]
        additionalProperties: false

config:
  host: 127.0.0.1
  port: 9000
