# Hook definitions for message_validator plugin
# Convention: hook name must match method name exactly
hooks:
  - name: validate_messages
    type: pre_llm_call
    enabled: true
    timeout: 10.0
    description: "Validates and sanitizes messages before LLM calls"
    category: "message_validation"
    order:
      after: ["prompt_injection"]
      before: ["message_debugging"]
  
  - name: validate_structure
    type: pre_llm_call
    enabled: true
    timeout: 10.0
    description: "Validates message structure and role sequences"
    category: "message_validation"
    order:
      after: ["prompt_injection"]
      before: ["message_validator.validate_messages"]  # Run before validate_messages hook (use full hook name to avoid category cycle)

# Configuration schema for this plugin
config:
  log_level:
    type: string
    default: "warning"
    enum: ["debug", "info", "warning", "error"]
    description: "Logging level for validation issues"
  
  strict_mode:
    type: boolean
    default: false
    description: "Reject invalid messages instead of fixing them"
  
  max_message_length:
    type: integer
    default: 100000
    description: "Maximum allowed message length"
    minimum: 1000
    maximum: 1000000
  
  sanitize_content:
    type: boolean
    default: true
    description: "Sanitize message content (remove dangerous patterns)"
  
  enforce_alternating:
    type: boolean
    default: true
    description: "Enforce alternating user/assistant pattern by merging consecutive duplicates"
  
  allowed_roles:
    type: array
    items:
      type: string
      enum: ["system", "user", "assistant", "tool"]
    default: ["system", "user", "assistant", "tool"]
    description: "List of allowed message roles"
  
  validation_level:
    type: string
    enum: ["minimal", "standard", "strict"]
    default: "standard"
    description: "Validation strictness level"
