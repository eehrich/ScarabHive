<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Files panel tests</title>
  <style>body { margin: 0; } iframe { width: 900px; height: 700px; border: 0; }</style>
</head>
<body>
<iframe id="panel" title="panel"></iframe>
<script type="module">
  // The real Files panel against a stub server, loaded on its own (no shell), pinned to a session.
  const results = {};
  const check = async (name, fn) => {
    try { results[name] = (await fn()) === true ? 'ok' : 'failed'; }
    catch (error) { results[name] = `error: ${error && error.message}`; }
  };
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  async function until(what, predicate, timeout = 10000) {
    const end = performance.now() + timeout;
    for (;;) {
      let value = null;
      try { value = await predicate(); } catch { /* not there yet */ }
      if (value) return value;
      if (performance.now() > end) throw new Error(`timed out waiting for ${what}`);
      await sleep(30);
    }
  }
  const frame = document.getElementById('panel');
  const doc = () => frame.contentDocument;
  const loaded = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
  frame.src = '/plugins/file_checkpoints/?session_id=s1';
  await loaded;
  await until('the checkpoints', () => doc().querySelectorAll('#filesView .pk-card').length === 2);

  const fileRow = (path) => doc().querySelector(`details.fc-file[data-path="${path}"]`);
  async function answer(label) {
    const dialog = await until('a question', () => doc().querySelector('dialog.pk-dialog[open]'));
    const text = dialog.textContent;
    [...dialog.querySelectorAll('button')].find((b) => b.textContent.trim() === label).click();
    await until('the question to close', () => !dialog.open);
    return text;
  }

  await check('the checkpoints are listed newest first with where they stand', async () => {
    const titles = [...doc().querySelectorAll('#filesView .pk-card-title')].map((t) => t.textContent);
    const older = doc().querySelectorAll('#filesView .pk-card')[1].textContent;
    return titles[0].includes('Checkpoint 5') && titles[0].includes('after turn 1')
      && titles[1].includes('Checkpoint 3') && titles[1].includes('before turn 1')
      && older.includes('fix the parser') && older.includes('terminal/execute ×2');
  });

  await check('a file opened shows its diff with the numbers of the new file', async () => {
    fileRow('/w/a.txt').open = true;
    const pre = await until('the diff', () => fileRow('/w/a.txt').querySelector('pre.pk-code--lines'));
    const del = pre.querySelector('.pk-code-line--del');
    const add = pre.querySelector('.pk-code-line--add');
    return del.textContent === '-old line' && del.dataset.line === ''
      && add.textContent === '+new line' && add.dataset.line === '4'
      && pre.querySelectorAll('.pk-code-line--file').length === 2;
  });

  await check('a file without a diff says why', async () => {
    fileRow('/w/logo.bin').open = true;
    await until('the note', () => fileRow('/w/logo.bin').textContent.includes('Binary file (0 -> 6 bytes).'));
    return !fileRow('/w/logo.bin').querySelector('pre');
  });

  await check('a refresh with nothing new leaves an open diff alone', async () => {
    const pre = fileRow('/w/a.txt').querySelector('pre.pk-code--lines');
    const asked = (await (await fetch('/stub/diffs')).json()).length;
    doc().dispatchEvent(new CustomEvent('refresh', { detail: { auto: false } }));
    await sleep(500);
    const again = (await (await fetch('/stub/diffs')).json()).length;
    return pre && asked === 2 && again === asked && fileRow('/w/a.txt').open
      && fileRow('/w/a.txt').querySelector('pre.pk-code--lines') === pre;
  });

  const card = (number) => doc().querySelector(`.pk-card[data-card="${number}"]`);
  const shownAt = (el) => el.offsetParent !== null;

  await check('the checkpoints stand under the span of their newest change, every change with its moment', async () => {
    const spans = [...doc().querySelectorAll('#filesView .fc-group')].map((g) => [
      g.querySelector('.pk-section-title').textContent, [...g.querySelectorAll('[data-rewind]')].map((b) => b.dataset.rewind)]);
    const stamps = [...doc().querySelectorAll('#filesView details.fc-file time')].map((t) => t.getAttribute('datetime'));
    const shownStamp = fileRow('/w/c.txt').querySelector('time').textContent;
    return JSON.stringify(spans) === JSON.stringify([['Last hour', ['5']], ['Yesterday', ['3']]])
      && stamps.length === 3 && stamps.every(Boolean)
      && /\d{2}:\d{2}:\d{2}/.test(shownStamp) && !!card(3).querySelector('.pk-card-head time');
  });

  await check('a file marked reviewed keeps its diff closed and its mark across a redraw', async () => {
    fileRow('/w/c.txt').querySelector('[data-review]').click();
    await until('the mark', () => fileRow('/w/c.txt').classList.contains('fc-reviewed'));
    const closed = !fileRow('/w/c.txt').open;
    doc().dispatchEvent(new CustomEvent('refresh', { detail: { auto: false } }));
    await sleep(500);
    const button = fileRow('/w/c.txt').querySelector('[data-review]');
    const stored = JSON.parse(frame.contentWindow.localStorage.getItem('fc.reviewed') || '{}');
    return closed && button.getAttribute('aria-pressed') === 'true' && card(5).classList.contains('fc-all-reviewed')
      && (stored.s1 || []).length === 1 && stored.s1[0].startsWith('5\n/w/c.txt\n');
  });

  await check('all files of a checkpoint are marked and unmarked at once', async () => {
    card(3).querySelector('[data-review-all]').click();
    await until('both marks', () => fileRow('/w/a.txt').classList.contains('fc-reviewed')
      && fileRow('/w/logo.bin').classList.contains('fc-reviewed'));
    const marked = card(3).classList.contains('fc-all-reviewed') && fileRow('/w/a.txt').open;   // its diff stays open
    card(3).querySelector('[data-review-all]').click();
    await until('no marks', () => !fileRow('/w/a.txt').classList.contains('fc-reviewed'));
    return marked && !fileRow('/w/logo.bin').classList.contains('fc-reviewed') && !card(3).classList.contains('fc-all-reviewed')
      && fileRow('/w/c.txt').classList.contains('fc-reviewed');
  });

  await check('hiding the reviewed hides their checkpoint and a span left empty', async () => {
    const toggle = doc().getElementById('hideReviewed');
    toggle.click();
    await sleep(100);
    const lastHour = card(5).closest('.fc-group');
    const hidden = !shownAt(card(5)) && !shownAt(lastHour) && shownAt(card(3));
    toggle.click();
    await sleep(100);
    return hidden && shownAt(card(5)) && shownAt(lastHour)
      && frame.contentWindow.localStorage.getItem('fc.hideReviewed') === 'false';
  });

  await check('a checkpoint reviewed whole offers no put back until a mark comes off', async () => {
    const hidden = card(5).classList.contains('fc-all-reviewed') && !card(5).querySelector('[data-rewind], [data-revert]')
      && !!card(3).querySelector('[data-rewind]');
    fileRow('/w/c.txt').querySelector('[data-review]').click();
    await until('the mark off', () => !fileRow('/w/c.txt').classList.contains('fc-reviewed'));
    return hidden && !!card(5).querySelector('[data-rewind="5"]');
  });

  await check('a refusal for a running session offers no overwrite', async () => {
    doc().querySelector('[data-rewind="5"]').click();
    await answer('Restore to here');
    await until('the refusal', () => doc().body.textContent.includes('Session s1 is running'));
    await sleep(300);
    const sent = await (await fetch('/stub/calls')).json();
    return !doc().querySelector('dialog.pk-dialog[open]') && sent.length === 1 && sent[0].checkpoint === 5;
  });

  await check('a refused rewind is asked once more and then sent with overwrite', async () => {
    doc().querySelector('[data-rewind="3"]').click();
    const first = await answer('Restore to here');
    const second = await answer('Overwrite');
    const calls = await until('both calls', async () => {
      const sent = await (await fetch('/stub/calls')).json();
      return sent.length === 3 && sent.slice(1);
    });
    return first.includes('since checkpoint 3') && second.includes('changed outside the agent')
      && calls[0].checkpoint === 3 && calls[0].overwrite === false && calls[1].overwrite === true
      && calls[1].session_id === 's1';
  });

  await check('a checkpoint that only counted calls is one line with nothing to put back', async () => {
    const row = doc().querySelector('.fc-counted[data-card="4"]');
    return !!row && !row.closest('.pk-card') && row.textContent.includes('coder_cli/run_task ×1')
      && row.textContent.includes('only counted') && !row.querySelector('button') && !!row.querySelector('time')
      && !row.textContent.includes('let it run');
  });

  await check('a checkpoint is reverted alone, and a file of it alone', async () => {
    card(3).querySelector('[data-revert="3"]').click();
    const asked = await answer('Revert');
    const wasOpen = fileRow('/w/a.txt').open;
    fileRow('/w/a.txt').querySelector('[data-revert-file]').click();
    const askedFile = await answer('Revert');
    const calls = await until('both reverts', async () => {
      const sent = await (await fetch('/stub/calls')).json();
      return sent.length === 5 && sent.slice(3);
    });
    return asked.includes('checkpoint 3 alone') && askedFile.includes('/w/a.txt')
      && calls[0].checkpoint === 3 && calls[0].only === true && !calls[0].path
      && calls[1].checkpoint === 3 && calls[1].path === '/w/a.txt' && calls[1].only === undefined
      && fileRow('/w/a.txt').open === wasOpen;   // the button in the file's summary leaves its diff as it was
  });

  await check('what is reviewed offers no revert', async () => {
    fileRow('/w/a.txt').querySelector('[data-review]').click();
    await until('the mark', () => fileRow('/w/a.txt').classList.contains('fc-reviewed'));
    const fileGone = !fileRow('/w/a.txt').querySelector('[data-revert-file]')
      && !!fileRow('/w/logo.bin').querySelector('[data-revert-file]') && !!card(3).querySelector('[data-revert="3"]');
    fileRow('/w/a.txt').querySelector('[data-review]').click();
    await until('the mark off', () => !fileRow('/w/a.txt').classList.contains('fc-reviewed'));
    return fileGone && !!fileRow('/w/a.txt').querySelector('[data-revert-file]');
  });

  await check('without storage a mark still holds for the page', async () => {
    const storage = Object.getPrototypeOf(frame.contentWindow.localStorage);
    const setItem = storage.setItem;
    storage.setItem = () => { throw new Error('storage blocked'); };
    try {
      fileRow('/w/logo.bin').querySelector('[data-review]').click();
      await until('the mark', () => fileRow('/w/logo.bin').classList.contains('fc-reviewed'));
      const held = fileRow('/w/logo.bin').querySelector('[data-review]').getAttribute('aria-pressed') === 'true';
      fileRow('/w/logo.bin').querySelector('[data-review]').click();
      await until('the mark off', () => !fileRow('/w/logo.bin').classList.contains('fc-reviewed'));
      return held;
    } finally {
      storage.setItem = setItem;
    }
  });

  await fetch('/__results', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(results) });
</script>
</body>
</html>
