# task_switch plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "task_switch"
version = "0.1.0"
description = "Task state management - allows LLM to switch between task modes via template_vars"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["tool-server"]
category = "workflow"
tags = ["state", "workflow", "prompt-control"]
requires = { agent_system = ">=0.6.0" }
