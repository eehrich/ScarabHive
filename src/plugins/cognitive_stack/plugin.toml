# cognitive_stack plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "cognitive_stack"
version = "1.0.0"
description = "Cognitive Stack Plugin - working memory for LLMs: a nested problem-solving stack exposed via MCP tools plus a pre_llm_call hook"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["mcp-server", "hooks"]
category = "tools"
requires = { python = ">=3.11", agent_system = ">=0.6.0" }
