# Cognitive Stack MCP Server Schema
# Jinja2 variables: {{ name }}, {{ max_depth }}

tools:
  - name: "{{ name }}"
    description: "Manage cognitive stack for nested problem-solving. Operations: push_batch (add items), pop_batch (return items), peek (view top), list (show all), clear (reset). Stack automatically tracked per session - no need to remember stack_id!"
    inputSchema:
      type: object
      properties:
        operation:
          type: string
          enum: ["push_batch", "pop_batch", "peek", "list", "clear"]
          description: "Operation to perform: push_batch (add frames), pop_batch (remove frames), peek (view top N), list (show all), clear (reset stack)"

        # push_batch parameters
        items:
          type: array
          description: "Required for 'push_batch': Array of frame objects to push onto stack. Each item MUST be an object with 'context' (string, required) and optional 'data' (object). Example: [{\"context\": \"Task 1\", \"data\": {\"priority\": \"high\"}}, {\"context\": \"Task 2\"}]"
          items:
            type: object
            properties:
              context:
                type: string
                description: "Description of the context/task for this frame"
              data:
                type: object
                description: "Optional structured data for this frame"
            required: ["context"]

        # pop_batch parameters
        count:
          type: integer
          description: "Required for 'pop_batch': Number of frames to pop from stack"
          minimum: 1

        # Common parameters
        stack_id:
          type: string
          description: "Stack ID (optional - automatically resolved from your session). Only needed if managing multiple stacks explicitly."

        # peek parameters
        depth:
          type: integer
          description: "For 'peek': Number of top frames to view (default: 1)"
          default: 1
          minimum: 1

      required: ["operation"]

# Hook Configuration
hooks:
  - name: inject_stack_context
    type: pre_llm_call
    enabled: false  # default is disabled, agents enable it explicitly
    timeout: 5.0
    description: "Inject active cognitive stack into system prompt to provide working memory context"
    category: "prompt_injection"
    order:
      after: ["context_optimization"]
      before: ["message_validation"]

config:
  max_depth:
    type: integer
    default: 20
    description: "Maximum number of frames allowed on a single stack (prevents infinite recursion)"
    minimum: 5
    maximum: 100

  max_frames_in_prompt:
    type: integer
    default: 3
    description: "Number of top frames to show in hook prompt injection"
    minimum: 1
    maximum: 10
