# Cognitive Stack MCP Server Schema
# Jinja2 variables: {{ name }}, {{ max_depth }}, {{ session_ttl_seconds }}

tools:
  - name: "{{ name }}"
    description: "Manage cognitive stack for nested problem-solving and working memory. Operations: push_batch (add contexts), pop_batch (return previous contexts), peek (view without removing), list (show all), clear (reset)."
    inputSchema:
      type: object
      properties:
        operation:
          type: string
          enum: ["push_batch", "pop_batch", "peek", "list", "clear"]
          description: "Operation to perform: push_batch (add one or more frames), pop_batch (remove one or more frames), peek (view top N), list (show all), clear (reset stack)"

        # Push parameters
        context:
          type: string
          description: "Required for 'push': Description of nested context you're entering"
        data:
          type: object
          description: "Optional for 'push': Structured data for this frame (key-value pairs)"
          default: {}

        # Batch parameters
        items:
          type: array
          description: "Required for 'push_batch': Array of items to push onto stack. Each item: {context: string, data?: object}"
          items:
            type: object
            properties:
              context:
                type: string
              data:
                type: object
            required: ["context"]
        count:
          type: integer
          description: "Required for 'pop_batch': Number of frames to pop from stack"
          minimum: 1

        # Common parameters
        stack_id:
          type: string
          description: "Stack ID. Required for pop/peek/list/clear. Optional for push (creates new stack if omitted on first use)"

        # Peek parameter
        depth:
          type: integer
          description: "For 'peek': Number of top frames to view (default: 1)"
          default: 1
          minimum: 1

      required: ["operation"]

# Hook Configuration
hooks:
  - name: inject_stack_context
    type: pre_llm_call
    enabled: false  # default is disabled, agents enable it explicitly
    timeout: 5.0
    description: "Inject active cognitive stack into system prompt to provide working memory context"
    category: "prompt_injection"
    order:
      after: ["context_optimization"]
      before: ["message_validation"]

config:
  max_frames_in_prompt:
    type: integer
    default: 3
    description: "Number of top frames to show in prompt injection"
    minimum: 1
    maximum: 10
