{% extends "kit/panel_base.html" %}
{% from "kit/macros.html" import icon %}
{% block title %}Sub-Agents{% endblock %}
{% block head %}<link rel="stylesheet" href="/plugins/{{ plugin }}/static/panel.css">{% endblock %}
{% block toolbar %}
<pk-session></pk-session>
<select id="show" class="pk-select pk-select--sm sa-show" aria-label="Show" hidden>
  <option value="open">Running, idle, interrupted</option>
  <option value="running">Running</option>
  <option value="all">All, archived included</option>
</select>
<pk-refresh interval="10" auto></pk-refresh>
{% endblock %}
{% block content %}
<div class="pk-tabs" role="tablist" data-pk-tabs>
  <button class="pk-tab" role="tab" aria-selected="true" aria-controls="tab-map" data-tab="map">Map</button>
  <button class="pk-tab" role="tab" aria-selected="false" aria-controls="tab-list" data-tab="list">List</button>
</div>

<section id="tab-map" role="tabpanel" aria-label="Map">
  <div id="map" class="pk-stack sa-map"></div>
</section>

<section id="tab-list" role="tabpanel" aria-label="List" hidden>
  <div class="pk-stats" id="stats"><span class="pk-skeleton"></span></div>
  <div class="pk-muted sa-phase" id="phase" hidden></div>
  <div id="agents" class="pk-stack"></div>
</section>

<dialog id="detail" class="pk-dialog pk-drawer sa-drawer" aria-labelledby="detailTitle">
  <div class="pk-dialog-head">
    <h2 id="detailTitle" class="pk-dialog-title pk-grow pk-mono">Sub-agent</h2>
    <button type="button" class="pk-btn pk-btn--ghost pk-btn--icon pk-btn--sm" data-close aria-label="Close" title="Close">{{ icon('x') }}</button>
  </div>
  <div id="detailBody" class="pk-dialog-body" tabindex="-1"></div>
</dialog>
{% endblock %}
{% block scripts %}<script type="module" src="/plugins/{{ plugin }}/static/panel.js"></script>{% endblock %}
