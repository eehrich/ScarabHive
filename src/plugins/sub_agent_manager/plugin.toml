# sub_agent_manager plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "sub_agent_manager"
version = "1.0.0"
description = "Manages persistent sub-agent instances for coordinator agents"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["tool-server", "web"]
requires = { agent_system = ">=0.7.0" }
dependencies = ["anyio>=4.0"]  # the shielded close of a run's events (server.py); Starlette brings it, declared all the same
