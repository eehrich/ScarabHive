# MCP tool definition for Sub-Agent Manager (unified tool approach).

tools:
  - type: function
    function:
      name: "{{ name }}_manage_sub_agent"
      description: |
        Manage persistent sub-agent instances for delegation of specialized tasks.
        Sub-agents maintain conversation history and can be continued across multiple requests.

        **Followup existing agents:** Use `continue` to send new tasks to existing sub-agents.
        
        Operations:
        - create: Spawn new sub-agent and execute task (blocking=true by default, blocking=false for async)
        - continue: Continue existing sub-agent with new user message. (blocking=true by default, blocking=false for async)
        - poll: Check status of running sub-agent (NON-BLOCKING)
        - wait: Wait for sub-agent to complete (BLOCKING - returns result)
        - wait_all: Wait for multiple sub-agents (BLOCKING - returns result)
        - cancel: Cancel running sub-agent
        - list: Get all active sub-agents for current session
        - info: Get detailed status and recent activity of specific sub-agent
        - delete: Archive sub-agent instance

        IMPORTANT - Blocking vs Async Operations:
        - create with blocking=true (default): BLOCKING - returns full result before tool returns
        - create with blocking=false: NON-BLOCKING - returns instance_id immediately, agent runs in background
        - continue is always BLOCKING
        - Use create(blocking=false) + wait_all for parallel execution (faster for batch operations)
        - Same instance_id cannot run concurrently. Use different instances for parallel work.

      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: [create, continue, poll, wait, wait_all, cancel, list, info, delete]
            description: |
              Operation to perform:
              - create: Create new sub-agent (only if instance does not exist)
              - continue: Continue existing sub-agent with new message/task
              - poll: Check status of running sub-agent (NON-BLOCKING)
              - wait: Wait for sub-agent to complete (BLOCKING)
              - wait_all: Wait for multiple sub-agents (BLOCKING)
              - cancel: Cancel running sub-agent
              - list: List all active sub-agents
              - info: Get detailed info about specific sub-agent
              - delete: Archive sub-agent instance

          # Parameters for 'create' operation
          agent_type:
            type: string
            description: |
              Agent type to spawn (required for 'create').
              Available agents: {{ allowed_agents }}

          task:
            type: string
            description: |
              Initial task description (required for 'create').
              This will be the first message in the sub-agent's session.

          instance_label:
            type: string
            description: |
              Optional custom label for readability (create only).
              Auto-generated if omitted. Format: alphanumeric, underscore, hyphen.

          blocking:
            type: boolean
            description: |
              Wait for sub-agent to complete before returning (create only, default: true).
              - blocking=true: Returns full result (BLOCKING)
              - blocking=false: Returns instance_id immediately, agent runs in background (NON-BLOCKING)
            default: true

          use_advanced_model:
            type: boolean
            description: |
              Use more capable and expensive LLM for complex reasoning (create/continue, default: false).
              Useful for switching between standard and advanced reasoning mid-conversation.
              For standard tasks do not use, to save time and money.
            default: false

          # Parameters for async operations (poll/wait/cancel)
          # Uses instance_id instead of separate job_id

          timeout:
            type: number
            description: |
              Timeout in seconds for wait/wait_all operations.
            default: 3600

          # Parameters for 'continue', 'poll', 'wait', 'cancel', 'info', 'delete' operations
          instance_id:
            type: string
            description: |
              Sub-agent instance ID (required for continue/poll/wait/cancel/info/delete).
              Use the exact session ID as shown in the system prompt (e.g., 'sub_book_test_agent_001').
              This ID is injected into your system prompt when sub-agents are active.
              You can also use the ID returned when the sub-agent was created.

          instance_ids:
            type: array
            items:
              type: string
            description: |
              List of instance IDs (required for wait_all).
              Use exact session IDs as shown in system prompt (e.g., ['sub_scene_writer_001', 'sub_scene_writer_002']).
              All instances must exist or wait_all will fail.

          message:
            type: string
            description: |
              New message for sub-agent (required for 'continue').
              The sub-agent sees this in context of previous conversation.

          # Parameters for 'list' operation
          include_completed:
            type: boolean
            description: |
              Include archived sub-agents in list (list only, default: false).
            default: false

        required: [operation]

# Web UI configuration
web_ui:
  button:
    enabled: false
    text: "{{name}}"
    icon: "🤖"

  # Dropdown menu integration
  menu:
    enabled: true
    items:
      - id: "sub_agents"
        menu_id: "user"
        section: "Sub-Agents"
        label: "{{ name }}"
        action: "openPanel"
        panel_id: "{{ name }}"
        icon: "🤖"
        requires_admin: false
        order: 100
        tooltip: "Sub-Agent-Manager - {{ name }}"

  panel:
    enabled: true
    title: "{{ name }}"
    endpoint: "/plugins/{{ name }}/"
    type: "iframe"
    width: "1000px"
    height: "800px"

  # Access control
  requires_auth: true
  requires_role: null  # No role restriction - all authenticated users

  endpoints:
    - path: "/"
      method: "GET"
      handler: "get_panel"
      response_type: "html"
      description: "Sub-agent manager web UI panel"
    - path: "/sub-agents"
      method: "GET"
      handler: "get_sub_agents_json"
      response_type: "json"
      description: "List all sub-agents for current session"
    - path: "/sub-agents/{agent_id}"
      method: "GET"
      handler: "get_sub_agent_detail"
      response_type: "json"
      description: "Get details of specific sub-agent"
    - path: "/sub-agents/{agent_id}"
      method: "DELETE"
      handler: "delete_sub_agent"
      response_type: "json"
      description: "Delete/archive sub-agent instance"
    - path: "/stats"
      method: "GET"
      handler: "get_stats"
      response_type: "json"
      description: "Get statistics for current session (total, active, archived)"

# Hook configuration
hooks:
  - name: inject_sub_agent_context
    type: pre_llm_call
    enabled: true
    description: |
      Injects active sub-agent information into system prompt before LLM calls.
      Provides coordinator agent with awareness of available sub-agents.
    timeout: 5.0
    order:
      after: ["begin"]  # Run after initialization hooks
      before: ["end"]   # Run before finalization hooks

config:
  max_sub_agents_per_session: 10
  max_nesting_depth: 5
  max_message_history: 100
  allowed_agents:
    - basic_agent
    - web_research_agent
    - financial_analyst_agent
    - code_reviewer_agent
    - meta_web_research_agent
    - parallel_thinking_agent
    - thinking_agent
  blocked_agents:
  hook_config:
    enabled: true
    inject_sub_agent_context:
      # Injects active sub-agent list into coordinator's system prompt
      # Gives coordinator agent visibility into available sub-agents for follow-up tasks
      enabled: true
      # Limits number of sub-agents shown to prevent system prompt bloat
      # Only shows N most recently active sub-agents
      max_sub_agents_shown: 5
      show_completed: false
      show_tool_state: true
      format: markdown
