# tool definition for Sub-Agent Manager (unified tool approach).

tools:
  - type: function
    function:
      name: "{{ name }}_manage_sub_agent"
      description: |
        Manage persistent sub-agents. They maintain history and can be continued.

        Operations (required):
        - create: Spawn+execute (blocking=true default, false=async)
        - continue: Send new message to existing agent (blocking=true default, false=async)
        - poll: Check async status (NON-BLOCKING) -> Do not poll too frequently!
        - wait/wait_all: Wait for completion (BLOCKING)
        - cancel: Stop running agent
        - list: Active sub-agents
        - info: Read a sub-agent's transcript (see 'messages' + 'window' in the
          response). Default (no 'offset') returns the TAIL -- the most recent
          messages, which is what you want right after a run. To read the full
          transcript from the start, page with offset=0, then offset=<limit>,
          etc. until window.has_more_after is false.
        - delete: Archive instance

        Async: create(blocking=false) + wait_all for parallel execution.
        Same instance_id cannot run concurrently.

        Important!: Do **not** recreate agents (delete+create) - use existing ones via continue. They have the useful history. Recreate only on Major-Errors.

      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: [create, continue, poll, wait, wait_all, cancel, list, info, delete]
            description: "create|continue|poll|wait|wait_all|cancel|list|info|delete"

          agent_type:
            type: string
            description: |
              Agent to spawn (create). Available: {{ allowed_agents }}
              {% if phase_filtering_enabled %}
              NOTE: Phase filtering is active. Available agents change based on current workflow phase ({{ phase_variable }}).
              {% endif %}

          task:
            type: string
            description: "Initial message (create)"

          instance_label:
            type: string
            description: "Optional label (create). Response contains instance_id for follow-ups."

          blocking:
            type: boolean
            description: "Wait for completion (create, default=true). false=async"
            default: true

          use_advanced_model:
            type: boolean
            description: "Use better LLM (create/continue, default=false)"
            default: false

          instance_id:
            type: string
            description: "Instance ID (continue/poll/wait/cancel/info/delete). Use 'instance_id' from create response, NOT instance_label."

          instance_ids:
            type: array
            items:
              type: string
            description: "Instance IDs array (wait_all, delete). All must exist. For delete: archives multiple sub-agents at once."

          message:
            type: string
            description: "New message (continue). Sub-agent sees previous conversation context."

          include_completed:
            type: boolean
            description: |
              Include archived sub-agents in list (list only, default: false).
            default: false

          limit:
            type: integer
            description: |
              Max messages to return (info only). Default 20, hard cap ~200 per
              call -- page with 'offset' rather than raising this for more.

          offset:
            type: integer
            description: |
              0-based message index to start from (info only). Omit for the
              TAIL (most recent 'limit' messages, the common case). Set to
              page through the full transcript from the start: 0, then
              'limit', then 2*'limit', ... until window.has_more_after is false.

          max_chars:
            type: integer
            description: |
              Max characters per message/tool-call-argument before truncation
              (info only). Default 4000. 0 or negative = no truncation.

        required: [operation]

# Slash commands. Both run the tool above with a fixed operation -- the same
# call the agent makes, through the same authorization, so a chat can only
# reach what this agent is already allowed to do.
commands:
  - name: subagents
    description: "sub-agents of this session: what runs, what is done"
    tool: "{{ name }}_manage_sub_agent"
    params: {operation: list}
  - name: cancel
    description: "stop a sub-agent that is running in the background"
    tool: "{{ name }}_manage_sub_agent"
    params: {operation: cancel}
    argument: instance_id
    argument_hint: "<instance-id>"

# Web UI configuration
web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Sub-Agents"
    description: "Running and finished sub-agent tasks"
    icon: workflow
    category: agents
    keywords: [sub-agents, tasks, spawn]
    window: {width: 1000, height: 760}
    contexts:
      session: "/plugins/{{ name }}/?session_id={session_id}"

  endpoints:
    - path: "/"
      method: "GET"
      handler: "render_panel"
      response_type: "html"
      description: "The Sub-Agents panel"
    - path: "/sub-agents"
      method: "GET"
      handler: "get_sub_agents"
      response_type: "json"
      description: "Every sub-agent of a session, archived ones included, and its workflow phase"
    - path: "/sub-agents/{agent_id}"
      method: "GET"
      handler: "get_sub_agent"
      response_type: "json"
      description: "A sub-agent's transcript, paged"
    - path: "/sub-agents/{agent_id}"
      method: "DELETE"
      handler: "archive_sub_agent"
      response_type: "json"
      description: "Archive a sub-agent"

# Hook configuration
hooks:
  - name: inject_sub_agent_context
    type: pre_llm_call
    enabled: false # by default false, must be activate if sub agents are used
    description: |
      Injects active sub-agent information into system prompt before LLM calls.
      Provides coordinator agent with awareness of available sub-agents.
    timeout: 5.0
    order:
      after: ["begin"]  # Run after initialization hooks
      before: ["end"]   # Run before finalization hooks

config:
  max_sub_agents_per_session: 10
  max_nesting_depth: 5  # levels below the calling session; sub-sessions inherit the rest of the budget
  max_message_history: 100
  max_sub_agents_per_type: 3
  default_wait_timeout: 3600  # Default timeout in seconds for wait/wait_all operations (1 hour)
  auto_archive_on_limit: false  # If true, auto-archive oldest sub-agent when limit is reached
  allow_advanced_model: true  # false = the caller's use_advanced_model is ignored (logged) for every spawn/continue
  advanced_create_only_agents: []  # agent types whose use_advanced_model counts on `create` only; a continue on them runs the normal chain
  allowed_agents:
    - basic_agent
    - research_agent
    - financial_analyst_agent
  blocked_agents:
  hook_config:
    enabled: true
    inject_sub_agent_context:
      # Injects active sub-agent list into coordinator's system prompt
      # Gives coordinator agent visibility into available sub-agents for follow-up tasks
      enabled: true
      # Limits number of sub-agents shown to prevent system prompt bloat
      # Shows the N most recently created sub-agents
      max_sub_agents_shown: 5
      show_completed: false
      format: markdown
  # Phase-based agent filtering (optional, top-level key of the server entry)
  # Filters the "Available agents" list based on a session template variable
  # Example: Show only planning agents when workflow_phase="planning"
  phase_filtering:
    enabled: false
    phase_variable: "workflow_phase"  # Name of the template variable to read
    phase_agents:  # Map of phase -> allowed agents for that phase
      # planning:
      #   - story_designer
      #   - story_reviewer
      # characters:
      #   - character_designer
      #   - character_reviewer
      _default: []  # Fallback if phase not in map (empty = show all allowed_agents)
