# MCP tool definition for Sub-Agent Manager (unified tool approach).

tools:
  - type: function
    function:
      name: "{{ name }}_manage_sub_agent"
      description: |
        Manage persistent sub-agents. They maintain history and can be continued.

        Operations:
        - create: Spawn+execute (blocking=true default, false=async)
        - continue: Send new message to existing agent (BLOCKING)
        - poll: Check async status (NON-BLOCKING)
        - wait/wait_all: Wait for completion (BLOCKING)
        - cancel: Stop running agent
        - list: Active sub-agents
        - info: Detailed status
        - delete: Archive instance

        Async: create(blocking=false) + wait_all for parallel execution.
        Same instance_id cannot run concurrently.

      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: [create, continue, poll, wait, wait_all, cancel, list, info, delete]
            description: "create|continue|poll|wait|wait_all|cancel|list|info|delete"

          # Parameters for 'create' operation
          agent_type:
            type: string
            description: "Agent type (create). Available: {{ allowed_agents }}"

          task:
            type: string
            description: "Initial task (create). First message in sub-agent session."

          instance_label:
            type: string
            description: "Custom label (create, optional). Auto-generated if omitted."

          blocking:
            type: boolean
            description: "Wait for completion (create, default=true). false=async."
            default: true

          use_advanced_model:
            type: boolean
            description: "Use advanced LLM (create/continue, default=false). More capable but slower/costlier."
            default: false

          timeout:
            type: number
            description: "Timeout seconds (wait/wait_all)."
            default: 3600

          instance_id:
            type: string
            description: "Instance ID (continue/poll/wait/cancel/info/delete). From system prompt or create result."

          instance_ids:
            type: array
            items:
              type: string
            description: "Instance IDs array (wait_all). All must exist."

          message:
            type: string
            description: "New message (continue). Sub-agent sees previous conversation context."

          include_completed:
            type: boolean
            description: |
              Include archived sub-agents in list (list only, default: false).
            default: false

        required: [operation]

# Web UI configuration
web_ui:
  button:
    enabled: false
    text: "{{name}}"
    icon: "🤖"

  # Dropdown menu integration
  menu:
    enabled: true
    items:
      - id: "sub_agents"
        menu_id: "user"
        section: "Sub-Agents"
        label: "{{ name }}"
        action: "openPanel"
        panel_id: "{{ name }}"
        icon: "🤖"
        requires_admin: false
        order: 100
        tooltip: "Sub-Agent-Manager - {{ name }}"

  panel:
    enabled: true
    title: "{{ name }}"
    endpoint: "/plugins/{{ name }}/"
    type: "iframe"
    width: "1000px"
    height: "800px"

  # Access control
  requires_auth: true
  requires_role: null  # No role restriction - all authenticated users

  endpoints:
    - path: "/"
      method: "GET"
      handler: "get_panel"
      response_type: "html"
      description: "Sub-agent manager web UI panel"
    - path: "/sub-agents"
      method: "GET"
      handler: "get_sub_agents_json"
      response_type: "json"
      description: "List all sub-agents for current session"
    - path: "/sub-agents/{agent_id}"
      method: "GET"
      handler: "get_sub_agent_detail"
      response_type: "json"
      description: "Get details of specific sub-agent"
    - path: "/sub-agents/{agent_id}"
      method: "DELETE"
      handler: "delete_sub_agent"
      response_type: "json"
      description: "Delete/archive sub-agent instance"
    - path: "/stats"
      method: "GET"
      handler: "get_stats"
      response_type: "json"
      description: "Get statistics for current session (total, active, archived)"

# Hook configuration
hooks:
  - name: inject_sub_agent_context
    type: pre_llm_call
    enabled: true
    description: |
      Injects active sub-agent information into system prompt before LLM calls.
      Provides coordinator agent with awareness of available sub-agents.
    timeout: 5.0
    order:
      after: ["begin"]  # Run after initialization hooks
      before: ["end"]   # Run before finalization hooks

config:
  max_sub_agents_per_session: 10
  max_nesting_depth: 5
  max_message_history: 100
  max_sub_agents_per_type: 3
  allowed_agents:
    - basic_agent
    - web_research_agent
    - financial_analyst_agent
    - code_reviewer_agent
    - meta_web_research_agent
    - parallel_thinking_agent
    - thinking_agent
  blocked_agents:
  hook_config:
    enabled: true
    inject_sub_agent_context:
      # Injects active sub-agent list into coordinator's system prompt
      # Gives coordinator agent visibility into available sub-agents for follow-up tasks
      enabled: true
      # Limits number of sub-agents shown to prevent system prompt bloat
      # Only shows N most recently active sub-agents
      max_sub_agents_shown: 5
      show_completed: false
      show_tool_state: true
      format: markdown
