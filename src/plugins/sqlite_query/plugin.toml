# sqlite_query plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "sqlite_query"
version = "1.0.0"
description = "Simple SQL execution for debugging SQLite databases"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["mcp-server"]
category = "tools"
tags = ["database", "sql", "sqlite", "debugging"]
requires = { agent_system = ">=0.6.0" }
dependencies = ["mcp>=1.14.1"]
