# SQLite Query Plugin - Simple SQL Execution for Debugging

tools:
  - type: function
    function:
      name: "{{ name }}_execute_sql"
      description: |
        Execute raw SQL statements on configured SQLite database. 
        Be careful as this allows full access to the database. No backups are made.
        
      parameters:
        type: object
        properties:
          sql:
            type: string
            description: |
              One SQL statement to execute.
              Examples:
              - "SELECT * FROM items WHERE status = 'draft'"
              - "UPDATE items SET status = 'completed' WHERE id = 1"
              - "PRAGMA table_info(items)"
        required: ["sql"]
        additionalProperties: false

config:
  database: default.db
  query_timeout: 30
  max_rows: 500
  max_value_bytes: 67108864
  max_value_chars: 10000
