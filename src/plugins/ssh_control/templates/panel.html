<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Terminal Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #0c0c0c;
            color: #cccccc;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        /* Tab Bar */
        .tab-bar {
            display: flex;
            background: #1e1e1e;
            border-bottom: 1px solid #007acc;
            padding: 0;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .tab {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: #2d2d2d;
            border-right: 1px solid #3c3c3c;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .tab:hover {
            background: #3e3e3e;
        }

        .tab.active {
            background: #0c0c0c;
            color: #4fc3f7;
            border-bottom: 2px solid #007acc;
        }

        .tab-label {
            margin-right: 8px;
        }

        /* Compact per-tab status */
        .tab-status {
            margin-left: 6px;
            font-size: 11px;
            color: #9ad4f5;
            opacity: 0.9;
            min-width: 28px;
            text-align: right;
        }
        .tab-status.connected {
            /* green when connected */
            color: #6ee56e;
        }
        .tab-status.disconnected {
            /* red when disconnected/unavailable */
            color: #f07171;
        }
        .tab-status.not-yet-connected {
            /* gray when not yet connected (lazy connection) */
            color: #858585;
            opacity: 0.7;
        }

        .tab-close {
            color: #858585;
            margin-left: 8px;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
        }

        .tab-close:hover {
            color: #f48771;
        }

        .tab-add {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            background: #2d2d2d;
            cursor: pointer;
            color: #4fc3f7;
            font-weight: bold;
            transition: background 0.2s;
        }

        .tab-add:hover {
            background: #3e3e3e;
        }

        /* Terminal Container */
        .terminal-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            background: #0c0c0c;
        }

        .terminal-pane {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .terminal-pane.active {
            display: flex;
        }

        /* Terminal Output */
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            background: #0c0c0c;
            color: #cccccc;
        }

        .terminal-output::-webkit-scrollbar {
            width: 12px;
        }

        .terminal-output::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        .terminal-output::-webkit-scrollbar-thumb {
            background: #3c3c3c;
            border-radius: 6px;
        }

        .terminal-output::-webkit-scrollbar-thumb:hover {
            background: #4e4e4e;
        }

        /* Command Entry */
        .command-entry {
            display: flex;
            padding: 12px 16px;
            border-top: 1px solid #3c3c3c;
            background: #1e1e1e;
            align-items: center;
        }

        .command-prompt {
            color: #4fc3f7;
            margin-right: 8px;
            font-weight: bold;
        }

        .command-input {
            flex: 1;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #cccccc;
            padding: 8px 12px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            outline: none;
            border-radius: 4px;
        }

        .command-input:focus {
            border-color: #007acc;
            box-shadow: 0 0 4px rgba(0, 122, 204, 0.3);
        }

        .command-button {
            margin-left: 12px;
            padding: 8px 20px;
            background: #007acc;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .command-button:hover {
            background: #005a9e;
        }

        .command-button:active {
            background: #004578;
        }

        .command-button:disabled {
            background: #3c3c3c;
            color: #858585;
            cursor: not-allowed;
        }

        /* Terminal Line Styles */
        .terminal-line {
            margin-bottom: 4px;
        }

        .terminal-prompt {
            color: #4fc3f7;
            font-weight: bold;
        }

        .terminal-command {
            color: #ffffff;
        }

        .terminal-stdout {
            color: #cccccc;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .terminal-stderr {
            color: #f48771;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .terminal-success {
            color: #a9d18e;
        }

        .terminal-error {
            color: #f48771;
            font-weight: bold;
        }

        .terminal-info {
            color: #ffd966;
        }

        /* Modal Dialog */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #252526;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #3c3c3c;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            color: #cccccc;
            font-size: 13px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 8px 12px;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #cccccc;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            border-radius: 4px;
            outline: none;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: #007acc;
            box-shadow: 0 0 4px rgba(0, 122, 204, 0.3);
        }

        .form-checkbox {
            margin-right: 8px;
        }

        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #007acc;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #005a9e;
        }

        .btn-secondary {
            background: #3c3c3c;
            color: #cccccc;
        }

        .btn-secondary:hover {
            background: #4e4e4e;
        }

        /* Loading Indicator */
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #3c3c3c;
            border-top-color: #007acc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #858585;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 14px;
        }

        /* Icon Buttons */
        .icon-button-group {
            display: flex;
            gap: 5px;
            padding: 0 8px;
        }

        .icon-btn {
            background: none;
            border: 1px solid #3c3c3c;
            color: #d4d4d4;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 4px;
        }

        .icon-btn:hover {
            background: #3c3c3c;
            border-color: #007acc;
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
        }

        .icon-btn.active {
            background: #0e639c;
            border-color: #007acc;
        }

        /* Error Message Box */
        .error-message {
            display: none;
            background: #5a1d1d;
            border: 1px solid #f48771;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 16px;
            color: #f48771;
            font-size: 13px;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Tab Bar -->
    <div class="tab-bar" id="tabBar">
        <!-- Tabs will be dynamically inserted here -->
        <div class="icon-button-group">
            <button id="refreshHistoryBtn" class="icon-btn" title="Refresh History" onclick="refreshCurrentMachine()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                    <path d="M3 21v-5h5"/>
                </svg>
            </button>
            <button id="autoRefreshHistoryBtn" class="icon-btn" title="Auto-refresh: OFF" onclick="toggleAutoRefresh()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3"/>
                </svg>
            </button>
        </div>
        <div class="tab-add" id="addTabBtn" title="Add Machine">+</div>
    </div>

    <!-- Terminal Container -->
    <div class="terminal-container" id="terminalContainer">
        <!-- Terminal panes will be dynamically inserted here -->
    </div>

    <!-- Add Machine Modal -->
    <div class="modal-overlay" id="addMachineModal">
        <div class="modal">
            <div class="modal-header">Add SSH Machine</div>
            <form id="addMachineForm">
                <div id="addMachineError" class="error-message"></div>

                <div class="form-group">
                    <label class="form-label" for="machineName">Name *</label>
                    <input type="text" id="machineName" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="machineHost">Host *</label>
                    <input type="text" id="machineHost" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="machinePort">Port</label>
                    <input type="number" id="machinePort" class="form-input" value="22">
                </div>

                <div class="form-group">
                    <label class="form-label" for="machineUsername">Username *</label>
                    <input type="text" id="machineUsername" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="authMethod">Authentication</label>
                    <select id="authMethod" class="form-select">
                        <option value="key">SSH Key</option>
                        <option value="password">Password</option>
                        <option value="agent">SSH Agent</option>
                    </select>
                </div>

                <div class="form-group" id="keyPathGroup">
                    <label class="form-label" for="keyPath">Key Path</label>
                    <input type="text" id="keyPath" class="form-input" value="~/.ssh/id_rsa">
                </div>

                <div class="form-group" id="passwordGroup" style="display: none;">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input">
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="persistent" class="form-checkbox">
                        <span class="form-label" style="display: inline;">Save to config file</span>
                    </label>
                </div>

                <div class="form-buttons">
                    <button type="button" class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Machine</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Remove Modal -->
    <div class="modal-overlay" id="confirmRemoveModal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">Remove Machine?</div>
            <div style="margin-bottom: 20px; color: #cccccc; font-size: 14px; line-height: 1.5;">
                <p id="confirmRemoveText" style="margin: 0 0 12px 0;"></p>
                <p style="margin: 0; color: #858585; font-size: 12px;">Note: This will only remove it from the current session. To permanently remove it from the config file, edit config/mcp.yaml manually.</p>
            </div>
            <div class="form-buttons">
                <button type="button" class="btn btn-secondary" id="cancelRemoveBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmRemoveBtn">Remove</button>
            </div>
        </div>
    </div>

    <script>
        // State management
        let machines = [];
        let activeTab = null;
        let terminalHistory = {}; // Per-machine command history
        let historyLoaded = {}; // Track which machines have loaded history
        let lastHistoryTimestamp = {}; // Track last loaded history timestamp per machine
        let autoRefreshInterval = null;
        let autoRefreshEnabled = false;

        // Initialize
        async function init() {
            await loadMachines();
            setupEventListeners();

            // Create tabs for all machines (all are removable with custom confirm dialog)
            machines.forEach(machine => {
                createTab(machine.name, true);
            });

            // Activate first tab
            if (machines.length > 0) {
                switchTab(machines[0].name);
            }

            // Start status refresh (lazy checks every 5s, active check every 30s)
            startStatusRefresh();
            
            // Start auto-refresh for active tab (DISABLED for debugging)
            // startAutoRefresh();
        }

        // Auto-refresh history every 5 seconds (DISABLED for debugging)
        function startAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }

            /* DISABLED - causing duplicates
            autoRefreshInterval = setInterval(() => {
                if (activeTab) {
                    refreshMachineHistory(activeTab);
                }
            }, 5000); // Refresh every 5 seconds
            */
        }

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('addTabBtn').addEventListener('click', openAddMachineModal);
            document.getElementById('cancelAddBtn').addEventListener('click', closeAddMachineModal);
            document.getElementById('addMachineForm').addEventListener('submit', handleAddMachine);
            document.getElementById('authMethod').addEventListener('change', toggleAuthFields);

            // Click outside modal to close
            document.getElementById('addMachineModal').addEventListener('click', (e) => {
                if (e.target.id === 'addMachineModal') {
                    closeAddMachineModal();
                }
            });
        }

        // Load machines from API
        async function loadMachines() {
            try {
                const response = await fetch('/plugins/ssh_control/api/machines');
                const data = await response.json();
                machines = data.machines || [];
            } catch (error) {
                console.error('Failed to load machines:', error);
                machines = [];
            }
        }

        // Create tab for machine
        function createTab(machineName, removable = false) {
            const tabBar = document.getElementById('tabBar');
            const addBtn = document.getElementById('addTabBtn');

            // Check if tab already exists
            const existingTab = document.querySelector(`.tab[data-machine="${machineName}"]`);
            if (existingTab) {
                // Tab already exists, don't create duplicate
                return;
            }

            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.dataset.machine = machineName;

            const label = document.createElement('span');
            label.className = 'tab-label';
            label.textContent = machineName;
            tab.appendChild(label);

            // Compact status element (ms-only or short disconnected marker)
            const status = document.createElement('span');
            status.className = 'tab-status';
            status.textContent = '\u2014'; // em-dash when unknown/disconnected
            tab.appendChild(status);

            if (removable) {
                const closeBtn = document.createElement('span');
                closeBtn.className = 'tab-close';
                closeBtn.textContent = '×';
                closeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeTab(machineName);
                });
                tab.appendChild(closeBtn);
            }

            tab.addEventListener('click', () => switchTab(machineName));

            tabBar.insertBefore(tab, addBtn);

            // Create terminal pane (only if tab was created)
            createTerminalPane(machineName);

            // Immediately fetch status for this tab
            updateTabStatus(machineName).catch(err => console.debug('status fetch failed', err));
        }

        // Create terminal pane
        async function createTerminalPane(machineName) {
            const container = document.getElementById('terminalContainer');

            // Check if pane already exists
            let pane = document.querySelector(`.terminal-pane[data-machine="${machineName}"]`);
            if (pane) {
                // Pane already exists, do nothing (history is already loaded)
                return;
            }

            pane = document.createElement('div');
            pane.className = 'terminal-pane';
            pane.dataset.machine = machineName;

            const output = document.createElement('div');
            output.className = 'terminal-output';
            output.id = `terminal-${machineName}`;

            // Add welcome message
            const welcome = document.createElement('div');
            welcome.className = 'terminal-line terminal-info';
            welcome.textContent = `Terminal for ${machineName}. Type commands below.`;
            output.appendChild(welcome);

            pane.appendChild(output);

            // Command input
            const commandEntry = document.createElement('div');
            commandEntry.className = 'command-entry';

            const prompt = document.createElement('span');
            prompt.className = 'command-prompt';
            prompt.textContent = `${machineName}$`;
            commandEntry.appendChild(prompt);

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'command-input';
            input.placeholder = 'Enter command...';
            input.id = `input-${machineName}`;
            commandEntry.appendChild(input);

            const button = document.createElement('button');
            button.className = 'command-button';
            button.textContent = 'Run';
            button.id = `run-${machineName}`;
            button.addEventListener('click', () => executeCommand(machineName));
            commandEntry.appendChild(button);

            // Enter key to execute
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    executeCommand(machineName);
                }
            });

            pane.appendChild(commandEntry);
            container.appendChild(pane);

            // Initialize history
            terminalHistory[machineName] = [];
            historyLoaded[machineName] = false;
            lastHistoryTimestamp[machineName] = 0;

            // Load initial history from server
            await loadMachineHistory(machineName);
        }

        // Load command history for a machine (initial load)
        async function loadMachineHistory(machineName) {
            if (historyLoaded[machineName]) {
                // Already loaded, skip
                return;
            }

            try {
                const response = await fetch(`/plugins/ssh_control/api/machines/${machineName}/history?limit=50`);
                const data = await response.json();

                if (data.history && data.history.length > 0) {
                    const output = document.getElementById(`terminal-${machineName}`);

                    // Add history separator
                    const separator = document.createElement('div');
                    separator.className = 'terminal-line terminal-info';
                    separator.textContent = `--- Previous commands (${data.count} shown) ---`;
                    output.appendChild(separator);

                    // Display history in reverse order (oldest first)
                    const historyReversed = [...data.history].reverse();
                    historyReversed.forEach(entry => {
                        appendHistoryEntry(machineName, entry);

                        // Track latest timestamp
                        if (entry.timestamp > lastHistoryTimestamp[machineName]) {
                            lastHistoryTimestamp[machineName] = entry.timestamp;
                        }
                    });

                    // Add separator after history
                    const endSeparator = document.createElement('div');
                    endSeparator.className = 'terminal-line terminal-info';
                    endSeparator.textContent = '--- Live session ---';
                    output.appendChild(endSeparator);

                    // Auto-scroll to bottom
                    output.scrollTop = output.scrollHeight;
                }

                historyLoaded[machineName] = true;
            } catch (error) {
                console.error(`Failed to load history for ${machineName}:`, error);
                historyLoaded[machineName] = true; // Mark as loaded to avoid retry loops
            }
        }

        // Refresh history (check for new commands)
        async function refreshMachineHistory(machineName) {
            if (!historyLoaded[machineName]) {
                // Initial load not done yet
                return;
            }

            try {
                const response = await fetch(`/plugins/ssh_control/api/machines/${machineName}/history?limit=10`);
                const data = await response.json();

                if (data.history && data.history.length > 0) {
                    // Check for new entries (timestamp > lastHistoryTimestamp)
                    const newEntries = data.history.filter(entry =>
                        entry.timestamp > lastHistoryTimestamp[machineName]
                    );

                    if (newEntries.length > 0) {
                        const output = document.getElementById(`terminal-${machineName}`);

                        // Append new entries (oldest first)
                        const newEntriesReversed = [...newEntries].reverse();
                        newEntriesReversed.forEach(entry => {
                            appendHistoryEntry(machineName, entry);

                            // Update timestamp
                            if (entry.timestamp > lastHistoryTimestamp[machineName]) {
                                lastHistoryTimestamp[machineName] = entry.timestamp;
                            }
                        });

                        // Auto-scroll to bottom
                        output.scrollTop = output.scrollHeight;
                    }
                }
            } catch (error) {
                console.error(`Failed to refresh history for ${machineName}:`, error);
            }
        }

        // Append a single history entry to the terminal
        function appendHistoryEntry(machineName, entry) {
            const output = document.getElementById(`terminal-${machineName}`);

            // Command line
            const commandLine = document.createElement('div');
            commandLine.className = 'terminal-line';
            commandLine.innerHTML = `<span class="terminal-prompt">${machineName}$</span> <span class="terminal-command">${escapeHtml(entry.command)}</span>`;
            output.appendChild(commandLine);

            // Stdout
            if (entry.stdout_preview) {
                const stdoutLine = document.createElement('div');
                stdoutLine.className = 'terminal-line terminal-stdout';
                stdoutLine.textContent = entry.stdout_preview;
                if (entry.stdout_preview.length >= 10000) {
                    const truncNote = document.createElement('div');
                    truncNote.className = 'terminal-line terminal-info';
                    truncNote.textContent = '[Output truncated at 10KB limit]';
                    output.appendChild(stdoutLine);
                    output.appendChild(truncNote);
                } else {
                    output.appendChild(stdoutLine);
                }
            }

            // Stderr
            if (entry.stderr_preview) {
                const stderrLine = document.createElement('div');
                stderrLine.className = 'terminal-line terminal-stderr';
                stderrLine.textContent = entry.stderr_preview;
                if (entry.stderr_preview.length >= 10000) {
                    const truncNote = document.createElement('div');
                    truncNote.className = 'terminal-line terminal-info';
                    truncNote.textContent = '[Error output truncated at 10KB limit]';
                    output.appendChild(stderrLine);
                    output.appendChild(truncNote);
                } else {
                    output.appendChild(stderrLine);
                }
            }

            // Exit code
            const exitLine = document.createElement('div');
            exitLine.className = `terminal-line ${entry.success ? 'terminal-success' : 'terminal-error'}`;
            exitLine.textContent = `[Exit code: ${entry.exit_code}]`;
            if (entry.duration_formatted) {
                exitLine.textContent += ` (${entry.duration_formatted})`;
            }
            if (entry.timestamp_formatted) {
                exitLine.textContent += ` at ${entry.timestamp_formatted}`;
            }
            output.appendChild(exitLine);
        }

        // Switch active tab
        function switchTab(machineName) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.machine === machineName) {
                    tab.classList.add('active');
                }
            });

            // Update panes
            document.querySelectorAll('.terminal-pane').forEach(pane => {
                pane.classList.remove('active');
                if (pane.dataset.machine === machineName) {
                    pane.classList.add('active');
                }
            });

            activeTab = machineName;

            // Focus input
            const input = document.getElementById(`input-${machineName}`);
            if (input) input.focus();
        }

        // Execute command
        async function executeCommand(machineName) {
            const input = document.getElementById(`input-${machineName}`);
            const button = document.getElementById(`run-${machineName}`);
            const output = document.getElementById(`terminal-${machineName}`);

            const command = input.value.trim();
            if (!command) return;

            // Track execution timestamp (to avoid double-loading from history)
            const executionTime = Date.now() / 1000; // Unix timestamp in seconds

            // Add command to history
            terminalHistory[machineName].push({
                command,
                timestamp: new Date()
            });

            // Display command
            const commandLine = document.createElement('div');
            commandLine.className = 'terminal-line';
            commandLine.innerHTML = `<span class="terminal-prompt">${machineName}$</span> <span class="terminal-command">${escapeHtml(command)}</span>`;
            output.appendChild(commandLine);

            // Clear input and disable button
            input.value = '';
            input.disabled = true;
            button.disabled = true;
            button.innerHTML = 'Running <span class="loading"></span>';

            try {
                // Execute via API
                const response = await fetch('/plugins/ssh_control/api/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        machine: machineName,
                        command: command
                    })
                });

                const result = await response.json();

                // Check if API returned an error (non-2xx status or error field)
                if (!response.ok || result.error) {
                    const errorLine = document.createElement('div');
                    errorLine.className = 'terminal-line terminal-error';
                    errorLine.textContent = `Error: ${result.error || 'Command execution failed'}`;
                    output.appendChild(errorLine);
                    return;
                }

                // Display output
                if (result.stdout) {
                    const stdoutLine = document.createElement('div');
                    stdoutLine.className = 'terminal-line terminal-stdout';
                    stdoutLine.textContent = result.stdout;
                    output.appendChild(stdoutLine);
                }

                if (result.stderr) {
                    const stderrLine = document.createElement('div');
                    stderrLine.className = 'terminal-line terminal-stderr';
                    stderrLine.textContent = result.stderr;
                    output.appendChild(stderrLine);
                }

                // Display exit code
                const exitLine = document.createElement('div');
                exitLine.className = `terminal-line ${result.exit_code === 0 ? 'terminal-success' : 'terminal-error'}`;
                exitLine.textContent = `[Exit code: ${result.exit_code}]`;
                output.appendChild(exitLine);

                // Update lastHistoryTimestamp to prevent auto-refresh from re-adding this command
                if (executionTime > lastHistoryTimestamp[machineName]) {
                    lastHistoryTimestamp[machineName] = executionTime + 1; // +1 to ensure we skip this one
                }
                
                // Update tab status after command execution (machine is now connected)
                updateTabStatus(machineName).catch(err => console.debug('status update after command failed', err));

            } catch (error) {
                const errorLine = document.createElement('div');
                errorLine.className = 'terminal-line terminal-error';
                errorLine.textContent = `Error: ${error.message}`;
                output.appendChild(errorLine);
            } finally {
                // Re-enable input
                input.disabled = false;
                button.disabled = false;
                button.textContent = 'Run';

                // Auto-scroll to bottom
                output.scrollTop = output.scrollHeight;

                // Focus input
                input.focus();
            }
        }

        // Add machine modal
        function openAddMachineModal() {
            // Clear any previous error
            const errorBox = document.getElementById('addMachineError');
            errorBox.classList.remove('show');
            errorBox.textContent = '';

            document.getElementById('addMachineModal').classList.add('active');
            document.getElementById('machineName').focus();
        }

        function closeAddMachineModal() {
            document.getElementById('addMachineModal').classList.remove('active');
            document.getElementById('addMachineForm').reset();

            // Clear error message
            const errorBox = document.getElementById('addMachineError');
            errorBox.classList.remove('show');
            errorBox.textContent = '';
        }

        function toggleAuthFields() {
            const authMethod = document.getElementById('authMethod').value;
            const keyPathGroup = document.getElementById('keyPathGroup');
            const passwordGroup = document.getElementById('passwordGroup');

            if (authMethod === 'password') {
                keyPathGroup.style.display = 'none';
                passwordGroup.style.display = 'block';
            } else if (authMethod === 'key') {
                keyPathGroup.style.display = 'block';
                passwordGroup.style.display = 'none';
            } else { // agent
                keyPathGroup.style.display = 'none';
                passwordGroup.style.display = 'none';
            }
        }

        async function handleAddMachine(e) {
            e.preventDefault();

            const formData = {
                name: document.getElementById('machineName').value,
                host: document.getElementById('machineHost').value,
                port: parseInt(document.getElementById('machinePort').value) || 22,
                username: document.getElementById('machineUsername').value,
                auth_method: document.getElementById('authMethod').value,
                persistent: document.getElementById('persistent').checked
            };

            if (formData.auth_method === 'key') {
                formData.key_path = document.getElementById('keyPath').value;
            } else if (formData.auth_method === 'password') {
                formData.password = document.getElementById('password').value;
            }

            try {
                // Clear previous error
                const errorBox = document.getElementById('addMachineError');
                errorBox.classList.remove('show');
                errorBox.textContent = '';

                const response = await fetch('/plugins/ssh_control/api/machines/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    // Add to machines list
                    machines.push({
                        name: formData.name,
                        host: formData.host,
                        port: formData.port,
                        username: formData.username
                    });

                    // Create tab (removable if dynamic)
                    createTab(formData.name, true);
                    switchTab(formData.name);

                    closeAddMachineModal();
                } else {
                    // Show error in modal
                    errorBox.textContent = result.error || 'Failed to add machine';
                    errorBox.classList.add('show');
                }
            } catch (error) {
                // Show error in modal
                const errorBox = document.getElementById('addMachineError');
                errorBox.textContent = `Error: ${error.message}`;
                errorBox.classList.add('show');
            }
        }

        // Remove tab and machine
        async function removeTab(machineName) {
            console.log('removeTab called for:', machineName);

            // Show custom confirm modal instead of browser confirm()
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmRemoveModal');
                const confirmBtn = document.getElementById('confirmRemoveBtn');
                const cancelBtn = document.getElementById('cancelRemoveBtn');
                const textElement = document.getElementById('confirmRemoveText');

                textElement.textContent = `Remove machine '${machineName}' from runtime?`;
                modal.classList.add('active');

                const handleConfirm = async () => {
                    cleanup();
                    console.log('User confirmed removal');

                    try {
                        console.log('Sending DELETE request...');
                        const response = await fetch(`/plugins/ssh_control/api/machines/${machineName}?remove_from_config=false`, {
                            method: 'DELETE'
                        });

                        console.log('Response status:', response.status);
                        const result = await response.json();
                        console.log('Response result:', result);

                        if (result.success) {
                            // Remove tab
                            const tab = document.querySelector(`.tab[data-machine="${machineName}"]`);
                            if (tab) tab.remove();

                            // Remove pane
                            const pane = document.querySelector(`.terminal-pane[data-machine="${machineName}"]`);
                            if (pane) pane.remove();

                            // Remove from machines list
                            machines = machines.filter(m => m.name !== machineName);

                            // Clear history
                            delete terminalHistory[machineName];
                            delete historyLoaded[machineName];
                            delete lastHistoryTimestamp[machineName];

                            // Switch to another tab
                            if (activeTab === machineName && machines.length > 0) {
                                switchTab(machines[0].name);
                            } else if (machines.length === 0) {
                                activeTab = null;
                            }

                            console.log('Machine removed successfully');
                        } else {
                            alert(`Failed to remove machine: ${result.error}`);
                        }
                    } catch (error) {
                        console.error('Error removing machine:', error);
                        alert(`Error removing machine: ${error.message}`);
                    }

                    resolve();
                };

                const handleCancel = () => {
                    cleanup();
                    console.log('User cancelled removal');
                    resolve();
                };

                const cleanup = () => {
                    modal.classList.remove('active');
                    confirmBtn.removeEventListener('click', handleConfirm);
                    cancelBtn.removeEventListener('click', handleCancel);
                    modal.removeEventListener('click', handleModalClick);
                };

                const handleModalClick = (e) => {
                    if (e.target === modal) {
                        handleCancel();
                    }
                };

                confirmBtn.addEventListener('click', handleConfirm);
                cancelBtn.addEventListener('click', handleCancel);
                modal.addEventListener('click', handleModalClick);
            });
        }

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Refresh current machine's history
        function refreshCurrentMachine() {
            if (activeTab) {
                refreshMachineHistory(activeTab);
            }
        }

        // Update a tab's status: show latency in ms when connected, otherwise a short dash
        async function updateTabStatus(machineName) {
            try {
                const resp = await fetch(`/plugins/ssh_control/api/machines/${encodeURIComponent(machineName)}/status`);
                if (!resp.ok) throw new Error('status fetch failed');
                const data = await resp.json();
                
                console.log('Status update for', machineName, ':', data); // DEBUG
                
                const tab = document.querySelector(`.tab[data-machine="${machineName}"]`);
                if (!tab) return;
                const statusEl = tab.querySelector('.tab-status');
                if (!statusEl) return;

                if (data.not_yet_connected) {
                    // Machine never connected yet (lazy connection)
                    console.log('  -> not_yet_connected'); // DEBUG
                    statusEl.textContent = '\u25cb'; // white circle '○'
                    statusEl.classList.remove('connected', 'disconnected');
                    statusEl.classList.add('not-yet-connected');
                    statusEl.title = 'Not yet connected (will connect on first use)';
                } else if (data.connected) {
                    const ms = Math.round(data.latency_ms || 0);
                    console.log('  -> connected, latency:', ms, 'ms'); // DEBUG
                    statusEl.textContent = `${ms}ms`;
                    statusEl.classList.remove('disconnected', 'not-yet-connected');
                    statusEl.classList.add('connected');
                    statusEl.title = 'Connected';
                } else {
                    console.log('  -> disconnected'); // DEBUG
                    statusEl.textContent = '\u2014'; // em-dash short marker
                    statusEl.classList.remove('connected', 'not-yet-connected');
                    statusEl.classList.add('disconnected');
                    statusEl.title = 'Disconnected';
                }
            } catch (err) {
                console.error('Status update error for', machineName, ':', err); // DEBUG
                // On any error, mark as disconnected
                const tab = document.querySelector(`.tab[data-machine="${machineName}"]`);
                if (!tab) return;
                const statusEl = tab.querySelector('.tab-status');
                if (!statusEl) return;
                statusEl.textContent = '\u2014';
                statusEl.classList.remove('connected', 'not-yet-connected');
                statusEl.classList.add('disconnected');
                statusEl.title = 'Status unavailable';
            }
        }

        // Periodically refresh status for all visible tabs
        let statusRefreshCounter = 0; // Track how many refresh cycles
        
        function startStatusRefresh() {
            // Run once immediately
            machines.forEach(m => updateTabStatus(m.name).catch(() => {}));

            // Then every 5s
            setInterval(() => {
                statusRefreshCounter++;
                const doActiveCheck = (statusRefreshCounter % 6) === 0; // Every 30s (6 * 5s)
                
                machines.forEach(m => {
                    if (doActiveCheck) {
                        // Every 30s: do active check to update latency
                        updateTabStatusActive(m.name).catch(() => {});
                    } else {
                        // Normal lazy check
                        updateTabStatus(m.name).catch(() => {});
                    }
                });
            }, 5000);
        }
        
        // Active status check (actually pings the machine to measure latency)
        async function updateTabStatusActive(machineName) {
            try {
                const resp = await fetch(`/plugins/ssh_control/api/machines/${encodeURIComponent(machineName)}/status?active=true`);
                if (!resp.ok) throw new Error('active status fetch failed');
                const data = await resp.json();
                
                console.log('Active status update for', machineName, ':', data); // DEBUG
                
                const tab = document.querySelector(`.tab[data-machine="${machineName}"]`);
                if (!tab) return;
                const statusEl = tab.querySelector('.tab-status');
                if (!statusEl) return;

                if (data.connected && data.latency_ms != null) {
                    const ms = Math.round(data.latency_ms);
                    console.log('  -> active check: connected, latency:', ms, 'ms'); // DEBUG
                    statusEl.textContent = `${ms}ms`;
                    statusEl.classList.remove('disconnected', 'not-yet-connected');
                    statusEl.classList.add('connected');
                    statusEl.title = 'Connected';
                } else if (data.not_yet_connected) {
                    statusEl.textContent = '\u25cb';
                    statusEl.classList.remove('connected', 'disconnected');
                    statusEl.classList.add('not-yet-connected');
                    statusEl.title = 'Not yet connected (will connect on first use)';
                } else {
                    statusEl.textContent = '\u2014';
                    statusEl.classList.remove('connected', 'not-yet-connected');
                    statusEl.classList.add('disconnected');
                    statusEl.title = 'Disconnected';
                }
            } catch (err) {
                console.error('Active status update error for', machineName, ':', err);
            }
        }

        // Toggle auto-refresh
        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            const btn = document.getElementById('autoRefreshHistoryBtn');

            if (autoRefreshEnabled) {
                btn.classList.add('active');
                btn.title = 'Auto-refresh: ON';
                autoRefreshInterval = setInterval(() => {
                    if (activeTab) {
                        refreshMachineHistory(activeTab);
                    }
                }, 5000);
                // Immediate refresh
                if (activeTab) {
                    refreshMachineHistory(activeTab);
                }
            } else {
                btn.classList.remove('active');
                btn.title = 'Auto-refresh: OFF';
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
