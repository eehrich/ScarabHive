<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Terminal Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #0c0c0c;
            color: #cccccc;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }
        
        /* Tab Bar */
        .tab-bar {
            display: flex;
            background: #1e1e1e;
            border-bottom: 1px solid #007acc;
            padding: 0;
            overflow-x: auto;
            flex-shrink: 0;
        }
        
        .tab {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: #2d2d2d;
            border-right: 1px solid #3c3c3c;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: background 0.2s;
        }
        
        .tab:hover {
            background: #3e3e3e;
        }
        
        .tab.active {
            background: #0c0c0c;
            color: #4fc3f7;
            border-bottom: 2px solid #007acc;
        }
        
        .tab-label {
            margin-right: 8px;
        }
        
        .tab-close {
            color: #858585;
            margin-left: 8px;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
        }
        
        .tab-close:hover {
            color: #f48771;
        }
        
        .tab-add {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            background: #2d2d2d;
            cursor: pointer;
            color: #4fc3f7;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .tab-add:hover {
            background: #3e3e3e;
        }
        
        /* Terminal Container */
        .terminal-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            background: #0c0c0c;
        }
        
        .terminal-pane {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        
        .terminal-pane.active {
            display: flex;
        }
        
        /* Terminal Output */
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            background: #0c0c0c;
            color: #cccccc;
        }
        
        .terminal-output::-webkit-scrollbar {
            width: 12px;
        }
        
        .terminal-output::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        
        .terminal-output::-webkit-scrollbar-thumb {
            background: #3c3c3c;
            border-radius: 6px;
        }
        
        .terminal-output::-webkit-scrollbar-thumb:hover {
            background: #4e4e4e;
        }
        
        /* Command Entry */
        .command-entry {
            display: flex;
            padding: 12px 16px;
            border-top: 1px solid #3c3c3c;
            background: #1e1e1e;
            align-items: center;
        }
        
        .command-prompt {
            color: #4fc3f7;
            margin-right: 8px;
            font-weight: bold;
        }
        
        .command-input {
            flex: 1;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #cccccc;
            padding: 8px 12px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            outline: none;
            border-radius: 4px;
        }
        
        .command-input:focus {
            border-color: #007acc;
            box-shadow: 0 0 4px rgba(0, 122, 204, 0.3);
        }
        
        .command-button {
            margin-left: 12px;
            padding: 8px 20px;
            background: #007acc;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .command-button:hover {
            background: #005a9e;
        }
        
        .command-button:active {
            background: #004578;
        }
        
        .command-button:disabled {
            background: #3c3c3c;
            color: #858585;
            cursor: not-allowed;
        }
        
        /* Terminal Line Styles */
        .terminal-line {
            margin-bottom: 4px;
        }
        
        .terminal-prompt {
            color: #4fc3f7;
            font-weight: bold;
        }
        
        .terminal-command {
            color: #ffffff;
        }
        
        .terminal-stdout {
            color: #cccccc;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .terminal-stderr {
            color: #f48771;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .terminal-success {
            color: #a9d18e;
        }
        
        .terminal-error {
            color: #f48771;
            font-weight: bold;
        }
        
        .terminal-info {
            color: #ffd966;
        }
        
        /* Modal Dialog */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: #252526;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #3c3c3c;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 6px;
            color: #cccccc;
            font-size: 13px;
        }
        
        .form-input,
        .form-select {
            width: 100%;
            padding: 8px 12px;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #cccccc;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            border-radius: 4px;
            outline: none;
        }
        
        .form-input:focus,
        .form-select:focus {
            border-color: #007acc;
            box-shadow: 0 0 4px rgba(0, 122, 204, 0.3);
        }
        
        .form-checkbox {
            margin-right: 8px;
        }
        
        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }
        
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .btn-primary {
            background: #007acc;
            color: #ffffff;
        }
        
        .btn-primary:hover {
            background: #005a9e;
        }
        
        .btn-secondary {
            background: #3c3c3c;
            color: #cccccc;
        }
        
        .btn-secondary:hover {
            background: #4e4e4e;
        }
        
        /* Loading Indicator */
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #3c3c3c;
            border-top-color: #007acc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #858585;
            text-align: center;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .empty-state-text {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Tab Bar -->
    <div class="tab-bar" id="tabBar">
        <!-- Tabs will be dynamically inserted here -->
        <div class="tab-add" id="addTabBtn" title="Add Machine">+</div>
    </div>
    
    <!-- Terminal Container -->
    <div class="terminal-container" id="terminalContainer">
        <!-- Terminal panes will be dynamically inserted here -->
    </div>
    
    <!-- Add Machine Modal -->
    <div class="modal-overlay" id="addMachineModal">
        <div class="modal">
            <div class="modal-header">Add SSH Machine</div>
            <form id="addMachineForm">
                <div class="form-group">
                    <label class="form-label" for="machineName">Name *</label>
                    <input type="text" id="machineName" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="machineHost">Host *</label>
                    <input type="text" id="machineHost" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="machinePort">Port</label>
                    <input type="number" id="machinePort" class="form-input" value="22">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="machineUsername">Username *</label>
                    <input type="text" id="machineUsername" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="authMethod">Authentication</label>
                    <select id="authMethod" class="form-select">
                        <option value="key">SSH Key</option>
                        <option value="password">Password</option>
                        <option value="agent">SSH Agent</option>
                    </select>
                </div>
                
                <div class="form-group" id="keyPathGroup">
                    <label class="form-label" for="keyPath">Key Path</label>
                    <input type="text" id="keyPath" class="form-input" value="~/.ssh/id_rsa">
                </div>
                
                <div class="form-group" id="passwordGroup" style="display: none;">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="persistent" class="form-checkbox">
                        <span class="form-label" style="display: inline;">Save to config file</span>
                    </label>
                </div>
                
                <div class="form-buttons">
                    <button type="button" class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Machine</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // State management
        let machines = [];
        let activeTab = null;
        let terminalHistory = {}; // Per-machine command history
        
        // Initialize
        async function init() {
            await loadMachines();
            setupEventListeners();
            
            // Create tabs for all machines
            machines.forEach(machine => {
                createTab(machine.name, false);
            });
            
            // Activate first tab
            if (machines.length > 0) {
                switchTab(machines[0].name);
            }
        }
        
        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('addTabBtn').addEventListener('click', openAddMachineModal);
            document.getElementById('cancelAddBtn').addEventListener('click', closeAddMachineModal);
            document.getElementById('addMachineForm').addEventListener('submit', handleAddMachine);
            document.getElementById('authMethod').addEventListener('change', toggleAuthFields);
            
            // Click outside modal to close
            document.getElementById('addMachineModal').addEventListener('click', (e) => {
                if (e.target.id === 'addMachineModal') {
                    closeAddMachineModal();
                }
            });
        }
        
        // Load machines from API
        async function loadMachines() {
            try {
                const response = await fetch('/plugins/ssh_control/api/machines');
                const data = await response.json();
                machines = data.machines || [];
            } catch (error) {
                console.error('Failed to load machines:', error);
                machines = [];
            }
        }
        
        // Create tab for machine
        function createTab(machineName, removable = false) {
            const tabBar = document.getElementById('tabBar');
            const addBtn = document.getElementById('addTabBtn');
            
            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.dataset.machine = machineName;
            
            const label = document.createElement('span');
            label.className = 'tab-label';
            label.textContent = machineName;
            tab.appendChild(label);
            
            if (removable) {
                const closeBtn = document.createElement('span');
                closeBtn.className = 'tab-close';
                closeBtn.textContent = '×';
                closeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeTab(machineName);
                });
                tab.appendChild(closeBtn);
            }
            
            tab.addEventListener('click', () => switchTab(machineName));
            
            tabBar.insertBefore(tab, addBtn);
            
            // Create terminal pane
            createTerminalPane(machineName);
        }
        
        // Create terminal pane
        function createTerminalPane(machineName) {
            const container = document.getElementById('terminalContainer');
            
            const pane = document.createElement('div');
            pane.className = 'terminal-pane';
            pane.dataset.machine = machineName;
            
            const output = document.createElement('div');
            output.className = 'terminal-output';
            output.id = `terminal-${machineName}`;
            
            // Add welcome message
            const welcome = document.createElement('div');
            welcome.className = 'terminal-line terminal-info';
            welcome.textContent = `Connected to ${machineName}. Type commands below.`;
            output.appendChild(welcome);
            
            pane.appendChild(output);
            
            // Command input
            const commandEntry = document.createElement('div');
            commandEntry.className = 'command-entry';
            
            const prompt = document.createElement('span');
            prompt.className = 'command-prompt';
            prompt.textContent = `${machineName}$`;
            commandEntry.appendChild(prompt);
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'command-input';
            input.placeholder = 'Enter command...';
            input.id = `input-${machineName}`;
            commandEntry.appendChild(input);
            
            const button = document.createElement('button');
            button.className = 'command-button';
            button.textContent = 'Run';
            button.id = `run-${machineName}`;
            button.addEventListener('click', () => executeCommand(machineName));
            commandEntry.appendChild(button);
            
            // Enter key to execute
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    executeCommand(machineName);
                }
            });
            
            pane.appendChild(commandEntry);
            container.appendChild(pane);
            
            // Initialize history
            terminalHistory[machineName] = [];
        }
        
        // Switch active tab
        function switchTab(machineName) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.machine === machineName) {
                    tab.classList.add('active');
                }
            });
            
            // Update panes
            document.querySelectorAll('.terminal-pane').forEach(pane => {
                pane.classList.remove('active');
                if (pane.dataset.machine === machineName) {
                    pane.classList.add('active');
                }
            });
            
            activeTab = machineName;
            
            // Focus input
            const input = document.getElementById(`input-${machineName}`);
            if (input) input.focus();
        }
        
        // Execute command
        async function executeCommand(machineName) {
            const input = document.getElementById(`input-${machineName}`);
            const button = document.getElementById(`run-${machineName}`);
            const output = document.getElementById(`terminal-${machineName}`);
            
            const command = input.value.trim();
            if (!command) return;
            
            // Add command to history
            terminalHistory[machineName].push({
                command,
                timestamp: new Date()
            });
            
            // Display command
            const commandLine = document.createElement('div');
            commandLine.className = 'terminal-line';
            commandLine.innerHTML = `<span class="terminal-prompt">${machineName}$</span> <span class="terminal-command">${escapeHtml(command)}</span>`;
            output.appendChild(commandLine);
            
            // Clear input and disable button
            input.value = '';
            input.disabled = true;
            button.disabled = true;
            button.innerHTML = 'Running <span class="loading"></span>';
            
            try {
                // Execute via API
                const response = await fetch('/plugins/ssh_control/api/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        machine: machineName,
                        command: command
                    })
                });
                
                const result = await response.json();
                
                // Display output
                if (result.stdout) {
                    const stdoutLine = document.createElement('div');
                    stdoutLine.className = 'terminal-line terminal-stdout';
                    stdoutLine.textContent = result.stdout;
                    output.appendChild(stdoutLine);
                }
                
                if (result.stderr) {
                    const stderrLine = document.createElement('div');
                    stderrLine.className = 'terminal-line terminal-stderr';
                    stderrLine.textContent = result.stderr;
                    output.appendChild(stderrLine);
                }
                
                // Display exit code
                const exitLine = document.createElement('div');
                exitLine.className = `terminal-line ${result.exit_code === 0 ? 'terminal-success' : 'terminal-error'}`;
                exitLine.textContent = `[Exit code: ${result.exit_code}]`;
                output.appendChild(exitLine);
                
            } catch (error) {
                const errorLine = document.createElement('div');
                errorLine.className = 'terminal-line terminal-error';
                errorLine.textContent = `Error: ${error.message}`;
                output.appendChild(errorLine);
            } finally {
                // Re-enable input
                input.disabled = false;
                button.disabled = false;
                button.textContent = 'Run';
                
                // Auto-scroll to bottom
                output.scrollTop = output.scrollHeight;
                
                // Focus input
                input.focus();
            }
        }
        
        // Add machine modal
        function openAddMachineModal() {
            document.getElementById('addMachineModal').classList.add('active');
            document.getElementById('machineName').focus();
        }
        
        function closeAddMachineModal() {
            document.getElementById('addMachineModal').classList.remove('active');
            document.getElementById('addMachineForm').reset();
        }
        
        function toggleAuthFields() {
            const authMethod = document.getElementById('authMethod').value;
            const keyPathGroup = document.getElementById('keyPathGroup');
            const passwordGroup = document.getElementById('passwordGroup');
            
            if (authMethod === 'password') {
                keyPathGroup.style.display = 'none';
                passwordGroup.style.display = 'block';
            } else if (authMethod === 'key') {
                keyPathGroup.style.display = 'block';
                passwordGroup.style.display = 'none';
            } else { // agent
                keyPathGroup.style.display = 'none';
                passwordGroup.style.display = 'none';
            }
        }
        
        async function handleAddMachine(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('machineName').value,
                host: document.getElementById('machineHost').value,
                port: parseInt(document.getElementById('machinePort').value) || 22,
                username: document.getElementById('machineUsername').value,
                auth_method: document.getElementById('authMethod').value,
                persistent: document.getElementById('persistent').checked
            };
            
            if (formData.auth_method === 'key') {
                formData.key_path = document.getElementById('keyPath').value;
            } else if (formData.auth_method === 'password') {
                formData.password = document.getElementById('password').value;
            }
            
            try {
                const response = await fetch('/plugins/ssh_control/api/machines/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Add to machines list
                    machines.push({
                        name: formData.name,
                        host: formData.host,
                        port: formData.port,
                        username: formData.username
                    });
                    
                    // Create tab (removable if dynamic)
                    createTab(formData.name, true);
                    switchTab(formData.name);
                    
                    closeAddMachineModal();
                } else {
                    alert(`Failed to add machine: ${result.error}`);
                }
            } catch (error) {
                alert(`Error adding machine: ${error.message}`);
            }
        }
        
        // Remove tab and machine
        async function removeTab(machineName) {
            if (!confirm(`Remove machine '${machineName}'?`)) return;
            
            try {
                const response = await fetch(`/plugins/ssh_control/api/machines/${machineName}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Remove tab
                    const tab = document.querySelector(`.tab[data-machine="${machineName}"]`);
                    if (tab) tab.remove();
                    
                    // Remove pane
                    const pane = document.querySelector(`.terminal-pane[data-machine="${machineName}"]`);
                    if (pane) pane.remove();
                    
                    // Remove from machines list
                    machines = machines.filter(m => m.name !== machineName);
                    
                    // Clear history
                    delete terminalHistory[machineName];
                    
                    // Switch to another tab
                    if (activeTab === machineName && machines.length > 0) {
                        switchTab(machines[0].name);
                    }
                } else {
                    alert(`Failed to remove machine: ${result.error}`);
                }
            } catch (error) {
                alert(`Error removing machine: ${error.message}`);
            }
        }
        
        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
