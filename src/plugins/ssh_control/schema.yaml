tools:
  - type: function
    function:
      name: "{{ name }}_list_machines"
      description: "List all configured SSH machines with optional tag filtering"
      parameters:
        type: object
        properties:
          tags:
            type: array
            items:
              type: string
            description: "Optional list of tags to filter machines"
        required: []

  - type: function
    function:
      name: "{{ name }}_execute"
      description: "Execute a command on one remote machine via SSH."
      parameters:
        type: object
        properties:
          machine:
            type: string
            description: "Single machine name."
          command:
            type: string
            description: "Command to execute on the remote machine"
          timeout:
            type: integer
            description: "Command timeout in seconds (optional, uses machine default)"
          check_exit_code:
            type: boolean
            description: "Fail if exit code is not 0 (default: true)"
          background:
            type: boolean
            default: false
            description: "Run the command in the background and return at once with a process_id. Read it with get_output, stop it with kill_process. Holds one connection of the machine's pool for the whole run."
          wake:
            type: boolean
            default: false
            description: "Only with background=true: wake this session when the command ends, so you can end your turn instead of polling. When woken, call get_output with the process_id. The answer says whether the wake is armed; if it is not, poll instead. A wake is best effort even when armed - if you are not woken, fall back to polling."
          process_id:
            type: string
            description: "Custom id for a background command (auto-generated if omitted, only used when background=true)"
        required:
          - machine
          - command

  - type: function
    function:
      name: "{{ name }}_get_output"
      description: "Read what a background SSH command has written so far, and whether it still runs."
      parameters:
        type: object
        properties:
          process_id:
            type: string
            description: "Process ID from execute with background=true"
          stream:
            type: string
            enum: ["stdout", "stderr", "both"]
            default: "both"
            description: "Which output stream to read"
          clear_buffer:
            type: boolean
            default: false
            description: "Drop what was read from the buffer (default: false)"
        required:
          - process_id
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_kill_process"
      description: "Stop a background SSH command."
      parameters:
        type: object
        properties:
          process_id:
            type: string
            description: "Process ID from execute with background=true"
          force:
            type: boolean
            default: false
            description: "Send SIGKILL instead of SIGTERM (default: false)"
        required:
          - process_id
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_upload_file"
      description: "Upload a local file to one remote machine via SFTP."
      parameters:
        type: object
        properties:
          machine:
            type: string
            description: "Single machine name."
          local_path:
            type: string
            description: "Local file path to upload"
          remote_path:
            type: string
            description: "Remote destination path"
          mode:
            type: string
            description: "File permissions in octal format (e.g., '0644')"
        required:
          - machine
          - local_path
          - remote_path

  - type: function
    function:
      name: "{{ name }}_download_file"
      description: "Download a file from a remote machine via SFTP to local filesystem"
      parameters:
        type: object
        properties:
          machine:
            type: string
            description: "Single machine name"
          remote_path:
            type: string
            description: "Remote file path to download"
          local_path:
            type: string
            description: "Local destination path"
        required:
          - machine
          - remote_path
          - local_path

  - type: function
    function:
      name: "{{ name }}_check_connection"
      description: "Check SSH connection health."
      parameters:
        type: object
        properties:
          machine:
            type: string
            description: "Machine name; omit for all"
        required: []

  - type: function
    function:
      name: "{{ name }}_add_machine"
      description: "Add an SSH machine at runtime; the connection is tested first."
      parameters:
        type: object
        properties:
          name:
            type: string
            description: "Unique machine name identifier"
          host:
            type: string
            description: "Hostname or IP address"
          port:
            type: integer
            description: "SSH port (default: 22)"
          username:
            type: string
            description: "SSH username"
          auth_method:
            type: string
            enum: ["key", "password", "agent"]
            description: "Authentication method (default: key)"
          password:
            type: string
            description: "Password for password auth (not saved to config for security)"
          key_path:
            type: string
            description: "Path to SSH key file (default: ~/.ssh/id_rsa)"
          tags:
            type: array
            items:
              type: string
            description: "Optional tags for filtering (default: [])"
          persistent:
            type: boolean
            description: "Keep the machine across restarts by storing it in data/ssh_control/machines.<instance>.yaml (default: false). Passwords and passphrases are never stored, only a key path."
          max_connections:
            type: integer
            description: "Max parallel connections (default: 3)"
        required:
          - name
          - host
          - username
      security_notes:
        - "Passwords are never saved to config files, only key paths"
        - "Connection is tested with 10s timeout before adding"
        - "Duplicate machine names are rejected"
      examples:
        - description: "Add production database server with key auth and persistence"
          parameters:
            name: "prod-db"
            host: "192.168.1.50"
            username: "deploy"
            auth_method: "key"
            key_path: "~/.ssh/deploy_key"
            tags: ["production", "database"]
            persistent: true
        - description: "Add temporary test server with password auth"
          parameters:
            name: "test-server"
            host: "10.0.0.100"
            username: "testuser"
            auth_method: "password"
            password: "temp123"
            persistent: false

  - type: function
    function:
      name: "{{ name }}_remove_machine"
      description: "Remove an SSH machine from runtime and optionally from config. Closes all active connections and cleans up connection pools."
      parameters:
        type: object
        properties:
          name:
            type: string
            description: "Machine name to remove"
          remove_from_config:
            type: boolean
            description: "Also delete it from data/ssh_control/machines.<instance>.yaml (default: false). Machines that come from the YAML configuration are not in that store and cannot be removed this way."
        required:
          - name
      cleanup_notes:
        - "Closes all active connections in the pool"
        - "Removes machine from runtime connection manager"
        - "Optionally removes from YAML config file"
      examples:
        - description: "Remove temporary machine (runtime only)"
          parameters:
            name: "temp-server"
            remove_from_config: false
        - description: "Remove persistent machine and cleanup config"
          parameters:
            name: "old-prod-db"
            remove_from_config: true

# Web UI Configuration
web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "SSH Machines"
    description: "Control and monitor SSH-connected machines"
    icon: server
    category: system
    keywords: [ssh, machines, remote]
    window: {width: 900, height: 640}

  endpoints:
    - path: "/"
      method: "GET"
      handler: "render_panel"
      response_type: "html"
    - path: "/api/machines"
      method: "GET"
      handler: "list_machines"
      response_type: "json"
      description: "The machines with their connection state (active=true pings the ones connected to before)"
    - path: "/api/machines"
      method: "POST"
      handler: "add_machine"
      response_type: "json"
      description: "Add a machine through {{ name }}_add_machine, into the store too if it is to be kept"
    - path: "/api/machines/{name:path}"
      method: "DELETE"
      handler: "remove_machine"
      response_type: "json"
      description: "Remove a machine through {{ name }}_remove_machine, from the store too"
    - path: "/api/machines/{machine_name:path}/history"
      method: "GET"
      handler: "machine_history"
      response_type: "json"
      description: "The last commands run on a machine, oldest first"
    - path: "/api/execute"
      method: "POST"
      handler: "run_command"
      response_type: "json"
      description: "Run a command on a machine"

config:
  machines:
  security:
    # Prevents MITM attacks by verifying host keys against known_hosts file
    strict_host_key_checking: true
    known_hosts_file: ~/.ssh/known_hosts
    # AUDIT lines in the server log for every command, background command and
    # file transfer (there is no separate audit file)
    audit_log: true
  plugins: null
  servers: null
