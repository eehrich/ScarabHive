tools:
  - type: function
    function:
      name: ssh_control_list_machines
      description: "List all configured SSH machines with optional tag filtering"
      parameters:
        type: object
        properties:
          tags:
            type: array
            items:
              type: string
            description: "Optional list of tags to filter machines"
        required: []
    
  - type: function
    function:
      name: ssh_control_execute
      description: "Execute a command on one or more remote machines via SSH. Use this for any shell command including file operations (cat, ls, echo, etc.)"
      parameters:
        type: object
        properties:
          machine:
            type: string
            description: "Machine name or comma-separated list of machine names"
          command:
            type: string
            description: "Command to execute on the remote machine(s)"
          timeout:
            type: integer
            description: "Command timeout in seconds (optional, uses machine default)"
          check_exit_code:
            type: boolean
            description: "Fail if exit code is not 0 (default: true)"
        required:
          - machine
          - command
    
  - type: function
    function:
      name: ssh_control_upload_file
      description: "Upload a local file to one or more remote machines via SFTP"
      parameters:
        type: object
        properties:
          machine:
            type: string
            description: "Machine name or comma-separated list of machine names"
          local_path:
            type: string
            description: "Local file path to upload"
          remote_path:
            type: string
            description: "Remote destination path"
          mode:
            type: string
            description: "File permissions in octal format (e.g., '0644')"
        required:
          - machine
          - local_path
          - remote_path
    
  - type: function
    function:
      name: ssh_control_download_file
      description: "Download a file from a remote machine via SFTP to local filesystem"
      parameters:
        type: object
        properties:
          machine:
            type: string
            description: "Machine name"
          remote_path:
            type: string
            description: "Remote file path to download"
          local_path:
            type: string
            description: "Local destination path"
        required:
          - machine
          - remote_path
          - local_path
    
  - type: function
    function:
      name: ssh_control_check_connection
      description: "Check SSH connection health for one or more machines"
      parameters:
        type: object
        properties:
          machine:
            type: string
            description: "Machine name or comma-separated list of names (omit to check all)"
        required: []
  
  - type: function
    function:
      name: ssh_control_add_machine
      description: "Dynamically add a new SSH machine to the connection manager at runtime. Optionally persist to config file. Connection is tested before adding."
      parameters:
        type: object
        properties:
          name:
            type: string
            description: "Unique machine name identifier"
          host:
            type: string
            description: "Hostname or IP address"
          port:
            type: integer
            description: "SSH port (default: 22)"
          username:
            type: string
            description: "SSH username"
          auth_method:
            type: string
            enum: ["key", "password", "agent"]
            description: "Authentication method (default: key)"
          password:
            type: string
            description: "Password for password auth (not saved to config for security)"
          key_path:
            type: string
            description: "Path to SSH key file (default: ~/.ssh/id_rsa)"
          tags:
            type: array
            items:
              type: string
            description: "Optional tags for filtering (default: [])"
          persistent:
            type: boolean
            description: "Save to config/mcp.yaml for persistence (default: false). Note: passwords are never saved."
          max_connections:
            type: integer
            description: "Max parallel connections (default: 3)"
        required:
          - name
          - host
          - username
      security_notes:
        - "Passwords are never saved to config files, only key paths"
        - "Connection is tested with 10s timeout before adding"
        - "Duplicate machine names are rejected"
      examples:
        - description: "Add production database server with key auth and persistence"
          parameters:
            name: "prod-db"
            host: "192.168.1.50"
            username: "deploy"
            auth_method: "key"
            key_path: "~/.ssh/deploy_key"
            tags: ["production", "database"]
            persistent: true
        - description: "Add temporary test server with password auth"
          parameters:
            name: "test-server"
            host: "10.0.0.100"
            username: "testuser"
            auth_method: "password"
            password: "temp123"
            persistent: false
  
  - type: function
    function:
      name: ssh_control_remove_machine
      description: "Remove an SSH machine from runtime and optionally from config. Closes all active connections and cleans up connection pools."
      parameters:
        type: object
        properties:
          name:
            type: string
            description: "Machine name to remove"
          remove_from_config:
            type: boolean
            description: "Also remove from config/mcp.yaml if present (default: false)"
        required:
          - name
      cleanup_notes:
        - "Closes all active connections in the pool"
        - "Removes machine from runtime connection manager"
        - "Optionally removes from YAML config file"
      examples:
        - description: "Remove temporary machine (runtime only)"
          parameters:
            name: "temp-server"
            remove_from_config: false
        - description: "Remove persistent machine and cleanup config"
          parameters:
            name: "old-prod-db"
            remove_from_config: true

# Web UI Configuration
web_ui:
  # Header button configuration
  button:
    enabled: true
    text: "SSH Control"
    icon: "🖥️"
    tooltip: "SSH Machine Control Panel"
  
  # Panel configuration
  panel:
    enabled: true
    title: "SSH Machine Control"
    endpoint: "/plugins/ssh_control/panel"
    type: "iframe"
    description: "Control and monitor SSH-connected machines"
  
  endpoints:
    - path: "/panel.html"
      method: "GET"
      description: "SSH control dashboard panel"
    - path: "/api/machines"
      method: "GET"
      description: "List all configured machines with connection status"
    - path: "/api/machines/{machine}/status"
      method: "GET"
      description: "Get detailed status for specific machine"
    - path: "/api/machines/add"
      method: "POST"
      description: "Dynamically add a new SSH machine (calls ssh_control_add_machine tool)"
      body_schema:
        type: object
        properties:
          name:
            type: string
            description: "Unique machine name"
          host:
            type: string
            description: "Hostname or IP"
          port:
            type: integer
            description: "SSH port (default: 22)"
          username:
            type: string
            description: "SSH username"
          auth_method:
            type: string
            enum: ["key", "password", "agent"]
          password:
            type: string
            description: "Password (not saved to config)"
          key_path:
            type: string
            description: "Path to SSH key file"
          tags:
            type: array
            items:
              type: string
          persistent:
            type: boolean
            description: "Save to config file (default: false)"
          max_connections:
            type: integer
        required: ["name", "host", "username"]
    - path: "/api/machines/{name}"
      method: "DELETE"
      description: "Remove an SSH machine (calls ssh_control_remove_machine tool)"
      query_parameters:
        remove_from_config:
          type: boolean
          description: "Also remove from config file (default: false)"
    - path: "/api/history"
      method: "GET"
      description: "Get recent command execution history"
    - path: "/api/execute"
      method: "POST"
      description: "Execute command on remote machine"
