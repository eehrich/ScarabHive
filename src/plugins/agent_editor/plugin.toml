# agent_editor plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "agent_editor"
version = "0.1.0"
description = "Panel to create and edit agents in their YAML files, comments kept."
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["web"]
category = "infrastructure"
requires = { agent_system = ">=0.7.0" }
# ruamel is this plugin's own: it renders a YAML file keeping comments.
# starlette is FastAPI's base and arrives with it, but this plugin imports
# it directly (run_in_threadpool), so it says so rather than relying on a
# transitive install that a fresh venv on the server need not have.
dependencies = ["ruamel.yaml>=0.18", "starlette>=0.40"]
