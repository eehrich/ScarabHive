tools:
  - type: function
    function:
      name: execute_python
      description: Execute Python code in a secure sandbox environment. Supports mathematical expressions and basic programming.
      parameters:
        type: object
        properties:
          code:
            type: string
            description: "Python code to execute (e.g., '(2+3)*4', 'x = 42; y = x * 2', 'abs(-15)')"
        required: [code]
        additionalProperties: false

  - type: function
    function:
      name: validate_python
      description: Validate Python code syntax without executing it.
      parameters:
        type: object
        properties:
          code:
            type: string
            description: "Python code to validate for syntax errors"
        required: [code]
        additionalProperties: false

  - type: function
    function:
      name: reset_sandbox
      description: Reset the Python sandbox environment, clearing all variables and state.
      parameters:
        type: object
        properties: {}
        additionalProperties: false