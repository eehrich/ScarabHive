tools:
  - type: function
    function:
      name: execute_python
      description: |
        Execute Python code in a secure sandbox. Supports built-in types, math/stats, control flow, functions and f-strings. No imports or global dunders allowed.
        Note: Avoid __name__ (use direct function calls instead of if __name__ == "__main__").
      parameters:
        type: object
        properties:
          code:
            type: string
            description: "Python code with proper formatting (e.g., 'def double(x):\\n    return x * 2\\n\\nresult = double(5)\\nprint(f\"Result: {result}\")')"
        required: [code]
        additionalProperties: false

  - type: function
    function:
      name: reset_sandbox
      description: Reset the Python sandbox environment, clearing all variables and state.
      parameters:
        type: object
        properties: {}
        additionalProperties: false