tools:
  - type: function
    function:
      name: "{{ name }}_execute"
      description: |
        Execute Python code in a secure sandbox. Supports built-in types, math/stats, control flow, functions, f-strings, and type checking.
        No imports, os function or global dunders allowed; no break/continue.
        Use print() to see values.
        Note: Avoid __name__ (use direct function calls instead of if __name__ == "__main__").
      parameters:
        type: object
        properties:
          code:
            type: string
            description: "Python code with proper formatting. Example: 'def calc(x): return x * 2 if isinstance(x, int) else 0\\nprint(calc(5))'"
        required: [code]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_reset"
      description: Reset the Python sandbox environment, clearing all variables and state.
      parameters:
        type: object
        properties: {}
        additionalProperties: false