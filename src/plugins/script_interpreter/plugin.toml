# script_interpreter plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "script_interpreter"
version = "1.0.0"
description = "Secure Python script execution plugin with sandboxed environment for mathematical expressions, basic operations, and simple programming constructs"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["mcp-server"]
category = "utilities"
license = "MIT"
requires = { agent_system = ">=0.6.0" }
