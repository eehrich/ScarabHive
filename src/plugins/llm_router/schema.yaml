tools:
  - type: function
    function:
      name: chat
      description: Route chat requests to different LLM providers using profiles for specialized tasks or alternative AI models.
      parameters:
        type: object
        properties:
          messages:
            type: array
            items:
              type: object
            description: "Array of chat messages"
          message:
            type: string
            description: "Single message text (alternative to messages array)"
          profile:
            type: string
            {% if available_profiles %}
            enum: {{ available_profiles | tojson }}
            description: "LLM profile name to use. Available profiles: {{ available_profiles | join(', ') }}. Each profile defines the provider, model, and settings."
            {% else %}
            description: "LLM profile name to use (e.g., 'turbo', 'normal', 'think'). Each profile defines the provider, model, and settings."
            {% endif %}
        required: ["profile"]
        additionalProperties: true

  - type: function
    function:
      name: list_profiles
      description: List all available LLM profiles with their detailed configurations including models, providers, and settings.
      parameters:
        type: object
        properties: {}
        additionalProperties: false
