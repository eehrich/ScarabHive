tools:
  - type: function
    function:
      name: "{{ name }}_chat"
      description: "Consultant-style chat agent: routes requests to LLM profiles/providers. Acts like an expert consultant—asks clarifying questions, frames tasks, provides advice, and selects specialized profiles as needed."
      parameters:
        type: object
        properties:
          messages:
            type: array
            items:
              type: object
            description: "Array of chat messages"
          message:
            type: string
            description: "Single message text (alternative to messages array)"
          profile:
            type: string
            {% if available_profiles %}
            enum: {{ available_profiles | tojson }}
            description: "LLM profile name. Available: {{ available_profiles | join(', ') }}. Each defines provider, model, settings."
            {% else %}
            description: "LLM profile name (e.g., 'turbo', 'normal', 'think'). Each defines provider, model, settings."
            {% endif %}
        required: ["profile"]
        additionalProperties: true

  - type: function
    function:
      name: "{{ name }}_list_profiles"
      description: List all available LLM profiles with their detailed configurations.
      parameters:
        type: object
        properties: {}
        additionalProperties: false
