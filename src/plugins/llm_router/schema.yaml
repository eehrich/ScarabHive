tools:
  - type: function
    function:
      name: "{{ name }}_chat"
      description: "Send messages to another LLM profile and return its answer (one call, no tools)."
      parameters:
        type: object
        properties:
          messages:
            type: array
            items:
              type: object
            description: "Array of chat messages"
          message:
            type: string
            description: "Single message text (alternative to messages array)"
          profile:
            type: string
            {% if available_profiles %}
            enum: {{ available_profiles | tojson }}
            description: "LLM profile name. Available: {{ available_profiles | join(', ') }}. Each defines provider, model, settings."
            {% else %}
            description: "LLM profile name (e.g., 'turbo', 'normal', 'think'). Each defines provider, model, settings."
            {% endif %}
        required: ["profile"]
        additionalProperties: true

  - type: function
    function:
      name: "{{ name }}_list_profiles"
      description: List the LLM profiles with their model and description.
      parameters:
        type: object
        properties: {}
        additionalProperties: false
