type: function
function:
  name: {{name}}
  description: Route requests to different LLM providers for specialized tasks or alternative AI models.
  parameters:
    type: object
    properties:
      action:
        type: string
        enum: [chat]
      messages:
        type: array
        items:
          type: object
      message:
        type: string
      provider:
        type: string
      model:
        type: string
    additionalProperties: true
