# file_ops plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "file_ops"
version = "1.0.0"
description = "Secure file operations for text files with sandboxed directory access"
author = "Enrico Ehrich"
entrypoint = "server:FileOpsServer"
type = ["mcp-server"]
category = "utilities"
requires = { agent_system = ">=0.6.0" }
