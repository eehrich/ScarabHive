# File Operations Plugin Schema
# Jinja2 variables: {{ name }}, {{ read_only }}

tools:
  - type: function
    function:
      name: "{{ name }}_read_file"
      description: "Read the contents of a file. Line numbers are 1-indexed. This tool will truncate its output at 2000 lines and may be called repeatedly with offset and limit parameters to read larger files in chunks."
      parameters:
        type: object
        properties:
          filePath:
            type: string
            description: "The absolute path of the file to read."
          offset:
            type: integer
            minimum: 1
            description: "Optional: the 1-based line number to start reading from. Only use this if the file is too large to read at once. If not specified, the file will be read from the beginning."
          limit:
            type: integer
            minimum: 1
            description: "Optional: the maximum number of lines to read. Only use this together with `offset` if the file is too large to read at once."
        required: ["filePath"]
        additionalProperties: false

{% if not read_only %}
  - type: function
    function:
      name: "{{ name }}_manage"
      description: |
        File and directory management operations: create, delete, move, rename.
        All paths must be within allowed directories. Parent directories are auto-created for create operation.
        To replace a file completely, use create with overwrite: true -- never delete and create again.
      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: ["create", "delete", "move", "rename"]
            description: |
              Operation to perform:
              - create: Create file with content. Fails if it exists, unless overwrite is true -- that replaces the whole content in one call, no delete first.
              - delete: Delete file or empty directory
              - move: Move file/directory to new location
              - rename: Rename file/directory (same directory)
          path:
            type: string
            description: "Absolute path to the file or directory to operate on"
          content:
            type: string
            description: "File content (required for create operation, files only)"
          destination:
            type: string
            description: "Destination path (required for move operation)"
          new_name:
            type: string
            description: "New name without path (required for rename operation)"
          overwrite:
            type: boolean
            default: false
            description: "Replace the file if it exists, content and all (for create operation). Editing a part of a file is what replace_string_in_file is for."
          recursive:
            type: boolean
            default: false
            description: "Allow recursive deletion of non-empty directories (for delete operation)"
        required: ["operation", "path"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_replace_string_in_file"
      description: |
        This is a tool for making edits in an existing file in the workspace. For moving or renaming files, use run in terminal tool with the 'mv' command instead. For larger edits, split them into smaller edits and call the edit tool multiple times to ensure accuracy. Before editing, always ensure you have the context to understand the file's contents and context. To edit a file, provide: 1) filePath (absolute path), 2) oldString (MUST be the exact literal text to replace including all whitespace, indentation, newlines, and surrounding code etc), and 3) newString (MUST be the exact literal text to replace \`oldString\` with (also including all whitespace, indentation, newlines, and surrounding code etc.). Ensure the resulting code is correct and idiomatic.). Each use of this tool replaces exactly ONE occurrence of oldString.

        CRITICAL for \`oldString\`: Must uniquely identify the single instance to change. Include at least 3 lines of context BEFORE and AFTER the target text, matching whitespace and indentation precisely. If this string matches multiple locations, or does not match exactly, the tool will fail.
      parameters:
        type: object
        properties:
          filePath:
            type: string
            description: "An absolute path to the file to edit."
          oldString:
            type: string
            description: "The exact literal text to replace, preferably unescaped. For single replacements (default), include at least 3 lines of context BEFORE and AFTER the target text, matching whitespace and indentation precisely. For multiple replacements, specify expected_replacements parameter. If this string is not the exact literal text (i.e. you escaped it) or does not match exactly, the tool will fail."
          newString:
            type: string
            description: "The exact literal text to replace `old_string` with, preferably unescaped. Provide the EXACT text. Ensure the resulting code is correct and idiomatic."
        required: ["filePath", "oldString", "newString"]
        additionalProperties: false
{% endif %}

  - type: function
    function:
      name: "{{ name }}_list_directory"
      description: |
        List directory contents with optional filtering and recursion.
        Capped at max_results entries; a cut-off listing says so (truncated).
        A recursive listing skips .gitignored and excluded directories and
        reports that in skipped — use search_files to look for a file by name.
      parameters:
        type: object
        properties:
          dir_path:
            type: string
            description: "Path to directory"
          recursive:
            type: boolean
            default: false
            description: "Recursively list subdirectories"
          pattern:
            type: string
            description: "Glob pattern to filter entries (e.g., '*.py')"
          include_hidden:
            type: boolean
            default: false
            description: "Include hidden files (starting with .)"
          max_results:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
            description: "Maximum number of entries (files + directories) to return"
          include_ignored:
            type: boolean
            default: false
            description: "Also list ignored, excluded and hidden entries"
        required: ["dir_path"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_search_files"
      description: |
        Search for files by name pattern using glob syntax.
        Examples: "*.py", "**/*.test.ts", "src/**/models/*.py"

        Files hidden by .gitignore, by the configured exclude patterns and
        dotfiles are skipped by default — that is what keeps the search fast on a large
        tree. The answer always reports which filters were active, so an empty
        result can be told apart from "it is there, behind a filter". Set
        include_ignored when you need to be sure.
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: "Glob pattern for file search (e.g., '*.py', '**/*.test.js')"
          max_results:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
            description: "Maximum number of files to return"
          include_ignored:
            type: boolean
            default: false
            description: "Also search ignored, excluded and hidden files. A full walk: minutes on a large tree, so keep the pattern narrow"
        required: ["pattern"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_grep_search"
      description: |
        Search for text patterns across files. Supports literal strings and regex.
        Returns matching lines with surrounding context.

        Files hidden by .gitignore, by the configured exclude patterns and
        dotfiles are skipped by default. The answer reports which filters were active, so
        "no matches" does not have to mean "not in the codebase" — set
        include_ignored to search those as well.
      parameters:
        type: object
        properties:
          query:
            type: string
            description: "Search query (literal text or regex pattern)"
          is_regex:
            type: boolean
            default: false
            description: "Treat query as regex pattern"
          include_pattern:
            type: string
            description: "Only search in files matching this glob (e.g., '**/*.py')"
          case_sensitive:
            type: boolean
            default: false
            description: "Case-sensitive search"
          max_results:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
            description: "Maximum number of matches to return"
          context_lines:
            type: integer
            minimum: 0
            maximum: 10
            default: 2
            description: "Number of context lines before/after match"
          include_ignored:
            type: boolean
            default: false
            description: "Also search ignored, excluded and hidden files. A full walk: minutes on a large tree, so keep the pattern narrow"
        required: ["query"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_semantic_search"
      description: |
        Find code by meaning instead of by wording. Each hit is a SYMBOL — a
        function, a class, a heading section — with its file, its line and its
        signature, so you can read straight to it.

        Examples:
          - "how a run is cancelled" → _handle_cancel() in the sub-agent manager
          - "database connection code" → finds DB setup, connection pools, ORM configs
          - "error handling patterns" → locates try/except blocks, error classes

        Use it when you do NOT know the word the code uses; grep_search is
        better whenever you do. Off unless configured, and while the index is
        still building the answer says so instead of returning nothing.
      parameters:
        type: object
        properties:
          query:
            type: string
            description: "Natural language search query describing what code you're looking for"
          max_results:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            description: "Maximum number of symbols to return"
          filter_pattern:
            type: string
            description: "Optional glob pattern to filter results by file type (e.g., '*.py')"
        required: ["query"]
        additionalProperties: false

config:
  # Read-only mode: disables all write/modification operations
  # When true, only read_file, list_directory, search_files, grep_search, semantic_search are available
  read_only: false
  
  # Sandbox security: restricts file operations to these directories only
  # Prevents path traversal attacks and unauthorized file access
  allowed_directories:
    - data/workspace
  max_file_size_for_indexing_kb: 1024
  max_file_size_mb: 10
  
  # File reading limits to prevent memory issues with large files
  max_unpaginated_file_size_kb:
    type: integer
    default: 100
    description: "Maximum file size in KB to read without pagination (default: 100KB)"
    minimum: 10
    maximum: 10240
  
  default_line_limit:
    type: integer
    default: 500
    description: "Default number of lines to read when file exceeds max_unpaginated_file_size"
    minimum: 50
    maximum: 10000
  
  search:
    # DOCUMENTATION, not defaults: nothing reads this block for a tool
    # server (only hook plugins read `config:`), so an instance that leaves
    # a key out gets the fallback in search.py -- which is what the values
    # below repeat. These govern the SEMANTIC index only. It is built in the BACKGROUND,
    # started by the first semantic_search call; that call itself never waits
    # for it. search_files and grep_search walk the disk and need no index at
    # all — that wait was the reason a glob over a large tree did not return
    # within 150 seconds.
    enable_indexing: true
    index_on_startup: true
    # The vector collection. Defaults to file_ops_<instance>: two instances are
    # two trees, and one shared name let the second one's rebuild clear the
    # first one's index. Set the same name on two instances that share a tree,
    # and switch enable_indexing off on all but one of them.
    # collection_name: file_ops_coder_fs_ro
    # Requires ChromaDB Python package for vector embeddings and similarity search.
    # Off unless configured — the server defaults it to false.
    enable_semantic_search: false
    auto_reindex_interval: 300

    # Search dotfiles and dot-directories as well.
    search_hidden: false

    # Skipped by BOTH the index and the text search, and reported as skipped
    # rather than silently dropped. Matched relative to each allowed directory.
    exclude_patterns:
      - '**/.git/**'
      - '**/__pycache__/**'
      - '**/node_modules/**'
      - '**/.venv/**'
      - '**/*.min.js'
      - '**/*.min.css'
      - '**/*.map'
