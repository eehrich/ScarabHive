# File Operations Plugin Schema
# Jinja2 variables: {{ name }}, {{ read_only }}

tools:
  - type: function
    function:
      name: "{{ name }}_read_file"
      description: "Read a text file (a binary one is refused). A file over {{ max_unpaginated_kb }} KB returns its first {{ default_line_limit }} lines and total_lines; read the rest with offset and limit. A page also stops at {{ max_unpaginated_kb }} KB and then says where to go on."
      parameters:
        type: object
        properties:
          filePath:
            type: string
            description: "Path under {{ allowed }}, relative as written or absolute"
          offset:
            type: integer
            minimum: 1
            description: "1-based start line"
          limit:
            type: integer
            minimum: 1
            description: "Maximum lines to read"
        required: ["filePath"]
        additionalProperties: false

{% if not read_only %}
  - type: function
    function:
      name: "{{ name }}_manage"
      description: |
        Create, delete, move or rename files and directories within the allowed directories.
        create makes missing parent directories.
      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: ["create", "delete", "move", "rename"]
            description: |
              - create: new file with content; fails if it exists unless overwrite
              - delete: file or empty directory (non-empty: recursive)
              - move: to destination
              - rename: to new_name, same directory
          path:
            type: string
            description: "Path under {{ allowed }}, relative as written or absolute"
          content:
            type: string
            description: "File content (create)"
          destination:
            type: string
            description: "Destination path (move)"
          new_name:
            type: string
            description: "New name without path (rename)"
          overwrite:
            type: boolean
            default: false
            description: "create: replace an existing file whole (never delete first)"
          recursive:
            type: boolean
            default: false
            description: "delete: also non-empty directories"
        required: ["operation", "path"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_replace_string_in_file"
      description: |
        Edit an existing file: replace exactly ONE occurrence of oldString with newString. Split larger edits into several calls. To move or rename, use {{ name }}_manage.
      parameters:
        type: object
        properties:
          filePath:
            type: string
            description: "Path under {{ allowed }}, relative as written or absolute"
          oldString:
            type: string
            description: "Exact literal text, unescaped, whitespace and indentation included. Must occur exactly once: include ~3 lines of context before and after."
          newString:
            type: string
            description: "Exact literal replacement text, unescaped"
        required: ["filePath", "oldString", "newString"]
        additionalProperties: false
{% endif %}

  - type: function
    function:
      name: "{{ name }}_list_directory"
      description: |
        List directory contents with optional filtering and recursion.
        Capped at max_results entries; a cut-off listing says so (truncated).
        A recursive listing skips .gitignored and excluded directories and
        reports that in skipped — use search_files to look for a file by name.
      parameters:
        type: object
        properties:
          dir_path:
            type: string
            description: "Directory under {{ allowed }}, relative as written or absolute"
          recursive:
            type: boolean
            default: false
            description: "Recursively list subdirectories"
          pattern:
            type: string
            description: "Glob pattern to filter entries (e.g., '*.py')"
          include_hidden:
            type: boolean
            default: false
            description: "Include hidden files (starting with .)"
          max_results:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
            description: "Maximum number of entries (files + directories) to return"
          include_ignored:
            type: boolean
            default: false
            description: "Also list ignored, excluded and hidden entries"
        required: ["dir_path"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_search_files"
      description: |
        Search for files by name pattern using glob syntax.
        Examples: "*.py", "**/*.test.ts", "src/**/models/*.py"

        Files hidden by .gitignore, by the configured exclude patterns and
        dotfiles are skipped by default — that is what keeps the search fast on a large
        tree. The answer always reports which filters were active, so an empty
        result can be told apart from "it is there, behind a filter". Set
        include_ignored when you need to be sure.
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: "Glob pattern for file search (e.g., '*.py', '**/*.test.js')"
          max_results:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
            description: "Maximum number of files to return"
          include_ignored:
            type: boolean
            default: false
            description: "Also search ignored, excluded and hidden files. A full walk: minutes on a large tree, so keep the pattern narrow"
        required: ["pattern"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_grep_search"
      description: |
        Search for text patterns across files. Supports literal strings and regex.
        Returns matching lines with surrounding context.

        Files hidden by .gitignore, by the configured exclude patterns and
        dotfiles are skipped by default. The answer reports which filters were active, so
        "no matches" does not have to mean "not in the codebase" — set
        include_ignored to search those as well.
      parameters:
        type: object
        properties:
          query:
            type: string
            description: "Search query (literal text or regex pattern)"
          is_regex:
            type: boolean
            default: false
            description: "Treat query as regex pattern"
          include_pattern:
            type: string
            description: "Only search in files matching this glob (e.g., '**/*.py')"
          case_sensitive:
            type: boolean
            default: false
            description: "Case-sensitive search"
          max_results:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
            description: "Maximum number of matches to return"
          context_lines:
            type: integer
            minimum: 0
            maximum: 10
            default: 2
            description: "Number of context lines before/after match"
          include_ignored:
            type: boolean
            default: false
            description: "Also search ignored, excluded and hidden files. A full walk: minutes on a large tree, so keep the pattern narrow"
        required: ["query"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_semantic_search"
      description: |
        Find code by meaning instead of by wording. Each hit is a SYMBOL — a
        function, a class, a heading section — with its file, its line and its
        signature, so you can read straight to it.

        Examples:
          - "how a run is cancelled" → _handle_cancel() in the sub-agent manager
          - "database connection code" → finds DB setup, connection pools, ORM configs
          - "error handling patterns" → locates try/except blocks, error classes

        Use it when you do NOT know the word the code uses; grep_search is
        better whenever you do. Ask in the language of what you are looking
        for -- for code, in English, whatever language you talk to the user
        in: the index model is English, and a German question found the code
        it described at a third of the English one's score. Off unless
        configured. Files that changed are
        indexed before the answer when that takes only seconds; while the index
        is still building or catching up, the answer covers what is indexed so
        far and says so (index_complete / index_fresh: false, with progress).
      parameters:
        type: object
        properties:
          query:
            type: string
            description: "What the code does, as a short question or phrase -- in English for code"
          max_results:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            description: "Maximum number of symbols to return"
          filter_pattern:
            type: string
            description: "Optional glob pattern to filter results by file type (e.g., '*.py')"
        required: ["query"]
        additionalProperties: false

config:
  # DOCUMENTATION, not defaults: a tool server does not read this block. The
  # values are what server.py falls back to when the server entry in
  # plugins.yaml leaves a key out -- except allowed_directories, see there.

  # Read-only mode: the write tools (manage, replace_string_in_file) are not
  # rendered, and the server refuses them if one is called anyway.
  read_only: false

  # The sandbox: every path a tool takes must resolve inside one of these.
  # Relative entries count from the project; "." is the folder the CLI was
  # started in. Without the key nothing is allowed (fail closed); the list
  # below is an example, not a default.
  allowed_directories:
    - src
    - docs
    - tests
    - tmp
  
  # File reading limits to prevent memory issues with large files
  max_unpaginated_file_size_kb:
    type: integer
    default: 100
    description: "Maximum file size in KB to read without pagination (default: 100KB)"
    minimum: 10
    maximum: 10240
  
  default_line_limit:
    type: integer
    default: 500
    description: "Default number of lines to read when file exceeds max_unpaginated_file_size"
    minimum: 50
    maximum: 10000
  
  search:
    # DOCUMENTATION, not defaults: nothing reads this block for a tool
    # server (only hook plugins read `config:`), so an instance that leaves
    # a key out gets the fallback in search.py -- which is what the values
    # below repeat. These govern the SEMANTIC index only. It is built in the BACKGROUND,
    # started by the first semantic_search call; that call itself never waits
    # for it, and the build keeps what it stored when its process ends.
    # search_files and grep_search need no index at all — that wait was the
    # reason a glob over a large tree did not return within 150 seconds.
    enable_indexing: true
    index_on_startup: true
    # The vector collection. Defaults to file_ops_<instance>: two instances are
    # two trees, and one shared name let the second one's rebuild clear the
    # first one's index. Set the same name on two instances that share a tree,
    # and switch enable_indexing off on all but one of them.
    # collection_name: file_ops_coder_fs_ro
    # Requires ChromaDB Python package for vector embeddings and similarity search.
    # Off unless configured — the server defaults it to false.
    enable_semantic_search: false
    auto_reindex_interval: 300
    # How long a semantic search waits for the index to catch up with files
    # that changed since the last pass (seconds; 0 = answer at once). Whether
    # anything changed is asked of the disk first (0.3 s on a 45.000-file
    # tree); nothing changed means no wait. Not caught up in time, the answer
    # comes from the index as it stands and says so (index_fresh: false).
    index_wait_seconds: 10
    # Files larger than this are left out of the index, and grep skips them.
    max_file_size_for_indexing_kb: 1024

    # Search dotfiles and dot-directories as well.
    search_hidden: false

    # grep_search and search_files run ripgrep when one is found: on PATH, or
    # in data/cache/bin, fetched there once from the official release and
    # checked against a pinned SHA-256 (ripgrep.py). "off" keeps the Python
    # walk; a path names the binary. FILE_OPS_RIPGREP_DOWNLOAD=0 stops the
    # download for a whole process.
    # ripgrep_path: off
    ripgrep_download: true

    # Skipped by BOTH the index and the text search, and reported as skipped
    # rather than silently dropped. Matched relative to each allowed directory.
    exclude_patterns:
      - '**/.git/**'
      - '**/__pycache__/**'
      - '**/node_modules/**'
      - '**/.venv/**'
      - '**/*.min.js'
      - '**/*.min.css'
      - '**/*.map'

# Opt-in per agent (hooks.overrides "<instance>.changed_files_notice"): before
# the first LLM call of a turn, a developer note lists the files added, changed
# or removed in the workspace since the agent's previous turn -- not by its own
# file edits. Needs an instance with a semantic index that it builds (the
# changes come from the index passes). Appended, never rewritten: cache-safe.
hooks:
  - name: changed_files_notice
    type: pre_llm_call
    enabled: false
    # Above the search's own wait (index_wait_seconds, 10 s by default): the
    # hook may wait for the index to catch up first.
    timeout: 20.0
    description: "Tell the agent which workspace files changed since its previous turn"
    # After tool_preload, whose results stand behind the turn's head first.
    category: "prompt_injection"
    # Per agent: max_listed (default 30) -- paths named in the note.
