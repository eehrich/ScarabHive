# Decision Plugin Schema — Jev-based Batch Probabilities and Scoring

tools:
  - type: function
    function:
      name: "{{ name }}_evaluate_probabilities"
      description: |
        Evaluate a batch of context items against one or more binary/likelihood questions in parallel using a calibrated decision model (Jev).
        Outputs calibrated probabilities (0.0 to 1.0) per item for each question.
      parameters:
        type: object
        properties:
          items:
            type: array
            description: "List of items/contexts to evaluate in batch. Each item is an object with 'context' and optional 'id' (or a plain text string)."
            items:
              type: object
              properties:
                id:
                  type: string
                  description: "Optional identifier for this context item (e.g. 'doc_1', 'comment_42'). Defaults to 'item_1', 'item_2', etc."
                context:
                  type: string
                  description: "The content, statement, code snippet, or context to be evaluated."
              required: ["context"]
          questions:
            type: array
            description: "List of questions to evaluate against each context item. Each item specifies the question text and an optional identifier or criteria."
            items:
              type: object
              properties:
                id:
                  type: string
                  description: "Optional identifier for the question (e.g. 'is_safe', 'needs_review'). Defaults to 'q1', 'q2', etc."
                question:
                  type: string
                  description: "The question or instruction to evaluate against each context (e.g. 'Is this operation safe to perform?')."
                criteria_true:
                  type: string
                  description: "What makes the answer true; only together with criteria_false."
                criteria_false:
                  type: string
                  description: "What makes the answer false; only together with criteria_true."
              required: ["question"]
          max_concurrency:
            type: integer
            description: "Optional maximum number of parallel evaluation calls (default from server config, e.g. 10)."
          include_details:
            type: boolean
            default: false
            description: "Whether to include raw confidence/distribution details in the result (default: false to minimize token footprint)."
        required: ["items", "questions"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_evaluate_scores"
      description: |
        Score a batch of context items on one or more ordered scales in parallel using a calibrated decision model (Jev).
        Each score is a continuous position on its scale: 0 = lowest level, len(scale)-1 = highest.
      parameters:
        type: object
        properties:
          items:
            type: array
            description: "List of items/contexts to evaluate in batch. Each item is an object with 'context' and optional 'id' (or a plain text string)."
            items:
              type: object
              properties:
                id:
                  type: string
                  description: "Optional identifier for this context item (e.g. 'code_1', 'essay_42'). Defaults to 'item_1', 'item_2', etc."
                context:
                  type: string
                  description: "The content, statement, code snippet, or context to be scored."
              required: ["context"]
          criteria:
            type: array
            description: "List of scoring dimensions/criteria to evaluate against each context."
            items:
              type: object
              properties:
                id:
                  type: string
                  description: "Optional identifier for the criterion (e.g. 'clarity', 'risk_level'). Defaults to 'c1', 'c2', etc."
                question:
                  type: string
                  description: "Instruction or dimension to score (e.g. 'Rate the clarity and structure of this text')."
                scale:
                  type: array
                  items:
                    type: string
                  description: "Ordered scale levels from lowest to highest (at least 2 levels). E.g. ['poor', 'fair', 'good', 'excellent'] or ['1', '2', '3', '4', '5']. Defaults to ['1', '2', '3', '4', '5'] if omitted."
              required: ["question"]
          max_concurrency:
            type: integer
            description: "Optional maximum number of parallel evaluation calls (default from server config, e.g. 10)."
          include_details:
            type: boolean
            default: false
            description: "Whether to include raw confidence/distribution details in the result (default: false to minimize token footprint)."
        required: ["items", "criteria"]
        additionalProperties: false

config:
  decision_profile:
    type: string
    description: "Decision profile name from llm_system.decision_profiles. If omitted or empty, llm_system.default_decision_profile is used."
  max_batch_size:
    type: integer
    default: 250
    description: "Maximum number of items allowed in a single batch evaluation call."
  max_concurrency:
    type: integer
    default: 10
    description: "Default maximum number of concurrent requests to the decision model."
  max_questions:
    type: integer
    default: 20
    description: "Maximum number of questions or criteria allowed per evaluation call."
  max_context_length:
    type: integer
    default: 50000
    description: "Maximum character length of context string allowed per item."
  default_scale:
    type: array
    items:
      type: string
    default: ["1", "2", "3", "4", "5"]
    description: "Default scoring scale used when a criterion does not provide a custom scale."
