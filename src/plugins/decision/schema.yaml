# Decision Plugin Schema — Jev-based Probabilities and Scoring

tools:
  - type: function
    function:
      name: "{{ name }}_evaluate_probabilities"
      description: |
        Evaluate a piece of context/text against one or more binary/likelihood questions using a calibrated decision model (Jev).
        Outputs calibrated probabilities (0.0 to 1.0) for each question.
      parameters:
        type: object
        properties:
          context:
            type: string
            description: "The content, statement, code snippet, or context to be evaluated."
          questions:
            type: array
            description: "List of questions to evaluate against the context. Each item specifies the question text and an optional identifier or criteria."
            items:
              type: object
              properties:
                id:
                  type: string
                  description: "Optional identifier for the question (e.g. 'is_safe', 'needs_review'). Defaults to 'q1', 'q2', etc."
                question:
                  type: string
                  description: "The question or instruction to evaluate against the context (e.g. 'Is this operation safe to perform?')."
                criteria_true:
                  type: string
                  description: "Optional explanation of what conditions make the question true."
                criteria_false:
                  type: string
                  description: "Optional explanation of what conditions make the question false."
              required: ["question"]
        required: ["context", "questions"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_evaluate_scores"
      description: |
        Evaluate a piece of context/text against one or more scoring dimensions using a calibrated decision model (Jev).
        Outputs continuous score points along ordered scales (e.g. 1-5 or custom levels).
      parameters:
        type: object
        properties:
          context:
            type: string
            description: "The content, statement, code snippet, or context to be scored."
          criteria:
            type: array
            description: "List of scoring dimensions/criteria to evaluate against the context."
            items:
              type: object
              properties:
                id:
                  type: string
                  description: "Optional identifier for the criterion (e.g. 'clarity', 'risk_level'). Defaults to 'c1', 'c2', etc."
                question:
                  type: string
                  description: "Instruction or dimension to score (e.g. 'Rate the clarity and structure of this text')."
                scale:
                  type: array
                  items:
                    type: string
                  description: "Ordered scale levels from lowest to highest (at least 2 levels). E.g. ['poor', 'fair', 'good', 'excellent'] or ['1', '2', '3', '4', '5']. Defaults to ['1', '2', '3', '4', '5'] if omitted."
              required: ["question"]
        required: ["context", "criteria"]
        additionalProperties: false

config:
  decision_profile:
    type: string
    description: "Decision profile name from llm_system.decision_profiles. If omitted or empty, llm_system.default_decision_profile is used."
  max_questions:
    type: integer
    default: 20
    description: "Maximum number of questions or criteria allowed per evaluation call."
  max_context_length:
    type: integer
    default: 50000
    description: "Maximum character length of context string allowed."
  default_scale:
    type: array
    items:
      type: string
    default: ["1", "2", "3", "4", "5"]
    description: "Default scoring scale used when a criterion does not provide a custom scale."
