# Hook definitions for simple_prompt_inject plugin
# Injects configurable text into conversations before LLM calls
hooks:
  - name: inject_prompt
    type: PRE_LLM_CALL
    enabled: true
    timeout: 1.0
    description: "Injects a configurable prompt into the message list before LLM calls"
    order:
      after: ["begin"]
      before: ["end"]

# Configuration schema
config:
  prompt_text:
    type: string
    default: ""
    description: >
      The text to inject into the conversation. Empty string means no injection.
      Supports Jinja2 template syntax with agent template_vars.

  prompt_file:
    type: string
    default: ""
    description: >
      Path to a .md file whose content is used as the injection prompt.
      Resolved relative to the config/ directory (or absolute).
      Takes precedence over prompt_text when set.
      Supports Jinja2 template syntax with agent template_vars.

  injection_position:
    type: string
    enum: ["before_last_user", "end"]
    default: "before_last_user"
    description: >
      Where to inject the prompt:
      - before_last_user: Insert as system message right before the last user message
      - end: Append as last message

  role:
    type: string
    enum: ["system", "developer", "user"]
    default: "system"
    description: >-
      The role of the injected message. "developer" is for what the RUN tells
      the model rather than what the agent IS — a budget, a deadline, a state
      the run just reached. Each LLM client sends it on the best rung its wire
      format has (see agent_system/llm/message_roles.py), so it never errors.
