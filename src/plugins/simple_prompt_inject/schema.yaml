# Hook definitions for simple_prompt_inject plugin
# Injects configurable text into conversations before LLM calls
hooks:
  - name: inject_prompt
    type: PRE_LLM_CALL
    enabled: true
    timeout: 1.0
    description: "Injects a configurable prompt into the message list before LLM calls"
    order:
      after: ["begin"]
      before: ["end"]

# Configuration schema
config:
  prompt_text:
    type: string
    default: ""
    description: >
      The text to inject into the conversation. Empty string means no injection.
      Supports Jinja2 template syntax with agent template_vars.

  prompt_file:
    type: string
    default: ""
    description: >
      Path to a .md file whose content is used as the injection prompt.
      Resolved relative to the config/ directory (or absolute).
      Takes precedence over prompt_text when set.
      Supports Jinja2 template syntax with agent template_vars.

  injection_position:
    type: string
    enum: ["before_last_user", "end", "after_system"]
    default: "before_last_user"
    description: >
      Where to inject the prompt, for every role alike:
      - before_last_user: right before the last user message. The text moves
        with the turn, so it is rewritten on every call -- that is the point
        for a reminder that must be read just before the answer, and it costs
        the cache of the last message, not of the history.
      - end: appended once and then left alone. Written again only when the
        rendered text changes.
      - after_system: right behind the system prompt, as part of the
        instructions, and it stays there. Rewritten only when the rendered text
        changes -- a changing head costs the cache of the whole history, so a
        text rendered from template_vars should be stable per session.
        role "system" always stands here.

  role:
    type: string
    enum: ["system", "developer", "user"]
    default: "developer"
    description: >-
      The role of the injected message. "developer" is for what the RUN tells
      the model rather than what the agent IS — a budget, a deadline, a state
      the run just reached. Each LLM client sends it on the best rung its wire
      format has (see agent_system/llm/message_roles.py), so it never errors.
      "system" is part of the agent's instructions: it always stands right
      behind the system prompt (injection_position "after_system"), because
      Anthropic and Gemini have no system role inside a history and would
      hoist it there anyway.
