# simple_prompt_inject plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "simple_prompt_inject"
version = "1.0.0"
description = "Simple hook plugin that injects configurable prompt text into conversations before LLM calls"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["hooks"]
category = "prompt"
tags = ["hooks", "prompt", "injection"]
requires = { agent_system = ">=0.6.0" }
