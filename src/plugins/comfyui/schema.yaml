# ComfyUI Plugin Tool Schema
# Single tool with multiple operations for workflow management

tools:
  - type: function
    function:
      name: "{{ name }}_workflow"
      description: >
        Execute and manage ComfyUI workflows for generating images, audio, video, and other media.
        Use operation='list' to see available workflows, then 'execute' to run them.
        Track progress with 'status' and retrieve outputs with 'result'.
      parameters:
        type: object
        properties:
          operation:
            type: string
            enum:
              - list
              - execute
              - status
              - result
              - load
              - wait_for_completion
              - server_status
              - queue
              - cancel
            description: >
              The operation to perform:
              - list: List available workflows (filterable by category)
              - execute: Execute a workflow with given parameters
              - status: Get the current status of a job
              - result: Retrieve output files from completed job
              - load: Load previously generated media for LLM analysis (view existing outputs)
              - wait_for_completion: Wait synchronously until a job completes (with timeout)
              - server_status: Check ComfyUI server connectivity
              - queue: View pending and running jobs
              - cancel: Cancel a job by prompt_id
          
          workflow_id:
            type: string
            description: >
              ID of the workflow to execute.
              Required for operation='execute'.
              Use operation='list' to see available workflow IDs.
          
          parameters:
            type: object
            description: >
              Parameters to pass to the workflow.
              Each workflow has different parameters.
              Use operation='list' to see required parameters for each workflow.
            additionalProperties: true
          
          prompt_id:
            type: string
            description: >
              The job ID returned from a previous 'execute' operation.
              Required for operations: status, result, cancel, wait_for_completion.
          
          timeout:
            type: integer
            default: 300
            description: >
              Maximum time in seconds to wait for job completion (for operation='wait_for_completion').
              Default: 300 seconds (5 minutes).
          
          poll_interval:
            type: integer
            default: 2
            description: >
              Time in seconds between status checks (for operation='wait_for_completion').
              Default: 2 seconds.
          
          category:
            type: string
            description: >
              Filter workflows by category (for operation='list').
              Common categories: image_generation, audio, video, tts
          
          download:
            type: boolean
            default: true
            description: >
              For operation='result' and 'wait_for_completion': whether to download files locally.
              If true (default), files are saved to the output directory.
          
          include_content:
            type: boolean
            default: false
            description: >
              For operation='result' and 'wait_for_completion': whether to include the generated
              media content in the response for LLM analysis. When true, images/audio/video
              will be attached so the LLM can see and analyze the generated content.
              Useful for workflows where you want the LLM to describe or evaluate the output.
          
          output_prefix:
            type: string
            default: "comfy"
            description: >
              Prefix for downloaded output files.
              Useful for organizing outputs from different jobs.
          
          file_path:
            type: string
            description: >
              For operation='load': Path to a specific file to load (absolute or relative to output directory).
              Use this to load a file you already know the path to.
          
          filename:
            type: string
            description: >
              For operation='load': Filename to search for in the output directory.
              The plugin will search for this file and load it for analysis.
        
        required:
          - operation
        additionalProperties: false
