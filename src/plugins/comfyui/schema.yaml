# ComfyUI Plugin Tool Schema
# Single tool with multiple operations for workflow management

tools:
  - type: function
    function:
      name: "{{ name }}_workflow"
      description: >
        Execute and manage ComfyUI workflows for generating images, audio, video, text, and other media.
        Use operation='list' to see available workflows, then 'execute' to run them.
        Track progress with 'status' and retrieve outputs with 'result'.
      parameters:
        type: object
        properties:
          operation:
            type: string
            enum:
              - list
              - execute
              - status
              - result
              - load
              - wait_for_completion
              - server_status
              - queue
              - cancel
              - upload_image
            description: >
              The operation to perform:
              - list: List available workflows (filterable by category)
              - execute: Execute a workflow with given parameters
              - status: Get the current status of a job
              - result: Retrieve output files from completed job
              - load: Load previously generated media for LLM analysis (view existing outputs)
              - wait_for_completion: Wait synchronously until a job completes 
              - server_status: Check ComfyUI server connectivity
              - queue: View pending and running jobs
              - cancel: Cancel a job by prompt_id
              - upload_image: Upload a local image file to ComfyUI's input folder for use as reference in img2img/IPAdapter workflows. Returns filename to use as workflow parameter.
          
          workflow_id:
            type: string
            description: >
              ID of the workflow to execute.
              Required for operation='execute'.
              Use operation='list' to see available workflow IDs.
          
          parameters:
            type: string
            description: >
              JSON-encoded parameters for the workflow (e.g.
              '{"prompt":"a forest","negative_prompt":"blurry","width":1024,"height":1536,"seed":42}').
              Each workflow has its own parameter names — call operation='list'
              first if unsure which fields are required. Required for operation='execute'.
          
          prompt_id:
            type: string
            description: >
              The job ID returned from a previous 'execute' operation.
              Required for operations: status, result, cancel, wait_for_completion.
              For operation='load': loads every output that 'result' saved for this job.
          
          poll_interval:
            type: integer
            default: 2
            description: >
              Time in seconds between status checks (for operation='wait_for_completion').
              Default: 2 seconds; at least 1.
          
          category:
            type: string
            description: >
              Filter workflows by category (for operation='list').
              Common categories: image_generation, audio, video, tts, text
          
          download:
            type: boolean
            default: true
            description: >
              For operation='result': whether to download files locally.
              If true (default), files are saved to the output directory.
              wait_for_completion with include_content=true always downloads.
          
          include_content:
            type: boolean
            default: false
            description: >
              For operation='result' and 'wait_for_completion': whether to include the generated
              media in the response for LLM analysis. When true, images/audio/video
              are attached so the LLM can see and analyze the generated content.
              With operation='result', text outputs carry their content in the response either way
              (up to 100,000 characters each); wait_for_completion with include_content=false answers
              only the status and the elapsed time.
              Useful for workflows where you want the LLM to describe or evaluate the output.
          
          output_prefix:
            type: string
            default: "comfy"
            description: >
              For operation='result' and 'wait_for_completion': prefix of the downloaded output files,
              1 to 64 letters, digits, '_', '.' or '-'
              (<prefix>_<filename>). Useful for organizing outputs from different jobs.
          
          file_path:
            type: string
            description: >
              For operation='load': Path to a specific file to load, relative to the output directory
              (an absolute path must lie inside it).
              Use this to load a file you already know the path to.
              For operation='upload_image': Path to the local image file to upload to ComfyUI's input
              folder. Returns a filename usable as reference_image in img2img/IPAdapter workflows.
          
          filename:
            type: string
            description: >
              For operation='load': Filename to search for in the output directory.
              The plugin will search for this file and load it for analysis.
        required:
          - operation
        additionalProperties: false

# Configuration schema
config:
  type: object
  properties:
    host:
      type: string
      description: ComfyUI server hostname
      default: "127.0.0.1"
    
    port:
      type: integer
      description: ComfyUI server port
      default: 8188
    
    timeout_seconds:
      type: integer
      description: Timeout for ComfyUI operations (seconds)
      default: 300
    
    unknown_threshold_seconds:
      type: integer
      description: >
        Fail early if a job stays in "unknown" status for this many seconds.
        If a job is not found in ComfyUI's queue or history after this threshold,
        it's considered lost/dropped and marked as failed immediately rather than
        waiting for the full timeout. This handles cases where jobs are lost due to
        server restarts or queue clearing. A server that cannot be reached is not such a job: after the same
        time wait_for_completion answers status "unreachable" and records nothing.
      default: 60
      minimum: 1
    
    output_dir:
      type: string
      description: Directory where ComfyUI outputs are saved
      default: "data/comfyui/outputs"
    
    workflow_files_dir:
      type: string
      description: Directory containing workflow JSON files
      default: "config/comfyui_workflows"
    
    cleanup_age_hours:
      type: integer
      description: >
        Automatically delete output files older than this many hours.
        Set to 0 to disable automatic cleanup.
        Cleanup runs on the first tool call and after each operation='result'.
      default: 48
      minimum: 0
    
    workflows:
      type: array
      description: List of available workflow configurations
      items:
        type: object


# Web UI
web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "ComfyUI"
    description: "Workflow jobs on the ComfyUI server"
    icon: image
    category: agents
    keywords: [images, workflows, jobs]
    window: {width: 760, height: 560}

  endpoints:
    - path: "/"
      method: "GET"
      handler: "render_panel"
      response_type: "html"
      description: "The ComfyUI panel"
    - path: "/jobs"
      method: "GET"
      handler: "list_jobs"
      response_type: "json"
      description: "Each server's state, the jobs still to finish, the last ones finished and the counts by status"
    - path: "/jobs/{prompt_id}/cancel"
      method: "POST"
      handler: "cancel_job"
      response_type: "json"
      description: "Cancel a queued or running job on the server that runs it"
