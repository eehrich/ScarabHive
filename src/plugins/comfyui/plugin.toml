# comfyui plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "comfyui"
version = "1.0.0"
description = "Execute ComfyUI workflows for image, audio, and video generation"
author = "Enrico Ehrich"
entrypoint = "server:PLUGIN_FACTORY"
type = ["tool-server"]
category = "media"
requires = { agent_system = ">=0.7.0" }
