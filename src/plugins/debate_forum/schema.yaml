# Hook definitions for debate_forum plugin
hooks:
  - name: inject_debate_context
    type: pre_llm_call
    enabled: false
    timeout: 5.0
    description: "Inject debate forum messages from other participants into the agent's context"
    category: "prompt_injection"
    order:
      after: ["context_optimization"]
      before: ["message_validation"]

# Tool definitions for debate_forum plugin
tools:
  - type: function
    function:
      name: "{{ name }}_create_group"
      description: >
        Create a new channel group. Groups let you organize related debate channels
        together (e.g. all channels for one story design run). Returns the group_id.
      parameters:
        type: object
        properties:
          name:
            type: string
            description: "Group name (e.g. 'Story Design - Buch 5 - 2024-03-15')"            
          description:
            type: string
            description: "Optional description (e.g. 'V5b pipeline run for book 5')"
        required: [name]

  - type: function
    function:
      name: "{{ name }}_list_groups"
      description: >
        List all channel groups, newest first. Each group includes a channel_count.
      parameters:
        type: object
        properties:
          limit:
            type: integer
            description: "Maximum groups to return (default 100)"

  - type: function
    function:
      name: "{{ name }}_create_channel"
      description: >
        Create a new debate channel. Returns the channel_id.
        Each debate gets its own channel where agents post messages.
      parameters:
        type: object
        properties:
          name:
            type: string
            description: "Short channel name (e.g. 'synopsis-debatte-book-3')"
          topic:
            type: string
            description: "What is being debated (e.g. 'Welche der 3 Synopsen ist am besten?')"
          context:
            type: string
            description: "Background context as text or JSON (genre, premise, candidates, etc.)"
          group_id:
            type: integer
            description: "Optional group ID to assign this channel to"
          metadata:
            type: object
            description: "Optional metadata (book_id, stage, pipeline, etc.)"
        required: [name, topic]

  - type: function
    function:
      name: "{{ name }}_post_message"
      description: >
        Post a message to a debate channel. The message is attributed to a named agent
        with a role (advocate, critic, moderator, etc.) and a round number.
      parameters:
        type: object
        properties:
          channel_id:
            type: integer
            description: "ID of the channel to post to"
          agent_name:
            type: string
            description: "Display name of the agent (e.g. 'Mira', 'Sven', 'Kai')"
          agent_role:
            type: string
            description: "Role in the debate"
          round:
            type: integer
            description: "Discussion round number (1, 2, 3, ...)"
          content:
            type: string
            description: "The message content"
          metadata:
            type: object
            description: "Optional metadata (llm_profile, token_count, etc.)"
        required: [channel_id, agent_name, agent_role, round, content]

  - type: function
    function:
      name: "{{ name }}_get_thread"
      description: >
        Get the full discussion thread for a channel, formatted as text.
        Use this to build context for the next agent in the debate.
      parameters:
        type: object
        properties:
          channel_id:
            type: integer
            description: "ID of the channel"
          format:
            type: string
            description: "Output format: 'text' (default, for LLM context) or 'json' (raw data)"
            enum: ["text", "json"]
          max_messages:
            type: integer
            description: "Limit number of messages returned (0=all, default=0)"
        required: [channel_id]

  - type: function
    function:
      name: "{{ name }}_conclude"
      description: >
        Conclude a debate with a verdict. Sets channel status to 'concluded'.
      parameters:
        type: object
        properties:
          channel_id:
            type: integer
            description: "ID of the channel"
          verdict:
            type: object
            description: "Verdict data (winner, score, feedback, action_items, etc.)"
          summary:
            type: string
            description: "Human-readable summary of the verdict"
        required: [channel_id, verdict]

  - type: function
    function:
      name: "{{ name }}_reopen_channel"
      description: >
        Reopen a concluded or archived debate channel back to active status.
        Allows posting new messages and continuing the debate.
      parameters:
        type: object
        properties:
          channel_id:
            type: integer
            description: "ID of the channel to reopen"
        required: [channel_id]

  - type: function
    function:
      name: "{{ name }}_rename_channel"
      description: >
        Rename a debate channel. Updates only the display name; channel_id,
        messages, pins and history stay intact.
      parameters:
        type: object
        properties:
          channel_id:
            type: integer
            description: "ID of the channel to rename"
          new_name:
            type: string
            description: "New display name for the channel"
        required: [channel_id, new_name]

  - type: function
    function:
      name: "{{ name }}_list_channels"
      description: >
        List debate channels, optionally filtered by status or group.
      parameters:
        type: object
        properties:
          status:
            type: string
            description: "Filter by status: 'active', 'concluded', 'archived'. Omit for all."
            enum: ["active", "concluded", "archived"]
          group_id:
            type: integer
            description: "Filter by group ID. Omit to show all groups."
          limit:
            type: integer
            description: "Maximum channels to return (default 50)"
          search:
            type: string
            description: "Search in channel name/topic"

  - type: function
    function:
      name: "{{ name }}_pin_message"
      description: >
        Pin or unpin a message. Pinned messages are always included in the context
        injection for sub-agents, regardless of the sliding window size.
        Use this to preserve important context (original task, key decisions, etc.).
      parameters:
        type: object
        properties:
          message_id:
            type: integer
            description: "ID of the message to pin or unpin"
          pinned:
            type: boolean
            description: "true to pin, false to unpin (default: true)"
        required: [message_id]

# Web UI configuration
web_ui:
  button:
    enabled: true
    text: "Debate Forum"
    icon: "💬"
    tooltip: "View LLM debate channels and discussion threads"
  
  panel:
    enabled: true
    title: "Debate Forum"
    panel_id: "{{ name }}"
    endpoint: "/plugins/{{ name }}/"
    type: "iframe"
    description: "Discord-style debate forum showing agent discussions"
  
  endpoints:
    - path: "/"
      method: "GET"
      handler: "render_panel"
      response_type: "html"
      description: "Render the debate forum panel"
    - path: "/static/panel.css"
      method: "GET"
      handler: "serve_css"
      response_type: "response"
      description: "Serve panel CSS"
    - path: "/static/panel.js"
      method: "GET"
      handler: "serve_js"
      response_type: "response"
      description: "Serve panel JavaScript"
    - path: "/api/channels"
      method: "GET"
      handler: "api_list_channels"
      response_type: "json"
      description: "List channels"
    - path: "/api/groups"
      method: "GET"
      handler: "api_list_groups"
      response_type: "json"
      description: "List channel groups"
    - path: "/api/channels/{channel_id}"
      method: "GET"
      handler: "api_get_channel"
      response_type: "json"
      description: "Get channel details"
    - path: "/api/channels/{channel_id}/messages"
      method: "GET"
      handler: "api_get_messages"
      response_type: "json"
      description: "Get messages for a channel"
    - path: "/api/stats"
      method: "GET"
      handler: "api_get_stats"
      response_type: "json"
      description: "Get forum statistics"
    - path: "/api/channels/{channel_id}/messages"
      method: "POST"
      handler: "api_post_message"
      response_type: "json"
      description: "Post a message to a channel from the web UI"
    - path: "/api/channels/{channel_id}/archive"
      method: "POST"
      handler: "api_archive_channel"
      response_type: "json"
      description: "Archive a channel"
    - path: "/api/channels/{channel_id}/reopen"
      method: "POST"
      handler: "api_reopen_channel"
      response_type: "json"
      description: "Reopen a concluded or archived channel"
    - path: "/api/channels"
      method: "POST"
      handler: "api_create_channel"
      response_type: "json"
      description: "Create a new channel"
    - path: "/api/channels/{channel_id}"
      method: "DELETE"
      handler: "api_delete_channel"
      response_type: "json"
      description: "Permanently delete a channel and all its messages"
    - path: "/api/messages/{message_id}/pin"
      method: "POST"
      handler: "api_toggle_pin"
      response_type: "json"
      description: "Toggle pin status of a message"
