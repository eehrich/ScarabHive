<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debate Forum</title>
    <link rel="stylesheet" href="static/panel.css">
</head>
<body>
    <!-- Header -->
    <header class="forum-header">
        <div class="header-left">
            <span class="header-icon">💬</span>
            <h1>Debate Forum</h1>
        </div>
        <div class="header-stats" id="stats-bar">
            <span class="stat" id="stat-active" title="Active channels">🟢 <span>0</span></span>
            <span class="stat" id="stat-concluded" title="Concluded">✅ <span>0</span></span>
            <span class="stat" id="stat-archived" title="Archived">📦 <span>0</span></span>
            <span class="stat" id="stat-messages" title="Total messages">💬 <span>0</span></span>
        </div>
        <div class="header-right">
            <select id="filter-group" title="Filter by group">
                <option value="">All Groups</option>
            </select>
            <select id="filter-status" title="Filter by status">
                <option value="">All Channels</option>
                <option value="active">🟢 Active</option>
                <option value="concluded">✅ Concluded</option>
                <option value="archived">📦 Archived</option>
            </select>
            <input type="text" id="filter-search" placeholder="Search..." title="Search channels">
            <button class="btn-refresh" id="btn-refresh" title="Refresh">⟳</button>
        </div>
    </header>

    <!-- Main layout: sidebar + chat area -->
    <div class="forum-container">
        <!-- Channel sidebar -->
        <aside class="channel-sidebar" id="channel-sidebar">
            <div class="sidebar-header">Channels</div>
            <div class="channel-list" id="channel-list">
                <div class="empty-state">No channels yet</div>
            </div>
        </aside>

        <!-- Chat area -->
        <main class="chat-area" id="chat-area">
            <div class="chat-placeholder" id="chat-placeholder">
                <div class="placeholder-icon">💬</div>
                <div class="placeholder-text">Select a channel to view the debate</div>
            </div>

            <!-- Channel header (hidden until selected) -->
            <div class="chat-header" id="chat-header" style="display:none">
                <div class="chat-header-info">
                    <span class="chat-channel-name" id="chat-channel-name"></span>
                    <span class="chat-channel-topic" id="chat-channel-topic"></span>
                </div>
                <div class="chat-header-actions">
                    <span class="chat-msg-count" id="chat-msg-count"></span>
                    <button class="btn-sm btn-archive" id="btn-archive" title="Archive channel">📦</button>
                </div>
            </div>

            <!-- Messages -->
            <div class="chat-messages" id="chat-messages" style="display:none"></div>

            <!-- Chat input (only for active channels) -->
            <div class="chat-input-bar" id="chat-input-bar" style="display:none">
                <input type="text" id="chat-input-name" placeholder="Name" title="Your display name" value="User">
                <input type="text" id="chat-input-role" placeholder="Role" title="Your role" value="user">
                <input type="text" id="chat-input-msg" placeholder="Type a message..." title="Message">
                <button id="btn-send" title="Send">Send</button>
            </div>

            <!-- Verdict box (shown if concluded) -->
            <div class="verdict-box" id="verdict-box" style="display:none">
                <div class="verdict-title">⚖️ Verdict</div>
                <div class="verdict-content" id="verdict-content"></div>
            </div>
        </main>

        <!-- Participants sidebar (right) -->
        <aside class="participants-sidebar" id="participants-sidebar" style="display:none">
            <div class="sidebar-header">Participants</div>
            <div class="participants-list" id="participants-list"></div>
        </aside>
    </div>

    <script src="static/panel.js"></script>
</body>
</html>
