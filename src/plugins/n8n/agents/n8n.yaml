# n8n: the tool instance and the agent that builds workflows with it.
#
# N8N_BASE_URL, N8N_API_KEY and N8N_MCP_KEY come from config/secrets.env
# (docs/deploy/README.md). Without them the instance offers no tools, so an
# installation without n8n loses nothing by this being enabled.
plugins:
  servers:

    n8n:
      type: n8n
      enabled: true
      description: "n8n: find nodes, validate, create and test workflows through n8n's instance MCP, under ScarabHive's policy"
      managed_tag: scarabhive
      # Test runs pin every node that could act outside the execution. These
      # two lists are the operator's exceptions (docs/design.md §3.3, §8.4).
      allowed_hosts: []
      live_node_types: []
      # The builder publishes, takes offline and archives when the user asks
      # (design E4); false leaves it only triggering. A trigger's wake waits this long.
      allow_publish: true
      watch_max_hours: 24
      tested_n8n_version: "2.39.9"

    # The builder's memory across sessions: the user, their projects, what
    # failed. Its own sandbox, so it never writes into another agent's bundle.
    n8n_okf:
      type: okf
      enabled: true
      description: "n8n builder: what it remembers about the user and their projects (OKF bundle)"
      allowed_directories:
        - data/okf/n8n
      hook_max_concepts: 6
      hook_graph_depth: 1

    n8n_agent:
      type: multi_turn_agent
      enabled: true
      description: "Build an n8n workflow from a request and prove it runs: finds the nodes, validates, creates a draft and test-runs it with outside calls mocked; publishes and runs it when asked"

      self_tool_descriptions:
        n8n_agent_execute_task: "Build an n8n workflow for a request and prove it with a test run; returns the workflow id, the editor link, what ran live, what was mocked, and what the user still has to do"
        n8n_agent_list_available_tools: "List the n8n tools the workflow builder uses"

      agent_config:
        # Structured building work; the fallback is the same model over the
        # direct DeepSeek API, so an OpenRouter outage does not stop it.
        llm_profile: [structured, deepseek-chat]
        llm_profile_advanced: []
        llm_params:
          "*":
            prompt_cache_mode: multi_turn
        max_steps: 60
        system_template: "./prompts/n8n_agent.md"
        template_vars:
          # Written once here: the prompt renders it, the hook below reads the same path.
          okf_bundle: "data/okf/n8n"

        skills:
          always: []
          on_demand: ["n8n-building", "n8n-testing", "n8n-recipes"]

        tools:
          # Explicit list, "+" to merge with what multi_turn_agent brings.
          # The last four act for real; the prompt allows them only when the
          # user asked, the tools check what they can (design §3.4).
          allowed:
            - "+n8n/n8n_search_nodes"
            - "+n8n/n8n_get_node_types"
            - "+n8n/n8n_explore_node_resources"
            - "+n8n/n8n_get_best_practices"
            - "+n8n/n8n_get_sdk_reference"
            - "+n8n/n8n_list_credentials"
            - "+n8n/n8n_validate_node_config"
            - "+n8n/n8n_validate_workflow"
            - "+n8n/n8n_create_workflow"
            - "+n8n/n8n_update_workflow"
            - "+n8n/n8n_get_workflow"
            - "+n8n/n8n_list_workflows"
            - "+n8n/n8n_test_workflow"
            - "+n8n/n8n_get_execution"
            - "+n8n/n8n_list_executions"
            - "+n8n/n8n_publish_workflow"
            - "+n8n/n8n_unpublish_workflow"
            - "+n8n/n8n_archive_workflow"
            - "+n8n/n8n_trigger_workflow"
            - "+skills/*"
            - "+n8n_okf/*"
            - "+tavily_search/*"            # the web: a service's API, an error message n8n does not explain

        hooks:
          enabled: true
          overrides:
            # Node definitions and execution data are large.
            context_engineer.engineer_context:
              enabled: true
            # Folds in what the user's message is about: the lexical hit and
            # its linked concepts. Without hook_bundle it does nothing, silently.
            n8n_okf.okf_context_injection:
              enabled: true
              hook_bundle: data/okf/n8n

      metadata:
        author: "Enrico Ehrich"
        version: "0.1.0"
        tags: ["n8n", "workflow", "automation"]
        category: "automation"
        visibility: "both"
