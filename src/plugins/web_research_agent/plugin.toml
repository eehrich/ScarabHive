# web_research_agent plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "web_research_agent"
version = "0.1.0"
description = "Specialized web research agent combining DuckDuckGo search with web scraping capabilities"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["mcp-server"]
category = "tools"
requires = { agent_system = ">=0.6.0" }
