tools:
  - type: function
    function:
      name: "{{ name }}_web_research"
      description: "Advanced multi-source web research - automatically searches, scrapes, and synthesizes information from multiple websites into comprehensive reports with source citations. Superior to basic search for complex topics."
      parameters:
        type: object
        properties:
          topic:
            type: string
            description: "The topic to research"
          source_urls:
            type: array
            items:
              type: string
            description: "Optional: specific URLs to include in research"
          max_results:
            type: integer
            default: 5
            description: "Maximum number of results to return"
        required: ["topic"]

  - type: function
    function:
      name: "{{ name }}_fact_check"
      description: "Professional fact-checking service - searches authoritative sources, analyzes evidence, and provides verification status (True/False/Partially True) with detailed supporting evidence and source credibility assessment"
      parameters:
        type: object
        properties:
          claim:
            type: string
            description: "The claim to verify"
          source_urls:
            type: array
            items:
              type: string
            description: "Optional: specific URLs to check against"
          max_results:
            type: integer
            default: 5
            description: "Maximum number of sources to check"
        required: ["claim"]

  - type: function
    function:
      name: "{{ name }}_source_analysis"
      description: "Expert source analysis - compares information across multiple websites, identifies contradictions, assesses source reliability, and provides balanced perspective analysis. Essential for controversial or complex topics."
      parameters:
        type: object
        properties:
          topic:
            type: string
            description: "The topic to compare sources for"
          source_urls:
            type: array
            items:
              type: string
            description: "Specific URLs to compare"
          max_results:
            type: integer
            default: 5
            description: "Maximum number of sources to compare"
        required: ["topic"]

  - type: function
    function:
      name: "{{ name }}_research_assistant"
      description: "AI-powered research assistant - intelligently selects the most relevant sources, performs deep analysis, and synthesizes findings into actionable insights. Perfect for research tasks requiring judgment and context understanding."
      parameters:
        type: object
        properties:
          task:
            type: string
            description: "The research task or query to perform"
          max_results:
            type: integer
            default: 5
            description: "Maximum number of results to return"
        required: ["task"]
