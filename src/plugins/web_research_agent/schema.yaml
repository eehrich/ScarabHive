tools:
  - type: function
    function:
      name: research
      description: "Comprehensive topic research with multiple sources"
      parameters:
        type: object
        properties:
          topic:
            type: string
            description: "The topic to research"
          source_urls:
            type: array
            items:
              type: string
            description: "Optional: specific URLs to include in research"
          max_results:
            type: integer
            default: 5
            description: "Maximum number of results to return"
        required: ["topic"]

  - type: function
    function:
      name: fact_check
      description: "Verify claims against multiple reliable sources"
      parameters:
        type: object
        properties:
          claim:
            type: string
            description: "The claim to verify"
          source_urls:
            type: array
            items:
              type: string
            description: "Optional: specific URLs to check against"
          max_results:
            type: integer
            default: 5
            description: "Maximum number of sources to check"
        required: ["claim"]

  - type: function
    function:
      name: compare_sources
      description: "Compare information across multiple sources for a topic"
      parameters:
        type: object
        properties:
          topic:
            type: string
            description: "The topic to compare sources for"
          source_urls:
            type: array
            items:
              type: string
            description: "Specific URLs to compare"
          max_results:
            type: integer
            default: 5
            description: "Maximum number of sources to compare"
        required: ["topic"]

  - type: function
    function:
      name: ask
      description: "General research query with intelligent source selection"
      parameters:
        type: object
        properties:
          task:
            type: string
            description: "The research task or query to perform"
          max_results:
            type: integer
            default: 5
            description: "Maximum number of results to return"
        required: ["task"]
