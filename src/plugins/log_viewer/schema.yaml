tools:
  - type: function
    function:
      name: "{{ name }}_list"
      description: List all available log files in the configured log directory.
      parameters:
        type: object
        properties: {}
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_tail"
      description: Get the most recent lines from a specified log file.
      parameters:
        type: object
        properties:
          log_file:
            type: string
            description: "Log file path"
          lines:
            type: integer
            default: 500
            description: "Number of recent lines to retrieve"
        required: ["log_file"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_search"
      description: Search log files for patterns with regex support.
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: "Search pattern (regex supported)"
          log_file:
            type: string
            description: "Specific log file to search (optional)"
          max_results:
            type: integer
            default: 100
            description: "Maximum number of results (default: 100)"
        required: ["pattern"]
        additionalProperties: false

# Web UI configuration
web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Logs"
    description: "Application logs with filtering and live polling"
    icon: file-text
    category: debug
    keywords: [logs, errors, api]
    window: {width: 1000, height: 680}

  endpoints:
    - path: "/"
      method: "GET"
      handler: "get_panel"
      response_type: "html"
      description: "The Logs panel"

    - path: "/logs/list"
      method: "GET"
      handler: "list_log_files"
      response_type: "json"
      description: "The configured log files, with size and rotations of those that exist"

    - path: "/logs/content/{log_name:path}"
      method: "GET"
      handler: "get_log_content"
      response_type: "json"
      description: "The last entries of a configured log file and its rotations (lines, levels, search)"
config:
  log_files:
    - logs/api.log
    - logs/cli.log
