tools:
  - type: function
    function:
      name: "{{ name }}_list"
      description: List all available log files in the configured log directory.
      parameters:
        type: object
        properties: {}
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_tail"
      description: Get the most recent lines from a specified log file.
      parameters:
        type: object
        properties:
          log_file:
            type: string
            description: "Log file path"
          lines:
            type: integer
            default: 500
            description: "Number of recent lines to retrieve"
        required: ["log_file"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_search"
      description: Search log files for patterns with regex support.
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: "Search pattern (regex supported)"
          log_file:
            type: string
            description: "Specific log file to search (optional)"
          max_results:
            type: integer
            default: 100
            description: "Maximum number of results (default: 100)"
        required: ["pattern"]
        additionalProperties: false

# Web UI configuration
web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Logs"
    description: "Application logs with filtering and live polling"
    icon: file-text
    category: debug
    keywords: [logs, errors, api]
    window: {width: 1000, height: 680}

  endpoints:
    - path: "/"
      method: "GET"
      handler: "panel"
      response_type: "html"
      description: "Main log viewer UI panel"
    
    - path: "/logs/list"
      method: "GET"
      handler: "list_log_files"
      response_type: "json"
      description: "List available log files with metadata"
    
    - path: "/logs/content/{log_name:path}"
      method: "GET"
      handler: "get_log_content"
      response_type: "json"
      description: "Get log file content with optional timestamp filtering (avoids infinite loops)"
    
    - path: "/logs/download/{log_name:path}"
      method: "GET"
      handler: "download_log_file"
      response_type: "response"
      description: "Download entire log file"
    
    - path: "/logs/poll/{log_name:path}"
      method: "GET"
      handler: "poll_log_updates"
      response_type: "json"
      description: "Poll for log updates since last timestamp (non-streaming approach)"
    
    - path: "/panel.html"
      method: "GET"
      handler: "panel_html"
      response_type: "html"
      description: "Main log viewer UI panel"
    
    - path: "/panel"
      method: "GET"
      handler: "panel"
      response_type: "html"
      description: "Main log viewer UI panel (alternate endpoint)"
    
    - path: "/static/{file_path:path}"
      method: "GET"
      handler: "serve_static"
      response_type: "response"
      description: "Static assets (CSS, JS, images)"
config:
  log_files:
    - logs/api.log
    - logs/cli.log
  max_lines: 20
  refresh_interval: 1.0
