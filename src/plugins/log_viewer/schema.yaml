tools:
  - type: function
    function:
      name: "{{ name }}_list"
      description: List the configured log files, with size and last change of those that exist.
      parameters:
        type: object
        properties: {}
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_tail"
      description: Get the most recent lines of one configured log file (the file itself, not its rotations).
      parameters:
        type: object
        properties:
          log_file:
            type: string
            description: "A configured log file, exactly as {{ name }}_list names it (e.g. logs/api.log)"
          lines:
            type: integer
            default: 500
            description: "How many of the newest lines to return, at least 1 (default 500)"
        required: ["log_file"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_search"
      description: Search the configured log files line by line for a regular expression (case-insensitive).
      parameters:
        type: object
        properties:
          pattern:
            type: string
            description: "Python regular expression, matched against each line, case-insensitive"
          log_file:
            type: string
            description: "One configured log file, exactly as {{ name }}_list names it; without it every configured file is searched"
          max_results:
            type: integer
            default: 100
            description: "Stop after this many matching lines, at least 1 (default 100)"
        required: ["pattern"]
        additionalProperties: false

# Web UI configuration
web_ui:
  # The panel's catalogue entry: launcher, command palette and chat links read it
  # (agent_system/ui/catalog.py lists the fields and categories).
  panel:
    endpoint: "/plugins/{{ name }}/"
    title: "Logs"
    description: "Application logs with filtering and live polling"
    icon: file-text
    category: debug
    keywords: [logs, errors, api]
    window: {width: 1000, height: 680}

  endpoints:
    - path: "/"
      method: "GET"
      handler: "get_panel"
      response_type: "html"
      description: "The Logs panel"

    - path: "/logs/list"
      method: "GET"
      handler: "list_log_files"
      response_type: "json"
      description: "The configured log files, with size and rotations of those that exist"

    - path: "/logs/content/{log_name:path}"
      method: "GET"
      handler: "get_log_content"
      response_type: "json"
      description: "The last entries of a configured log file and its rotations (lines, levels, search)"
config:
  log_files:
    - logs/api.log
    - logs/cli.log
    - logs/profiling.log
    - logs/security.log
