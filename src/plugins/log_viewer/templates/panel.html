{% extends "kit/panel_base.html" %}
{% from "kit/macros.html" import icon %}
{% block title %}Logs{% endblock %}
{% block head %}<link rel="stylesheet" href="/plugins/{{ plugin }}/static/panel.css">{% endblock %}
{% block toolbar %}<span class="pk-muted lv-small" id="updated"></span><pk-refresh interval="5"></pk-refresh>{% endblock %}
{% block content %}
<div class="pk-row">
  <select id="file" class="pk-select pk-select--sm lv-file" aria-label="Log file"></select>
  <label class="pk-search lv-search">{{ icon('search') }}<input id="search" class="pk-input pk-input--sm" type="search" placeholder="Search" aria-label="Search"></label>
  <select id="lines" class="pk-select pk-select--sm lv-lines" aria-label="Entries">
    <option value="100">Last 100</option>
    <option value="250">Last 250</option>
    <option value="500" selected>Last 500</option>
    <option value="1000">Last 1000</option>
    <option value="5000">Last 5000</option>
  </select>
  <div class="pk-row lv-levels" role="group" aria-label="Levels">
    <button type="button" class="pk-btn pk-btn--sm" data-level="error" aria-pressed="true" title="Error and critical">Error</button>
    <button type="button" class="pk-btn pk-btn--sm" data-level="warning" aria-pressed="true">Warning</button>
    <button type="button" class="pk-btn pk-btn--sm" data-level="info" aria-pressed="true">Info</button>
    <button type="button" class="pk-btn pk-btn--sm" data-level="debug" aria-pressed="true">Debug</button>
  </div>
  <button type="button" id="follow" class="pk-btn pk-btn--ghost pk-btn--sm" aria-pressed="true" title="Keep the newest entry in view">{{ icon('arrow-down', size='sm') }} Follow</button>
  <span class="pk-muted lv-small" id="shown"></span>
</div>
<div id="log" class="lv-log"><span class="pk-skeleton"></span></div>
{% endblock %}
{% block scripts %}<script type="module" src="/plugins/{{ plugin }}/static/panel.js"></script>{% endblock %}
