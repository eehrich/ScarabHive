tools:
  - type: function
    function:
      name: "{{ name }}_operations"
      description: Date and time operations.
      parameters:
        type: object
        properties:
          operation:
            type: string
            enum: [current, format, parse, add_time, subtract_time, convert_timezone, to_timestamp, calendar_info, business_days, day_of_week, days_until]
            description: "Date/time operation: current=now, format=custom format, add_time=add duration, convert_timezone=timezone conversion"
          timezone:
            type: string
            description: "Timezone (e.g., 'UTC', 'Europe/Berlin', 'America/New_York')"
          format:
            type: string
            description: "Output format ('iso', 'human', 'date_only', 'time_only' or a strftime pattern)"
          datetime:
            type: string
            description: "Input date/time, ISO 8601 (parse/format: also Unix timestamp)"
          input_format:
            type: string
            description: "strptime pattern of datetime (format only)"
          years:
            type: integer
            description: "Years to add/subtract"
          months:
            type: integer
            description: "Months to add/subtract"
          days:
            type: integer
            description: "Days to add/subtract; business_days: business days to add"
          hours:
            type: integer
            description: "Hours to add/subtract"
          minutes:
            type: integer
            description: "Minutes to add/subtract"
          seconds:
            type: integer
            description: "Seconds to add/subtract"
          target_date:
            type: string
            description: "End date for days_until and business_days"
        required: [operation]
        additionalProperties: false