# openai_api plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "openai_api"
version = "0.1.0"
description = "OpenAI-compatible Responses and Chat Completions API: every agent is a model under /plugins/<name>/v1"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["web"]
category = "integration"
requires = { agent_system = ">=0.7.0" }
dependencies = ["anyio>=4.0"]  # the shielded stop (turns.py); Starlette brings it, declared all the same
