hooks:
  - name: inject_active_sessions
    type: pre_llm_call
    enabled: false # default is disabled
    timeout: 5.0
    description: "Inject active sessions into system prompt"
    category: "prompt_injection"
    order:
      after: ["context_optimization"]
      before: ["message_validation"]

config:
  max_thoughts_in_prompt:
    type: integer
    default: 5
    description: "Recent thoughts per session in system prompt"
    minimum: 1
    maximum: 20
  
  max_sessions_in_prompt:
    type: integer
    default: 1
    description: "Active sessions in prompt (most recent first)"
    minimum: 1
    maximum: 5
  
  show_branch_info:
    type: boolean
    default: true
    description: "Show branch information"
  
  show_relative_timestamps:
    type: boolean
    default: true
    description: "Relative timestamps ('2m ago' vs absolute)"
  
  show_quick_actions:
    type: boolean
    default: true
    description: "Show action hints"
  
  format:
    type: string
    default: "markdown"
    description: "Injection format: markdown or text"

tools:
  - type: function
    function:
      name: "{{ name }}"
      description: |
        Step-by-step reasoning for complex problems. Dynamic thought chains with branching/revision.
        
        QUICK START: Set total_thoughts=15-20 for complex tasks, 10 for medium, 5 for simple.
        Use needs_more_thoughts=true if you need more (avoids warnings).
        
        KEY PARAMS:
        - thought: Your reasoning step
        - next_thought_needed: false=done
        - thought_number: Your counter (server assigns real sequence)
        - total_thoughts: Estimate (auto-clamped)
        - needs_more_thoughts: true=increase estimate without warning
        - is_revision: Revise earlier thought (+ revises_thought=N)
        - branch_from_thought/branch_id: Create/switch exploration paths
      parameters:
        type: object
        properties:
          thought:
            type: string
            minLength: 1
            maxLength: 10000
            description: "Current thinking step"
          next_thought_needed:
            type: boolean
            description: "Continue? false=done"
          thought_number:
            type: integer
            minimum: 1
            description: "Your counter (server assigns real sequence)"
          total_thoughts:
            type: integer
            minimum: 1
            description: "Estimate total (15-20 complex, 10 medium, 5 simple). Auto-clamped if exceeded."
          session_id:
            type: string
            description: "Session ID (auto-generated if omitted)"
          is_revision:
            type: boolean
            default: false
            description: "Revise previous thought?"
          revises_thought:
            type: integer
            minimum: 1
            description: "Which thought # to revise (if is_revision=true)"
          branch_from_thought:
            type: integer
            minimum: 1
            description: "Start branch from thought #"
          branch_id:
            type: string
            maxLength: 100
            description: "Branch name (create: set both branch_from+branch_id, switch: branch_id only)"
          needs_more_thoughts:
            type: boolean
            default: false
            description: "Increase estimate without warnings"
          idempotency_key:
            type: string
            maxLength: 200
            description: "UUID/hash for retry protection"
        required: ["thought", "next_thought_needed", "thought_number", "total_thoughts"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_clear_history"
      description: "Clear session(s). Omit session_id for all."
      parameters:
        type: object
        properties:
          session_id:
            type: string
            description: "Session to clear (omit for all)"
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_get_summary"
      description: "Get session summary with thoughts, branches, stats."
      parameters:
        type: object
        properties:
          session_id:
            type: string
            description: "Session to summarize"
          max_thoughts:
            type: integer
            minimum: 1
            maximum: {{ max_history_size }}
            default: 10
            description: "Thoughts in summary"
          include_branches:
            type: boolean
            default: true
            description: "Include branch tree"
        required: ["session_id"]
        additionalProperties: false
