# sequential_thinking plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "sequential_thinking"
version = "1.0.0"
description = "Step-by-step reasoning tool with branching and revision support for complex problem-solving"
author = "Enrico Ehrich"
entrypoint = "server:SequentialThinkingServer"
type = ["mcp-server"]
category = "reasoning"
requires = { agent_system = ">=0.6.0" }
