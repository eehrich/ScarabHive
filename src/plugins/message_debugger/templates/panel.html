<div class="message-debugger-panel">
    <link rel="stylesheet" href="/plugins/message_debugger/static/panel.css">
    
    <div class="debugger-header">
        <div class="debugger-title">🐛 Message Debugger</div>
        <div class="debugger-controls">
            <button class="debugger-btn" onclick="messageDebugger.refresh()" title="Refresh">
                🔄
            </button>
            <button class="debugger-btn danger" onclick="messageDebugger.clearHistory()" title="Clear History">
                🗑️
            </button>
            <button class="debugger-btn active" id="auto-refresh-btn" onclick="messageDebugger.toggleAutoRefresh()" title="Auto-Refresh (5s) - Active">
                ⏱️
            </button>
        </div>
    </div>
    
    <div class="debugger-stats" id="stats-container">
        <!-- Stats will be populated by JavaScript -->
    </div>
    
    <div class="debugger-filters">
        <div class="filter-group">
            <label class="filter-label">Agent Name</label>
            <select class="filter-input" id="filter-agent" onchange="messageDebugger.applyFilters()">
                <option value="">All Agents</option>
            </select>
        </div>
        <div class="filter-group">
            <label class="filter-label">Session ID</label>
            <select class="filter-input" id="filter-session" onchange="messageDebugger.applyFilters()">
                <option value="">All Sessions</option>
            </select>
        </div>
        <div class="filter-group">
            <label class="filter-label">Max Results</label>
            <input type="number" class="filter-input" id="filter-limit" value="50" min="1" max="500" onchange="messageDebugger.applyFilters()">
        </div>
    </div>
    
    <div class="snapshots-list" id="snapshots-container">
        <div class="loading">
            <div class="spinner"></div>
            <div>Loading message snapshots...</div>
        </div>
    </div>
    
    <script src="/plugins/message_debugger/static/panel.js"></script>
</div>
