<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Message Debugger panel tests</title>
  <style>body { margin: 0; } iframe { width: 1100px; height: 800px; border: 0; }</style>
</head>
<body>
<iframe id="panel" title="panel"></iframe>
<script type="module">
  // The real panel against the real plugin, driven from outside: same origin, so this page reaches into it.
  const results = {};
  const check = async (name, fn) => {
    try { results[name] = (await fn()) === true ? 'ok' : 'failed'; }
    catch (error) { results[name] = `error: ${error && error.message}`; }
  };
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  async function until(what, predicate, timeout = 10000) {
    const end = performance.now() + timeout;
    for (;;) {
      let value = null;
      try { value = await predicate(); } catch { /* not there yet */ }
      if (value) return value;
      if (performance.now() > end) throw new Error(`timed out waiting for ${what}`);
      await sleep(30);
    }
  }

  const frame = document.getElementById('panel');
  const doc = () => frame.contentDocument;
  const $ = (selector) => doc().querySelector(selector);
  const rows = (tab) => [...doc().querySelectorAll(`#${tab} tr[data-id]`)];
  const requestIds = (tab) => rows(tab).map((row) => row.lastElementChild.title);
  const underR1 = (id) => id === 'r-1' || id.startsWith('r-1_');
  const titled = (prefix) => $('#detailTitle').textContent.startsWith(prefix);
  /** Type into a filter field; the panel waits 300 ms for more typing before it asks again. */
  const type = (id, value) => {
    $(id).value = value;
    $(id).dispatchEvent(new Event('input'));
  };
  const choose = (id, value) => {
    $(id).value = value;
    $(id).dispatchEvent(new Event('change'));
  };
  const question = () => doc().querySelector('dialog.pk-dialog[open]:not(#detail)');
  const stats = async () => (await fetch('/plugins/message_debugger/stats')).json();

  await new Promise((resolve) => { frame.onload = resolve; frame.src = '/plugins/message_debugger/?request_id=r-1'; });

  await check('opened for a request, both lists show that request and the calls under it, and their tabs count them', async () => {
    await until('the turns of r-1', () => rows('turns').length === 5);
    const turns = requestIds('turns');
    // a call under the request shows where it hangs, and the session a sub-agent runs in
    const subAgent = rows('turns').find((row) => row.lastElementChild.title === 'r-1_sub_ab12');
    const shownUnder = subAgent.lastElementChild.textContent === 'r-1_sub_ab12'
      && subAgent.querySelector('td[title="s-sub"]')?.textContent === 's-sub';
    await until('the count on the other tab', () => $('#requestsCount').textContent === '4');
    const counted = $('#turnsCount').textContent === '5';
    $('[data-tab="requests"]').click();
    await until('the entries of r-1', () => rows('requests').length === 4);
    const entries = requestIds('requests');
    $('[data-tab="turns"]').click();
    return turns.every(underR1) && turns.includes('r-1_001') && turns.includes('r-1_sub_ab12') && counted && shownUnder
      && entries.every(underR1) && entries.includes('r-1_sub_ab12') && $('#filterRequest').value === 'r-1';
  });

  await check('the lists sort by a column, by value and not by the text shown, and keep that order when drawn anew', async () => {
    const headOf = (tab, text) => [...doc().querySelectorAll(`#${tab} th`)].find((th) => th.textContent.trim() === text);
    const tokens = () => rows('turns').map((row) => row.children[5].textContent).join('|');
    const biggestFirst = `${Number(12000).toLocaleString()}|${Number(900).toLocaleString()}|0|0|0`;
    const newest = requestIds('turns').join();
    const marked = headOf('turns', 'Time').getAttribute('aria-sort') === 'descending';
    headOf('turns', 'Tokens').click();  // biggest first: as text, "900" would come before "12,000"
    const byTokens = tokens() === biggestFirst;
    const before = $('#turns table');
    type('#filterRequest', 'r-1_001');
    await until('one request', () => rows('turns').length === 1);
    type('#filterRequest', 'r-1');
    await until('r-1 drawn anew', () => rows('turns').length === 5 && $('#turns table') !== before);
    const kept = tokens() === biggestFirst && headOf('turns', 'Tokens').getAttribute('aria-sort') === 'descending';
    headOf('turns', 'Type').click();  // A to Z as shown: input before output
    const types = rows('turns').map((row) => row.children[1].textContent.trim());
    const inputFirst = types[0] === 'input' && types.at(-1) === 'output' && types.join() === [...types].sort().join();
    headOf('turns', 'Time').click();
    headOf('turns', 'Time').click();  // newest first again, as the drawer checks after this one expect
    // the raw requests sort too: Z to A puts writer before the helper, the newest entry
    $('[data-tab="requests"]').click();
    await until('the entries of r-1', () => rows('requests').length === 4);
    const agents = () => rows('requests').map((row) => row.children[2].textContent).join();
    const helperFirst = agents() === 'helper,writer,writer,writer';
    headOf('requests', 'Agent').click();
    headOf('requests', 'Agent').click();
    const writerFirst = agents() === 'writer,writer,writer,helper';
    headOf('requests', 'Time').click();
    headOf('requests', 'Time').click();
    $('[data-tab="turns"]').click();
    const restored = requestIds('turns').join() === newest && agents() === 'helper,writer,writer,writer';
    const got = { marked, byTokens, kept, inputFirst, restored, helperFirst, writerFirst };
    if (!Object.values(got).every(Boolean)) throw new Error(`${JSON.stringify(got)} tokens=${tokens()} agents=${agents()}`);
    return true;
  });

  await check('a turn opens in the drawer with its messages: text as text, JSON tool results and tool arguments as trees, other fields by name; the drawer scrolls below its head', async () => {
    const oldest = rows('turns').at(-1);
    oldest.click();
    const drawer = $('#detail');
    await until('the messages', () => drawer.querySelectorAll('.md-message').length === 4);
    const [, user, assistant, tool] = drawer.querySelectorAll('.md-message');
    const text = user.querySelector('pre.pk-code');
    const asText = text?.textContent === 'Write <b>chapter</b> 3.' && text.querySelector('b') === null
      && user.textContent.includes('23 chars');
    const resultTree = tool.querySelector(':scope > .pk-json')?.textContent.includes('arrival') && tool.querySelector('pre.pk-code') === null;
    const call = assistant.querySelector('.md-tool-call');
    const argumentTree = call.querySelector('.pk-json') !== null && call.textContent.includes('writer_outline');
    const badges = [...tool.querySelectorAll('.pk-badge')].map((badge) => badge.textContent.trim());
    const fields = badges.includes('served_by: gpt')
      && tool.querySelector('details.md-extra > summary')?.textContent === 'reasoning_details';
    const body = $('#detailBody');
    body.scrollTop = body.scrollHeight;
    await sleep(50);
    const scrolled = body.scrollTop > 0 && $('#detail [data-close]').getBoundingClientRect().top >= 0;
    body.scrollTop = 0;
    return drawer.open && asText && resultTree && argumentTree && fields && scrolled
      && titled(`Turn #${oldest.dataset.id} ·`) && oldest.getAttribute('aria-selected') === 'true';
  });

  await check('the drawer steps to newer and older entries and stops at the ends of the list', async () => {
    const ids = rows('turns').map((row) => row.dataset.id);  // newest first; the drawer shows the oldest
    const newer = $('#detail [data-step="-1"]');
    const older = $('#detail [data-step="1"]');
    const atOldest = older.disabled && !newer.disabled;
    for (let index = ids.length - 2; index >= 0; index -= 1) {
      newer.click();
      await until(`turn ${ids[index]}`, () => titled(`Turn #${ids[index]} ·`));
    }
    const atNewest = newer.disabled && !older.disabled;
    for (let index = 1; index <= ids.length - 2; index += 1) {
      older.click();
      await until(`turn ${ids[index]}`, () => titled(`Turn #${ids[index]} ·`));
    }
    return atOldest && atNewest && rows('turns')[ids.length - 2].getAttribute('aria-selected') === 'true';
  });

  await check('an entry that answers after one asked for later does not replace it in the drawer', async () => {
    const ids = rows('turns').map((row) => row.dataset.id);
    const shown = ids.length - 2;  // the drawer shows the turn before the oldest
    $('#detail [data-step="1"]').click();  // the oldest turn: it answers late
    await sleep(100);
    $('#detail [data-step="-1"]').click();  // back, answered at once
    await until('the turn shown before', () => titled(`Turn #${ids[shown]} ·`));
    await sleep(1800);  // the oldest turn's answer has come
    return titled(`Turn #${ids[shown]} ·`) && rows('turns')[shown].getAttribute('aria-selected') === 'true';
  });

  await check("an entry's session filter shows every request of that session", async () => {
    $('#detail [data-filter="session"]').click();  // of r-1's output turn, in s-1
    const closed = !$('#detail').open;
    await until('the turns of s-1', () => rows('turns').length === 5);
    const ids = requestIds('turns');
    return closed && $('#filterSession').value === 's-1' && $('#filterRequest').value === '' && $('#turnsCount').textContent === '5'
      && ids.includes('r-3') && ids.includes('r-1_001') && !ids.includes('r-1_sub_ab12') && !ids.includes('r-10');
  });

  await check('a slower answer for filters changed since does not replace the list', async () => {
    type('#filterSession', 's-slow');
    await sleep(600);  // past the pause typing waits for: the lists are asked for s-slow, which answers late
    type('#filterSession', 's-2');
    await until('the turn of s-2', () => rows('turns').length === 1 && requestIds('turns')[0] === 'r-2');
    await sleep(1500);  // the answer for s-slow has come
    return rows('turns').length === 1 && requestIds('turns')[0] === 'r-2';
  });

  await check('a list asked for new filters shows nothing of the old ones while it loads', async () => {
    $('[data-tab="requests"]').click();
    await until('the entry of s-2', () => rows('requests').length === 1 && $('#turnsCount').textContent === '1');
    $('[data-tab="turns"]').click();
    await until('the turn of s-2', () => rows('turns').length === 1);
    choose('#filterAgent', 'writer');  // nothing of s-2 is the writer's
    const cleared = rows('turns').length === 0 && rows('requests').length === 0
      && $('#turnsCount').textContent === '' && $('#requestsCount').textContent === '';
    await until('the empty list', () => $('#turns .pk-empty') && $('#requestsCount').textContent === '0');
    choose('#filterAgent', '');
    await until('the turn of s-2 again', () => rows('turns').length === 1);
    return cleared;
  });

  await check('a tick of the auto refresh leaves a list that is still loading alone, and the ticks after it bring what is new', async () => {
    type('#filterSession', 's-slow');  // its lists answer after 1.5 s
    await sleep(400);
    const tick = () => doc().dispatchEvent(new CustomEvent('refresh', { detail: { auto: true } }));
    const ticking = setInterval(tick, 200);
    try {
      await until('the turn of s-slow while the ticks go on', () => rows('turns').length === 1 && requestIds('turns')[0] === 'r-slow', 4000);
      const turns = (await stats()).total_turns;
      await fetch('/__stub/turn?session_id=s-slow', { method: 'POST' });
      await until('the new turn, brought by a tick', () => rows('turns').length === 2, 6000);
      await until('the new count, brought by a tick', () => $('#stats .pk-stat-value')?.textContent === String(turns + 1), 3000);
      return true;
    } finally {
      clearInterval(ticking);
    }
  });

  await check('more entries load a page at a time, also when a refresh comes in between, and a refresh keeps as many as are wanted; an entry gone meanwhile is named in the drawer', async () => {
    type('#filterSession', '');
    await until('every turn', () => $('#turnsCount').textContent === '130');
    await until('the agent choices', () => [...$('#filterAgent').options].some((option) => option.value === 'bulk'));
    choose('#filterAgent', 'bulk');
    await until('a page of bulk turns', () => $('#turns .md-footer')?.textContent.includes('50 of 120'));
    const firstPage = rows('turns').length === 50;
    $('#turns [data-more]').click();
    $('pk-refresh [data-act="now"]').click();  // before the page has come
    await until('a page more', () => $('#turns .md-footer')?.textContent.includes('100 of 120'));
    const secondPage = rows('turns').length === 100;
    $('#turns [data-more]').click();
    await until('every bulk turn', () => rows('turns').length === 120);
    const noMore = $('#turns [data-more]') === null;
    await fetch('/__stub/turn', { method: 'POST' });
    $('pk-refresh [data-act="now"]').click();
    await until('the refresh', () => $('#turns .md-footer')?.textContent.includes('121 of 121'));
    const kept = rows('turns').length === 121 && requestIds('turns')[0] === 'r-bulk-new'
      && new Set(rows('turns').map((row) => row.dataset.id)).size === 121;
    // the oldest bulk turn is gone: a step to it names it, not the turn shown before
    const [beforeOldest, oldest] = rows('turns').slice(-2);
    beforeOldest.click();
    await until('the turn before the oldest', () => titled(`Turn #${beforeOldest.dataset.id} ·`));
    $('#detail [data-step="1"]').click();
    await until('the gone turn', () => $('#detailBody').textContent.includes('not found'));
    const named = $('#detailTitle').textContent === `Turn #${oldest.dataset.id}`;
    $('#detail [data-close]').click();
    return firstPage && secondPage && noMore && kept && named;
  });

  await check('with the refresh paused, an entry captured since shows only once the viewer refreshes -- not on a tab switch or a filter change, and a list asked for while a refresh is on its way does not undo it', async () => {
    // the bulk turns of the check before, all 121 of them; the auto refresh is off, as a page starts without a choice
    const paused = $('pk-refresh [data-act="auto"]').getAttribute('aria-pressed') === 'false';
    const answered = async () => (await (await fetch('/__stub/answered')).json()).turns;
    /** Let the panel ask for its turns, and wait until that answer is in and drawn. */
    const asked = async (what, act) => {
      const before = await answered();
      act();
      await until(what, async () => (await answered()) > before);
      await sleep(150);
    };
    const seen = () => `${$('#turns .md-footer')?.textContent.replace(/\s+/g, ' ').trim()} / ${rows('turns').length} rows`;
    await fetch('/__stub/turn', { method: 'POST' });  // a second r-bulk-new
    await asked('the turns after a tab switch', () => {
      $('[data-tab="requests"]').click();
      $('[data-tab="turns"]').click();
    });
    const tabSwitch = seen();
    await asked('the turns of one request', () => type('#filterRequest', 'r-bulk-new'));
    const filtered = seen();
    await asked('every bulk turn again', () => type('#filterRequest', ''));  // a new filter starts on the first page
    const unfiltered = seen();
    $('pk-refresh [data-act="now"]').click();
    await until('the refresh', () => $('#turns .md-footer')?.textContent.includes('50 of 122'));
    // s-slow answers late: a tab switch right after a refresh asks again before the refresh has answered
    choose('#filterAgent', '');
    type('#filterSession', 's-slow');
    await until('the turns of s-slow', () => seen() === '2 of 2 / 2 rows');
    await fetch('/__stub/turn?session_id=s-slow', { method: 'POST' });
    const before = await answered();
    $('pk-refresh [data-act="now"]').click();
    $('[data-tab="requests"]').click();
    $('[data-tab="turns"]').click();
    await until('the answers to the refresh and the tab switch', async () => (await answered()) >= before + 2, 6000);
    await sleep(150);
    const overtaken = seen();
    type('#filterSession', '');
    const expected = ['121 of 121 / 121 rows', '1 of 1 / 1 rows', '50 of 121 Load more / 50 rows', '3 of 3 / 3 rows'];
    const got = [tabSwitch, filtered, unfiltered, overtaken];
    if (!paused || got.join() !== expected.join()) throw new Error(`paused=${paused}, saw ${got.join(' | ')}`);
    return true;
  });

  await check('the retry of a request shows its attempt and reason, and its entry opens with its error', async () => {
    choose('#filterAgent', '');
    type('#filterRequest', 'r-1');
    await until('the turns of r-1', () => $('#turnsCount').textContent === '5');
    $('[data-tab="requests"]').click();
    await until('the entries of r-1', () => $('#requestsCount').textContent === '4' && rows('requests').length === 4);
    const retry = rows('requests').find((row) => row.textContent.includes('retry 1/3'));
    const reason = retry.querySelector('.md-reason')?.textContent === 'rate limited';
    retry.click();
    await until('its error', () => $('#detail .md-error-text')?.textContent === '[RETRY 1/3] rate limited');
    const title = titled(`Response #${retry.dataset.id} ·`);
    $('#detail [data-close]').click();
    return reason && title && !$('#detail').open;
  });

  await check('a response names the backend that served it, in the list and in the drawer', async () => {
    const served = rows('requests').filter((row) => row.querySelector('.md-served-by'));
    const inList = served.length === 1 && served[0].querySelector('.md-served-by').textContent === 'via Google AI Studio';
    served[0].click();
    await until('its drawer', () => titled(`Response #${served[0].dataset.id} ·`));
    const facts = [...$('#detailBody dl.pk-kv').children].map((cell) => cell.textContent);
    const inDrawer = facts[facts.indexOf('Served by') + 1] === 'Google AI Studio';
    $('#detail [data-close]').click();
    return inList && inDrawer;
  });

  /** Choose an action from the panel's menu; resolves with the question it asks. */
  const ask = async (action) => {
    $('#actionsButton').click();
    await until('the menu', () => $('#actions').matches(':popover-open'));
    $(`#actions [data-action="${action}"]`).click();
    return until('the question', question);
  };
  let pruned = 0;
  const originalFetch = frame.contentWindow.fetch.bind(frame.contentWindow);
  frame.contentWindow.fetch = (input, init) => {
    if (String(input).includes('/plugins/message_debugger/prune')) pruned += 1;
    return originalFetch(input, init);
  };

  await check('clearing asks first and, confirmed, empties the lists', async () => {
    let asked = await ask('clear');
    const titledQuestion = asked.textContent.includes('Clear all captured data');
    asked.querySelector('[data-index="0"]').click();  // Cancel
    await sleep(500);
    const kept = (await stats()).total_turns > 0;
    asked = await ask('clear');
    asked.querySelector('[data-index="1"]').click();
    await until('the emptied lists', () => $('#requests .pk-empty') && $('#requestsCount').textContent === '0');
    // with no filter left the list says nothing was captured, not that nothing matches
    type('#filterRequest', '');
    await until('the list without filters', () => $('#requests .pk-empty-title')?.textContent === 'No LLM requests captured yet');
    return titledQuestion && kept && (await stats()).total_turns === 0 && $('#turnsCount').textContent === '0';
  });

  await check('pruning asks first and, confirmed, tells what it did, a compacted file included, and shows the lists as they are now', async () => {
    let asked = await ask('prune');
    const titledQuestion = asked.textContent.includes('Prune the database');
    asked.querySelector('[data-index="0"]').click();  // Cancel
    await sleep(500);
    const notYet = pruned === 0;
    // a turn captured since the lists were drawn: the paused lists leave it out until they start over
    await fetch('/__stub/turn', { method: 'POST' });
    asked = await ask('prune');
    asked.querySelector('[data-index="1"]').click();
    // the clear has freed the pages: the report stays until it is read
    const report = await until('the report', () => question()?.textContent.includes('Database pruned') && question());
    const told = report.textContent.includes('Stripped 0 payloads, dropped 0 turns') && report.textContent.includes('The file was compacted');
    report.querySelector('[data-index="0"]').click();
    await until('the turns counted as they are now', () => $('#turnsCount').textContent === '1');
    return titledQuestion && notYet && pruned === 1 && told && !$('#actionsButton').disabled;
  });

  await check("an admin has the user filter, the maintenance menu and the file's size; a user has none of them and sees their own captures only", async () => {
    const labels = () => [...doc().querySelectorAll('#stats .pk-stat-label')].map((label) => label.textContent);
    await fetch('/__stub/turn?user_id=alice', { method: 'POST' });
    $('#stats').replaceChildren();
    doc().dispatchEvent(new CustomEvent('refresh', { detail: { auto: false } }));
    await until("the admin's statistics", () => labels().includes('Database'));
    const adminHas = !$('#userFilter').hidden && !$('#actionsButton').hidden;
    type('#filterUser', 'alice');
    await until("the admin's view of alice", () => $('#turnsCount').textContent === '1');

    await fetch('/__stub/viewer?name=alice', { method: 'POST' });
    await new Promise((resolve) => { frame.onload = resolve; frame.src = '/plugins/message_debugger/'; });
    await until("alice's statistics", () => labels().includes('Turns'));
    await until('her one turn', () => rows('turns').length === 1);
    const userHasNone = $('#userFilter').hidden && $('#actionsButton').hidden && !labels().includes('Database');
    const ownOnly = $('#turnsCount').textContent === '1' && requestIds('turns')[0] === 'r-alice';
    return adminHas && userHasNone && ownOnly;
  });

  await fetch('/__results', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(results) });
</script>
</body>
</html>
