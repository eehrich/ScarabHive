# Hook definitions for message_debugger plugin
hooks:
  - name: debugger_capture_pre_llm
    type: pre_llm_call
    enabled: true
    timeout: 5.0
    description: "Captures LLM input messages just before sending to LLM (runs last in pre-chain)"
    category: "message_debugging"
    order:
      after: ["context_summarization", "context_optimization", "prompt_injection", "message_validation"]
      before: ["end"]
  
  - name: debugger_capture_post_llm
    type: post_llm_call
    enabled: true
    timeout: 5.0
    description: "Captures LLM response immediately after receiving from LLM (runs first in post-chain)"
    category: "message_debugging"
    order:
      after: ["begin"]
      before: ["end"]

# Configuration schema
config:
  max_history_entries:
    type: integer
    default: 100
    description: "Maximum number of message snapshots to keep in history"
    minimum: 10
    maximum: 1000
  
  capture_enabled:
    type: boolean
    default: true
    description: "Enable/disable message capturing"
  
  capture_pre_llm:
    type: boolean
    default: true
    description: "Capture messages before LLM call (input)"
  
  capture_post_llm:
    type: boolean
    default: true
    description: "Capture messages after LLM call (output)"
  
  include_tool_calls:
    type: boolean
    default: true
    description: "Include detailed tool call information in captured messages"
  
  include_token_estimates:
    type: boolean
    default: true
    description: "Calculate and include token estimates for each message"
  
  auto_cleanup_threshold:
    type: integer
    default: 150
    description: "When history exceeds this size, automatically cleanup old entries"
    minimum: 50
    maximum: 2000

# Web UI configuration
web_ui:
  # Header button configuration
  button:
    enabled: true
    text: "Message Debug"
    icon: "🔍"
    tooltip: "View captured LLM messages (pre & post calls)"
  
  # Panel configuration
  panel:
    enabled: true
    title: "Message Debugger - LLM Input/Output Snapshots"
    panel_id: "{{ name }}"
    endpoint: "/plugins/{{ name }}/"
    type: "iframe"
    description: "View captured message snapshots from before and after LLM calls"
  
  endpoints:
    - path: "/snapshots"
      method: "GET"
      handler: "list_snapshots"
      response_type: "json"
      description: "Get list of captured message snapshots with filtering options"
    - path: "/snapshots/{index}"
      method: "GET"
      handler: "get_snapshot"
      response_type: "json"
      description: "Get specific snapshot by index"
    - path: "/stats"
      method: "GET"
      handler: "get_stats"
      response_type: "json"
      description: "Get debugger statistics (total captures, agent breakdown, etc.)"
    - path: "/snapshots"
      method: "DELETE"
      handler: "clear_snapshots"
      response_type: "json"
      description: "Clear all captured snapshots"
    - path: "/"
      method: "GET"
      handler: "render_panel"
      response_type: "html"
      description: "Render the interactive web panel UI"
    - path: "/static/panel.css"
      method: "GET"
      handler: "serve_css"
      response_type: "response"
      description: "Serve panel CSS"
    - path: "/static/panel.js"
      method: "GET"
      handler: "serve_js"
      response_type: "response"
      description: "Serve panel JavaScript"
