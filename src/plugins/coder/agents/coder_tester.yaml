# Test runner — runs the checks and reports them small.
#
# Why this is a sub-agent and not just the coder calling pytest itself: a
# failing suite prints hundreds of lines, and almost none of them carry
# signal. The coder needs the assertion and the five relevant frames, not the
# collection log. The tester absorbs the noise in its own context.
#
# It holds NO edit tools — only the coder writes code. It does hold the shell,
# and a shell can write; that is deliberate (the mutation probe needs to move
# a file back and forth) and it is the reason this agent is not called
# "read-only".
plugins:
  servers:

    coder_tester:
      type: multi_turn_agent
      enabled: true
      description: "Test runner — runs targeted suites, reports failures compactly, and performs the mutation probe on request"

      self_tool_descriptions:
        coder_tester_execute_task: "Run the given tests (or lint/type checks) and report pass/fail with only the lines that carry the failure — optionally prove a test bites via a mutation probe"
        coder_tester_list_available_tools: "List the shell and read-only file tools available"

      agent_config:
        # Running a command and quoting the failure verbatim is not a
        # reasoning task. Diagnosis belongs to the coder.
        llm_profile: [structured, structured_fallback]
        llm_profile_advanced: [code, code_fallback]

        llm_params:
          "*":
            context_window: 200000

        max_steps: 40

        system_template: "./prompts/coder_tester.md"

        tools:
          allowed:
            - "+coder_shell/*"
            - "+coder_fs_ro/*"

        hooks:
          overrides:
            # The project's AGENTS.md: how this project runs its checks.
            # Inherited from the coder's session, so both work by one version.
            project_instructions.inject_project_instructions:
              enabled: true
              root: "."

      metadata:
        author: "Enrico Ehrich"
        version: "1.0.0"
        tags: ["coding", "tests", "mutation"]
        category: "development"
        visibility: "tool"
        min_role: "admin"  # role gate (auth/agent_access.py): a shell and read access to the whole checkout
