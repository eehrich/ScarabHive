# Reviewer — attacks a finished change, and cannot touch it.
#
# Two properties make this worth a separate agent instead of a prompt section
# in the coder:
#
# 1. A FRESH CONTEXT. The coder knows what it meant; that knowledge is exactly
#    what hides the bug. The reviewer sees only the code.
# 2. NO WRITE ACCESS, enforced by config. coder_fs_ro does not render write
#    tools into the schema, and the server refuses them a second time. A
#    reviewer that can "just fix it" stops reviewing and starts rewriting.
#
# Judging is where a stronger model pays for itself: a false finding costs the
# coder a whole fix round, so the model that decides gets the good chain.
plugins:
  servers:

    coder_reviewer:
      type: basic_agent
      enabled: true
      description: "Adversarial code reviewer — read-only, tries to refute every finding before reporting it"

      self_tool_descriptions:
        coder_reviewer_execute_task: "Review a finished change adversarially and report only findings that survived a refutation attempt, each with the failing case"
        coder_reviewer_list_available_tools: "List the read-only review tools available"

      agent_config:
        # Same chain as the coder: judging a change is not the cheaper half of
        # the work, so it does not get the cheaper model.
        llm_profile: [or-claude-sonnet, or-gpt-full]
        llm_profile_advanced: [claude-opus, or-claude-sonnet]

        llm_params:
          "*":
            context_window: 200000

        # Read the diff, read around it, chase the callers, try to break each
        # finding. That is a lot of reading for one report, and on a large
        # change it is hours of it. The cap has to be a safety net, not a
        # budget: a reviewer that runs out mid-verification reports the
        # findings it happened to reach, which reads exactly like a clean
        # review.
        max_steps: 200

        system_template: "./prompts/coder_reviewer.md"

        skills:
          always: ["adversarial-review"]
          on_demand: ["codebase-design"]

        tools:
          allowed:
            - "coder_fs_ro/*"
            - "skills/*"
            - "sequential_thinking/*"

          # semantic_search is dead weight here: with ChromaDB embeddings off
          # (the default) every call answers SemanticSearchDisabled, so
          # offering it only costs a turn. grep_search covers the need.
          # Enable embeddings first if you ever want this back.
          # Note the doubled name -- that is the house convention and it is
          # correct: a "server/tool" pattern is matched EXACTLY against
          # server_name + "/" + tool_name, and the tool name already carries
          # the instance prefix. Written as "coder_fs/semantic_search" this
          # pattern matches nothing and blocks nothing, silently. Verified
          # both ways with tool_matches_patterns(): semantic_search gone,
          # grep_search still there.
          blocked:
            - "coder_fs_ro/coder_fs_ro_semantic_search"

        hooks:
          enabled: true
          overrides:
            # Off: it rewrites the cached prompt prefix on every call, and
            # what it injects are this agent's own thoughts -- already in the
            # transcript, and re-readable through its own tool.
            sequential_thinking.inject_active_sessions:
              enabled: false

      metadata:
        author: "Enrico Ehrich"
        version: "1.0.0"
        tags: ["coding", "review", "read-only", "adversarial"]
        category: "development"
        visibility: "tool"
