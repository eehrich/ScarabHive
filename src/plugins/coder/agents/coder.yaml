# The coding agent.
#
# It owns the change; the three sub-agents in this plugin are its instruments:
# coder_explorer finds things, coder_reviewer attacks the finished change,
# coder_tester runs the checks. Only this agent writes files.
#
# Knowledge lives in skills, not in this prompt (docs/skills_design.md):
#   always     coding-harness      — the loop it works by, and when to delegate
#   on_demand  adversarial-review  — pulled before it reviews its own fix round
#              tdd                 — pulled when it writes tests
#              diagnosing-bugs     — pulled when it hunts a bug
#              codebase-design     — pulled when the question is where a seam goes
# The last three already existed under skills/coding/ — the harness reuses them
# rather than restating them.
plugins:
  servers:

    coder:
      type: multi_turn_agent
      enabled: true
      description: "Coding agent with a harness: plans, changes, tests and has its work adversarially reviewed by sub-agents before calling it done"

      self_tool_descriptions:
        coder_execute_task: "Implement, fix or refactor code in the workspace — plans the change, edits files, runs the tests and has the result reviewed before reporting"
        coder_list_available_tools: "List the coding tools available (files, shell, sub-agents, skills)"

      agent_config:
        # Sonnet leads, GPT catches. Both links are different model families,
        # so a bad day for one does not take the chain -- but both route
        # through OpenRouter, so an OpenRouter outage takes both. Swap either
        # link to its direct-API twin (claude-sonnet / gpt-full) if that
        # matters more than billing through one account.
        llm_profile: [code, code_fallback]
        # Reached via use_advanced_model=true when a caller escalates.
        llm_profile_advanced: [code_adv, code_adv_fallback]

        llm_params:
          "*":
            context_window: 200000
            # Interactive multi-turn work: marks the conversation end as a
            # cache breakpoint on Anthropic profiles, implicit continuation
            # caching on GPT profiles.
            prompt_cache_mode: multi_turn

        # A real change is many turns: read, edit, run tests, react to a
        # failure, review, fix. 300 is a safety net, not a target.
        max_steps: 300

        # An answer cut off at the output cap is sent back with a note instead
        # of ending the run, up to twice in a row. Measured 24.09.2026: three
        # calls in a row stopped at 16384 tokens, each lost the tool call that
        # was writing a whole file, and the announcement before it ended the
        # run as its reply.
        output_cap_notes: 2

        system_template: "./prompts/coder.md"

        template_vars:
          # One place the bundle path is written. The prompt renders it, so it
          # cannot drift from what the injection hook above reads. It is a
          # STATIC value -- it does not change between calls, so it does not
          # cost the prompt cache anything.
          okf_bundle: "data/okf/coder"

        skills:
          always: ["coding-harness"]
          on_demand: ["adversarial-review", "tdd", "diagnosing-bugs", "codebase-design"]

        tools:
          allowed:
            - "+coder_fs/*"                 # read/write inside the sandbox
            - "+coder_shell/*"              # builds, tests, git (read)
            - "+coder_sam/*"                # explorer, reviewer, tester
            - "+skills/*"                   # read the bundled reference files
            - "+todo/*"                     # the task list, visible across turns
            - "+coder_okf/*"                # durable project knowledge it wrote
            - "+sequential_thinking/*"      # think a hard step through
            - "+datetime/*"
            # Claude Code, where it is installed: without the claude executable
            # the instance offers no tools, and the prompt's section on it is
            # rendered only when has_tool() finds them.
            - "+coding_cli/*"

          # semantic_search is ON since 18.09.2026 and no longer blocked here:
          # the index stores one document per symbol, so a hit is a function
          # with its file and line instead of a README. THIS instance owns
          # the index; the read-only twin of the sub-agents reads the same
          # collection -- see agents/tools.yaml.

        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true
            # OFF on purpose, all three of them below.
            #
            # Each inserts a system message directly behind the first one --
            # inside the cached prompt prefix -- and each carries content that
            # changes MID-TURN: a task gets updated, a thought is added, a
            # sub-agent finishes. So the prefix is invalidated exactly while
            # the agent is working hardest, and every following call pays full
            # price for a context it already has.
            #
            # Nothing is lost. All three sources are the agent's OWN tool
            # calls, so they sit in the transcript already, and the tools are
            # in its allowlist to re-read on demand:
            #   todo                -> `todo` (operation: list)
            #   thinking sessions   -> the thoughts are its own tool results
            #   live sub-agents     -> `coder_sam_manage_sub_agent` (list)
            # The three sub-agent NAMES are in the prompt anyway, so the
            # injected "available agents" line was a duplicate of a line that
            # is already in the cached prefix for free.
            todo.inject_todo_tasks:
              enabled: false
            sequential_thinking.inject_active_sessions:
              enabled: false
            # Without this the agent starts every session at zero. It is the
            # piece every comparable harness has (CLAUDE.md, AGENTS.md,
            # HERMES.md): durable facts about this project, carried forward.
            #
            # Unlike a flat notes file this folds in only what the current turn
            # is ABOUT -- the lexical hit plus its linked neighbours -- so the
            # bundle can grow past what would fit in a prompt.
            #
            # This one stays ON although it injects at the same place, because
            # it does not churn the way the three above do: it keys on the last
            # USER message, so the block is byte-identical across every LLM
            # call within a turn, and only moves when the user speaks -- when
            # the prefix changes anyway. The one exception is the agent writing
            # a concept mid-turn; that is a deliberate, rare act.
            #
            # hook_bundle is mandatory: without it the hook returns silently
            # without doing anything, which is indistinguishable from an empty
            # bundle. It must also resolve inside coder_okf's sandbox, or the
            # same silence follows. There is a test for both.
            # Only hook_bundle belongs here -- it is the one key with no
            # default. How much to inject is set once on the coder_okf
            # instance; repeating it here would just be a second place to
            # forget.
            coder_okf.okf_context_injection:
              enabled: true
              hook_bundle: data/okf/coder
            # Off for the same reason as the two above.
            coder_sam.inject_sub_agent_context:
              enabled: false
            # Long coding sessions overflow the window; without this the run
            # dies at the context limit instead of compacting.
            context_engineer.engineer_context:
              enabled: true
            # The project's AGENTS.md -- the file every other coding agent
            # reads. Unlike the three hooks switched off above it does not
            # churn: it is read once per session and stands behind the system
            # prompt unchanged until the session ends. `root: "."` is
            # coder_fs's own "." -- the directory the command was started in
            # -- so a harness started in another project reads THAT project's
            # file; derived, the four coder_fs roots would be ambiguous there.
            # The three sub-agents switch it on the same way and inherit this
            # session's version.
            project_instructions.inject_project_instructions:
              enabled: true
              root: "."

      metadata:
        author: "Enrico Ehrich"
        version: "1.0.0"
        tags: ["coding", "harness", "review", "tests"]
        category: "development"
        visibility: "both"
