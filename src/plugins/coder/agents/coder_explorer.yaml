# Explorer — the read-only finder.
#
# Its whole reason to exist is context economy: sweeping thirty files to answer
# "where is X handled?" costs thousands of tokens, and the coder needs the
# answer, not the files. The explorer burns its own context and returns a few
# lines with paths.
#
# It writes nothing: coder_fs_ro renders no write tools at all.
plugins:
  servers:

    coder_explorer:
      type: basic_agent
      enabled: true
      description: "Read-only code explorer — answers 'where is X, who calls Y, how does Z flow' with file paths and line numbers"

      self_tool_descriptions:
        coder_explorer_execute_task: "Search the codebase read-only and report where something lives, who calls it, and how a flow runs — with paths and line numbers"
        coder_explorer_list_available_tools: "List the read-only search tools available"

      agent_config:
        # Search is finding-and-selecting work over a lot of text: a cheap
        # model with a large window beats an expensive one here, and the
        # answer is checkable (the coder opens the paths it names).
        llm_profile: [or-gemini-flash, or-deepseek-flash, or-gpt-mini]
        llm_profile_advanced: []

        llm_params:
          "*":
            context_window: 200000

        # A sweep is search, read, narrow, report. It does not need 300.
        max_steps: 40

        system_template: "./prompts/coder_explorer.md"

        tools:
          allowed:
            - "coder_fs_ro/*"

          # semantic_search is dead weight here and worse than useless: with
          # ChromaDB embeddings off (the default) it still reports
          # status=success with zero hits, so "nothing found" is
          # indistinguishable from "the feature is off" — and the call
          # creates an empty vector store on disk as a side effect.
          # grep_search covers the need. Enable embeddings first if you ever
          # want this back.
          # Note the doubled name -- that is the house convention and it is
          # correct: a "server/tool" pattern is matched EXACTLY against
          # server_name + "/" + tool_name, and the tool name already carries
          # the instance prefix. Written as "coder_fs/semantic_search" this
          # pattern matches nothing and blocks nothing, silently. Verified
          # both ways with tool_matches_patterns(): semantic_search gone,
          # grep_search still there.
          blocked:
            - "coder_fs_ro/coder_fs_ro_semantic_search"

      metadata:
        author: "Enrico Ehrich"
        version: "1.0.0"
        tags: ["coding", "search", "read-only"]
        category: "development"
        visibility: "tool"
