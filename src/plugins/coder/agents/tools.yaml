# Tool instances for the coder harness.
#
# These are not agents — they are per-harness instances of shared plugins, so
# the coder's sandbox, its shell and its sub-agent limits are set here once
# instead of being repeated in every agent file.
#
# THE ONE KNOB you will want to change: `allowed_directories` on coder_fs and
# coder_fs_ro. It decides which tree the harness may touch at all. Both lists
# must stay identical — a reviewer that cannot read what the coder just wrote
# reviews nothing.
plugins:
  servers:

    # Read+write file access for the coder itself.
    coder_fs:
      type: file_ops
      enabled: true
      description: "coder harness: read/write file access inside the sandbox"
      allowed_directories:
        # The project workspace the harness builds in.
        - data/workspace/
        # Its own skills: the harness may correct the discipline it works by.
        # Everything else about this plugin (agents, prompts) stays out of
        # reach — an agent that can rewrite its own tool allowlist has none.
        - src/plugins/coder/skills/
      max_file_size_mb: 10
      max_unpaginated_file_size_kb: 200
      default_line_limit: 500
      search:
        # Text/filename indexes are in-memory dicts and grep_search needs
        # them, so indexing stays on. Semantic search stays off (the default):
        # it is the only part that persists a ChromaDB store to disk, and
        # grep over a code tree does not need embeddings.
        enable_indexing: true
        index_on_startup: true
        exclude_patterns:
          - '**/.git/**'
          - '**/__pycache__/**'
          - '**/node_modules/**'
          - '**/.venv/**'
          - '**/*.pyc'
          - '**/dist/**'
          - '**/build/**'

    # The same tree, but writes are impossible. This is what makes
    # "whoever reviews, reviews read-only" a property of the config instead of
    # a sentence in a prompt: in read_only mode file_ops does not even render
    # its write tools into the schema, and the server rejects them a second
    # time if one is called anyway.
    #
    # A second instance means a second in-memory index over the same tree.
    # That is the price of the guarantee, and it is only paid while a
    # read-only sub-agent is actually running.
    coder_fs_ro:
      type: file_ops
      enabled: true
      description: "coder harness: read-only file access for reviewer and explorer"
      read_only: true
      allowed_directories:
        - data/workspace/
        - src/plugins/coder/skills/
      max_file_size_mb: 10
      max_unpaginated_file_size_kb: 200
      default_line_limit: 500
      search:
        enable_indexing: true
        index_on_startup: true
        exclude_patterns:
          - '**/.git/**'
          - '**/__pycache__/**'
          - '**/node_modules/**'
          - '**/.venv/**'
          - '**/*.pyc'
          - '**/dist/**'
          - '**/build/**'

    # Shell for the coder and the test runner.
    #
    # NOT confined by the kernel: `sandbox.mode` would need bubblewrap, and on
    # Windows every command in a confining mode fails with
    # SANDBOX_UNAVAILABLE. So the blacklist below is a speed bump against
    # typos and nothing more — a pattern list cannot bound what `bash -c` can
    # do. The enforced boundary in this harness is coder_fs, not this shell.
    # Read that as: do not hand this instance to an agent you would not trust
    # with the whole machine.
    coder_shell:
      type: terminal
      enabled: true
      description: "coder harness: shell for builds, tests and git"
      # Top level, not under `config:` — the terminal server reads `security`,
      # `limits`, `platform` and `sandbox` straight off its MCPConfig.
      security:
        blacklist:
          - 'rm -rf /'
          - 'dd if='
          - mkfs
          - 'chmod 777'
          # git verbs that rewrite history or throw away uncommitted work.
          # The harness reads git; committing is the user's call.
          - 'git push'
          - 'git reset --hard'
          - 'git checkout --'
          - 'git clean -'
        allow_command_chains: true
      platform:
        # Start where the sandbox is. Without this the shell opens at the repo
        # root, so a test run happens somewhere other than where the code the
        # agent may touch actually lives.
        initial_cwd: data/workspace
      limits:
        max_output_size_kb: 60
        default_timeout_seconds: 300
        max_timeout_seconds: 1800
        max_concurrent_background: 5

    # The harness's own knowledge bundle (OKF: git-versioned markdown concepts
    # with a link graph, agent-writable).
    #
    # A DEDICATED instance, not the shared `okf` server, and that is the whole
    # point: the shared one is sandboxed to all of `data/okf`, so an agent
    # using it can write into every other agent's bundle -- the sysadmin's
    # `infra` runbooks included, which are injected into that agent's prompt.
    # Rooting this instance at one bundle makes the boundary something the
    # sandbox enforces rather than something the prompt asks for.
    coder_okf:
      type: okf
      enabled: true
      description: "coder harness: durable project knowledge (OKF bundle)"
      allowed_directories:
        - data/okf/coder
      # Injection defaults. The agent-level hook override sets `hook_bundle`;
      # without it the hook does nothing at all.
      hook_max_concepts: 6
      hook_graph_depth: 1
      max_concept_file_kb: 512
      max_bundle_files: 5000

    # Sub-agent manager for the harness roles.
    #
    # Nesting is capped at 2: coder -> role sub-agent, and there it ends. The
    # roles are leaves by design, none of them owns a manager, so a review
    # cannot start a review.
    coder_sam:
      type: sub_agent_manager
      enabled: true
      description: "coder harness: explorer, reviewer and test-runner sub-agents"
      max_nesting_depth: 2
      max_sub_agents_per_type: 4
      max_sub_agents_per_session: 20
      max_message_history: 100
      default_wait_timeout: 3600
      auto_archive_on_limit: true
      allowed_agents:
        - coder_explorer
        - coder_reviewer
        - coder_tester
      hook_config:
        enabled: true
        inject_sub_agent_context:
          enabled: true
          max_sub_agents_shown: 6
          show_completed: false
          show_tool_state: true
          format: markdown
