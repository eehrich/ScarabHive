# Review a finished change from several lenses at once, then let three skeptics try to refute every finding:
# what is left is what at least two of them could not refute. Read-only -- nobody writes, so all of it may
# run in parallel. Copy it, give it an id of its own, change what the task needs; then validate and run it.
stategraph: 1
id: review_with_refutation
title: Review with refutation

params:
  change: {type: string, required: true, description: "What changed and what it should achieve"}
  files:  {type: array, required: true, description: "The changed files, with paths"}
  lenses: {type: array, default: [correctness, error handling, the callers of what changed], description: One reviewer per lens}

limits: {max_output_tokens: 150000, concurrency: 4, max_steps: 200, timeout: 1h}

context:
  findings: []
  confirmed: []
  refuted: 0
  lost: []

initial: review

states:
  review:
    description: One reviewer per lens, in parallel.
    do:
      map: params.lenses
      as: lens
      concurrency: 4
      fail: collect
      each:
        agent: coder_reviewer
        task: |
          Review this change for {{ lens }} only. Read the files yourself.
          The change: {{ params.change }}
          Files: {{ params.files }}
          Report only findings that name a failing case -- the file, the line, the claim and the input or state
          that breaks it. None found: an empty list.
        schema:
          type: object
          required: [findings]
          properties:
            findings:
              type: array
              items:
                type: object
                required: [file, line, claim]
                properties:
                  file: {type: string}
                  line: {type: integer}
                  claim: {type: string}
    transitions:
      - target: verify
        effect: |
          ctx.lost = ["review: " + lens for lens, r in zip(params.lenses, out) if r["status"] != "succeeded"]
          ctx.findings = [f for r in out if r["status"] == "succeeded" for f in r["out"]["findings"]]

  verify:
    description: >-
      Three skeptics per finding; it stands when at least two cannot refute it, falls when two refute it, and is
      lost when skeptics failed and leave neither.
    do:
      map: ctx.findings
      as: finding
      concurrency: 4
      fail: collect
      each:
        map: range(3)
        as: skeptic
        fail: collect
        each:
          agent: coder_reviewer
          task: |
            Try to refute this finding against the code: a guard before it, a caller that rules the input out,
            a branch no entry point reaches. Read the places. Answer refuted=true when you cannot show the
            failing case yourself.

            {{ finding }}
          schema:
            type: object
            required: [refuted, reason]
            properties:
              refuted: {type: boolean}
              reason: {type: string}
    transitions:
      - target: done
        effect: |
          votes = [[v["out"]["refuted"] for v in r["out"] if v["status"] == "succeeded"]
                   if r["status"] == "succeeded" else [] for r in out]
          ctx.confirmed = [f for f, vs in zip(ctx.findings, votes) if vs.count(False) >= 2]
          ctx.refuted = len([vs for vs in votes if vs.count(True) >= 2])
          ctx.lost = ctx.lost + ["verify: " + f["claim"] for f, vs in zip(ctx.findings, votes)
                                 if vs.count(False) < 2 and vs.count(True) < 2]

  done:
    type: final
    output:
      confirmed: "{{ ctx.confirmed }}"
      refuted: "{{ ctx.refuted }}"
      lost: "{{ ctx.lost }}"
