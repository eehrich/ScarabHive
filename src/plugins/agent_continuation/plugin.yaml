name: agent_continuation
version: 1.0.0
description: >
  Evaluates whether an agent's text response is a final answer or an
  intermediate status update.  When the response looks intermediate the
  hook signals the LLM loop to continue instead of exiting, enabling
  fully autonomous multi-step workflows.
author: AgentSystem
type:
  - hooks
entrypoint: plugin:PLUGIN_FACTORY
requires:
  agent_system: ">=0.4.0"
