# agent_continuation plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "agent_continuation"
version = "1.0.0"
description = "Evaluates whether an agent's text response is a final answer or an intermediate status update.  When the response looks intermediate the hook signals the LLM loop to continue instead of exiting, enabling fully autonomous multi-step workflows.\n"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
type = ["hooks"]
requires = { agent_system = ">=0.6.0" }
