# Hook definitions for agent_continuation plugin
# Convention: hook name must match method name exactly

hooks:
  - name: evaluate_completion
    type: post_llm_call
    enabled: false
    timeout: 30.0
    description: >
      Evaluates whether an agent text response is a final answer or an
      intermediate status report.  Sets metadata["continue"] = True when
      the agent should keep working.
    category: "agent_continuation"
    order:
      # Run before any output formatting but after usage tracking
      before: ["message_debugging"]

# -----------------------------------------------------------------
# Configuration schema (defaults — overridable in plugins.yaml)
# -----------------------------------------------------------------
config:
  # Maximum auto-continuations per request (safety valve)
  max_continuations:
    type: integer
    default: 10
    minimum: 1
    maximum: 50
    description: "Maximum number of times the loop may be continued per request"

  # Default user message injected to keep the agent going
  default_continue_message:
    type: string
    default: >
      Your previous response appears to be an intermediate status update,
      not a final result.  Continue executing the remaining steps of your
      task.  Do not repeat status information — proceed with the next
      action.
    description: "User message injected when continuation is triggered"

  # Strategy: "rules", "llm", "decision", or "hybrid"
  strategy:
    type: string
    default: "rules"
    enum: ["rules", "llm", "decision", "hybrid"]
    description: >
      Evaluation strategy — rules (fast, free), llm (a chat model answers
      FINAL or CONTINUE), decision (a decision model answers one named
      question with a probability), hybrid (rules first, then whichever
      hybrid_fallback names).

  # LLM profile used for the evaluator (only for "llm" / "hybrid")
  llm_profile:
    type: string
    default: "turbo"
    description: "LLM profile for the evaluator model"

  # LLM evaluation prompt (Jinja2-like placeholders)
  llm_prompt:
    type: string
    default: |
      You are a completion evaluator.  Given an AI agent's response,
      determine whether it is a FINAL answer or an INTERMEDIATE status
      update that means the agent should keep working.

      Agent name: {{ agent_name }}

      Response (truncated):
      ---
      {{ response }}
      ---

      Reply with exactly one word: FINAL or CONTINUE
    description: "Prompt template for LLM-based evaluation"

  # Which judge hybrid falls back to when no rule matched. The decision model
  # is billed per call, so running the free rules first is the point of hybrid.
  hybrid_fallback:
    type: string
    default: "llm"
    enum: ["llm", "decision"]
    description: "Judge for hybrid when no rule matched"

  # ---------------------------------------------------------------
  # strategy: "decision" — one named question, answered with a probability
  # ---------------------------------------------------------------

  # Which decision model judges. Empty = llm_system.default_decision_profile.
  decision_profile:
    type: string
    default: ""
    description: >
      Profile from llm_system.decision_profiles. Empty means the configured
      default_decision_profile — set this only to make one agent use a
      different judge than the rest.

  # The question. This is the whole prompt: no template, no placeholders.
  decision_question:
    type: string
    default: >
      Is this the agent's FINAL answer to its task?
    description: "The one question the decision model answers about the response"

  # What the two sides of that question mean. Both or neither: half a pair
  # tells the model that the other case means nothing.
  decision_final_means:
    type: string
    default: >
      A finished result: the work is done and this reports the outcome.
    description: "Criterion for 'yes, final' — sent as criteria.true"

  decision_continue_means:
    type: string
    default: >
      An intermediate status report, a plan, or an announcement of what the
      agent is about to do next.
    description: "Criterion for 'no, keep working' — sent as criteria.false"

  # How sure the model must be that the answer is final before the loop stops.
  decision_threshold:
    type: number
    default: 0.5
    minimum: 0.0
    maximum: 1.0
    description: >
      Continue while p(final) is BELOW this. 0.5 means "whichever the model
      thinks is more likely". Raise it to keep working unless the model is
      quite sure the answer is finished; lower it to stop more easily.

  # Per-agent rule overrides (keyed by agent name)
  agent_rules:
    type: object
    default: {}
    description: >
      Per-agent configuration.  Keys are agent names, values are objects
      with optional keys: strategy, continue_message, default, rules,
      llm_prompt, max_continuations, followups, followups_on_continue,
      hybrid_fallback, decision_profile, decision_question,
      decision_final_means, decision_continue_means, decision_threshold.
      Agents that don't appear here use the global strategy/defaults.
