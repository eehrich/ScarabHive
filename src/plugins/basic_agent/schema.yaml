tools:
  - type: function
    function:
      name: "{{ name }}_execute_task"
      description: Execute tasks using a basic agent with LLM capabilities and access to all available tools
      parameters:
        type: object
        properties:
          task:
            type: string
            description: "The task or question to execute"
          {% if llm_profiles and llm_profiles|length > 1 %}llm_profile:
            type: string
            description: "Optional LLM profile to use. If not specified, uses the agent's default profile."
            enum: {{ llm_profiles | tojson }}
          {% endif %}{% if has_advanced %}use_advanced_model:
            type: boolean
            description: "Use the agent's advanced LLM profile (alternative to llm_profile parameter). If both are set, llm_profile takes precedence."
            default: false
          {% else %}use_advanced_model:
            type: boolean
            description: "Use the agent's advanced LLM profile. Note: This agent has no advanced profile configured, so this has no effect."
            default: false
          {% endif %}
        required: ["task"]
        additionalProperties: false

  - type: function
    function:
      name: "{{ name }}_list_available_tools"
      description: List all available tools that the agent can access (returns only tool names and descriptions)
      parameters:
        type: object
        properties: {}
        additionalProperties: false