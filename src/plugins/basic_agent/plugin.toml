# basic_agent plugin manifest — metadata + Python requirements in one file.
# Read by agent_system.plugins.plugin_manifest; pip requirements (if any)
# go in a `dependencies = [...]` line and are aggregated into the build by
# scripts/aggregate_plugin_deps.py.
[plugin]
name = "basic_agent"
version = "1.0.0"
description = "Basic agent plugin providing agent execution capabilities as tools"
author = "Enrico Ehrich"
entrypoint = "plugin:PLUGIN_FACTORY"
# The constructor reads config and builds an LLM client -- no I/O, no
# thread, no socket -- so a server of this type may be built on first use
# instead of at start. Enforced: agent_system.runtime refuses to register
# a lazy type that builds something other than an Agent.
lazy = true
type = ["tool-server"]
category = "tools"
tags = ["agent", "execution", "llm", "task", "basic"]
requires = { python = ">=3.11", agent_system = ">=0.6.0" }
