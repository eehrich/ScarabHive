{#- Kit macros. {% from "kit/macros.html" import icon %} -#}

{% macro icon(name, size="", label="") -%}
<svg class="pk-icon{% if size %} pk-icon--{{ size }}{% endif %}"{% if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %}><use href="/static/kit/icons.svg#{{ name }}"/></svg>
{%- endmacro %}

{% macro logo(size=24) -%}
<svg class="pk-logo" width="{{ size }}" height="{{ size }}" role="img" aria-label="ScarabHive"><use href="/static/kit/logo.svg#mark"/></svg>
{%- endmacro %}
