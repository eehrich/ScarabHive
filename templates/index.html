<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent System (MCP)</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/panels.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/mcp.css') }}?v=blocked-tools">
  <link rel="stylesheet" href="{{ url_for('static', path='css/debug.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/chat.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/sessions.css') }}" />
  
  <!-- Prism.js for Syntax Highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='favicon.ico') }}" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <h1>Scarab Agent System</h1>
        <div class="session-id-display header-session">
          <span class="label">Session:</span>
          <span id="headerSessionId">--</span>
        </div>
      </div>
      <div class="header-buttons">
        <button id="mcpToggleBtn" aria-expanded="false" title="Show MCP servers & tools">
          MCP-Servers
        </button>
        <button id="statusToggleBtn" aria-expanded="false" title="Show status & metrics">Status</button>
        <button id="debugToggleBtn" aria-expanded="false" title="Show debug messages">Debug</button>
        <!-- Plugin buttons will be dynamically inserted here -->
      </div>
    </header>

    <main class="main-container">
      <div class="main-content">
        <div id="requestIdDisplay" class="request-id-display" title="Current Request ID" style="display: none;">
          Request: <span id="currentRequestId">--</span>
        </div>
        <div id="chat" class="chat" aria-live="polite"></div>
      </div>
    </main>

    <div class="inputBar" role="region" aria-label="Chat input">
      <div class="input-bar-container">
        <form id="f">
          <div id="attachedFiles" class="attached-files"></div>
          <div class="input-container">
            <textarea 
              id="task" 
              placeholder="Ask the agent…" 
              autocomplete="on"
              rows="1"
              aria-label="Message input"
            ></textarea>
          </div>
        </form>
        <div class="input-bar-top">
          <div class="selector-group">
            <label>Agent:</label>
            <select id="agentSelector" title="Agent selection (coming soon)">
              <option>default_agent</option>
            </select>
          </div>
          <div class="selector-group">
            <label>Model:</label>
            <select id="modelSelector" title="Model selection (coming soon)">
              <option>gpt-4.1</option>
            </select>
          </div>
          <div class="input-actions">
            <label for="fileInput" class="file-upload-btn icon-action" title="Attach images">
              <svg width="18" height="18" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14.5 5.5L8 12L5.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8 2V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M13.5 11.5L13 14H3L2.5 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="8" cy="6" r="0.5" fill="currentColor"/>
              </svg>
            </label>
            <input id="fileInput" type="file" accept="image/*" multiple style="display:none" />
            <button id="runBtn" type="submit" class="icon-btn run-btn icon-action" title="Run (Ctrl+Enter)" form="f">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 2.5L12 8L4 13.5V2.5Z"/>
              </svg>
            </button>
            <button id="stopBtn" type="button" class="icon-btn stop-btn icon-action" title="Stop" aria-label="Stop" style="display: none;">
              <!-- centered square stop icon -->
              <svg width="20" height="20" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                <!-- larger inner square with softer corners -->
                <rect x="4" y="4" width="16" height="16" rx="4" fill="currentColor" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

        <!-- Load JavaScript Modules (order matters) -->
    <script src="{{ url_for('static', path='js/auth.js') }}"></script>
    <script src="{{ url_for('static', path='js/panel_manager.js') }}"></script>
    <script src="{{ url_for('static', path='js/plugin_manager.js') }}"></script>
    <script src="{{ url_for('static', path='js/user_profile.js') }}"></script>
    <script src="{{ url_for('static', path='js/dropdown_menu.js') }}"></script>
    <script src="{{ url_for('static', path='js/selector_module.js') }}"></script>
    <script type="module" src="{{ url_for('static', path='js/session_module.js') }}"></script>
    <script src="{{ url_for('static', path='js/mcp_module.js') }}?v=blocked-tools"></script>
    <script src="{{ url_for('static', path='js/status_module.js') }}"></script>
    <script src="{{ url_for('static', path='js/debug_module.js') }}"></script>
    <script src="{{ url_for('static', path='js/file_upload_module.js') }}"></script>
    <script src="{{ url_for('static', path='js/chat_module.js') }}"></script>
    <script src="{{ url_for('static', path='js/textarea_module.js') }}"></script>
    <script src="{{ url_for('static', path='js/main.js') }}"></script>
    
    <!-- Prism.js for Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
  </body>
</html>
