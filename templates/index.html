<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent System (MCP)</title>
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/panels.css" />
    <link rel="stylesheet" href="/static/css/mcp.css" />
    <link rel="stylesheet" href="/static/css/debug.css" />
    <link rel="stylesheet" href="/static/css/chat.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  </head>
  <body>
    <header>
      <h1>Scarab Agent System</h1>
      <div class="header-buttons">
        <button id="mcpToggleBtn" aria-expanded="false" title="Show MCP servers & tools">
          MCP-Servers (<span id="mcpConnected">15</span>)
        </button>
        <button id="statusToggleBtn" aria-expanded="false" title="Show status & metrics">Status</button>
        <button id="debugToggleBtn" aria-expanded="false" title="Show debug messages">Debug</button>
      </div>
    </header>

    <main class="main-container">
      <div class="main-content">
        <div id="chat" class="chat" aria-live="polite"></div>
      </div>
    </main>

    <div class="inputBar" role="region" aria-label="Chat input">
      <form id="f">
        <input id="task" type="text" placeholder="Ask the agent…" autocomplete="on" />
        <button id="runBtn" type="submit">Run</button>
      </form>
    </div>

        <!-- Load JavaScript Modules (order matters) -->
    <script src="{{ url_for('static', path='js/panel_manager.js') }}"></script>
    <script src="{{ url_for('static', path='js/mcp_module.js') }}"></script>
    <script src="{{ url_for('static', path='js/status_module.js') }}"></script>
    <script src="{{ url_for('static', path='js/debug_module.js') }}"></script>
    <script src="{{ url_for('static', path='js/main.js') }}"></script>
  </body>
</html>
