{% from "kit/macros.html" import icon, logo %}
<!doctype html>
<html lang="en" class="pk-root" data-theme="{{ ui_theme(request) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScarabHive</title>
  <link rel="icon" href="/static/kit/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/kit/kit.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body class="app">
  <header class="app-header">
    <button id="sessionsToggle" type="button" class="pk-btn pk-btn--ghost pk-btn--icon" aria-controls="sessionsPane" aria-expanded="true" title="Sessions (Ctrl+B)">{{ icon('panel-left') }}</button>
    <a class="app-brand" href="/" aria-label="ScarabHive">{{ logo(22) }}<span>ScarabHive</span></a>
    <div class="app-session">
      <button id="headerSessionId" type="button" class="app-session-title pk-truncate" title="Open the session in a panel" disabled>New session</button>
    </div>
    <button id="paletteButton" type="button" class="app-search" title="Search panels, sessions and actions">
      {{ icon('search') }}<span class="pk-grow">Search or run a command</span><kbd class="pk-kbd">Ctrl K</kbd>
    </button>
    <div class="app-header-actions">
      <button id="helpButton" type="button" class="pk-btn pk-btn--ghost pk-btn--icon" title="Help: the ScarabHive manual">{{ icon('circle-help') }}</button>
      <button id="launcherButton" type="button" class="pk-btn pk-btn--ghost pk-btn--icon" popovertarget="launcher" title="Panels">{{ icon('layout-grid') }}</button>
      <button id="themeButton" type="button" class="pk-btn pk-btn--ghost pk-btn--icon" title="Theme">{{ icon('monitor') }}</button>
      <button id="userButton" type="button" class="app-avatar" popovertarget="userMenu" title="Account"><span id="userInitials"></span></button>
      <button id="dockToggle" type="button" class="pk-btn pk-btn--ghost pk-btn--icon" aria-controls="dock" aria-expanded="false" title="Panels (Ctrl+Alt+B)" disabled>{{ icon('panel-right') }}</button>
    </div>
  </header>

  <div class="app-body">
    <aside id="sessionsPane" class="app-sessions" aria-label="Sessions"></aside>
    <div id="sessionsResizer" class="app-sessions-resizer" role="separator" aria-orientation="vertical" aria-controls="sessionsPane" aria-label="Resize the sessions pane" tabindex="0"></div>

    <main class="app-main">
      <div id="chatScroll" class="app-chat-scroll">
        <div id="chat" class="chat" aria-live="polite"></div>
      </div>

      <div class="inputBar" role="region" aria-label="Chat input">
        <!-- method dialog: outside a dialog a submit never navigates, not even before the chat script runs -->
        <form id="f" class="composer" method="dialog">
          <div id="attachedFiles" class="attached-files"></div>
          <div class="input-container">
            <textarea id="task" placeholder="Message the agent…" rows="1" aria-label="Message"></textarea>
          </div>
          <div class="composer-bar">
            <button id="agentPicker" type="button" class="composer-select" title="Agent" aria-haspopup="dialog">{{ icon('workflow', size='sm') }}<span id="agentLabel" class="pk-truncate">Agent</span>{{ icon('chevron-down', size='sm') }}</button>
            <button id="modelPicker" type="button" class="composer-select" title="Model profile" aria-haspopup="dialog">{{ icon('cpu', size='sm') }}<span id="modelLabel" class="pk-truncate">Model profile</span>{{ icon('chevron-down', size='sm') }}</button>
            <span class="pk-grow"></span>
            <button id="attachButton" type="button" class="pk-btn pk-btn--ghost pk-btn--icon" title="Attach files" aria-label="Attach files">{{ icon('paperclip') }}</button>
            <input id="fileInput" type="file" multiple hidden>
            <button id="runBtn" type="submit" class="pk-btn pk-btn--primary pk-btn--icon run-btn" title="Run (Ctrl+Enter)" aria-label="Run">{{ icon('send-horizontal') }}</button>
            <button id="stopBtn" type="button" class="pk-btn pk-btn--icon stop-btn" title="Stop" aria-label="Stop" style="display: none;">{{ icon('square') }}</button>
          </div>
        </form>
      </div>
    </main>

    <div id="dockResizer" class="app-dock-resizer" role="separator" aria-orientation="vertical" hidden></div>
    <section id="dock" class="app-dock" aria-label="Docked panels" hidden>
      <div class="app-dock-bar">
        <button id="dockCollapse" type="button" class="pk-btn pk-btn--ghost pk-btn--icon pk-btn--sm app-back" title="Back to the chat">{{ icon('arrow-left', size='sm') }}</button>
        <div class="app-dock-tabs" role="tablist"></div>
        <button id="dockHelp" type="button" class="pk-btn pk-btn--ghost pk-btn--icon pk-btn--sm app-dock-help" title="Help for this panel" data-idle>{{ icon('circle-help', size='sm') }}</button>
      </div>
      <div class="app-dock-frames"></div>
    </section>
  </div>

  <footer class="app-status">
    <span class="app-status-item" id="connectionState"><span class="pk-dot"></span> <span>Connecting</span></span>
    <span class="pk-grow"></span>
    <span class="app-status-item" id="floatingList"></span>
    <span class="app-status-item pk-muted" id="versionLabel"></span>
  </footer>

  <div id="floatingLayer" class="app-floating-layer"></div>

  <div id="launcher" class="app-launcher pk-menu" popover>
    <div class="pk-search">{{ icon('search') }}<input id="launcherSearch" class="pk-input" type="search" placeholder="Find a panel" aria-label="Find a panel"></div>
    <div id="launcherList" class="app-launcher-list"></div>
  </div>

  <div id="userMenu" class="pk-menu" popover>
    <div class="pk-menu-label" id="userMenuName"></div>
    <button type="button" class="pk-menu-item" data-open-panel="settings">{{ icon('settings') }} Settings</button>
    <button type="button" class="pk-menu-item" data-open-panel="system">{{ icon('activity') }} System</button>
    <hr class="pk-menu-separator">
    <button type="button" class="pk-menu-item" id="logoutButton">{{ icon('log-out') }} Log out</button>
  </div>

  <dialog id="palette" class="pk-dialog app-palette" aria-label="Command palette">
    <div class="pk-search">{{ icon('search') }}<input id="paletteInput" class="pk-input" placeholder="Panels, sessions, agents, actions" autocomplete="off"></div>
    <div id="paletteList" class="app-palette-list" role="listbox"></div>
  </dialog>

  <dialog id="picker" class="pk-dialog app-palette" aria-labelledby="pickerTitle">
    <div class="picker-head">
      <h2 id="pickerTitle" class="pk-dialog-title"></h2>
      <div id="pickerGroups" class="picker-groups" role="group" aria-label="Group by"></div>
    </div>
    <div class="pk-search">{{ icon('search') }}<input id="pickerInput" class="pk-input" autocomplete="off" role="combobox" aria-controls="pickerList" aria-expanded="true" aria-label="Search"></div>
    <div id="pickerList" class="app-palette-list" role="listbox" aria-labelledby="pickerTitle"></div>
  </dialog>

  <script src="/static/vendor/prism/prism.js" data-manual></script>
  <script src="/static/vendor/markdown-it/markdown-it.min.js"></script>
  <script src="/static/js/selector_module.js"></script>
  <script src="/static/js/file_upload_module.js"></script>
  <script src="/static/js/slash_commands.js"></script>
  <script src="/static/js/chat_module.js"></script>
  <script src="/static/js/textarea_module.js"></script>
  <script src="/static/js/input_history.js"></script>
  <script type="module" src="/static/js/shell/shell.js"></script>
</body>
</html>
