<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent System (MCP)</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/index.css" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  </head>
  <body>
    <header>
      <h1>
        Scarab Agent System
        <span class="mcp-badge">MCP-Servers
          <span id="mcpConnected" class="mcp-connected" title="Connection status" aria-hidden="true"></span>
        </span>
      </h1>
      <button id="statusToggleBtn" aria-expanded="false" title="Show status & metrics">Status</button>
    </header>

    <main class="main-container">
      <div class="main-content">
        <div id="chat" class="chat" aria-live="polite"></div>
      </div>
    </main>

    <div class="inputBar" role="region" aria-label="Chat input">
      <form id="f">
        <input id="task" type="text" placeholder="Ask the agent…" autocomplete="on" />
        <button id="runBtn" type="submit">Run</button>
      </form>
    </div>

    <script src="/static/js/index.js"></script>
  </body>
</html>
