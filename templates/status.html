<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Status Stream</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      body { font-family: system-ui, Arial, sans-serif; background:#0e141b; color:#dbe2ec; margin:0; }
      header { padding:12px 20px; background:#121c27; border-bottom:1px solid #1f2b38; }
      h1 { margin:0; font-size:18px; }
      .toolbar { padding:8px 16px; background:#101922; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
      label { font-size:12px; text-transform:uppercase; letter-spacing:0.5px; opacity:.7; }
      input { background:#172330; border:1px solid #263545; color:#c8d2dd; padding:4px 8px; border-radius:4px; font-size:14px; }
      input:focus { outline:1px solid #355d85; }
      #timeline { padding:12px 16px 80px; }
      .event { position:relative; padding:8px 12px 8px 14px; margin:4px 0 4px 8px; border-left:3px solid #2e3e4f; background:#13202c; border-radius:4px; animation:fadeIn .3s ease; }
      .event.start { border-color:#00bcd4; }
      .event.progress { border-color:#1e88e5; }
      .event.end { border-color:#2e7d32; }
      .event.error { border-color:#c62828; }
      .meta { font-size:11px; opacity:.75; margin-top:4px; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .event:hover { background:#182a38; cursor:pointer; }
      .phase { font-size:11px; padding:2px 6px; border-radius:10px; margin-right:6px; text-transform:uppercase; letter-spacing:.5px; }
      .phase.start { background:#00bcd41a; color:#00bcd4; }
      .phase.progress { background:#1e88e51a; color:#42a5f5; }
      .phase.end { background:#2e7d321a; color:#81c784; }
      .phase.error { background:#c628281a; color:#ef5350; }
      .server { font-weight:600; }
      .req { opacity:.65; font-size:12px; }
      .msg { display:inline; }
      .empty { opacity:.5; font-style:italic; padding:12px 4px; }
      @keyframes fadeIn { from { opacity:0; transform:translateY(-2px);} to { opacity:1; transform:translateY(0);} }
      .footer { position:fixed; bottom:0; left:0; right:0; background:#121c27; border-top:1px solid #1f2b38; padding:6px 12px; font-size:11px; display:flex; justify-content:space-between; }
      a { color:#5eb2ff; text-decoration:none; }
      a:hover { text-decoration:underline; }
      dialog { background:#0f1a24; color:#dbe2ec; border:1px solid #27455e; border-radius:6px; padding:16px 20px; max-width:600px; width:90%; }
      dialog::backdrop { background:rgba(0,0,0,0.55); backdrop-filter:blur(2px); }
      pre { white-space:pre-wrap; word-break:break-word; background:#081018; padding:10px; border-radius:4px; overflow:auto; font-size:12px; }
      .closeBtn { background:#213242; color:#dbe2ec; border:1px solid #2f4a61; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; }
      .closeBtn:hover { background:#2b4255; }
      .filters-group { display:flex; gap:16px; align-items:flex-end; }
    </style>
  </head>
  <body>
    <header><h1>Status Stream</h1></header>
    <div class="toolbar">
      <div class="filters-group">
        <div>
          <label for="serverFilter">Server</label><br />
          <input id="serverFilter" size="14" placeholder="(all)" />
        </div>
        <div>
          <label for="requestFilter">Request ID</label><br />
          <input id="requestFilter" size="14" placeholder="(all)" />
        </div>
        <div>
          <label for="autoScrollChk">Autoscroll</label><br />
          <input id="autoScrollChk" type="checkbox" checked />
        </div>
      </div>
    </div>
    <main id="timeline"></main>
    <div class="footer"><span id="conn">Connecting…</span><span id="counts">0 events</span></div>
    <dialog id="detailDialog">
      <form method="dialog" style="text-align:right;margin:0 0 8px 0"><button class="closeBtn">Close</button></form>
      <h3 id="detailTitle" style="margin-top:0"></h3>
      <pre id="detailJson"></pre>
    </dialog>
    <script>
      const tl = document.getElementById('timeline');
      const serverFilter = document.getElementById('serverFilter');
      const requestFilter = document.getElementById('requestFilter');
      const autoScrollChk = document.getElementById('autoScrollChk');
      const conn = document.getElementById('conn');
      const counts = document.getElementById('counts');
      const dlg = document.getElementById('detailDialog');
      const detailTitle = document.getElementById('detailTitle');
      const detailJson = document.getElementById('detailJson');
      let total = 0;
      let es;
      let reconnectTimer;

      function esc(s){return (s+"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
      function fmtTime(ts){try{return new Date(ts).toLocaleTimeString();}catch(e){return ts;}}
      function applyFilters(ev){
        const sf = serverFilter.value.trim();
        const rf = requestFilter.value.trim();
        if (sf && ev.server !== sf) return false;
        if (rf && ev.request_id !== rf) return false;
        return true;
      }
      function addEvent(ev){
        if(!applyFilters(ev)) return;
        total++; counts.textContent = total + ' event' + (total!==1?'s':'');
        const div = document.createElement('div');
        div.className = 'event ' + esc(ev.phase || 'progress');
        const phase = esc(ev.phase || '?');
        const msg = esc(ev.message || '');
        const srv = esc(ev.server || '?');
        const rid = esc(ev.request_id || '');
        div.innerHTML = `<span class="phase ${phase}">${phase}</span><span class="server">${srv}</span> <span class="req">${rid}</span><br><span class="msg">${msg}</span><div class="meta">${fmtTime(ev.timestamp)} · level=${esc(ev.level)}${ev.meta?' · meta':''}</div>`;
        div.addEventListener('click',()=>{
          detailTitle.textContent = `${srv} ${phase}`;
          detailJson.textContent = JSON.stringify(ev, null, 2);
          dlg.showModal();
        });
        tl.appendChild(div);
        if (autoScrollChk.checked){ requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight})); }
      }
      function connect(){
        if(es){ es.close(); }
        conn.textContent='Connecting…';
        es = new EventSource('/status/stream');
        es.onopen=()=>{conn.textContent='Connected';};
        es.onerror=()=>{conn.textContent='Disconnected'; if(reconnectTimer) return; reconnectTimer=setTimeout(()=>{reconnectTimer=null; connect();}, 2000);};
        es.onmessage=(e)=>{ try{ const ev = JSON.parse(e.data); addEvent(ev);}catch(err){} };
      }
      connect();
      [serverFilter, requestFilter].forEach(inp=>inp.addEventListener('input',()=>{ tl.innerHTML=''; total=0; counts.textContent='0 events'; }));
    </script>
  </body>
</html>
