[pytest]
; Central tests/ plus per-plugin colocated tests (src/plugins/<name>/tests and
; the same under every further root src/plugins_<name>/). Globs are
; expanded relative to rootdir; a plugin without a tests/ dir simply doesn't
; match. Shared fixtures live in the root-level conftest.py, so colocated plugin
; tests inherit them too.
testpaths = tests src/plugins*/*/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --timeout=120
; Treat Python warnings as errors by default. Specific warnings
; can be fine-tuned via filterwarnings below.
filterwarnings =
    error
    ; Windows-specific: asyncio subprocess transports may not be cleanly closed
    ; during test cleanup due to Python's event loop finalization order.
    ; This is a known limitation on Windows with pytest-asyncio.
    ignore::pytest.PytestUnraisableExceptionWarning
    ; A coding_cli run outlives its Popen by design: as an error, this warning raises inside __del__ and
    ; pytest keeps its traceback until the test ends, pinning whatever frame the finalizer interrupted
    ; (a later git call's pipe ends: a hang).
    ignore:subprocess \d+ is still running:ResourceWarning
    ; Python 3.14 deprecations inside dependencies, not in this code: fastapi
    ; 0.115, starlette and chromadb call asyncio.iscoroutinefunction; google-genai
    ; compares against typing._UnionGenericAlias at import (types.py). Limited to
    ; those modules, so the same call in our own code still fails -- except in
    ; test modules that silence it themselves (the stategraph test kit's
    ; FASTAPI_PY314 marker).
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fastapi
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:starlette
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb
    ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google\.genai\.types
timeout = 120
timeout_method = thread
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = src tests
markers =
    integration: marks tests as integration tests (may be slower)
    asyncio: marks tests as async tests
    unit: marks tests as unit tests
    slow: marks tests as slow (deselect with '-m "not slow"')