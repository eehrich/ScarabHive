[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --timeout=120 -W error
; Treat Python warnings as errors by default (-W error). Specific warnings
; can be fine-tuned via filterwarnings below.
; no filtering allowed
filterwarnings =
timeout = 120
timeout_method = thread
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = src
markers =
    integration: marks tests as integration tests (may be slower)
    asyncio: marks tests as async tests
    unit: marks tests as unit tests