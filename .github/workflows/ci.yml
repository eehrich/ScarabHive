name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # CPU-only PyTorch: requirements/all.txt pulls in torch (sentence-transformers,
  # voicefixer, ...), and from PyPI torch on Linux brings several GB of CUDA
  # libraries that no test uses.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

  # ==========================================================================
  # CI TEST SUBSET -- the one place that decides what CI runs.
  #
  # The full suite takes 20+ minutes. This subset is the framework core
  # without the network: no real LLM calls (the root conftest.py replaces
  # agent_system.llm.registry.build_client with a fake client), no API server
  # process. Left out: tests/app, tests/status, tests/tools, tests/bootstrap
  # and tests/ui (build_app() on the full repository config), tests/cli and
  # tests/scripts (subprocesses, sleeps of several seconds), tests/integration,
  # tests/other, tests/plugins_writer, and the per-plugin suites under
  # src/plugins*/*/tests. Single files from those directories are in when
  # they need neither: the tool dispatch and cancellation tests, the systemd
  # unit template check, and two that build the app on a minimal config or
  # read a temporary session store.
  # ==========================================================================
  CI_TEST_PATHS: >-
    tests/config
    tests/hooks
    tests/skills
    tests/services
    tests/utils
    tests/auth
    tests/session
    tests/llm
    tests/agent
    tests/tool
    tests/plugins
    tests/pluginsystem
    tests/api
    tests/app/test_api_honours_agent_config_path.py
    tests/cli/test_agent_run_lists_the_sessions_it_runs.py
    tests/tools/test_tool_server.py
    tests/tools/test_schema_based_tool_server.py
    tests/other/test_cancellation_system.py
    tests/scripts/test_systemd_unit_template.py
  # Known failures on a clean checkout, and tests that need the network.
  # Remove a line once its test is fixed.
  CI_TEST_SKIP: >-
    --ignore=tests/utils/test_vector_store.py
    --deselect=tests/pluginsystem/test_plugin_deps_declared.py::test_plugin_modules_use_no_parent_relative_imports
    --deselect=tests/utils/test_yaml_io.py::test_no_production_code_calls_the_pure_python_loader
    --deselect=tests/utils/test_memory_profiling.py::TestMemoryLeakDetector::test_only_a_snapshot_asked_for_records_allocations_and_they_outlast_the_periodic_ones

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The rules are selected in pyproject.toml ([tool.ruff.lint]); the version
      # is pinned so a new ruff release does not turn CI red on its own.
      - name: Install ruff
        run: python -m pip install "ruff==0.16.0"
      - name: ruff check
        run: ruff check . --output-format github
      - name: docker-compose.yml is valid
        run: docker compose config --quiet

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.11: the lowest version pyproject.toml accepts (requires-python).
        # 3.12: the Docker image and the version the README recommends.
        # 3.14: the version the project is developed on.
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/all.txt
            pyproject.toml
      # pycairo (reportlab[pycairo]) has no Linux wheels and is compiled.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel
          python -m pip install --index-url "$TORCH_INDEX_URL" torch torchaudio
          python -m pip freeze | grep -iE '^(torch|torchaudio)==' > "$RUNNER_TEMP/torch-constraints.txt"
          python -m pip install -c "$RUNNER_TEMP/torch-constraints.txt" -e ".[dev,test]"

      # Non-blocking: mypy reports several hundred errors at the time CI was
      # introduced (539 in src/agent_system + src/plugins). The step shows
      # them without failing the job; make it blocking once the count is 0.
      - name: Mypy (non-blocking)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m mypy src/agent_system src/plugins

      # pytest.ini turns warnings into errors; the Python 3.14 deprecations
      # inside fastapi, starlette, chromadb and google-genai are ignored there by module.
      # The root conftest.py ends only processes carrying its own session's
      # marker, and orphans of sessions that provably ended.
      - name: Pytest (CI subset)
        run: |
          python -m pytest $CI_TEST_PATHS $CI_TEST_SKIP

  docker:
    name: Docker image
    # Building the image takes several minutes and GB of disk: on main and on
    # demand only, not on every pull request.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t scarabhive:ci .
      - name: Start and wait for the health check
        run: |
          # AUTH_SECRET_KEY: for a config.yaml that reads auth.secret_key from
          # "${AUTH_SECRET_KEY}"; unused while it holds a literal value.
          docker run -d --name scarabhive --init -p 127.0.0.1:8000:8000 \
            -e AUTH_SECRET_KEY="$(openssl rand -hex 32)" scarabhive:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' scarabhive)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' scarabhive)" = true ] || break
            sleep 10
          done
          docker logs scarabhive
          exit 1
      - name: Container logs
        if: always()
        run: docker logs scarabhive 2>&1 | tail -n 200 || true
