name: CI (bash validation)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install -e .[dev]
      - name: Verify console scripts
        run: |
          source .venv/bin/activate
          # Test that all MCP console scripts are available and working
          for script in mcp-duckduckgo-search mcp-google-search mcp-yahoo-finance mcp-twitter-search mcp-llm-router mcp-weather mcp-datetime mcp-web-research-agent mcp-web-scraper mcp-http-server; do
            echo "Testing $script --help"
            if ! $script --help > /dev/null 2>&1; then
              echo "ERROR: $script failed"
              exit 1
            fi
          done
          echo "All console scripts verified successfully"
      - name: Run basic validation
        run: |
          source .venv/bin/activate
          # Basic validation that the package can be imported
          python -c "import agent_system; print('Package import successful')"
        shell: bash
