name: CI - real plugin integration

on:
  push:
    paths:
      - 'tests/fixtures/real_plugin/**'
      - 'tests/test_mcp_real_plugin_install.py'
      - '.github/workflows/ci-real-plugin.yml'
  workflow_dispatch: {}

jobs:
  real-plugin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Create venv
        run: |
          python -m venv .venv; .venv/bin/python -m pip install --upgrade pip
      - name: Install project with dev extras
        run: |
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run real plugin integration test
        run: |
          .venv/bin/python -m pytest tests/test_mcp_real_plugin_install.py -q | tee pytest-output.txt
      - name: Upload pytest output
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
