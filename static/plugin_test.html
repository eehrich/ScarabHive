<!DOCTYPE html>
<html>
<head>
    <title>Plugin Manager Test</title>
    <style>
        .header-buttons { 
            padding: 20px; 
            border: 2px solid #ccc;
            margin: 20px;
        }
        .plugin-button {
            margin: 5px;
            padding: 10px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Plugin Manager Test</h1>
    
    <div class="header-buttons">
        <button>Existing Button 1</button>
        <button>Existing Button 2</button>
        <!-- Plugin buttons will be dynamically inserted here -->
    </div>
    
    <div id="log"></div>
    
    <script>
        // Simple logging function
        function log(message) {
            console.log(message);
            document.getElementById('log').innerHTML += '<p>' + message + '</p>';
        }
        
        window.AgentSystem = window.AgentSystem || {};
        
        window.AgentSystem.PluginManager = {
            plugins: new Map(),
            
            async init() {
                log('Initializing Plugin Manager...');
                try {
                    await this.loadPlugins();
                    this.createPluginButtons();
                } catch (error) {
                    log('Failed to initialize Plugin Manager: ' + error.message);
                }
            },
            
            async loadPlugins() {
                try {
                    log('Fetching plugins from /api/plugins/ui');
                    const response = await fetch('/api/plugins/ui');
                    if (!response.ok) {
                        throw new Error(`Failed to fetch plugins: ${response.status}`);
                    }
                    
                    const plugins = await response.json();
                    log(`Loaded ${plugins.length} plugins with UI: ` + JSON.stringify(plugins, null, 2));
                    
                    // Store plugins in map
                    this.plugins.clear();
                    plugins.forEach(plugin => {
                        this.plugins.set(plugin.id, plugin);
                    });
                    
                } catch (error) {
                    log('Error loading plugins: ' + error.message);
                    throw error;
                }
            },
            
            createPluginButtons() {
                log('Creating plugin buttons...');
                const headerButtons = document.querySelector('.header-buttons');
                if (!headerButtons) {
                    log('ERROR: Header buttons container not found');
                    return;
                }
                
                // Find the comment marker for plugin buttons
                const commentMarker = Array.from(headerButtons.childNodes).find(
                    node => node.nodeType === Node.COMMENT_NODE && 
                    node.textContent.trim().includes('Plugin buttons will be dynamically inserted here')
                );
                
                if (!commentMarker) {
                    log('WARNING: Comment marker not found, appending to end of header');
                }
                
                let buttonsCreated = 0;
                
                // Create buttons for each enabled plugin
                this.plugins.forEach(plugin => {
                    if (plugin.enabled) {
                        log(`Creating button for plugin: ${plugin.id}`);
                        const button = document.createElement('button');
                        button.className = 'plugin-button';
                        button.textContent = `${plugin.button_icon} ${plugin.button_text}`;
                        button.title = plugin.description || `Open ${plugin.name} plugin`;
                        
                        button.addEventListener('click', () => {
                            log(`Plugin button clicked: ${plugin.id}`);
                            this.handlePluginClick(plugin);
                        });
                        
                        if (commentMarker) {
                            // Insert after the comment marker
                            headerButtons.insertBefore(button, commentMarker.nextSibling);
                        } else {
                            // Append to the end
                            headerButtons.appendChild(button);
                        }
                        
                        buttonsCreated++;
                    }
                });
                
                log(`Created ${buttonsCreated} plugin buttons`);
            },
            
            handlePluginClick(plugin) {
                log(`Handling click for plugin: ${plugin.id}`);
                alert(`Plugin ${plugin.name} clicked! Panel endpoint: ${plugin.panel_endpoint}`);
            }
        };
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            log('DOM loaded, initializing plugin manager...');
            window.AgentSystem.PluginManager.init();
        });
    </script>
</body>
</html>
