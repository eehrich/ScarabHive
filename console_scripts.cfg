# The commands `pip install` creates, read by pyproject.toml
# ([tool.setuptools.dynamic] entry-points). console_scripts.private.cfg, where
# it exists, continues this section: keep [console_scripts] the last one here.
[console_scripts]
agent-cli = agent_system.agent_cli:main
agent-run = agent_system.agent_run:main
agent-api = agent_system.app:run
validate-agents = scripts.validate_agent_configs:main
tool-duckduckgo-search = plugins.duckduckgo_search.__main__:cli_main
tool-twitter-search = plugins.twitter_search.__main__:cli_main
tool-llm-router = plugins.llm_router.__main__:cli_main
tool-weather = plugins.weather.__main__:cli_main
tool-datetime = plugins.datetime.__main__:cli_main
tool-web-scraper = plugins.web_scraper.__main__:cli_main
tool-http-server = plugins.http_server.__main__:cli_main
tool-basic-operations = plugins.basic_operations.__main__:cli_main
tool-file-ops = plugins.file_ops.__main__:main
tool-sqlite-query = plugins.sqlite_query.__main__:cli_main
audio-ops = plugins.audio_ops.__main__:main
