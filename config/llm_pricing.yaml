# OpenAI via OpenRouter — standard tier (endpoint tag `openai`), <=272K context.
# Routing in llm_openrouter.yaml: order: [openai], allow_fallbacks: false.
#
# service_tier: flex costs HALF of these values. Standard is listed anyway:
# the numbers apply only when usage_json.cost is missing, and a fallback should
# overestimate rather than underestimate. The third tier `openai/fast` costs
# double the standard price.
#
# GPT-5.6 and GPT-6: cache writes cost 1.25x input (cache_write = the 0.25x
# premium). Above 272K prompt tokens input doubles and output rises by half —
# not representable here.
# Source: developers.openai.com/api/docs/pricing
#
# Older models (gpt-5.4, gpt-5.4-mini, gpt-5, gpt-oss-120b) stay listed: the
# cost analysis also covers old DB rows.
#
# Source: GET /api/v1/models/<slug>/endpoints, tag `openai`. Prices there are
# AFTER discount; the discount is in the field `pricing.discount`.
# Regular = price / (1 - discount) — that is what is listed here.
# /api/v1/models does not show the field.
