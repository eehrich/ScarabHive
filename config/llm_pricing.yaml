# =============================================================================
# OpenRouter — Fallback prices (prefer usage_json.cost from API response)
# These are only used when the response doesn't include actual billed cost.
# =============================================================================

# Gemini via OpenRouter — cache read = 0.1x of input price
google/gemini-3-flash-preview:
  input: 0.50
  output: 3.00
