# LLM Pricing Configuration (per 1M tokens)
# Used by writer-costs.exe / analyze_costs.py for cost calculation.
#
# For OpenRouter models: actual billed cost comes from usage_json.cost in the
# response — these values are only used as fallback when that field is missing.
#
# For direct API models (DeepSeek, Google Gemini SDK, Anthropic, OpenAI):
# these prices are used directly since the API response doesn't include a cost field.
#
# Fields:
#   input:        cost per 1M input tokens
#   output:       cost per 1M output tokens
#   cached_input: cost per 1M cached input tokens (optional, defaults to input price)
#   batch_discount: multiplier for batch API pricing (e.g. 0.5 = 50% off). Optional.
#                   Applied when provider in DB starts with "batch_" (e.g. batch_gemini).
#
# Last updated: 2026-09-07

# =============================================================================
# DeepSeek — Direct API (api.deepseek.com)
# Both models are DeepSeek-V3.2 (chat = non-thinking, reasoner = thinking mode)
# Pricing: https://api-docs.deepseek.com/quick_start/pricing
# =============================================================================
deepseek-chat:
  input: 0.28
  output: 0.42
  cached_input: 0.028

deepseek-reasoner:
  input: 0.28
  output: 0.42
  cached_input: 0.028

