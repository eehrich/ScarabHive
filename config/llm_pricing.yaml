# OpenAI via OpenRouter — Standard-Tier (Endpunkt-Tag `openai`), ≤272K Kontext.
# Routing in llm_openrouter.yaml: order: [openai], allow_fallbacks: false.
#
# Wir fahren service_tier: flex, und das kostet die HÄLFTE dieser Werte
# (gemessen 07.09.2026 an gpt-6-astra: 9 in / 5 out = $0.000170 = 5/25 statt
# 10/50). Hier steht trotzdem Standard: die Zahlen greifen nur, wenn
# usage_json.cost fehlt, und ein Fallback soll eher zu hoch als zu niedrig
# schätzen. Die dritte Stufe `openai/fast` kostet das Doppelte von Standard.
#
# GPT-5.6 und GPT-6: Cache-Writes kosten das 1,25-fache des Inputs
# (cache_write = der Aufschlag 0.25x). Ueber 272K Prompt-Tokens verdoppelt
# sich der Input und der Output steigt um die Haelfte — nicht abbildbar.
# Quelle: developers.openai.com/api/docs/pricing, Stand 2026-09-16.
#
# Konfiguriert sind die latest-Aliase weiter unten; die vier Einträge
# gpt-5.6-*/gpt-6-astra sind ihre Ziele. Was darüber steht
# (gpt-5.4, gpt-5.4-mini, gpt-5, gpt-oss-120b) läuft nicht mehr, bleibt aber:
# die Kostenauswertung rechnet auch über alte DB-Zeilen.
#
# Quelle: GET /api/v1/models/<slug>/endpoints, Tag `openai`. Die Preise dort
# sind NACH Rabatt; der Rabatt steht im Feld `pricing.discount` (sol: 0.5).
# Regulaer = Preis / (1 - discount) — das steht hier. /api/v1/models zeigt
# das Feld nicht.
openai/gpt-5.4:
  input: 2.50
  output: 15.00
  cached_input: 0.25

openai/gpt-5.4-mini:
  input: 0.75
  output: 4.50
  cached_input: 0.075

openai/gpt-5:
  input: 1.25
  output: 10.00
  cached_input: 0.125

openai/gpt-oss-120b:
  input: 0.039
  output: 0.19

openai/gpt-5.6-luna:
  input: 0.20
  output: 1.20
  cached_input: 0.02
  cache_write: 0.05

openai/gpt-5.6-terra:
  input: 2.00
  output: 12.00
  cached_input: 0.20
  cache_write: 0.50

# ⚠️ Regulärer Preis. OpenRouter rechnet sol mit „50% off" ab (2.00/10.00),
