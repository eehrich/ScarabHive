# Doppelte; hier steht der Grundpreis ausserhalb dieser Zeiten.
# deepseek-chat/-reasoner: bis 2026-04 V3.2, danach Alias auf v4-flash,
# abgekuendigt zum 2026-07-24. Die Zeilen bleiben fuer alte DB-Eintraege.
# =============================================================================
