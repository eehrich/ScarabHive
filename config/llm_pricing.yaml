# OpenAI via OpenRouter — Standard-Tier (Endpunkt-Tag `openai`), ≤272K Kontext.
# Routing in llm_openrouter.yaml: order: [openai], allow_fallbacks: false.
#
# Wir fahren service_tier: flex, und das kostet die HÄLFTE dieser Werte
# (gemessen 07.09.2026 an gpt-6-astra: 9 in / 5 out = $0.000170 = 5/25 statt
# 10/50). Hier steht trotzdem Standard: die Zahlen greifen nur, wenn
# usage_json.cost fehlt, und ein Fallback soll eher zu hoch als zu niedrig
# schätzen. Die dritte Stufe `openai/fast` ist das Vierfache.
#
# Die vier Einträge unten sind die konfigurierten Modelle. Was darüber steht
# (gpt-5.4, gpt-5.4-mini, gpt-5, gpt-oss-120b) läuft nicht mehr, bleibt aber:
# die Kostenauswertung rechnet auch über alte DB-Zeilen.
#
# Quelle: GET /api/v1/models/<slug>/endpoints, Tag `openai` — ABER die API
# kennt zeitlich begrenzte Rabatte nicht und liefert den Aktionspreis als
# wäre er der reguläre (siehe sol). Hier stehen reguläre Preise; wer die
# Werte prüft, gleicht mit der Modellseite ab, nicht mit der API.
openai/gpt-5.4:
  input: 1.25
  output: 7.50
  cached_input: 0.125

openai/gpt-5.4-mini:
  input: 0.75
  output: 4.50
  cached_input: 0.075

openai/gpt-5:
  input: 1.25
  output: 10.00
  cached_input: 0.125

openai/gpt-oss-120b:
  input: 0.039
  output: 0.19

openai/gpt-5.6-luna:
  input: 0.20
  output: 1.20
  cached_input: 0.02

openai/gpt-5.6-terra:
  input: 2.00
  output: 12.00
  cached_input: 0.20

# ⚠️ Regulärer Preis. OpenRouter listet sol mit „50% off" bei 2.00/10.00 —
# eine Aktion ohne genanntes Enddatum, und die API verschweigt sie: weder
# /models noch /endpoints tragen einen Rabatt-Hinweis, dort steht nur der
# ermäßigte Wert. Nur die Modellseite zeigt beides nebeneinander. Wer die
# Preise per Skript nachzieht, holt sich also stillschweigend den Aktionspreis.
openai/gpt-5.6-sol:
  input: 4.00
  output: 20.00
  cached_input: 0.40

openai/gpt-6-astra:
  input: 10.00
  output: 50.00
  cached_input: 1.00

