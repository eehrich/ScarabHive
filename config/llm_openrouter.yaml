# =============================================================================
# OPENROUTER LLM MODELS
# =============================================================================
# OpenRouter provides unified access to 400+ AI models with higher rate limits
# and automatic fallback/load balancing across providers.
#
# Get your API key from: https://openrouter.ai/keys
# View pricing & models: https://openrouter.ai/models
# Docs: https://openrouter.ai/docs
#
# Benefits:
# - Higher rate limits than direct API access (especially for Gemini Tier 1)
# - Automatic fallback when providers are down
# - Single API for multiple providers
# - OpenAI-compatible API (use openai_httpx provider)
#
# Rate Limits:
# - Free tier: 20 requests/minute
# - With $10+ credit: 1000 free-tier requests/day
# =============================================================================

llm_system:
  models:
    # ---------------------------------------------------------------------------
    # GOOGLE GEMINI MODELS via OpenRouter
    # ---------------------------------------------------------------------------
    
    openrouter-gemini-3-flash:
      provider: openai_httpx
      model: google/gemini-3-flash-preview
      api_key: "***REMOVED***"  # Replace with your OpenRouter API key
      base_url: https://openrouter.ai/api/v1
      context_window: 200000  # 1M token context, but limited here for performance
      request_timeout: 240
      thinking_level: high
      max_tokens: 16384
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true  # Native image/audio/video processing

    openrouter-gemini-3-flash-minimal:
      provider: openai_httpx
      model: google/gemini-3-flash-preview
      api_key: "***REMOVED***"  # Replace with your OpenRouter API key
      base_url: https://openrouter.ai/api/v1
      context_window: 200000  # 1M token context, but limited here for performance
      request_timeout: 240
      thinking_level: minimal
      max_tokens: 16384
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true  # Native image/audio/video processing

      # Notes:
      # - Fast and cost-effective thinking model
      # - Optimized for agentic workflows, multi-turn chat, coding
      # - Native audio/video/PDF processing without transcription
      # - Higher rate limits than direct Google API at Tier 1
      # - Pricing: ~$0.30 input / ~$2.50 output per 1M tokens

    openrouter-gemini-3-flash-unlimited:
      provider: openai_httpx
      model: google/gemini-3-flash-preview
      api_key: "***REMOVED***"  # Replace with your OpenRouter API key
      base_url: https://openrouter.ai/api/v1
      context_window: 200000
      request_timeout: 400
      thinking_level: high
      max_tokens: 0  # No limit - let provider decide (for large structured outputs)
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true

      # Notes:
      # - Same as openrouter-gemini-3-flash but WITHOUT output token limit
      # - Use for testing/budget-conscious large structured output tasks
      # - Pricing: ~$0.30 input / ~$2.50 output per 1M tokens

    openrouter-gemini-3-pro:
      provider: openai_httpx
      model: google/gemini-3.1-pro-preview
      api_key: "***REMOVED***"  # Replace with your OpenRouter API key
      base_url: https://openrouter.ai/api/v1
      context_window: 200000  # 1M token context, but limited here for performance
      request_timeout: 300
      thinking_level: high
      max_tokens: 16384
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true  # Native image/audio/video processing

      # Notes:
      # - Google's flagship frontier model
      # - Best-in-class multimodal reasoning (text, image, video, audio, code)
      # - Premium quality for complex reasoning tasks
      # - Higher rate limits than direct Google API at Tier 1
      # - Pricing: ~$2 input / ~$12 output per 1M tokens

    openrouter-gemini-3-pro-unlimited:
      provider: openai_httpx
      model: google/gemini-3.1-pro-preview
      api_key: "***REMOVED***"  # Replace with your OpenRouter API key
      base_url: https://openrouter.ai/api/v1
      context_window: 200000
      request_timeout: 600
      thinking_level: high
      max_tokens: 0  # No limit - let provider decide (for large structured outputs)
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true

      # Notes:
      # - Same as openrouter-gemini-3-pro but WITHOUT output token limit
      # - Use for tasks with unpredictably large outputs (e.g. full story design JSON)
      # - Pricing: ~$2 input / ~$12 output per 1M tokens

    # ---------------------------------------------------------------------------
    # ANTHROPIC CLAUDE MODELS via OpenRouter
    # ---------------------------------------------------------------------------

    openrouter-claude-sonnet:
      provider: openai_httpx
      model: anthropic/claude-sonnet-4-6
      api_key: "***REMOVED***"
      base_url: https://openrouter.ai/api/v1
      context_window: 200000
      request_timeout: 240
      max_tokens: 16384
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true

      # Notes:
      # - Claude Sonnet 4.5 without Extended Thinking (no thinking tokens billed)
      # - Best for creative writing: scene generation, voice matching, story design
      # - Pricing: ~$3 input / ~$15 output per 1M tokens via OpenRouter

    openrouter-claude-sonnet-unlimited:
      provider: openai_httpx
      model: anthropic/claude-sonnet-4-6
      api_key: "***REMOVED***"
      base_url: https://openrouter.ai/api/v1
      context_window: 200000
      request_timeout: 240
      max_tokens: 0  # No limit - let provider decide
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true

      # Notes:
      # - Same as openrouter-claude-sonnet but WITHOUT output token limit
      # - Use for very long scene generation or full chapter rewrites


  # =============================================================================
  # PROFILES for easy access
  # =============================================================================
  profiles:
    or-gemini-flash:
      model_ref: openrouter-gemini-3-flash
      description: "OpenRouter Gemini 3 Flash - Fast with audio/video support"
      max_steps: 500

    or-gemini-flash-minimal:
      model_ref: openrouter-gemini-3-flash-minimal
      description: "OpenRouter Gemini 3 Flash - Minimal thinking level"
      max_steps: 500      

    or-gemini-flash-unlimited:
      model_ref: openrouter-gemini-3-flash-unlimited
      description: "OpenRouter Gemini 3 Flash - No output token limit (budget-friendly testing)"
      max_steps: 500

    or-gemini-pro:
      model_ref: openrouter-gemini-3-pro
      description: "OpenRouter Gemini 3 Pro - Best quality with audio/video support"
      max_steps: 500

    or-gemini-pro-unlimited:
      model_ref: openrouter-gemini-3-pro-unlimited
      description: "OpenRouter Gemini 3 Pro - No output token limit (for large structured outputs)"
      max_steps: 500

    or-claude-sonnet:
      model_ref: openrouter-claude-sonnet
      description: "OpenRouter Claude Sonnet 4.5 - Best for creative writing and scene generation"
      max_steps: 500

    or-claude-sonnet-unlimited:
      model_ref: openrouter-claude-sonnet-unlimited
      description: "OpenRouter Claude Sonnet 4.5 - No output token limit (for long scenes/rewrites)"
      max_steps: 500
    
