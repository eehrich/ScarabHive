# =============================================================================
# OPENROUTER MODELS
# =============================================================================
# Entries inherit from each other via `extends:` — see
# docs/llm_model_inheritance_konzept.md. Why a value is what it is (backend
# pins, fp8, cache keys): docs/llm_catalog.md
# =============================================================================

llm_system:
  models:

    # base class for all open router models
    openrouter-base:
      provider: openai_responses
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 272000      # independend of more conext size limit by default to 272K to avoid long context costs
      request_timeout: 600        # some models are really slow
      stream_silence_timeout: 900 # seconds of keep-alives only, then a retry
      max_tokens: 16384           # default limit to 16k
      include_thoughts: true    
      thinking_level: medium
      service_tier: flex          # use flex as std to save money
      
      capabilities:
        tools: true               # most models can handle tool calls nowadays
        function_calling: true    
        streaming: true           # enable streaming by default for better timeout handling
        json_mode: true           # not used atm
        image_input: false        # text only unless a child says otherwise
        audio_input: false
        video_input: false


    #
    # Gemini Models
    #

    openrouter-gemini:
      extends: openrouter-base
      prompt_cache_ttl_minutes: 5   # implicit cache, about 3-5 min, set by Google (not configurable); from 4096 prompt tokens
      context_window: 1048576     # Flash and Lite: full window, no long-context tier (Pro: below)
      tool_schema_dialect: gemini_function_declarations   # sonst MALFORMED_FUNCTION_CALL
      provider_routing: # make a defined order to avoid reasoning breaks
        # AI Studio first: measured 2026-10-01 replaying 30 calls of one agent
        # run, 2 runs each (docs/llm_catalog.md, "AI Studio vor Vertex").
        order:
        - google-ai-studio
        - google-vertex
        # Ohne diesen Riegel darf OpenRouter ueber die Liste hinaus ausweichen
        # — dann greift die definierte Reihenfolge nicht mehr, und der
        # Prompt-Cache des vorherigen Anbieters ist verloren. Faellt die Liste
        # aus, uebernimmt die llm_profile-Kette mit einem anderen Modell.
        allow_fallbacks: false

      # Kein safety_settings: OpenRouter laesst das Feld auf /responses fallen.
      # Wer eigene Schwellen braucht, nimmt die nativen gemini-3-*-Eintraege
      # (provider: gemini_sdk), die direkt mit Google reden. Warum das hier
      # nichts kostet: docs/llm_catalog.md

      capabilities:
        json_mode: true
        image_input: true
        audio_input: true
 

    openrouter-gemini-pro:
      extends: openrouter-gemini
      model: google/gemini-3.1-pro-preview
      context_window: 200000      # window 1M, but Pro costs double above 200K prompt tokens

    openrouter-gemini-pro-unlimited:
      extends: openrouter-gemini-pro
      max_tokens: 0

    openrouter-gemini-flash:
      extends: openrouter-gemini
      model: ~google/gemini-flash-latest
      thinking_level: medium

    openrouter-gemini-flash-minimal:
      extends: openrouter-gemini-flash
      max_tokens: 16384
      thinking_level: minimal

    openrouter-gemini-flash-unlimited:
      extends: openrouter-gemini-flash
      max_tokens: 0

    openrouter-gemini-flash-lite:
      extends: openrouter-gemini
      model: google/gemini-3.5-flash-lite
      max_tokens: 0
      thinking_level: low


    #
    # OpenAI Models
    #
    openrouter-gpt:
      extends: openrouter-base
      prompt_cache_ttl_minutes: 30  # fixed for GPT-5.6+/6 ("30m" is the only ttl OpenAI accepts); every hit renews it
      context_window: 272000      # window 1.05M, but above 272K prompt tokens input costs double
      provider_routing:
        order:
        - openai
        allow_fallbacks: false
      prompt_cache_key: auto
      capabilities:
        image_input: true

    openrouter-gpt-astra:
      extends: openrouter-gpt
      model: ~openai/gpt-astra-latest

    openrouter-gpt-astra-unlimited:
      extends: openrouter-gpt-astra
      max_tokens: 0

    # Terra is gone since GPT-6 (its alias stays on gpt-5.6-terra); Sol took its place.
    openrouter-gpt-sol:
      extends: openrouter-gpt
      model: ~openai/gpt-sol-latest
      max_tokens: 32768

    openrouter-gpt-sol-unlimited:
      extends: openrouter-gpt-sol
      max_tokens: 0

    openrouter-gpt-luna:
      extends: openrouter-gpt
      model: ~openai/gpt-luna-latest

    openrouter-gpt-luna-unlimited:
      extends: openrouter-gpt-luna
      max_tokens: 0

    # Non-thinking twin for mechanical text-in/text-out tasks (fallback of
    # the writer nothink role). Same pattern as
    # openrouter-deepseek-flash-nothinking: reasoning off, capabilities off.
    openrouter-gpt-luna-nothinking:
      extends: openrouter-gpt-luna
      thinking_level: none
      capabilities:
        tools: false
        function_calling: false
        streaming: false
        json_mode: false


    #
    # Anthropic models
    #

    openrouter-claude:
      extends: openrouter-base
      # Anthropic's default cache ttl, what our cache_control sends; every hit
      # renews it. 1 h (2x input per write) is not wired -- and on the Responses
      # route OpenRouter drops a cache_control that carries a ttl.
      prompt_cache_ttl_minutes: 5
      # Claude spricht cache_control, nicht die OpenAI-Breakpoints — und
      # OpenRouter reicht die nur ueber Chat Completions durch, nicht ueber
      # die Responses-API der Basis. Ohne beides laeuft Claude ohne Cache.
      provider: openai_httpx
      context_window: 1000000     # Claude 5.x: 1M at one price, no long-context tier
      prompt_cache_marker_style: anthropic
      reasoning_details_mode: keep_all   # sonst bricht das Cache-Praefix jede Runde
      include_thoughts: false     # Chat Completions liefert keine Thoughts
      capabilities:
        streaming: false
        image_input: true

    openrouter-claude-sonnet:
      extends: openrouter-claude
      model: ~anthropic/claude-sonnet-latest

    openrouter-claude-sonnet-unlimited:
      extends: openrouter-claude-sonnet
      max_tokens: 0

    openrouter-claude-opus:
      extends: openrouter-claude
      model: ~anthropic/claude-opus-latest

    openrouter-claude-opus-unlimited:
      extends: openrouter-claude-opus
      max_tokens: 0

    openrouter-claude-fable:
      extends: openrouter-claude
      model: ~anthropic/claude-fable-latest

    openrouter-claude-fable-unlimited:
      extends: openrouter-claude-fable  
      max_tokens: 0
      
    #
    # Deepseek Models
    #

    openrouter-deepseek:
      extends: openrouter-base
      context_window: 1000000
      provider_routing:
        order:
        - deepinfra
        - baidu
        allow_fallbacks: false

      max_tokens: null
      service_tier: null

      capabilities:
        tools: true
        function_calling: true
        streaming: true
        json_mode: true

    openrouter-deepseek-flash:
      extends: openrouter-deepseek
      model: ~deepseek/deepseek-v4-flash-latest
      provider_routing:
        # deepinfra zuerst: bei unseren Cache-Raten rund halb so teuer wie
        # streamlake (0,080 vs 0,220 $/M Input). streamlake als Zwilling —
        # hoeherer Durchsatz und der guenstigste cache-read. baidu antwortet
        # mit 429. Beide fp8.
        order:
        - deepinfra
        - streamlake
        quantizations:
        - fp8
        allow_fallbacks: false

    # simple nothinking version of deepseek-flash for easy tasks
    openrouter-deepseek-flash-nothinking:
      extends: openrouter-deepseek-flash        
      thinking_level: none
      capabilities:
        tools: false
        function_calling: false
        streaming: false
        json_mode: false     

    openrouter-deepseek-pro:
      extends: openrouter-deepseek
      model: ~deepseek/deepseek-pro-latest
      provider_routing:
        order:
        - alibaba
        - deepinfra
        allow_fallbacks: false

    # V4.1 Flash (alias_target 24.09.2026: deepseek/deepseek-v4.1-flash).
    # Teurer als V4-Flash, billiger als Pro -- und seit 24.09. laeuft keine
    # Kette mehr auf Pro: dieses Modell traegt jetzt auch `think`,
    # `llm_writer_thinking`, den amiga_coder und die debate_forum-Panels.
    # Die Pro-Knoten und -Profile stehen weiter da, benutzt sie nur niemand.
    #
    # Gepinnt auf die zwei guenstigsten fp8-Anbieter, $/M in/out/cache-read
    # (OpenRouter-Endpunkte 24.09.2026):
    #   deepinfra  0.140 / 0.420 / 0.0042
    #   streamlake 0.199 / 0.794 / 0.0040
    # Billiger sind nur fp4 (openinference/relace 0.100/0.500) und Anbieter
    # ohne genannte Quantisierung (morph 0.128/0.510, wafer 0.099/0.600 --
    # dessen cache-read 0.06 frisst den Vorteil bei unserem wiederholten
    # Kontext wieder auf). fireworks (0.220/0.660) war der alte Zwilling und
    # ist teurer als streamlake; der quantizations-Filter, der ihn frueher
    # herausgehalten haette, kann damit wieder stehen.
    openrouter-deepseek-latest-flash:
      extends: openrouter-deepseek
      model: ~deepseek/deepseek-flash-latest
      provider_routing:
        order:
        - deepinfra
        - streamlake
        quantizations:
        - fp8
        allow_fallbacks: false


    #
    # Misc models
    #

    openrouter-grok:
      extends: openrouter-base
      model: ~x-ai/grok-latest
      context_window: 200000      # window 500K, but double price above 200K prompt tokens

    openrouter-grok-unlimited:
      extends: openrouter-grok
      max_tokens: 0


    openrouter-qwen3.8-27B:
      extends: openrouter-base
      model: qwen/qwen3.8-27b
      context_window: 262144
      max_tokens: 65535
      provider_routing:
        order:
        - akashml
        - chutes
        quantizations:
        - fp8
      capabilities:
        image_input: true
        audio_input: true
        video_input: true
        
    openrouter-minimax-m3:
      extends: openrouter-base
      model: minimax/minimax-m3
      context_window: 524288      # the minimax endpoint's limit (prompt included)
      provider_routing:
        order:
        - minimax
        allow_fallbacks: false
      capabilities:
        image_input: true

    openrouter-minimax-m3-unlimited:
      extends: openrouter-minimax-m3
      max_tokens: 0

    openrouter-glm:
      extends: openrouter-base
      model: z-ai/glm-5.3
      context_window: 1000000     # no price tier; OpenRouter only routes to endpoints the request fits
      capabilities:
        image_input: true

    openrouter-glm-unlimited:
      extends: openrouter-glm
      max_tokens: 0

    # Benchmark-Kandidaten fuer den Kapitel-Scorer (13.09.2026, siehe
    # writer_pipeline_v4/docs/v4_issue_codes_uebersicht.md).
    openrouter-glm-flash:
      extends: openrouter-base
      model: ~z-ai/glm-flash-latest
      context_window: 1000000     # no price tier, as glm
      # openrouter-base setzt 16384 — die laengsten Scorer-Laeufe kamen auf 15.3k
      max_tokens: 0

    openrouter-kimi-k3:
      extends: openrouter-base
      model: moonshotai/kimi-k3
      context_window: 1000000     # no price tier; OpenRouter only routes to endpoints the request fits
      capabilities:
        image_input: true

    # Special Purpose Models: jev is NOT here -- it answers questions instead
    # of chatting (POST /api/alpha/decisions, "chat completions SDKs will not
    # work with it"), so it lives under decision_models: at the end of this
    # file, the way tts_models: sits next to models: in llm.yaml.

  # =============================================================================
  # PROFILES for easy access
  # =============================================================================
  profiles:
    or-gemini-flash-lite:
      model_ref: openrouter-gemini-flash-lite
      description: "OpenRouter Gemini Flash Lite"
      max_steps: 500

    or-gemini-flash:
