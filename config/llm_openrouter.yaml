      api_key: "${OPENROUTER_API_KEY}"
      base_url: https://openrouter.ai/api/v1
      context_window: 100000
      request_timeout: 600
      thinking_level: high
      service_tier: flex          # Google "Flex Processing" — cheaper, slower (longer queue). Remove or set to "standard" for normal-speed billing.
      provider_routing:           # Fix #515: sticky-backend für DeepSeek-Cache.
        order: ["deepinfra", "baidu", "gmicloud"]
      max_tokens: 16384
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true

      # Notes:
      # - DeepSeek V4 Flash, thinking mode enabled via reasoning.effort=high
      # - Same model as openrouter-deepseek-chat, just with reasoning toggled on
      # - Use for tasks that benefit from extended chain-of-thought

    openrouter-deepseek-reasoner-unlimited:
      extends: openrouter-deepseek-reasoner
      max_tokens: 0

