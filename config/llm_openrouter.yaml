# =============================================================================
# OPENROUTER MODELS
# =============================================================================
# Entries inherit from each other via `extends:` — see
# docs/llm_model_inheritance_konzept.md. Why a value is what it is (backend
# pins, fp8, cache keys): docs/llm_catalog.md
# =============================================================================

llm_system:
  models:

    openrouter-gemini-3.7-flash-minimal:
      extends: openrouter-gemini-3.7-flash
      context_window: 200000
      max_tokens: 16384
      thinking_level: minimal

    openrouter-gemini-3.7-flash-unlimited:
      extends: openrouter-gemini-3.7-flash
      context_window: 200000
      max_tokens: 0
      thinking_level: high

    openrouter-gemini-3.5-flash-lite:
      extends: openrouter-gemini-3-pro
      model: google/gemini-3.5-flash-lite
      context_window: 400000
      max_tokens: 32768
      thinking_level: low

    openrouter-gemini-3.7-flash:
      extends: openrouter-gemini-3-pro
      model: google/gemini-3.7-flash
      context_window: 400000
      max_tokens: 32768
      thinking_level: medium

    openrouter-gemini-3-pro:
      provider: openai_responses
      model: google/gemini-3.1-pro-preview
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 200000
      request_timeout: 600
      max_tokens: 16384
      thinking_level: high
      service_tier: flex
      provider_routing:
        order:
        - google-vertex
        - google-ai-studio
      safety_settings:
        HARM_CATEGORY_SEXUALLY_EXPLICIT: BLOCK_NONE
        HARM_CATEGORY_DANGEROUS_CONTENT: BLOCK_ONLY_HIGH
        HARM_CATEGORY_HARASSMENT: BLOCK_ONLY_HIGH
        HARM_CATEGORY_HATE_SPEECH: BLOCK_ONLY_HIGH
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true

    openrouter-gemini-3-pro-unlimited:
      extends: openrouter-gemini-3-pro
      max_tokens: 0

    openrouter-grok-4.1-fast:
      provider: openai_httpx
      model: x-ai/grok-4.1-fast
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 200000
      request_timeout: 600
      max_tokens: 16384
      service_tier: flex
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true

    openrouter-grok-4.1-fast-unlimited:
      extends: openrouter-grok-4.1-fast
      max_tokens: 0

    openrouter-qwen3.7-flash:
      provider: openai_httpx
      model: qwen/qwen3.7-flash
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 1000000
      request_timeout: 600
      max_tokens: 16384
      service_tier: flex
      capabilities:
        tools: true
        function_calling: true
        streaming: true
        json_mode: true

    openrouter-minimax-m3:
      provider: openai_httpx
      model: minimax/minimax-m3
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 1000000
      request_timeout: 600
      max_tokens: 16384
      service_tier: flex
      provider_routing:
        order:
        - minimax
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true

    openrouter-minimax-m3-unlimited:
      extends: openrouter-minimax-m3
      max_tokens: 0

    openrouter-llama-4-maverick:
      provider: openai_httpx
      model: meta-llama/llama-4-maverick
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 200000
      request_timeout: 600
      max_tokens: 16384
      service_tier: flex
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true

    openrouter-gpt-5.4:
      extends: openrouter-gpt-5.6-sol
      model: openai/gpt-5.4
      thinking_level: null

    openrouter-gpt-5.4-unlimited:
      extends: openrouter-gpt-5.4
      max_tokens: 0

    openrouter-gpt-5.4-mini:
      extends: openrouter-gpt-5.4
      model: openai/gpt-5.4-mini
      context_window: 400000

    openrouter-gpt-5.4-mini-unlimited:
      extends: openrouter-gpt-5.4-mini
      max_tokens: 0

    openrouter-gpt-5.6-sol:
      provider: openai_responses
      model: openai/gpt-5.6-sol
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 272000
      request_timeout: 600
      max_tokens: 16384
      thinking_level: medium
      service_tier: flex
      provider_routing:
        order:
        - openai
        allow_fallbacks: false
      prompt_cache_key: auto
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true

    openrouter-gpt-5.6-sol-unlimited:
      extends: openrouter-gpt-5.6-sol
      max_tokens: 0
      thinking_level: max

    openrouter-gpt-5.6-terra:
      extends: openrouter-gpt-5.6-sol
      model: openai/gpt-5.6-terra
      max_tokens: 32768

    openrouter-gpt-5.6-terra-unlimited:
      extends: openrouter-gpt-5.6-terra
      max_tokens: 0
      thinking_level: max

    openrouter-gpt-5.6-luna:
      extends: openrouter-gpt-5.6-sol
      model: openai/gpt-5.6-luna

    openrouter-gpt-5.6-luna-responses:
      extends: openrouter-gpt-5.6-luna
      thinking_level: max

    openrouter-gpt-5.6-luna-unlimited:
      extends: openrouter-gpt-5.6-luna
      max_tokens: 0
      thinking_level: max

    openrouter-gpt-oss-120b:
      provider: openai_httpx
      model: openai/gpt-oss-120b
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 131072
      request_timeout: 600
      max_tokens: 16384
      service_tier: flex
      reasoning_details_mode: keep_all
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: false

    openrouter-gpt-oss-120b-unlimited:
      extends: openrouter-gpt-oss-120b
      max_tokens: 0

    openrouter-claude-sonnet:
      provider: openai_httpx
      model: anthropic/claude-sonnet-5
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 200000
      request_timeout: 600
      max_tokens: 16384
      service_tier: flex
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true

    openrouter-claude-sonnet-unlimited:
      extends: openrouter-claude-sonnet
      max_tokens: 0

    openrouter-deepseek-flash-latest:
      extends: openrouter-deepseek-reasoner
      model: ~deepseek/deepseek-v4-flash-latest
      context_window: 1000000
      max_tokens: null
      thinking_level: null
      service_tier: null
      provider_routing:
        order:
        - streamlake
        - deepinfra
        - baidu
        quantizations:
        - fp8
      capabilities:
        streaming: true

    openrouter-deepseek-pro-0813:
      extends: openrouter-deepseek-reasoner
      model: deepseek/deepseek-v4-pro-0813
      context_window: 1000000
      max_tokens: null
      service_tier: null
      provider_routing:
        order:
        - deepseek
        - alibaba
        allow_fallbacks: false

    openrouter-deepseek-chat:
      extends: openrouter-deepseek-reasoner
      thinking_level: null

    openrouter-deepseek-chat-unlimited:
      extends: openrouter-deepseek-chat
      max_tokens: 0

    openrouter-deepseek-reasoner:
      provider: openai_httpx
      model: deepseek/deepseek-v4-flash
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 100000
      request_timeout: 600
      max_tokens: 16384
      thinking_level: high
      service_tier: flex
      provider_routing:
        order:
        - deepinfra
        - baidu
        - gmicloud
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true

    openrouter-deepseek-reasoner-unlimited:
      extends: openrouter-deepseek-reasoner
      max_tokens: 0

    openrouter-glm-5.2:
      provider: openai_httpx
      model: z-ai/glm-5.2
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 1000000
      request_timeout: 600
      max_tokens: 16384
      thinking_level: high
      service_tier: flex
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: false

    openrouter-glm-5.2-unlimited:
      extends: openrouter-glm-5.2
      max_tokens: 0

    openrouter-kimi-k3:
      provider: openai_httpx
      model: moonshotai/kimi-k3
      api_key: ${OPENROUTER_API_KEY}
      base_url: https://openrouter.ai/api/v1
      context_window: 1000000
      request_timeout: 600
      max_tokens: 16384
      thinking_level: high
      service_tier: flex
      capabilities:
        tools: true
        function_calling: true
        streaming: true
        json_mode: true
        multimodal: true
  # =============================================================================
  # PROFILES for easy access
  # =============================================================================
