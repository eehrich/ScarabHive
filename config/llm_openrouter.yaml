    # ---------------------------------------------------------------------------
    # DEEPSEEK MODELS via OpenRouter (V4 aktuell; darunter Legacy chat/reasoner)
    # ---------------------------------------------------------------------------
    # DeepSeek V4 Flash and V4 Pro routed through OpenRouter for higher rate
    # limits and unified billing. The same V4-Flash model serves both
    # "chat" (non-thinking) and "reasoner" (thinking) modes — toggled via
    # thinking_level. V4-Pro is the larger flagship variant.

    # ------------------------------------------------------------------------
    # DEEPSEEK V4 via OpenRouter — moved off the direct API (DeepSeek raised
    # its direct prices substantially; direct now matches the
    # "deepseek"-Endpunkt unten). Flash ueber den LATEST-Alias, Pro gepinnt
    # pinned to 0813 — there is no latest alias for Pro.
    #
    # Anbieterliste Flash (Stand 2026-08-20, $/1M Token, guenstigste zuerst):
    #   Anbieter        input   output  cached   Quant
    #   open-inference  0.065   0.14    0.014    fp4
    #   relace          0.07    0.14    0.014    fp4
    #   decart          0.0765  0.153   0.0153   fp4
    #   streamlake      0.0784  0.1568  0.0157   fp8   <- order[0]
    #   baidu           0.0798  0.1596  0.0160   fp8   <- order[1]
    #   deepinfra       0.08    0.18    0.0160   fp8   <- order[2]
    #   deepseek        0.22    0.66    0.007    (Direct-Preis; billigster CACHE,
    #                                             aber 3x input / 4x output)
    # The three cheapest are fp4-QUANTISED. For prose that is a quality risk
    # not worth ~15% savings — which is why `order` starts at the cheapest
    # fp8 endpoint. To try fp4: put open-inference at position 0 and measure
    # on the book, not on the invoice.
    #
    # Anbieterliste Pro (12 Endpunkte):
    #   deepseek        0.66    1.98    0.022    <- order[0], billigster in ALLEN
    #   alibaba         0.726   2.178   0.0726   <- order[1]
    #   gmicloud        1.188   3.564   0.0396
    #   (Rest: 1.32 / 3.96)
    openrouter-deepseek-flash-latest:
      provider: openai_httpx
      model: "~deepseek/deepseek-v4-flash-latest"
      api_key: "${OPENROUTER_API_KEY}"
      base_url: https://openrouter.ai/api/v1
      # Matches the DIRECT deepseek entries in llm.yaml: this model is the
      # fallback behind them, and a fallback with a smaller window would
      # reject exactly the long conversations that need rescuing.
      # Measured against the pinned endpoints (2026-08-20): streamlake 1.024M,
      # baidu/deepinfra 1.048M context. The older or-deepseek entries declare
      # 100k — THOSE are the understatement, not this value; too small a
      # window would fire the summarizer 10x too early.
      context_window: 1000000
      request_timeout: 600
      provider_routing:
        # Cheapest fp8 first; sticky order keeps the backend-local prompt
        # cache warm, same rationale as #515.
        # baidu LAST: it caps output at 131072 while streamlake/deepinfra
        # allow 384000 — three v4 scorers request 262144 via llm_params and
        # would 400 on baidu (review finding B4).
        order: ["streamlake", "deepinfra", "baidu"]
        # ENFORCED, not preferred: without this a saturated pin re-routes
        # price-sorted — straight onto the fp4 endpoints the table above
        # rules out for prose. Review finding; order alone is a soft bias.
        quantizations: ["fp8"]
      # Deliberately NO max_tokens: the direct profiles this entry replaces
      # ran without a cap (provider default). A hard 16384 here silently
      # truncated long scenes/JSON — and reasoning would share that budget.
      # NOTE baidu caps output at 131072 and is therefore LAST in order;
      # requests beyond that 400 there and rely on the chain fallback.
      capabilities:
        tools: true
        function_calling: true
        # streaming: verified live 2026-08-20 against the pinned fp8
        # endpoints (20 delta chunks, clean text). Without this flag 12
        # interactive chains (chat_agent, slowak_tutor, the plugins.yaml
        # default for 93 servers) lost their token streaming whenever OR is
        # healthy — that is, in the normal case.
        streaming: true
        json_mode: true

    openrouter-deepseek-pro-0813:
      provider: openai_httpx
      model: deepseek/deepseek-v4-pro-0813
      api_key: "${OPENROUTER_API_KEY}"
      base_url: https://openrouter.ai/api/v1
      context_window: 1000000
      request_timeout: 600
      thinking_level: high
      provider_routing:
        # DeepSeek's own endpoint is the cheapest on ALL three axes here.
        order: ["deepseek", "alibaba"]
        # Hard pin: the next-cheapest endpoint costs 2x (1.32/3.96). If both
        # pins are down, the AGENT chain falls back (direct deepseek-pro),
        # which is the designed rescue path — not a silent 2x price jump.
        allow_fallbacks: false
      # No max_tokens for the same reason as the flash entry above — and
      # thinking_level=high shares whatever budget a cap would set.
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true

    openrouter-deepseek-chat:
      provider: openai_httpx
      model: deepseek/deepseek-v4-flash
