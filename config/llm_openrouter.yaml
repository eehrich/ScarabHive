      description: "OpenRouter Gemini Flash - Minimal thinking level"
      max_steps: 500      

    or-gemini-flash-unlimited:
      model_ref: openrouter-gemini-flash-unlimited
      description: "OpenRouter Gemini Flash - No output token limit"
      max_steps: 500

    or-gemini-pro:
      model_ref: openrouter-gemini-pro
      description: "OpenRouter Gemini Pro"
      max_steps: 500

    or-gemini-pro-unlimited:
      model_ref: openrouter-gemini-pro-unlimited
      description: "OpenRouter Gemini Pro - No output token limit"
      max_steps: 500

    or-claude-sonnet:
      model_ref: openrouter-claude-sonnet
      description: "OpenRouter Claude Sonnet"
      max_steps: 500

    or-claude-sonnet-unlimited:
      model_ref: openrouter-claude-sonnet-unlimited
      description: "OpenRouter Claude Sonnet - No output token limit"
      max_steps: 500

    or-claude-opus:
      model_ref: openrouter-claude-opus
      description: "OpenRouter Claude Opus"
      max_steps: 500

    or-claude-opus-unlimited:
      model_ref: openrouter-claude-opus-unlimited
      description: "OpenRouter Claude Opus - No output token limit"
      max_steps: 500      

    or-claude-fable:
      model_ref: openrouter-claude-fable
      description: "OpenRouter Claude Fable"
      max_steps: 500

    or-claude-fable-unlimited:
      model_ref: openrouter-claude-fable-unlimited
      description: "OpenRouter Claude Fable - No output token limit"
      max_steps: 500

    or-grok:
      model_ref: openrouter-grok
      description: "OpenRouter Grok"
      max_steps: 500

    or-grok-unlimited:
      model_ref: openrouter-grok-unlimited
      description: "OpenRouter Grok - No output token limit"
      max_steps: 500

    or-qwen-mini:
      model_ref: openrouter-qwen3.8-27B
      description: "OpenRouter Qwen3.8 27B" 
      max_steps: 500

    or-minimax-m3:
      model_ref: openrouter-minimax-m3
      description: "OpenRouter MiniMax M3"
      max_steps: 500

    or-minimax-m3-unlimited:
      model_ref: openrouter-minimax-m3-unlimited
