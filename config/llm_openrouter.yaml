      # not be verified" 400s. Migrated 2026-07-16.
      provider: openai_responses
      model: openai/gpt-5.4
      # Required from GPT-5.6 on for cache matching. Belongs to the
      # model, not to 31 agent files (moved here 2026-08-22).
      prompt_cache_key: "auto"
      provider_routing:           # Single-org pin: reasoning items are org-bound; azure would not verify them.
        order: ["openai"]
        allow_fallbacks: false   # On openai outage the agent-level fallback chain takes over.
      api_key: "${OPENROUTER_API_KEY}"
      base_url: https://openrouter.ai/api/v1
      context_window: 272000  # 1.05M total, but >272K doubles pricing
      request_timeout: 600
      service_tier: flex          # Google "Flex Processing" — cheaper, slower (longer queue). Remove or set to "standard" for normal-speed billing.
      max_tokens: 16384
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true

    openrouter-gpt-5.4-unlimited:
      extends: openrouter-gpt-5.4
      max_tokens: 0

    openrouter-gpt-5.4-mini:
