# =============================================================================
# OPENROUTER LLM MODELS
# =============================================================================
# OpenRouter provides unified access to 400+ AI models with higher rate limits
# and automatic fallback/load balancing across providers.
#
# Get your API key from: https://openrouter.ai/keys
# View pricing & models: https://openrouter.ai/models
# Docs: https://openrouter.ai/docs
#
# Benefits:
# - Higher rate limits than direct API access (especially for Gemini Tier 1)
# - Automatic fallback when providers are down
# - Single API for multiple providers
# - OpenAI-compatible API (use openai_httpx provider)
#
# Rate Limits:
# - Free tier: 20 requests/minute
# - With $10+ credit: 1000 free-tier requests/day
# =============================================================================

llm_system:
  models:
    # ---------------------------------------------------------------------------
    # GOOGLE GEMINI MODELS via OpenRouter
    # ---------------------------------------------------------------------------
    
    openrouter-gemini-3-flash:
      provider: openai_httpx
      model: google/gemini-3-flash-preview
      api_key: "***REMOVED***"  # Replace with your OpenRouter API key
      base_url: https://openrouter.ai/api/v1
      context_window: 200000  # 1M token context, but limited here for performance
      request_timeout: 600
      thinking_level: high
      service_tier: flex          # Google "Flex Processing" — cheaper, slower (longer queue). Remove or set to "standard" for normal-speed billing.
      provider_routing:           # Bias OpenRouter toward a sticky backend — keeps implicit prompt cache warm (cache is backend-local). Soft preference; falls back to other providers if listed ones are unavailable.
        order: ["google-vertex", "google-ai-studio"]
      max_tokens: 16384
      safety_settings:
        HARM_CATEGORY_SEXUALLY_EXPLICIT: BLOCK_NONE
        HARM_CATEGORY_DANGEROUS_CONTENT: BLOCK_ONLY_HIGH
        HARM_CATEGORY_HARASSMENT: BLOCK_ONLY_HIGH
        HARM_CATEGORY_HATE_SPEECH: BLOCK_ONLY_HIGH
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true  # Native image/audio/video processing

    openrouter-gemini-3-flash-minimal:
