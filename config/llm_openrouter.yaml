      max_steps: 500

    or-kimi-k3:
      model_ref: openrouter-kimi-k3
      description: "OpenRouter Kimi K3"
      max_steps: 500

  # =============================================================================
  # DECISION MODELS - a questionnaire, not a conversation
  # =============================================================================
  # Named questions in, a typed answer with a probability out. No messages, no
  # prose, no tools. OpenRouter's answer reports its own cost; a host whose
  # answer carries none (laya-serve, TypeSafe direct) needs a row in
  # llm_pricing.yaml under its `model`, or its spend counts as unknown.
  # Client: src/plugins/llm_decisions (provides_decisions).

  decision_models:
    jev:
      provider: openrouter_decisions
      model: ~typesafe/jev-latest   # router alias, follows the newest version;
                                    # OpenRouter's own example pins typesafe/jev-1.13
      # url: the WHOLE endpoint (nothing is appended), default
      #      https://openrouter.ai/api/alpha/decisions
      # api_key: defaults to the env var of that url's host (OPENROUTER_API_KEY)
    # A local model (Laya) lives in llm.yaml; the two sections are merged.

  decision_profiles:
    jev:
      model_ref: jev
      description: "TypeSafe Jev - decides, does not write"

  # Who judges when a caller names no profile.
  default_decision_profile: jev
