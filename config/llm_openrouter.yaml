      base_url: https://openrouter.ai/api/v1
      context_window: 100000
      request_timeout: 600
      service_tier: flex          # Google "Flex Processing" — cheaper, slower (longer queue). Remove or set to "standard" for normal-speed billing.
      provider_routing:           # Fix #515: sticky-backend für DeepSeek-Cache (cache ist backend-local). Reihenfolge per B196-Empirie (3 größte mit 31/111 Calls). Soft preference, falls Backend down → fallback.
        order: ["deepinfra", "baidu", "gmicloud"]
      max_tokens: 16384
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true

      # Notes:
      # - DeepSeek V4 Flash, non-thinking mode (chat)
      # - Cheap and fast for medium tasks
      # - See https://openrouter.ai/deepseek/deepseek-v4-flash

    openrouter-deepseek-chat-unlimited:
      extends: openrouter-deepseek-chat
      max_tokens: 0  # No limit - let provider decide

    openrouter-deepseek-reasoner:
      provider: openai_httpx
