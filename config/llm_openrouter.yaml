# =============================================================================
# OPENROUTER LLM MODELS
# =============================================================================
# OpenRouter provides unified access to 400+ AI models with higher rate limits
# and automatic fallback/load balancing across providers.
#
# Get your API key from: https://openrouter.ai/keys
# View pricing & models: https://openrouter.ai/models
# Docs: https://openrouter.ai/docs
#
# Benefits:
# - Higher rate limits than direct API access (especially for Gemini Tier 1)
# - Automatic fallback when providers are down
# - Single API for multiple providers
# - OpenAI-compatible API (use openai_httpx provider)
#
# Rate Limits:
# - Free tier: 20 requests/minute
# - With $10+ credit: 1000 free-tier requests/day
# =============================================================================

llm_system:
  models:
    # ---------------------------------------------------------------------------
    # GOOGLE GEMINI MODELS via OpenRouter
    # ---------------------------------------------------------------------------
    
    # The plain flash profile (or-gemini-flash) points at
    # openrouter-gemini-3.7-flash further down — 3.7 costs no more than
    # 3-flash-preview, so there is only ONE flash model left here.
    # The two variants differ from it in a single knob.

    openrouter-gemini-3.7-flash-minimal:
      # Difference from the parent: thinking_level minimal. Window/max_tokens
      # deliberately unchanged — a model swap must not drag the knobs along.
      extends: openrouter-gemini-3.7-flash
      context_window: 200000  # 1M token context, but limited here for performance
      thinking_level: minimal
      max_tokens: 16384

      # Notes:
      # - Fast and cost-effective thinking model
      # - Optimized for agentic workflows, multi-turn chat, coding
      # - Native audio/video/PDF processing without transcription
      # - Higher rate limits than direct Google API at Tier 1
      # - Pricing: ~$0.30 input / ~$2.50 output per 1M tokens

    openrouter-gemini-3.7-flash-unlimited:
      # Difference from the parent: max_tokens 0 (unlimited).
      extends: openrouter-gemini-3.7-flash
      context_window: 200000
      thinking_level: high
      max_tokens: 0  # No limit - let provider decide (for large structured outputs)



    openrouter-gemini-3.5-flash-lite:
      # Native Responses-API route: thought signatures ride as verbatim items
      # (no Chat-Completions bridging => no "Corrupted thought signature" 400s).
      # safety_settings pass through. Migrated 2026-07-24.
      provider: openai_responses
      model: google/gemini-3.5-flash-lite
      api_key: "${OPENROUTER_API_KEY}"
      base_url: https://openrouter.ai/api/v1
      context_window: 400000      # 1M token native; capped here for context-budget perf
      request_timeout: 600
      thinking_level: low         # Reduced from medium 2026-05-26 — Flash 3.5's decoder
                                  # collapses with MALFORMED_FUNCTION_CALL when long reasoning +
                                  # structured tool-call output (sequential_thinking thought
                                  # strings, image_compose spec JSON) land in the same turn
                                  # after a multi-MB vision input. `low` keeps reasoning
                                  # available for retry decisions but cuts the per-turn
                                  # reasoning-token pressure that triggers the failure.
      service_tier: flex          # Google "Flex Processing" — cheaper, slower (longer queue). Remove or set to "standard" for normal-speed billing.
      provider_routing:           # Bias OpenRouter toward a sticky backend — keeps implicit prompt cache warm (cache is backend-local). Soft preference; falls back to other providers if listed ones are unavailable.
        order: ["google-vertex", "google-ai-studio"]
      max_tokens: 32768           # Big complex tool-calls (image_compose_render specs with multiple SVG strings)
                                  # PLUS thinking PLUS function-call envelope can exceed 16k —
                                  # truncation mid-JSON causes MALFORMED_FUNCTION_CALL.
      safety_settings:
        HARM_CATEGORY_SEXUALLY_EXPLICIT: BLOCK_NONE
        HARM_CATEGORY_DANGEROUS_CONTENT: BLOCK_ONLY_HIGH
        HARM_CATEGORY_HARASSMENT: BLOCK_ONLY_HIGH
        HARM_CATEGORY_HATE_SPEECH: BLOCK_ONLY_HIGH
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true  # text/image/video/audio/PDF native



    openrouter-gemini-3.7-flash:
      provider: openai_responses
      model: google/gemini-3.7-flash
      api_key: "${OPENROUTER_API_KEY}"
      base_url: https://openrouter.ai/api/v1
      context_window: 400000      # 1M token native; capped here for context-budget perf
      request_timeout: 600
      thinking_level: medium       
      service_tier: flex 
      provider_routing:  
        order: ["google-vertex", "google-ai-studio"]
      max_tokens: 32768    
      safety_settings:
        HARM_CATEGORY_SEXUALLY_EXPLICIT: BLOCK_NONE
        HARM_CATEGORY_DANGEROUS_CONTENT: BLOCK_ONLY_HIGH
        HARM_CATEGORY_HARASSMENT: BLOCK_ONLY_HIGH
        HARM_CATEGORY_HATE_SPEECH: BLOCK_ONLY_HIGH
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true


    openrouter-gemini-3-pro:
      # Native Responses-API route: thought signatures ride as verbatim items
      # (no Chat-Completions bridging => no "Corrupted thought signature" 400s).
      # safety_settings pass through. Migrated 2026-07-24.
      provider: openai_responses
      model: google/gemini-3.1-pro-preview
      api_key: "${OPENROUTER_API_KEY}"  # Replace with your OpenRouter API key
      base_url: https://openrouter.ai/api/v1
      context_window: 200000  # 1M token context, but limited here for performance
      request_timeout: 600
      thinking_level: high
      service_tier: flex          # Google "Flex Processing" — cheaper, slower (longer queue). Remove or set to "standard" for normal-speed billing.
      provider_routing:           # Bias OpenRouter toward a sticky backend — keeps implicit prompt cache warm (cache is backend-local). Soft preference; falls back to other providers if listed ones are unavailable.
        order: ["google-vertex", "google-ai-studio"]
      max_tokens: 16384
      safety_settings:
        HARM_CATEGORY_SEXUALLY_EXPLICIT: BLOCK_NONE
        HARM_CATEGORY_DANGEROUS_CONTENT: BLOCK_ONLY_HIGH
        HARM_CATEGORY_HARASSMENT: BLOCK_ONLY_HIGH
        HARM_CATEGORY_HATE_SPEECH: BLOCK_ONLY_HIGH
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true  # Native image/audio/video processing

      # Notes:
      # - Google's flagship frontier model
      # - Best-in-class multimodal reasoning (text, image, video, audio, code)
      # - Premium quality for complex reasoning tasks
      # - Higher rate limits than direct Google API at Tier 1
      # - Pricing: ~$2 input / ~$12 output per 1M tokens

    openrouter-gemini-3-pro-unlimited:
      extends: openrouter-gemini-3-pro
      max_tokens: 0  # No limit - let provider decide (for large structured outputs)

      # Notes:
      # - Same as openrouter-gemini-3-pro but WITHOUT output token limit
      # - Use for tasks with unpredictably large outputs (e.g. full story design JSON)
      # - Pricing: ~$2 input / ~$12 output per 1M tokens

    # ---------------------------------------------------------------------------
    # XAI GROK MODELS via OpenRouter
    # ---------------------------------------------------------------------------

    openrouter-grok-4.1-fast:
      provider: openai_httpx
      model: x-ai/grok-4.1-fast
      api_key: "${OPENROUTER_API_KEY}"
      base_url: https://openrouter.ai/api/v1
      context_window: 200000
      request_timeout: 600
      service_tier: flex          # Google "Flex Processing" — cheaper, slower (longer queue). Remove or set to "standard" for normal-speed billing.
      max_tokens: 16384
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true

      # Notes:
      # - xAI's best agentic tool calling model (0.31% tool error rate)
      # - 2M native context, 124 tok/s throughput
      # - Reasoning can be toggled via reasoning.enabled parameter
      # - Pricing: $0.20 input / $0.50 output / $0.05 cached per 1M tokens

    openrouter-grok-4.1-fast-unlimited:
      extends: openrouter-grok-4.1-fast
      max_tokens: 0

    # ---------------------------------------------------------------------------
    # QWEN MODELS via OpenRouter
    # ---------------------------------------------------------------------------

    openrouter-qwen3.7-flash:
      provider: openai_httpx
      model: qwen/qwen3.7-flash
      api_key: "${OPENROUTER_API_KEY}"
      base_url: https://openrouter.ai/api/v1
      context_window: 1000000
      request_timeout: 600
      service_tier: flex          # Google "Flex Processing" — cheaper, slower (longer queue). Remove or set to "standard" for normal-speed billing.
      max_tokens: 16384
      capabilities:
        tools: true
        function_calling: true
        streaming: true
        json_mode: true


    # ---------------------------------------------------------------------------
    # Mini Max
    # ---------------------------------------------------------------------------


    openrouter-minimax-m3:
      provider: openai_httpx
      model: minimax/minimax-m3
      api_key: "${OPENROUTER_API_KEY}"
      base_url: https://openrouter.ai/api/v1
      context_window: 1000000
      request_timeout: 600
      service_tier: flex          # Google "Flex Processing" — cheaper, slower (longer queue). Remove or set to "standard" for normal-speed billing.
      provider_routing:           # Sticky backend — OpenRouter's implicit prompt cache is backend-local; without a pin the 9 minimax upstreams free-load-balance → cache rarely warm (~6%). Pinned, a repeated prefix hits ~99% cached (probed 2026-07). Soft preference; falls back on outage.
        order: ["minimax"]
      max_tokens: 16384
      capabilities:
        tools: true
        function_calling: true
        streaming: false
        json_mode: true
        multimodal: true  # Text + image + video input per OpenRouter listing

      # Notes:
      # - MiniMax M3: built on MiniMax Sparse Attention (MSA), 1M native context
      # - Tuned for multi-step agentic work and coding tasks (not single-turn)
      # - Pricing (with current 50% promo): $0.30 input / $1.20 output / $0.06 cache read per 1M tokens
      # - https://openrouter.ai/minimax/minimax-m3

    openrouter-minimax-m3-unlimited:
      extends: openrouter-minimax-m3
      max_tokens: 0

