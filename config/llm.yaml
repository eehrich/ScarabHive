      ollama_mode: openai_compat
      context_window: 20000 # for testing small context
      request_timeout: 180
      capabilities:
        tools: true
        function_calling: true
        streaming: true
        json_mode: true

  profiles:
    turbo:
      model_ref: gpt-5-nano
      description: "Turbo model for high-speed responses and cheap, but less powerful"
      max_steps: 100
    normal:
      model_ref: gpt-5-mini
      description: "Fast model for medium reasoning tasks"
      max_steps: 100
    think:
