llm_system:
  # Default HTTPX timeout configuration for all models
  # These can be overridden per model if needed
  httpx_timeouts:
    connect: 10.0      # Connection establishment timeout (seconds)
    read: 180.0        # Read timeout - waiting for response data (seconds)
    write: 10.0        # Write timeout - sending request data (seconds)
    pool: 5.0          # Pool timeout - getting connection from pool (seconds)

  models:
    gemini-2-5-flash:
      provider: gemini
      model: gemini-2.5-flash
      api_key: "***REMOVED***"
      base_url: https://generativelanguage.googleapis.com/v1beta
      context_window: 200000 # Gemini 2.5 Flash has 1M context, but limit it to 200k for $$$
      request_timeout: 240
      include_thoughts: true
      thinking_budget: 2048
      capabilities:
        tools: true
        function_calling: true
        image_input: true
        streaming: true  # Streams reasoning tokens via delta.reasoning
        json_mode: true
        supported_api_types: [chat_completions]
        default_api_type: chat_completions

    gemini-2-5-flash-nostream:
      provider: gemini
      model: gemini-2.5-flash
      api_key: "***REMOVED***"
      base_url: https://generativelanguage.googleapis.com/v1beta
      context_window: 200000 # Gemini 2.5 Flash has 1M context, but limit it to 200k for $$$
      request_timeout: 240
      include_thoughts: false
      thinking_budget: 2048
      capabilities:
        tools: true
        function_calling: true
        image_input: true
        streaming: false  # Streams reasoning tokens via delta.reasoning
        json_mode: true
        supported_api_types: [chat_completions]
        default_api_type: chat_completions

    gemini-3-0-pro:
      provider: gemini
      model: gemini-3-pro-preview
      api_key: "***REMOVED***"
      base_url: https://generativelanguage.googleapis.com/v1beta
      context_window: 200000  # Gemini 3 Pro Thinking: 1M context, limit to 200k
      request_timeout: 240
      include_thoughts: true
      thinking_budget: 8192
      capabilities:
        tools: true
        function_calling: true
        image_input: true
        streaming: true  # Streams reasoning tokens via delta.reasoning
        json_mode: true
        supported_api_types: [chat_completions]
        default_api_type: chat_completions

    gemini-3-0-pro-nostream:
      provider: gemini
      model: gemini-3-pro-preview
      api_key: "***REMOVED***"
      base_url: https://generativelanguage.googleapis.com/v1beta
      context_window: 200000  # Gemini 3 Pro Thinking: 1M context, limit to 200k
      request_timeout: 240
      include_thoughts: false
      thinking_budget: 8192
      capabilities:
        tools: true
        function_calling: true
        image_input: true
        streaming: false
        json_mode: true
        supported_api_types: [chat_completions]
        default_api_type: chat_completions

    gemini-2-5-flash-batch:
      provider: gemini
      model: gemini-2.5-flash
      api_key: "***REMOVED***"
      base_url: https://generativelanguage.googleapis.com/v1beta
      context_window: 200000  # Gemini 2.5 Flash has 1M context, but limit it to 200k for $$$
      request_timeout: 240
      include_thoughts: false
      thinking_budget: 2048
      capabilities:
        tools: true
        function_calling: true
        image_input: true
        streaming: false
        json_mode: true
        supported_api_types: [chat_completions]
        default_api_type: chat_completions
      batch:
        enabled: true
        collection_window_seconds: 30   # 1 minutes collection window
        max_requests_per_batch: 100     # Up to 100 requests per batch
        poll_interval_seconds: 10       # Check status every minute
        max_wait_hours: 24              # Max 24 hours for batch completion
        cancel_on_startup: false        
        fallback_to_sync: false         # Fall back to sync if batch fails
        storage_path: "data/batch_jobs" # Where to store batch job data

    gpt-4.1:
      provider: openai_httpx
      model: gpt-4.1
      api_key: ***REMOVED***
      context_window: 1000000
      request_timeout: 240
      capabilities:
        tools: true
        function_calling: true
        image_input: true
        audio_input: false
        video_input: false
        streaming: true
        json_mode: true
        supported_api_types: [chat_completions]
        default_api_type: chat_completions
        max_image_size: 20971520  # 20MB
        supported_image_formats: [jpeg, png, gif, webp]
        image_detail_control: true

