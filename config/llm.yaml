llm_system:
  # Default HTTPX timeout configuration for all models
  # These can be overridden per model if needed
  httpx_timeouts:
    connect: 10.0      # Connection establishment timeout (seconds)
    read: 180.0        # Read timeout - waiting for response data (seconds)
    write: 10.0        # Write timeout - sending request data (seconds)
    pool: 5.0          # Pool timeout - getting connection from pool (seconds)

  models:
    gpt-4.1:
      provider: openai_httpx
      model: gpt-4.1
      openai_api_key: ***REMOVED***
      context_window: 1000000
      request_timeout: 60
      capabilities:
        tools: true
        function_calling: true
        image_input: true
        audio_input: false
        video_input: false
        streaming: true
        json_mode: true
        supported_api_types: [chat_completions]
        default_api_type: chat_completions
        max_image_size: 20971520  # 20MB
        supported_image_formats: [jpeg, png, gif, webp]
        image_detail_control: true

    gpt-5-nano:
      provider: openai_httpx
      model: gpt-5-nano
      openai_api_key: ***REMOVED***
      context_window: 272000
      request_timeout: 60
      capabilities:
        tools: true
        function_calling: true
        image_input: false
        streaming: false
        json_mode: true
        supported_api_types: [chat_completions]
        default_api_type: chat_completions

    gpt-5-mini:
      provider: openai_httpx
      model: gpt-5-mini
      openai_api_key: ***REMOVED***
      context_window: 272000
      request_timeout: 180
      httpx_timeouts:
        connect: 10.0
        read: 240.0
        write: 10.0
        pool: 5.0
      capabilities:
        tools: true
        function_calling: true
        image_input: true
        streaming: false
        json_mode: true
        supported_api_types: [chat_completions, assistants]
        default_api_type: chat_completions
        max_image_size: 20971520  # 20MB
        supported_image_formats: [jpeg, png, gif, webp]
        image_detail_control: true
        
