llm_system:
  # Default HTTPX timeout configuration for all models
  httpx_timeouts:
    connect: 10.0      # Connection establishment timeout (seconds)
    read: 180.0        # Read timeout - waiting for response data (seconds)
    write: 10.0        # Write timeout - sending request data (seconds)
    pool: 5.0          # Pool timeout - getting connection from pool (seconds)

  # =============================================================================
  # BATCH PROCESSING CONFIGURATION
  # =============================================================================
  # Global batch settings with per-provider overrides.
  # Models with provider: "batch" use these settings.
  batch:
    storage_path: "data/batch_jobs"   # Where to store batch job data
    
    providers:
      gemini:
        enabled: true
        collection_window_seconds: 10   # Time to collect requests before submitting
        max_requests_per_batch: 100     # Max requests per batch
        poll_interval_seconds: 10       # How often to check batch status
        max_wait_hours: 24              # Max time to wait for completion
        max_retries: 3                  # Retries for server-side cancellations
        cancel_on_startup: true         # Cancel orphaned batches on startup
        fallback_to_sync: false         # Don't fall back to sync API
        
      openai:
        enabled: true
        collection_window_seconds: 10
        max_requests_per_batch: 100     # OpenAI supports up to 50k
        poll_interval_seconds: 10
        max_wait_hours: 24
        max_retries: 3
        cancel_on_startup: true
        fallback_to_sync: false

  # =============================================================================
  # MODEL DEFINITIONS
  # =============================================================================
  models:
    # ---------------------------------------------------------------------------
    # GEMINI MODELS (Sync/Streaming)
    # ---------------------------------------------------------------------------
    gemini-2-5-flash:
      provider: gemini_sdk
      model: gemini-2.5-flash
      api_key: "***REMOVED***"
      base_url: https://generativelanguage.googleapis.com/v1beta
      context_window: 200000
      request_timeout: 240
      include_thoughts: true
      thinking_budget: 1024
      capabilities:
        tools: true
        function_calling: true
        image_input: true
        streaming: true
        json_mode: true
        supported_api_types: [chat_completions]
        default_api_type: chat_completions

    gemini-2-5-flash-nostream:
      provider: gemini_sdk
      model: gemini-2.5-flash
      api_key: "***REMOVED***"
      base_url: https://generativelanguage.googleapis.com/v1beta
      context_window: 200000
      request_timeout: 240
      include_thoughts: false
      thinking_budget: 1024
      capabilities:
        tools: true
        function_calling: true
        image_input: true
        streaming: false
        json_mode: true
        supported_api_types: [chat_completions]
        default_api_type: chat_completions

