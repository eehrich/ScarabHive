# ================================
# Configuration-Based Agents
# ================================
# Define agents purely through YAML configuration without plugin code.
# Epic 0043: Configuration-Based Agents (Zero-Code Agent Definition)

agents:
  # Financial Analyst Agent
  financial_analyst:
    enabled: true
    description: "Professional financial analyst for stock market analysis, fundamentals research, and investment insights"
    base_type: agent
    
    agent_config:
      llm_profile: turbo
      max_steps: 20
      system_template: "config/prompts/financial_analyst_prompt.yaml"
      
      tools:
        allowed:
          - "yahoo_finance/*"
          - "web_scraper/*"
          - "duckduckgo_search/*"
          - "basic_operations/wait_for"
        blocked:
          - "ssh_control/*"
          - "script_interpreter/*"
      
      context_management:
        enabled: true
        strategy: "SUMMARIZE_OLDEST"
        preserve_recent_messages: 8
    
    metadata:
      author: "AgentSystem"
      version: "1.0.0"
      tags: ["finance", "stocks", "analysis", "research"]
      category: "financial"
  
  # Code Reviewer Agent
  code_reviewer:
    enabled: true
    description: "Expert code reviewer for quality analysis, security audits, and best practices validation"
    base_type: agent
    
    agent_config:
      llm_profile: chat
      max_steps: 15
      system_template: "config/prompts/code_reviewer_prompt.yaml"
      
      tools:
        allowed:
          - "script_interpreter/*"
          - "log_viewer/*"
          - "web_scraper/*"
        blocked:
          - "ssh_control/*"
          - "yahoo_finance/*"
      
      context_management:
        enabled: true
        strategy: "SMART_COMPRESSION"
        preserve_recent_messages: 10
    
    metadata:
      author: "AgentSystem"
      version: "1.1.0"
      tags: ["code", "review", "quality", "security"]
      category: "development"
  
  # Research Assistant Agent
  research_assistant:
    enabled: true
    description: "Comprehensive research assistant for information gathering, fact-checking, and synthesis"
    base_type: agent
    
    agent_config:
      llm_profile: normal
      max_steps: 30
      system_template: "config/prompts/research_assistant_prompt.yaml"
      
      tools:
        allowed:
          - "duckduckgo_search/*"
          - "web_scraper/*"
          - "context7/*"
          - "basic_operations/*"
        blocked:
          - "ssh_control/*"
          - "script_interpreter/*"
          - "yahoo_finance/*"
      
      context_management:
        enabled: true
        strategy: "SUMMARIZE_OLDEST"
        preserve_recent_messages: 15
        summarization_threshold: 0.75
    
    metadata:
      author: "AgentSystem"
      version: "1.0.0"
      tags: ["research", "fact-checking", "synthesis", "information"]
      category: "research"
  
  # Simple Q&A Agent
  simple_qa:
    enabled: true
    description: "Lightweight Q&A agent for general knowledge questions without external tools"
    base_type: agent
    
    agent_config:
      llm_profile: normal
      max_steps: 5
      system_prompt: |
        You are a helpful AI assistant for answering general knowledge questions.
        
        Guidelines:
        - Provide accurate, concise answers
        - If you don't know something, say so honestly
        - Avoid speculation without clear indication
        - Use examples when helpful
        - Be friendly and professional
        
        Operational Context:
        - No external tools available (knowledge cutoff applies)
        - Planning budget: {{ max_steps }} steps
        - Current date: {{ current_date | default('n/a') }}
        
        If the question requires real-time data, current events, or external resources,
        clearly state that you cannot access that information.
      
      tools:
        allowed: []
        blocked: []
      
      context_management:
        enabled: false
    
    metadata:
      author: "AgentSystem"
      version: "1.0.0"
      tags: ["qa", "simple", "knowledge", "general"]
      category: "general"
  

  # System Administrator Agent
  system_admin:
    enabled: true
    description: "System Administrator who has ssh access to different servers"
    base_type: basic_agent
    
    agent_config:
      llm_profile: chat
      max_steps: 15
      system_template: "config/prompts/system_admin_prompt.yaml"
      
      tools:
        allowed:
          - "ssh_control/*"
          - "basic_operations/*"
          - "web_scraper/*"
          - "web_research_agent/*"
          - "duckduckgo_search/*"
      
      context_management:
        enabled: true
        strategy: "SUMMARIZE_OLDEST"
        preserve_recent_messages: 15
        summarization_threshold: 0.75
    
    metadata:
      author: "AgentSystem"
      version: "1.1.0"
      tags: ["ssh", "server", "Administrator", "security"]
      category: "it"

  # Meta Web Research Agent
  meta_web_research_agent:
    enabled: true
    description: "Meta Web Research Agent for advanced web scraping and research tasks"
    base_type: web_research_agent
    
    agent_config:
      llm_profile: normal
      max_steps: 10
      system_template: "config/prompts/meta_web_research_agent.yaml"

      tools:
        allowed:
          - "web_research_agent/*"
          - "web_scraper/*"
          - "duckduckgo_search/*"
      context_management:
        enabled: true
        strategy: "SUMMARIZE_OLDEST"
        preserve_recent_messages: 5
        summarization_threshold: 0.75
    
    metadata:
      author: "AgentSystem"
      version: "1.1.0"
      tags: ["web", "research", "meta"]
      category: "it"