# ================================
# Configuration-Based Agents
# ================================
# Define agents purely through YAML configuration without plugin code.
#

agents:
  # Meta Agent
  meta_agent:
    enabled: true
    description: "Meta Agent for orchestrating other agents and managing complex tasks"
    base_type: basic_agent
          
    agent_config:
      llm_profile: turbo
      max_steps: 10
      
      tools:
        allowed:
          #- "financial_analyst_agent/*"
          #- "code_reviewer_agent/*"
          - "sysadmin_agent/*"
          - "meta_web_research_agent/*"
          - "basic_agent/*"
      
      # Custom descriptions for this agent's own tools
      #tool_descriptions:
      #  meta_agent_execute_task: "Delegate tasks to specialized agents (sysadmin, web research) and orchestrate complex multi-agent workflows"
      #  meta_agent_list_tools: "List all available specialized agents and tools for task delegation"

      system_prompt: |
        You are a helpful AI assistant to delegate tasks to specialized agents and manage complex workflows.
        
        Guidelines:
        - Provide accurate, concise answers
        - If you don't know something, say so honestly
        - Avoid speculation without clear indication
        - Use examples when helpful
        - Be friendly and professional
        
        Operational Context:
        - Planning budget: {{ max_steps }} steps
        - Current date: {{ current_date | default('n/a') }}

      context_management:
        enabled: true
        strategy: "SUMMARIZE_OLDEST"
        preserve_recent_messages: 5
      
      # Hook system configuration (optional)
      hooks:
        enabled: true  # Enable hooks for this agent
        # Disable specific hooks if needed
        # disabled_hooks:
        #   - "request_logger.log_pre_llm"  # Disable request logging
        #   - "markdown_formatter.inject_markdown_system_prompt"  # Disable markdown prompt injection
        # Per-hook configuration overrides
        # hook_overrides:
        #   "markdown_formatter.format_markdown_output":
        #     enabled: true
        #     timeout: 5.0
        #     config:
        #       convert_to_html: true
        #       enable_code_highlighting: false
    
    metadata:
      author: "AgentSystem"
      version: "1.0.0"
      tags: ["meta", "orchestration", "management"]
      category: "meta"
      visibility: "ui"

  # Financial Analyst Agent
  financial_analyst_agent:
    enabled: true
    description: "Professional financial analyst for stock market analysis, fundamentals research, and investment insights"
    base_type: basic_agent
    
    agent_config:
      llm_profile: turbo
      max_steps: 20
      system_template: "config/prompts/financial_analyst_prompt.yaml"
      
      tools:
        allowed:
          - "yahoo_finance/*"
          - "web_scraper/*"
          - "duckduckgo_search/*"
          - "basic_operations/wait_for"
        blocked:
          - "ssh_control/*"
          - "script_interpreter/*"
      
      # Custom descriptions for this agent's own tools
      tool_descriptions:
        financial_analyst_agent_execute_task: "Analyze stocks, market data, and financial fundamentals using Yahoo Finance, web scraping, and search capabilities"
        financial_analyst_agent_list_tools: "List available financial analysis tools (Yahoo Finance, web scraper, search)"
      
      context_management:
        enabled: true
        strategy: "SUMMARIZE_OLDEST"
        preserve_recent_messages: 8
    
    metadata:
      author: "AgentSystem"
      version: "1.0.0"
      tags: ["finance", "stocks", "analysis", "research"]
      category: "financial"
      visibility: "both"
  
  # Code Reviewer Agent
  code_reviewer_agent:
    enabled: true
    description: "Expert code reviewer for quality analysis, security audits, and best practices validation"
    base_type: basic_agent
    
    agent_config:
      llm_profile: chat
      max_steps: 15
      system_template: "config/prompts/code_reviewer_prompt.yaml"
      
      tools:
        allowed:
          - "script_interpreter/*"
          - "log_viewer/*"
          - "web_scraper/*"
        blocked:
          - "ssh_control/*"
          - "yahoo_finance/*"
      
      # Custom descriptions for this agent's own tools
      tool_descriptions:
        code_reviewer_agent_execute_task: "Review code quality, security, and best practices using script execution, log analysis, and web research"
        code_reviewer_agent_list_tools: "List available code review tools (script interpreter, log viewer, web scraper)"
      
      context_management:
        enabled: true
        strategy: "SMART_COMPRESSION"
        preserve_recent_messages: 10
    
    metadata:
      author: "AgentSystem"
      version: "1.1.0"
      tags: ["code", "review", "quality", "security"]
      category: "development"
      visibility: "both"
  

  # Simple Q&A Agent
  simple_qa_agent:
    enabled: true
    description: "Lightweight Q&A agent for general knowledge questions without external tools"
    base_type: basic_agent
    
    agent_config:
      llm_profile: normal
      max_steps: 5
      system_prompt: |
        You are a helpful AI assistant for answering general knowledge questions.
        
        Guidelines:
        - Provide accurate, concise answers
        - If you don't know something, say so honestly
        - Avoid speculation without clear indication
        - Use examples when helpful
        - Be friendly and professional
        
        Operational Context:
        - No external tools available (knowledge cutoff applies)
        - Planning budget: {{ max_steps }} steps
        - Current date: {{ current_date | default('n/a') }}
        
        If the question requires real-time data, current events, or external resources,
        clearly state that you cannot access that information.
      
      tools:
        allowed: []
        blocked: []
      
      # Custom descriptions for this agent's own tools
      tool_descriptions:
        simple_qa_agent_execute_task: "Answer general knowledge questions using LLM knowledge only (no external tools or real-time data)"
        simple_qa_agent_list_tools: "List available tools (none - pure LLM-based Q&A)"
      
      context_management:
        enabled: false
    
    metadata:
      author: "AgentSystem"
      version: "1.0.0"
      tags: ["qa", "simple", "knowledge", "general"]
      visibility: "ui"
      category: "general"
  

  # System Administrator Agent
  sysadmin_agent:
    enabled: true
    description: "System Administrator who has ssh access to different servers"
    base_type: basic_agent
    
    agent_config:
      llm_profile: chat
      max_steps: 100
      system_template: "config/prompts/system_admin_prompt.yaml"
      
      tools:
        allowed:
          - "ssh_control/*"
          - "basic_operations/*"
          - "meta_web_research_agent/*"
      
      # Custom descriptions for this agent's own tools (inherited from basic_agent)
      tool_descriptions:
        sysadmin_agent_execute_task: "Execute system administration tasks with SSH access to production and development servers. Use this for server management, deployment, monitoring, and troubleshooting."
        sysadmin_agent_list_tools: "List all SSH and system administration tools available to the sysadmin agent"
      
      context_management:
        enabled: true
        strategy: "SUMMARIZE_OLDEST"
        preserve_recent_messages: 15
        summarization_threshold: 0.75
    
    metadata:
      author: "AgentSystem"
      version: "1.1.0"
      tags: ["ssh", "server", "Administrator", "security"]
      category: "it"
      visibility: "both"  

  # Meta Web Research Agent
  meta_web_research_agent:
    enabled: true
    description: "Meta Web Research Agent for advanced web scraping and research tasks"
    base_type: web_research_agent
    
    agent_config:
      llm_profile: turbo
      max_steps: 10
      system_template: "config/prompts/meta_web_research_agent.yaml"

      tools:
        allowed:
          - "weather/*"        
          - "web_research_agent/*"
          - "web_scraper/*"
          - "duckduckgo_search/*"
      
      # Custom descriptions for this agent's own tools (inherited from web_research_agent)
      tool_descriptions:
        meta_web_research_agent_web_research: "Conduct multi-source web research with automatic scraping and synthesis - ideal for comprehensive topic analysis"
        meta_web_research_agent_fact_check: "Verify claims against authoritative sources with credibility assessment and detailed evidence"
        meta_web_research_agent_source_analysis: "Compare and analyze information across multiple sources, identify contradictions, and assess reliability"
        meta_web_research_agent_research_assistant: "AI-powered deep research with intelligent source selection and actionable insights synthesis"
      
      context_management:
        enabled: false
    
    metadata:
      author: "AgentSystem"
      version: "1.1.0"
      tags: ["web", "research", "meta"]
      category: "it"
      visibility: "both"
