# ================================
# Plugin Configuration  
# ================================
# Configuration for local MCP plugins (servers)

plugins:
  # Plugin discovery directories
  plugin_dirs:
    - src/plugins
  
  # Default configuration for all plugins
  default_config:
    type: basic_agent
    enabled: false
    
    agent_config:
      llm_profile: normal
      max_steps: 20
      system_template: "config/prompts/system_prompt.yaml"
      
      hooks:        
        enabled: true 
        overrides:  # by default disable html formatting of markdown
          markdown_formatter.format_markdown_output:
             enabled: false     

      tools:
        allowed: []
        blocked: []
  
  # Plugin server configurations
  servers:
    example:
      type: example
      enabled: true
    
    basic_agent:
      type: basic_agent
      enabled: true
      agent_config:
        tools:
          allowed:
            - "*"
        hooks:
          enabled: true
          overrides:
            todo.inject_todo_tasks:
              enabled: true
            sequential_thinking.inject_active_sessions:
              enabled: true
      
      metadata:
        visibility: "both"  # Make available as tool for meta_agent
    
    duckduckgo_search:
      type: duckduckgo_search
      enabled: true
    
    basic_operations:
      type: basic_operations
      enabled: true
      max_wait_seconds: 3600
      default_update_interval: 5.0
    
    sequential_thinking:
      type: sequential_thinking
      enabled: true
      max_history_size: 100
      session_ttl_seconds: 3600
      enable_branching: true
      enable_revisions: true
      max_summary_thoughts: 10
      
      # Hook config for inject_active_sessions
      max_thoughts_in_prompt: 5
      show_branch_info: true
      format: markdown
    
    todo:
      type: todo
      enabled: true

    http_server:
      type: http_server
      enabled: false
      host: 127.0.0.1
      port: 9000
    
    yahoo_finance:
      type: yahoo_finance
      enabled: false
    
    twitter_search:
      type: twitter_search
      enabled: false
    
    web_scraper:
      type: web_scraper
      enabled: true
      proxies: []
    
    weather:
      type: weather
      enabled: true
    
    datetime:
      type: datetime
      enabled: true
    
    llm_router:
      type: llm_router
      enabled: true
    
    log_viewer:
      type: log_viewer
      enabled: true
    
    script_interpreter:
      type: script_interpreter
      enabled: true
    
    web_research_agent:
      type: web_research_agent
      enabled: true
      max_steps: 20

      agent_config:
        llm_profile: chat
        system_template: ""  # Use plugin's own system prompt template (empty string to override default)
        tools:
          allowed:
            - "duckduckgo_search/*"
            - "web_scraper/*"
      
      metadata:
        visibility: "both"  # Make available as tool for meta_web_research_agent
    
    ibkr:
      type: ibkr
      enabled: false
      host: 127.0.0.1
      port: 4002
    
    ssh_control:
      type: ssh_control
      enabled: true
      machines:
        - name: controlhost
          host: 192.0.2.114
          port: 22
          username: root
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3
        - name: MCP
          host: 192.0.2.113
          port: 22
          username: root
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3
    
    user_management:
      type: user_management
      enabled: true
    
    context_summarizer:
      type: context_summarizer
      enabled: true
    
    context_optimizer:
      type: context_optimizer
      enabled: true
    
    context_usage_tracker:
      type: context_usage_tracker
      enabled: true
    
    request_logger:
      type: request_logger
      enabled: true
    
    message_validator:
      type: message_validator
      enabled: true
      config:
        log_level: warning
        strict_mode: false
    
    markdown_formatter:
      type: markdown_formatter
      enabled: true
    
    message_debugger:
      type: message_debugger
      enabled: true
    
    # ================================
    # Configuration-Based Agent Instances
    # ================================
    # These agents are created from plugin types with custom configurations
    # Previously defined in config/agents.yaml (now consolidated here)
    
    meta_agent:
      type: basic_agent
      enabled: true
      description: "Meta Agent for orchestrating other agents and managing complex tasks"
      
      agent_config:
        llm_profile: normal
        max_steps: 50
        
        system_template: "config/prompts/meta_agent_prompt.yaml"
        
        tools:
          allowed:
            - "sysadmin_agent/*"
            - "meta_web_research_agent/*"
            #- "financial_analyst_agent/*"
            #- "code_reviewer_agent/*"
            - "basic_agent/*"
            - "basic_operations/*"
            - "datetime/*"
            - "sequential_thinking/*"
            - "todo/*"
        
        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true
            todo.inject_todo_tasks:
              enabled: true
            sequential_thinking.inject_active_sessions:
              enabled: true
      
      metadata:
        author: "AgentSystem"
        version: "1.0.0"
        tags: ["meta", "orchestration", "management"]
        category: "meta"
        visibility: "ui"
    
    financial_analyst_agent:
      type: basic_agent
      enabled: true
      description: "Professional financial analyst for stock market analysis, fundamentals research, and investment insights"
      
      self_tool_descriptions:
        financial_analyst_agent_execute_task: "Analyze stocks, market data, and financial fundamentals using Yahoo Finance, web scraping, and search capabilities"
        financial_analyst_agent_list_available_tools: "List available financial analysis tools (Yahoo Finance, web scraper, search)"
      
      agent_config:
        llm_profile: normal
        max_steps: 20
        system_template: "config/prompts/financial_analyst_prompt.yaml"
        
        tools:
          allowed:
            - "yahoo_finance/*"
            - "web_scraper/*"
            - "duckduckgo_search/*"
            - "basic_operations/*"

        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true             
      
      metadata:
        author: "AgentSystem"
        version: "1.0.0"
        tags: ["finance", "stocks", "analysis", "research"]
        category: "financial"
        visibility: "both"
    
    code_reviewer_agent:
      type: basic_agent
      enabled: true
      description: "Expert code reviewer for quality analysis, security audits, and best practices validation"
      
      self_tool_descriptions:
        code_reviewer_agent_execute_task: "Review code quality, security, and best practices using script execution, log analysis, and web research"
        code_reviewer_agent_list_available_tools: "List available code review tools (script interpreter, log viewer, web scraper)"
      
      agent_config:
        llm_profile: normal
        max_steps: 15
        system_template: "config/prompts/code_reviewer_prompt.yaml"
        
        tools:
          allowed:
            - "script_interpreter/*"
            - "log_viewer/*"
            - "web_scraper/*"

        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true            
      
      metadata:
        author: "AgentSystem"
        version: "1.1.0"
        tags: ["code", "review", "quality", "security"]
        category: "development"
        visibility: "both"
    
    simple_qa_agent:
      type: basic_agent
      enabled: true
      description: "Simple Q&A agent that answers questions using LLM knowledge only (no external tools)"
      
      # self_tool_descriptions now at MCPConfig level (not in agent_config)
      self_tool_descriptions:
        simple_qa_agent_execute_task: "Answer general knowledge questions using LLM knowledge only (no external tools or real-time data)"
        simple_qa_agent_list_available_tools: "List available tools (none - pure LLM-based Q&A)"
      
      agent_config:
        llm_profile: normal
        max_steps: 10
        
        system_prompt: |
          You are a helpful AI assistant that answers questions using your training knowledge.
          
          Guidelines:
          - Provide accurate, concise answers
          - If you don't know something, say so honestly
          - Avoid speculation without clear indication
          - Use examples when helpful
          - Be friendly and professional
          
          Operational Context:
          - No external tools available (knowledge cutoff applies)
          - Planning budget: {{ max_steps }} steps
          - Current date: {{ current_date | default('n/a') }}
          
          If the question requires real-time data, current events, or external resources,
          clearly state that you cannot access that information.
        
        tools:
          allowed: []
          blocked: []       
      
      metadata:
        author: "AgentSystem"
        version: "1.0.0"
        tags: ["qa", "simple", "knowledge", "general"]
        category: "general"
        visibility: "ui"
    
    sysadmin_agent:
      type: basic_agent
      enabled: true
      description: "System Administrator who has ssh access to different servers"
      
      # self_tool_descriptions now at MCPConfig level (not in agent_config)
      self_tool_descriptions:
        sysadmin_agent_execute_task: "Execute system administration tasks with SSH access to production and development servers. Use this for server management, deployment, monitoring, and troubleshooting."
        sysadmin_agent_list_available_tools: "List all SSH and system administration tools available to the sysadmin agent"
      
      agent_config:
        llm_profile: normal
        max_steps: 100
        system_template: "config/prompts/system_admin_prompt.yaml"
        
        tools:
          allowed:
            - "ssh_control/*"
            - "basic_operations/*"
            - "meta_web_research_agent/*"
            - "datetime/*"
            - "sequential_thinking/*"
            - "todo/*"

        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true
            todo.inject_todo_tasks:
              enabled: true
            sequential_thinking.inject_active_sessions:
              enabled: true
                   
      
      metadata:
        author: "AgentSystem"
        version: "1.1.0"
        tags: ["ssh", "server", "Administrator", "security"]
        category: "it"
        visibility: "both"
    
    meta_web_research_agent:
      type: web_research_agent
      enabled: true
      description: "Meta Web Research Agent for advanced web scraping and research tasks"
      
      # self_tool_descriptions for own tools (meta_web_research_agent_*)
      self_tool_descriptions:
        meta_web_research_agent_web_research: "Conduct multi-source web research with automatic scraping and synthesis - ideal for comprehensive topic analysis"
        meta_web_research_agent_fact_check: "Verify claims against authoritative sources with credibility assessment and detailed evidence"
        meta_web_research_agent_source_analysis: "Compare and analyze information across multiple sources, identify contradictions, and assess reliability"
        meta_web_research_agent_research_assistant: "AI-powered deep research with intelligent source selection and actionable insights synthesis"
      
      agent_config:
        llm_profile: normal
        max_steps: 10
        system_template: "config/prompts/meta_web_research_agent.yaml"
        
        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true
            todo.inject_todo_tasks:
              enabled: true
            sequential_thinking.inject_active_sessions:
              enabled: true
        
        tools:
          allowed:
            - "web_research_agent/*"
            - "weather/*"
            - "web_scraper/*"
            - "duckduckgo_search/*"
            - "datetime/*"
            - "basic_operations/*"
            - "sequential_thinking/*"
            - "todo/*"

      metadata:
        author: "AgentSystem"
        version: "1.1.0"
        tags: ["web", "research", "meta"]
        category: "search"
        visibility: "both"

# ================================
# Hook Configuration
# ================================
# Global configuration for plugin hooks
hooks:
  # Global hook settings
  enabled: true  # Master switch for all hooks
  default_timeout: 30.0  # Default timeout in seconds
  
  # Per-hook configuration overrides
  # Format: hook_name or plugin_name.hook_name
  overrides:
    # Example: Override request_logger hooks
    # request_logger.log_pre_llm:
    #   enabled: true
    #   timeout: 5.0
    
    # Example: Configure hook ordering
    # context_optimizer:
    #   enabled: true
    #   timeout: 10.0
    #   order:
    #     after: ["begin"]
    #     before: ["message_validator"]
    #
    # message_validator:
    #   enabled: true
    #   timeout: 5.0
    #   order:
    #     after: ["context_optimizer"]
    #     before: ["end"]
