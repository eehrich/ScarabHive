# ================================
# Plugin Configuration
# ================================
# Configuration for local MCP plugins (servers)
# Note: Additional plugin configs are loaded via includes in config/config.yaml
# (e.g., agents_writer/writer_plugin_configs.yaml, agents_trading/trading_plugin_configs.yaml)

plugins:
  # Plugin discovery directories
  plugin_dirs:
    - src/plugins
    - src/plugins_writer
    - src/plugins_trading

  # Default configuration for all plugins
  default_config:
    type: basic_agent
    enabled: false

    agent_config:
      llm_profile: [normal, chat]
      llm_profile_advanced: []
      max_steps: 20
      system_template: "config/prompts/system_prompt.yaml"

      hooks:
        enabled: true
        overrides:  # by default disable html formatting of markdown
          markdown_formatter.format_markdown_output:
             enabled: false
          markdown_formatter.inject_markdown_system_prompt:
             enabled: false
             
      timeouts:
        # Queue handler timeouts (prevent cross-session blocking)
        status_queue_put_timeout: 5.0  # seconds
        
        # LLM task timeout - safety net only!
        # For batch mode: actual timeout is max_wait_hours in llm.yaml
        # For sync mode: actual timeout is request_timeout in model config
        llm_task_max_iterations: 864000  # 864000 * 0.1s = 24h safety net
        
        # Session lock timeout (prevent same-session deadlock)
        session_lock_timeout: 5.0  # seconds
    
      tools:
        allowed: []
        blocked: []

  # Plugin server configurations
  servers:
    example:
      type: example
      enabled: true

    basic_agent:
      type: basic_agent
      enabled: true
      agent_config:
        # Kette: [0] = Default, Rest = Fallback-Reihenfolge. ALLE Einträge
        # (Union mit llm_profile_advanced) bleiben als llm_profile-Parameter
        # im Tool-Schema wählbar. Advanced leer: "think" ist bereits das
        # stärkste Profil — use_advanced_model wäre hier ein Downgrade.
        llm_profile: [think, normal, turbo, chat]
        llm_profile_advanced: []
        
        timeouts:
          # Queue handler timeouts (prevent cross-session blocking)
          status_queue_put_timeout: 5.0  # seconds
          
          # LLM task timeout - safety net only!
          # For batch mode: actual timeout is max_wait_hours in llm.yaml
          # For sync mode: actual timeout is request_timeout in model config
          llm_task_max_iterations: 864000  # 864000 * 0.1s = 24h safety net
          
          # Session lock timeout (prevent same-session deadlock)
          session_lock_timeout: 5.0  # seconds
          
          # NOTE: Hooks and tools have NO hard timeouts - they can run as long as needed
          # Examples: context_summarizer (10+ min), sub_agent_manager (hours)
        
        tools:
          allowed: []
        hooks:
          enabled: true
          overrides:
            todo.inject_todo_tasks:
              enabled: true
            memory.inject_memory_context:
              enabled: true
            sequential_thinking.inject_active_sessions:
              enabled: true

      metadata:
        visibility: "tool"  # Make available as tool for meta_agent



    basic_operations:
      type: basic_operations
      enabled: true
      max_wait_seconds: 3600
      default_update_interval: 5.0

    sequential_thinking:
      type: sequential_thinking
      enabled: true
      max_history_size: 100
      session_ttl_seconds: 3600
      enable_branching: true
      enable_revisions: true
      max_summary_thoughts: 10

      # Hook config for inject_active_sessions
      max_thoughts_in_prompt: 5
      show_branch_info: true
      format: markdown

    cognitive_stack:
      type: cognitive_stack
      enabled: true
      max_depth: 50
      max_frames_in_prompt: 3

    todo:
      type: todo
      enabled: true

    memory:
      type: memory
      enabled: true
      max_memories: 10
      max_memories_per_session: 1000
      auto_extract_keywords: true
      search_n_results: 5
      use_semantic_injection: true

    okf:
      type: okf
      enabled: true
      # Open Knowledge Format bundles (curated markdown knowledge, git-versioned).
      # Sandbox: tools may only touch bundles under these directories.
      allowed_directories:
        - data/okf
      # Consumer hook (context injection) is opt-in per agent via
      # hooks.overrides; set hook_bundle on the agent that should use it.
      # hook_bundle: data/okf/<bundle>
      hook_max_concepts: 6
      hook_graph_depth: 1

    lessons_learned:
      type: lessons_learned
      enabled: true
      description: "Persistent lessons learned across sessions with semantic search and cross-agent teaching"
      database_path: "data/lessons_learned/lessons.db"
      max_lessons_per_agent: 500
      dedup_similarity_threshold: 0.82
      exact_duplicate_threshold: 0.95
      llm_profile: "chat-nostream"
      consolidation_llm_profile: "chat-nostream"  # LLM for consolidation (merge decisions) - use think/normal for better quality

    http_server:
      type: http_server
      enabled: false
      host: 127.0.0.1
      port: 9000

    batch_monitor:
      type: batch_monitor
      enabled: true
      description: "Monitor and query batch queue status"

    image_compose:
      type: image_compose
      enabled: true
      description: "Compose layered images (background + text + shapes + gradients + SVG)"
      fonts_dir: "src/plugins/image_compose/fonts"   # plugin-bundled assets
      output_root: "."
      # font_aliases: drop a TTF into fonts_dir and map an alias name to its filename.
      # Available aliases (used in image_compose schema + cover_artist prompt):
      #   sans, sans_bold, serif, serif_bold, mono, display,
      #   display_grotesk (Type-Driven), script (handwritten), stencil (grunge),
      #   display_block (dramatic display)
      # Example:
      # font_aliases:
      #   display_grotesk: "Oswald-Bold.ttf"
      #   script: "Caveat-Regular.ttf"
      #   stencil: "StardosStencil-Bold.ttf"
      #   display_block: "BungeeInline-Regular.ttf"
      overlap_check_enabled: true   # warn on text/svg BBox overlap pairs after render
      overlap_min_gap_px: 30        # required clearance between text/svg layers (px)

    comfyui:
      type: comfyui
      enabled: true
      description: "Execute ComfyUI workflows for image, audio, and video generation"
      host: "192.0.2.5"  # primary / fallback
      port: 8188
      strategy: "least_loaded"  # "least_loaded" (probe queues) or "random"
      timeout_seconds: 1200
      servers:  # 4 ComfyUI-Instanzen auf einem Server (2 GPUs), load-balanced
        - host: "192.0.2.64" # PC
          port: 8188
        #- host: "192.0.2.5"  # gpuhost1
        #  port: 8188
        - host: "192.0.2.5" # keep other nodes off
          port: 8189
        #- host: "192.0.2.5"
        #  port: 8190
        #- host: "192.0.2.5"
        #  port: 8191

      unknown_threshold_seconds: 60  # Fail early if job stays unknown for this many seconds (lost/dropped)
      output_dir: "data/comfyui/outputs"
      workflow_files_dir: "config/comfyui_workflows"
      cleanup_age_hours: 48  # Delete files older than 48 hours (0 = disable cleanup)
      # upload_image security allowlist. Mirrors the code defaults PLUS
      # the writer cover dir — the Phase-E cover_feedback_judge uploads
      # the real cover composite for its VLM verification passes; without
      # this entry every judge run dies with "not found inside the
      # configured upload_source_dirs allowlist" (book 26, job 242).
      upload_source_dirs:
        - "data/comfyui/outputs"
        - "data/comfyui"
        - "data/writer/assets"
        - "data/writer/covers"
      workflows:
        - id: stable_audio
          name: "Stable Audio Generation"
          description: "Generate audio clips using Stable Audio Open 1.0 with T5 text encoder"
          category: audio
          workflow_file: stable_audio.json
          parameters:
            - name: prompt
              type: string
              required: true
              description: "Text description of the audio to generate (e.g., 'ambient electronic music')"
              node_id: "3"
              field: inputs.text
            - name: negative_prompt
              type: string
              required: false
              default: "noise, distortion, vocals, speech"
              description: "Things to avoid in the audio"
              node_id: "4"
              field: inputs.text
            - name: duration
              type: float
              default: 10.0
              description: "Audio duration in seconds (1-47)"
              node_id: "5"
              field: inputs.seconds_total
            - name: duration_latent
              type: float
              default: 10.0
              description: "Audio duration in seconds for latent"
              node_id: "6"
              field: inputs.seconds
            - name: steps
              type: integer
              default: 50
              description: "Number of sampling steps (10-200)"
              node_id: "7"
              field: inputs.steps
            - name: cfg_scale
              type: float
              default: 7.0
              description: "Classifier-free guidance scale (1-20)"
              node_id: "7"
              field: inputs.cfg
            - name: seed
              type: integer
              default: 0
              description: "Random seed (0 for random-like behavior)"
              node_id: "7"
              field: inputs.seed

        - id: sdxl_txt2img
          name: "Stable Diffusion XL Text-to-Image"
          description: "High-quality image generation using SDXL base model. Requires sd_xl_base_1.0.safetensors checkpoint."
          category: image_generation
          workflow_file: sdxl_txt2img.json
          parameters:
            - name: prompt
              type: string
              required: true
              description: "Text description of the image to generate"
              node_id: "6"
              field: inputs.text
            - name: negative_prompt
              type: string
              required: false
              default: "blurry, low quality, ugly, distorted, deformed"
              description: "Things to avoid in the image"
              node_id: "7"
              field: inputs.text
            - name: width
              type: integer
              default: 1024
              description: "Image width (512-2048, should be divisible by 8)"
              node_id: "5"
              field: inputs.width
            - name: height
              type: integer
              default: 1024
              description: "Image height (512-2048, should be divisible by 8)"
              node_id: "5"
              field: inputs.height
            - name: steps
              type: integer
              default: 20
              description: "Number of sampling steps (15-30 recommended)"
              node_id: "3"
              field: inputs.steps
            - name: cfg_scale
              type: float
              default: 7.0
              description: "Classifier-free guidance scale (5-10 recommended)"
              node_id: "3"
              field: inputs.cfg
            - name: seed
              type: integer
              default: 0
              description: "Random seed (0 for random)"
              node_id: "3"
              field: inputs.seed

        - id: juggernaut_xl
          name: "Juggernaut XL v9 + Hires-Fix (High-Quality SDXL)"
          description: "Juggernaut XL v9 community checkpoint with a hires-fix pass: base render at width x height, 4x-UltraSharp model upscale, downscale to 1.5x, then a low-denoise refine pass. Far better anatomy, faces and detail than vanilla SDXL base. width/height set the BASE size (default 1024x1536); final output is 1.5x that (1536x2304)."
          category: image_generation
          workflow_file: juggernaut_xl.json
          parameters:
            - name: prompt
              type: string
              required: true
              description: "Text description of the image to generate"
              node_id: "6"
              field: inputs.text
            - name: negative_prompt
              type: string
              required: false
              default: "blurry, low quality, ugly, deformed, bad anatomy, extra fingers, watermark, text, signature"
              description: "Things to avoid in the image"
              node_id: "7"
              field: inputs.text
            - name: width
              type: integer
              default: 1024
              description: "Image width (divisible by 8; 1024 recommended)"
              node_id: "5"
              field: inputs.width
            - name: height
              type: integer
              default: 1536
              description: "Image height (divisible by 8; 1536 = 2:3 book cover)"
              node_id: "5"
              field: inputs.height
            - name: steps
              type: integer
              default: 32
              description: "Sampling steps (30-40 recommended for Juggernaut)"
              node_id: "3"
              field: inputs.steps
            - name: cfg_scale
              type: float
              default: 5.5
              description: "Guidance scale (Juggernaut likes 3-7, lower than vanilla SDXL)"
              node_id: "3"
              field: inputs.cfg
            - name: seed
              type: integer
              default: 0
              description: "Random seed (0 for random)"
              node_id: "3"
              field: inputs.seed

        - id: sdxl_base_refiner
          name: "SDXL Base + Refiner + Hires-Fix"
          description: "Three-pass SDXL workflow: base model generates structure at width x height, refiner polishes details, then a 4x-UltraSharp upscale + lanczos downscale to hires_width x hires_height + low-denoise refine pass. Output dimensions = (hires_width, hires_height). Defaults give general SDXL-style output; set explicit hires dimensions for cover-art use. Requires both sd_xl_base_1.0 and sd_xl_refiner_1.0 checkpoints + 4x-UltraSharp."
          category: image_generation
          workflow_file: sdxl_base_refiner.json
          parameters:
            - name: prompt
              type: string
              required: true
              description: "Text description of the image to generate (injected into both base and refiner CLIP encoders + hires refine)"
              node_id: "20"
              field: inputs.text
            - name: prompt_refiner
              type: string
              required: false
              description: "Prompt for refiner model (if different from base). Defaults to same as prompt."
              node_id: "22"
              field: inputs.text
            - name: negative_prompt
              type: string
              required: false
              default: "blurry, low quality, ugly, distorted, deformed, bad anatomy, extra fingers, watermark, text, signature, jpeg artifacts"
              description: "Things to avoid (injected into both base and refiner negative prompts + hires refine)"
              node_id: "21"
              field: inputs.text
            - name: negative_prompt_refiner
              type: string
              required: false
              description: "Negative prompt for refiner (if different). Defaults to same as negative_prompt."
              node_id: "23"
              field: inputs.text
            - name: width
              type: integer
              default: 1024
              description: "Base image width — match an SDXL training bucket (1024x1024, 832x1216 for 2:3, 1216x832 for 3:2). Must be divisible by 8."
              node_id: "30"
              field: inputs.width
            - name: height
              type: integer
              default: 1024
              description: "Base image height — match an SDXL training bucket. Must be divisible by 8."
              node_id: "30"
              field: inputs.height
            - name: steps
              type: integer
              default: 30
              description: "Total sampling steps for both passes (25-35 recommended). Base uses ~80%, refiner ~20%."
              node_id: "40"
              field: inputs.steps
            - name: steps_refiner
              type: integer
              default: 30
              description: "Total steps value for refiner KSampler (must match base steps)"
              node_id: "41"
              field: inputs.steps
            - name: cfg_scale
              type: float
              default: 7.5
              description: "Classifier-free guidance scale (6-9 recommended)"
              node_id: "40"
              field: inputs.cfg
            - name: cfg_scale_refiner
              type: float
              default: 7.5
              description: "CFG scale for refiner (can be slightly lower for softer refinement)"
              node_id: "41"
              field: inputs.cfg
            - name: seed
              type: integer
              default: 0
              description: "Random seed for base sampler (0 for random)"
              node_id: "40"
              field: inputs.noise_seed
            - name: seed_refiner
              type: integer
              default: 0
              description: "Random seed for refiner sampler (0 for random)"
              node_id: "41"
              field: inputs.noise_seed
            - name: hires_width
              type: integer
              default: 1024
              description: "Final width after 4x upscale + lanczos downscale. Set to width for no resize, or to width * 1.5 for hires-fix boost. Must be divisible by 8."
              node_id: "72"
              field: inputs.width
            - name: hires_height
              type: integer
              default: 1024
              description: "Final height after 4x upscale + lanczos downscale. Set to height for no resize, or to height * 1.5 for hires-fix boost. Must be divisible by 8."
              node_id: "72"
              field: inputs.height
            - name: hires_steps
              type: integer
              default: 20
              description: "Sampling steps for the hires refine pass (15-25 typical)"
              node_id: "74"
              field: inputs.steps
            - name: hires_cfg
              type: float
              default: 7.5
              description: "CFG scale for hires refine pass"
              node_id: "74"
              field: inputs.cfg
            - name: hires_denoise
              type: float
              default: 0.4
              description: "Denoise strength for hires refine pass (0.0 = no change, 0.3-0.5 for sharpening, 0.6+ alters composition). Default 0.4 mirrors juggernaut_xl."
              node_id: "74"
              field: inputs.denoise
            - name: hires_seed
              type: integer
              default: 0
              description: "Random seed for hires refine pass (0 for random; can match seed for consistency)"
              node_id: "74"
              field: inputs.seed

        - id: sdxl_img2img
          name: "SDXL img2img (Style Continuation)"
          description: >
            SDXL image-to-image: encodes a reference image as the starting latent and denoises from
            a given step, preserving composition and colour palette proportional to denoise strength.
            Ideal for series covers where structural/colour continuity with a predecessor is desired.
            Requires sd_xl_base_1.0.safetensors + sd_xl_refiner_1.0.safetensors.
            Before using: upload the reference image with operation='upload_image' and pass the
            returned filename as reference_image.
          category: image_generation
          workflow_file: sdxl_img2img.json
          parameters:
            - name: prompt
              type: string
              required: true
              description: "Text description of the new image"
              node_id: "20"
              field: inputs.text
            - name: prompt_refiner
              type: string
              required: false
              description: "Prompt for refiner model (defaults to prompt)"
              node_id: "22"
              field: inputs.text
            - name: negative_prompt
              type: string
              required: false
              default: "blurry, low quality, ugly, distorted, deformed, bad anatomy, extra fingers, watermark, text, signature"
              description: "Things to avoid"
              node_id: "21"
              field: inputs.text
            - name: negative_prompt_refiner
              type: string
              required: false
              description: "Negative prompt for refiner (defaults to negative_prompt)"
              node_id: "23"
              field: inputs.text
            - name: reference_image
              type: string
              required: true
              description: "Reference image: LOCAL file path (e.g. output_path from wait_for_completion) or bare filename of a downloaded output — uploaded to the execution server automatically. Filenames already in ComfyUI's input folder also work."
              node_id: "05"
              field: inputs.image
            - name: steps
              type: integer
              default: 30
              description: "Total sampling steps (25-35 recommended)"
              node_id: "40"
              field: inputs.steps
            - name: steps_refiner
              type: integer
              default: 30
              description: "Must match steps"
              node_id: "41"
              field: inputs.steps
            - name: start_at_step
              type: integer
              default: 7
              description: >
                Step to start denoising from (controls denoise strength).
                Formula: int(steps * (1 - denoise)). Examples for steps=30:
                denoise=0.75 → 7, denoise=0.60 → 12, denoise=0.85 → 4.
                Lower = more faithful to reference; higher = more creative freedom.
              node_id: "40"
              field: inputs.start_at_step
            - name: cfg_scale
              type: float
              default: 7.5
              description: "Classifier-free guidance scale (6-9 recommended)"
              node_id: "40"
              field: inputs.cfg
            - name: cfg_scale_refiner
              type: float
              default: 7.5
              description: "CFG scale for refiner"
              node_id: "41"
              field: inputs.cfg
            - name: seed
              type: integer
              default: 0
              description: "Random seed (0 for random)"
              node_id: "40"
              field: inputs.noise_seed
            - name: seed_refiner
              type: integer
              default: 0
              description: "Random seed for refiner (use same as seed)"
              node_id: "41"
              field: inputs.noise_seed

        - id: sdxl_ipadapter
          name: "SDXL + IP-Adapter (Style Transfer)"
          description: >
            SDXL with IP-Adapter: extracts style/mood/colour embedding from a reference image and
            injects it as an additional conditioning signal. Generates a fully new composition
            while preserving the visual aesthetic of the reference — ideal for series covers that
            must feel like they belong together without being structural copies.
            Requires: sd_xl_base_1.0.safetensors, sd_xl_refiner_1.0.safetensors,
            ComfyUI-IPAdapter-Plus custom node, ip-adapter_sdxl.safetensors (ipadapter/ folder),
            CLIP-ViT-bigG-14-laion2B-39B-b160k.safetensors (clip_vision/ folder).
            Before using: upload the reference image with operation='upload_image' and pass the
            returned filename as reference_image.
          category: image_generation
          workflow_file: sdxl_ipadapter.json
          parameters:
            - name: prompt
              type: string
              required: true
              description: "Text description of the new image"
              node_id: "20"
              field: inputs.text
            - name: prompt_refiner
              type: string
              required: false
              description: "Prompt for refiner model (defaults to prompt)"
              node_id: "22"
              field: inputs.text
            - name: negative_prompt
              type: string
              required: false
              default: "blurry, low quality, ugly, distorted, deformed, bad anatomy, extra fingers, watermark, text, signature"
              description: "Things to avoid"
              node_id: "21"
              field: inputs.text
            - name: negative_prompt_refiner
              type: string
              required: false
              description: "Negative prompt for refiner (defaults to negative_prompt)"
              node_id: "23"
              field: inputs.text
            - name: reference_image
              type: string
              required: true
              description: "Reference image: LOCAL file path (e.g. output_path from wait_for_completion) or bare filename of a downloaded output — uploaded to the execution server automatically. Filenames already in ComfyUI's input folder also work."
              node_id: "05"
              field: inputs.image
            - name: weight
              type: float
              default: 0.7
              description: >
                IP-Adapter style weight (0.0–1.0). 0.5 = subtle style hint,
                0.7 = clear style match (recommended), 0.9 = very close to reference.
              node_id: "14"
              field: inputs.weight
            - name: width
              type: integer
              default: 1024
              description: "Image width (1024 recommended for SDXL)"
              node_id: "30"
              field: inputs.width
            - name: height
              type: integer
              default: 1024
              description: "Image height (1024 recommended for SDXL)"
              node_id: "30"
              field: inputs.height
            - name: steps
              type: integer
              default: 30
              description: "Total sampling steps for both passes"
              node_id: "40"
              field: inputs.steps
            - name: steps_refiner
              type: integer
              default: 30
              description: "Must match steps"
              node_id: "41"
              field: inputs.steps
            - name: cfg_scale
              type: float
              default: 7.5
              description: "Classifier-free guidance scale"
              node_id: "40"
              field: inputs.cfg
            - name: cfg_scale_refiner
              type: float
              default: 7.5
              description: "CFG scale for refiner"
              node_id: "41"
              field: inputs.cfg
            - name: seed
              type: integer
              default: 0
              description: "Random seed (0 for random)"
              node_id: "40"
              field: inputs.noise_seed
            - name: seed_refiner
              type: integer
              default: 0
              description: "Random seed for refiner (use same as seed)"
              node_id: "41"
              field: inputs.noise_seed

        - id: qwenvl_caption
          name: "Qwen3-VL 8B caption / verification"
          description: "Vision-language model — describes a given image. Use BEFORE accepting a generated image to verify what is actually depicted (people count, gender, visible objects). Returns a free-form text caption."
          category: image_describe
          workflow_file: qwenvl_caption.json
          parameters:
            - name: image
              type: string
              required: true
              description: "Image to describe: LOCAL file path (e.g. output_path from wait_for_completion) or bare filename of a downloaded output — uploaded to the execution server automatically. Filenames already in ComfyUI's input folder also work."
              node_id: "1"
              field: inputs.image
            - name: prompt
              type: string
              required: false
              default: |
                Describe what is actually depicted in this image. Cover the following on separate lines:

                PEOPLE: For each person, list gender (girl/boy/woman/man/etc), approximate age, hair (colour + style), clothing (colours + items), and any distinctive accessories. End with "total person count: N". If there are no people, write "no people".

                OBJECTS: List the prominent objects and props visible (e.g. backpack, teapot, bench, sword, book) with their colour/material.

                SETTING: One short sentence describing the location (forest, kitchen, beach, dungeon, etc.) and time of day / lighting mood.

                NOTABLE: Anything else that stands out (text, watermarks, logos, blood, deformed body parts, weird artifacts). If none, write "none".

                Be concise but specific. Do not invent details that aren't visible.
              description: "Custom question for the VLM. Default asks for people + objects + setting + notable artifacts — suitable for full cover verification."
              node_id: "2"
              field: inputs.custom_prompt
            - name: max_tokens
              type: integer
              default: 512
              description: "Max tokens in the caption (64–2048)."
              node_id: "2"
              field: inputs.max_tokens
            - name: seed
              type: integer
              default: 1
