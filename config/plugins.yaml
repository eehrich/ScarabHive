# ================================
# Plugin Configuration  
# ================================
# Configuration for local MCP plugins (servers)

plugins:
  # Plugin discovery directories
  plugin_dirs:
    - src/plugins
  
  # Default configuration for all plugins
  default_config:
    type: basic_agent
    enabled: false
    
    agent_config:
      llm_profile: normal
      max_steps: 20
      system_template: "config/prompts/system_prompt.yaml"
      
      tools:
        allowed: []
        blocked: []
  
  # Plugin server configurations
  servers:
    example:
      type: example
      enabled: true
    
    basic_agent:
      type: basic_agent
      enabled: true
      agent_config:
        tools:
          allowed:
            - "*"
    
    duckduckgo_search:
      type: duckduckgo_search
      enabled: true
    
    basic_operations:
      type: basic_operations
      enabled: true
      max_wait_seconds: 3600
      default_update_interval: 5.0
    
    http_server:
      type: http_server
      enabled: false
      host: 127.0.0.1
      port: 9000
    
    yahoo_finance:
      type: yahoo_finance
      enabled: false
    
    twitter_search:
      type: twitter_search
      enabled: false
    
    web_scraper:
      type: web_scraper
      enabled: true
      proxies: []
    
    weather:
      type: weather
      enabled: true
    
    datetime:
      type: datetime
      enabled: true
    
    llm_router:
      type: llm_router
      enabled: true
    
    log_viewer:
      type: log_viewer
      enabled: true
    
    script_interpreter:
      type: script_interpreter
      enabled: true
    
    web_research_agent:
      type: web_research_agent
      enabled: true
      max_steps: 20
      agent_config:
        llm_profile: normal
        tools:
          allowed:
            - "duckduckgo_search/*"
            - "web_scraper/*"
    
    ibkr:
      type: ibkr
      enabled: false
      host: 127.0.0.1
      port: 4002
    
    ssh_control:
      type: ssh_control
      enabled: true
      machines:
        - name: controlhost
          host: 192.0.2.114
          port: 22
          username: root
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3
        - name: MCP
          host: 192.0.2.113
          port: 22
          username: root
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3
    
    user_management:
      type: user_management
      enabled: true
    
    context_summarizer:
      type: context_summarizer
      enabled: true
    
    context_optimizer:
      type: context_optimizer
      enabled: true
    
    context_usage_tracker:
      type: context_usage_tracker
      enabled: true
    
    request_logger:
      type: request_logger
      enabled: true

# ================================
# Hook Configuration
# ================================
# Global configuration for plugin hooks
hooks:
  # Global hook settings
  enabled: true  # Master switch for all hooks
  default_timeout: 30.0  # Default timeout in seconds
  
  # Per-hook configuration overrides
  # Format: hook_name or plugin_name.hook_name
  overrides:
    # Example: Override request_logger hooks
    # request_logger.log_pre_llm:
    #   enabled: true
    #   timeout: 5.0
    
    # Example: Configure hook ordering
    # context_optimizer:
    #   enabled: true
    #   timeout: 10.0
    #   order:
    #     after: ["begin"]
    #     before: ["message_validator"]
    #
    # message_validator:
    #   enabled: true
    #   timeout: 5.0
    #   order:
    #     after: ["context_optimizer"]
    #     before: ["end"]
