# ================================
# Plugin Configuration  
# ================================
# Configuration for local MCP plugins (servers)

plugins:
  # Plugin discovery directories
  plugin_dirs:
    - src/plugins
  
  # Default configuration for all plugins
  default_config:
    type: basic_agent
    enabled: false
    
    agent_config:
      llm_profile: normal
      max_steps: 20
      system_template: "config/prompts/system_prompt.yaml"
      
      hooks:        
        enabled: true 
        overrides:  # by default disable html formatting of markdown
          markdown_formatter.format_markdown_output:
             enabled: false     

      tools:
        allowed: []
        blocked: []
  
  # Plugin server configurations
  servers:
    example:
      type: example
      enabled: true
    
    basic_agent:
      type: basic_agent
      enabled: true
      agent_config:
        tools:
          allowed:
            - "*"
        hooks:
          enabled: true
          overrides:
            todo.inject_todo_tasks:
              enabled: true
            memory.inject_memory_context:
              enabled: true
            sequential_thinking.inject_active_sessions:
              enabled: true
      
      metadata:
        visibility: "both"  # Make available as tool for meta_agent
    

    
    basic_operations:
      type: basic_operations
      enabled: true
      max_wait_seconds: 3600
      default_update_interval: 5.0
    
    sequential_thinking:
      type: sequential_thinking
      enabled: true
      max_history_size: 100
      session_ttl_seconds: 3600
      enable_branching: true
      enable_revisions: true
      max_summary_thoughts: 10
      
      # Hook config for inject_active_sessions
      max_thoughts_in_prompt: 5
      show_branch_info: true
      format: markdown
    
    todo:
      type: todo
      enabled: true
    
    memory:
      type: memory
      enabled: true
      max_memories: 10
      max_memories_per_session: 1000
      auto_extract_keywords: true
      search_n_results: 5
      use_semantic_injection: true

    http_server:
      type: http_server
      enabled: false
      host: 127.0.0.1
      port: 9000
    
    yahoo_finance:
      type: yahoo_finance
      enabled: false
    
    twitter_search:
      type: twitter_search
      enabled: false
    
    weather:
      type: weather
      enabled: true
    
    datetime:
      type: datetime
      enabled: true
    
    llm_router:
      type: llm_router
      enabled: true
    
    log_viewer:
      type: log_viewer
      enabled: true
    
    script_interpreter:
      type: script_interpreter
      enabled: true
    
    file_ops:
      type: file_ops
      enabled: true
      allowed_directories:
        - data/workspace
      max_file_size_mb: 10
      search:
        enable_indexing: true
        auto_reindex_interval: 300  # 5 minutes
        exclude_patterns:
          - "**/.git/**"
          - "**/__pycache__/**"
          - "**/node_modules/**"
          - "**/.venv/**"
          - "**/*.min.js"
          - "**/*.min.css"
          - "**/*.map"
    
    # File Operations Test Agent - RESTRICTED to data/workspace/ for safe testing
    file_ops_test_agent:
      type: basic_agent
      enabled: true
      description: "Test agent for file_ops plugin - RESTRICTED to data/workspace/ directory only"
      
      agent_config:
        llm_profile: normal
        max_steps: 20
        system_template: "config/prompts/file_ops_test_prompt.yaml"
        
        tools:
          allowed:
            - "file_ops/*"
            - "basic_operations/*"
            - "datetime/*"
        
        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true
      
      metadata:
        author: "AgentSystem"
        version: "1.0.0"
        tags: ["test", "file_operations", "development"]
        category: "development"
        visibility: "ui"
    
    sub_agent_manager:
      type: sub_agent_manager
      enabled: true
      max_nesting_depth: 5      
      allowed_agents:
        - basic_agent
        - web_research_agent
        - financial_analyst_agent
        - code_reviewer_agent
        - meta_web_research_agent
        - parallel_thinking_agent
        - thinking_agent
      hook_config:
        enabled: true
        inject_sub_agent_context:
          enabled: true
          max_sub_agents_shown: 5
          format: "markdown"
    
    user_management:
      type: user_management
      enabled: true
    
    context_summarizer:
      type: context_summarizer
      enabled: true
      config:
        max_message_preview_length: 5000
    
    context_optimizer:
      type: context_optimizer
      enabled: true
    
    context_usage_tracker:
      type: context_usage_tracker
      enabled: true
    
    request_logger:
      type: request_logger
      enabled: true
    
    message_validator:
      type: message_validator
      enabled: true
      config:
        log_level: warning
        strict_mode: false
    
    markdown_formatter:
      type: markdown_formatter
      enabled: true
    
    message_debugger:
      type: message_debugger
      enabled: true
    
# ================================
# Hook Configuration
# ================================
# Global configuration for plugin hooks
hooks:
  # Global hook settings
  enabled: true  # Master switch for all hooks
  default_timeout: 30.0  # Default timeout in seconds
  
  # Per-hook configuration overrides
  # Format: hook_name or plugin_name.hook_name
  overrides:
    # Example: Override request_logger hooks
    # request_logger.log_pre_llm:
    #   enabled: true
    #   timeout: 5.0
    
    # Example: Configure hook ordering
    # context_optimizer:
    #   enabled: true
    #   timeout: 10.0
    #   order:
    #     after: ["begin"]
    #     before: ["message_validator"]
    #
    # message_validator:
    #   enabled: true
    #   timeout: 5.0
    #   order:
    #     after: ["context_optimizer"]
    #     before: ["end"]
