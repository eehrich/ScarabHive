        injection_position: "before_last_user"  # or "end"
        role: "system"

    agent_continuation:
      type: agent_continuation
      enabled: true
      config:
        max_continuations: 10
        strategy: "rules"
        llm_profile: "turbo"
        default_continue_message: >
          Your previous response appears to be an intermediate status update,
          not a final result.  Continue executing the remaining steps of your
          task.  Do not repeat status information — proceed with the next
          action.
        # Per-agent rules can be configured here OR inline in the agent's
        # hooks.overrides (preferred — keeps config with the agent).
        # agent_rules:
        #   my_agent:
        #     strategy: "rules"
        #     default: "continue"
        #     rules:
        #       - type: keyword_final
        #         keywords: ["done", "completed"]


    terminal:
      type: terminal
      enabled: true

      # Security settings
      security:
        # Whitelist: If set, only these patterns are allowed
        # whitelist:
        #   - "^git .*"
        #   - "^python .*"
        #   - "^npm .*"
        #   - "^pytest .*"
        #   - "^ls .*"
        #   - "^cat .*"
        #   - "^grep .*"

        # Blacklist: Always blocked patterns
        blacklist:
          - "rm -rf /"
          - "dd if="
          - "mkfs"
          - "chmod 777"

        # Allow chained commands (&&, ||, ;)
        allow_command_chains: true

      # Resource limits
      limits:
        max_output_size_kb: 60  # Like GitHub Copilot
        default_timeout_seconds: 300
        max_timeout_seconds: 3600
        max_concurrent_background: 10

      # Platform settings
      platform:
        bash_path: "auto"  # Auto-detect or specify path
        initial_cwd: null  # Default to current directory

    audio_ops:
      type: audio_ops
      enabled: true
      description: "Audio file manipulation - cut segments from FLAC/MP3/WAV files"
      storage_path: "data/audio_ops"
 
