# ================================
# Plugin Configuration
# ================================
# Configuration for local MCP plugins (servers)
# Note: Additional plugin configs are loaded via includes in config/config.yaml
# (e.g., agents_writer/writer_plugin_configs.yaml, agents_trading/trading_plugin_configs.yaml)

plugins:
  # Plugin discovery directories
  plugin_dirs:
    - src/plugins
    - src/plugins_writer
    - src/plugins_trading

  # Default configuration for all plugins
  default_config:
    type: basic_agent
    enabled: false

    agent_config:
      llm_profile: normal
      max_steps: 20
      system_template: "config/prompts/system_prompt.yaml"

      hooks:
        enabled: true
        overrides:  # by default disable html formatting of markdown
          markdown_formatter.format_markdown_output:
             enabled: false

      timeouts:
        # Queue handler timeouts (prevent cross-session blocking)
        status_queue_put_timeout: 5.0  # seconds
        
        # LLM task timeout (only for truly stuck LLM calls)
        llm_task_max_iterations: 6000  # 6000 * 0.1s = 10 minutes max
        
        # Session lock timeout (prevent same-session deadlock)
        session_lock_timeout: 5.0  # seconds
    
      tools:
        allowed: []
        blocked: []

  # Plugin server configurations
  servers:
    example:
      type: example
      enabled: true

    basic_agent:
      type: basic_agent
      enabled: true
      agent_config:
        llm_profile: ["think", "normal", "turbo", "chat"]  # First is default, rest are available options
        
        timeouts:
          # Queue handler timeouts (prevent cross-session blocking)
          status_queue_put_timeout: 5.0  # seconds
          
          # LLM task timeout (only for truly stuck LLM calls)
          llm_task_max_iterations: 6000  # 6000 * 0.1s = 10 minutes max
          
          # Session lock timeout (prevent same-session deadlock)
          session_lock_timeout: 5.0  # seconds
          
          # NOTE: Hooks and tools have NO hard timeouts - they can run as long as needed
          # Examples: context_summarizer (10+ min), sub_agent_manager (hours)
        
        tools:
          allowed: []
        hooks:
          enabled: true
          overrides:
            todo.inject_todo_tasks:
              enabled: true
            memory.inject_memory_context:
              enabled: true
            sequential_thinking.inject_active_sessions:
              enabled: true

      metadata:
        visibility: "both"  # Make available as tool for meta_agent



    basic_operations:
      type: basic_operations
      enabled: true
      max_wait_seconds: 3600
      default_update_interval: 5.0

    sequential_thinking:
      type: sequential_thinking
      enabled: true
      max_history_size: 100
      session_ttl_seconds: 3600
      enable_branching: true
      enable_revisions: true
      max_summary_thoughts: 10

      # Hook config for inject_active_sessions
      max_thoughts_in_prompt: 5
      show_branch_info: true
      format: markdown

    cognitive_stack:
      type: cognitive_stack
      enabled: true
      max_depth: 50
      max_frames_in_prompt: 3

    todo:
      type: todo
      enabled: true

    memory:
      type: memory
      enabled: true
      max_memories: 10
      max_memories_per_session: 1000
      auto_extract_keywords: true
      search_n_results: 5
      use_semantic_injection: true

    http_server:
      type: http_server
      enabled: false
      host: 127.0.0.1
      port: 9000

    twitter_search:
      type: twitter_search
      enabled: false

    weather:
      type: weather
      enabled: true

    datetime:
      type: datetime
      enabled: true

    llm_router:
      type: llm_router
      enabled: true

    log_viewer:
      type: log_viewer
      enabled: true
      log_files:
        - logs/api.log
        - logs/cli.log

      max_lines: 20           # Maximum lines to return per request
      refresh_interval: 1.0   # Polling interval in seconds for UI updates

    script_interpreter:
      type: script_interpreter
      enabled: true

    file_ops:
      type: file_ops
      enabled: true
      allowed_directories:
        - data/workspace
      max_file_size_mb: 10
      search:
        enable_indexing: true
        index_on_startup: true
        enable_semantic_search: true
        auto_reindex_interval: 3600
        exclude_patterns:
          - "**/.git/**"
          - "**/__pycache__/**"
          - "**/node_modules/**"
          - "**/.venv/**"
          - "**/*.min.js"
          - "**/*.min.css"
          - "**/*.map"

    workspace_file_ops:
      type: file_ops
      enabled: true
      allowed_directories:
        - .
      max_file_size_mb: 200
      search:
        enable_indexing: true
        index_on_startup: false  # Don't auto-index on startup (too slow for large workspace)
        enable_semantic_search: true
        auto_reindex_interval: 3600  # 1 hour (reduced from 5 min to avoid constant rebuilds)
        exclude_patterns:
          - "**/.git/**"
          - "**/cache/**"
          - "**/.tmp/**"
          - "**/.backups/**"
          - "**/.pytest_cache/**"
          - "**/.ruff_cache/**"
          - "**/.mypy_cache/**"
          - "**/__pycache__/**"
          - "**/node_modules/**"
          - "**/.venv/**"
          - "**/*.min.js"
          - "**/*.min.css"
          - "**/*.map"




    #sqlite_query:
    #  type: sqlite_query
    #  enabled: true
    #  database: "data/writer/books.db"
    #  query_timeout: 30

    sub_agent_manager:
      type: sub_agent_manager
      enabled: true
      max_nesting_depth: 5
      allowed_agents:
        - basic_agent
        - web_research_agent
        - financial_analyst_agent
        - code_reviewer_agent
        - meta_web_research_agent
        - parallel_thinking_agent
        - thinking_agent
      hook_config:
        enabled: true
        inject_sub_agent_context:
          enabled: true
          max_sub_agents_shown: 5
          format: "markdown"

    user_management:
      type: user_management
      enabled: true

    context_summarizer:
      type: context_summarizer
      enabled: true
      config:
        max_message_preview_length: 5000
        min_time_between_summarizations: 500

    context_optimizer:
      type: context_optimizer
      enabled: true

    context_usage_tracker:
      type: context_usage_tracker
      enabled: true

    request_logger:
      type: request_logger
      enabled: true

    message_validator:
      type: message_validator
      enabled: true
      config:
        log_level: warning
        strict_mode: false

    markdown_formatter:
      type: markdown_formatter
      enabled: true

    message_debugger:
      type: message_debugger
      enabled: true


    terminal:
      type: terminal
      enabled: true

      # Security settings
      security:
        # Whitelist: If set, only these patterns are allowed
        # whitelist:
        #   - "^git .*"
        #   - "^python .*"
        #   - "^npm .*"
        #   - "^pytest .*"
        #   - "^ls .*"
        #   - "^cat .*"
        #   - "^grep .*"

        # Blacklist: Always blocked patterns
        blacklist:
          - "rm -rf /"
          - "dd if="
          - "mkfs"
          - "chmod 777"

        # Allow chained commands (&&, ||, ;)
        allow_command_chains: true

      # Resource limits
      limits:
        max_output_size_kb: 60  # Like GitHub Copilot
        default_timeout_seconds: 300
        max_timeout_seconds: 3600
        max_concurrent_background: 10

      # Platform settings
      platform:
        bash_path: "auto"  # Auto-detect or specify path
        initial_cwd: null  # Default to current directory

# ================================
# Hook Configuration
# ================================
# Global configuration for plugin hooks
hooks:
  # Global hook settings
  enabled: true  # Master switch for all hooks
  default_timeout: 30.0  # Default timeout in seconds

  # Per-hook configuration overrides
  # Format: hook_name or plugin_name.hook_name
  overrides:
    # Example: Override request_logger hooks
    # request_logger.log_pre_llm:
    #   enabled: true
    #   timeout: 5.0

    # Example: Configure hook ordering
    # context_optimizer:
    #   enabled: true
    #   timeout: 10.0
    #   order:
    #     after: ["begin"]
    #     before: ["message_validator"]
    #
    # message_validator:
    #   enabled: true
    #   timeout: 5.0
    #   order:
    #     after: ["context_optimizer"]
    #     before: ["end"]
