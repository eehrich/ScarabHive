---
# Configurable backlog values for status lists and symbol mappings.
# This file is optional; the code will fall back to sensible defaults if absent.
allowed_statuses:
  - open
  - done
  - closed
  - complete
  - finished
  - resolved
  - in progress
  - todo
  - reverted
  - rejected
  - cancelled
  - failed

finish_statuses:
  - done
  - closed
  - complete
  - finished
  - implemented
  - fixed

symbol_map:
  "☐": open
  "✅": done
  "❌": 
    - cancelled
    - rejected
    - reverted
  "⏳": "in progress"

word_map:
  done: done
  implemented: done
  finished: done
  resolved: done
  closed: done
  completed: done
  open: open
  "in progress": "in progress"
  started: "in progress"
  "in work": "in progress"
  in_work: "in progress"
  reverted: reverted
  rejected: rejected
  cancelled: cancelled
  deferred: cancelled
  duplicate: cancelled
  wontfix: cancelled
  failed: cancelled

acceptable_terminal:
  - done
  - reverted
  - rejected
  - cancelled
  - implemented
  - fixed
  - failed
