# ================================
# External MCP Servers Configuration
# ================================
# Configuration for remote/external MCP servers
#
# Reichweite: Tools externer Server erreichen Agenten ueber die API UND ueber
# `agent-cli run`. Letzteres ging bis 02.09.2026 nicht -- die CLI verband in
# einem eigenen asyncio.run() und schloss dessen Loop, bevor der Agent fragte.
# Sie faehrt jetzt EINEN Loop; die Erklaerung steht bei run_async() in
# agent_system/agent_cli.py.

external_servers:
  # Connection settings
  connection:
    timeout: 5.0
    parallel_connect: true
  
  # Caching configuration
  cache:
    enabled: true
    tool_list_ttl: 3600.0  # TTL for tool list cache (seconds)
    max_size: null         # Maximum cache entries (null = unlimited)
  
  # Remote MCP server definitions
  remote_servers:
    # --- Lokaler Server ueber stdio -------------------------------------
    # Der einzige stdio-Eintrag hier, deshalb ausfuehrlich: bei transport
    # stdio wird der Server GESTARTET statt angewaehlt, also braucht er
    # `command` (+ optional `args`, `env`) statt `url`. Er laeuft als
    # Subprozess mit unseren Rechten -- deshalb der Versions-Pin unten.
    #
    # npx/uvx SIND der Installationsweg des Oekosystems: sie holen das Paket
    # beim ersten Start und cachen es. Nichts liegt im Repo. Wer Server doch
    # auf Platte braucht (offline, gepinnt, Host ohne npm), legt sie nach
    # external/ -- das ist dafuer vorgesehen und in .gitignore.
    #
    # Live geprueft am 01.09.2026 ueber die ganze Kette: Bootstrap verbindet
    # ("1 connected, 0 failed", Protokoll 2025-06-18), der Agent
    # mcp_external_test_agent sieht 13 Tools und hat zwei davon wirklich
    # gerufen -- im Log stehen die Antworten des Servers, nicht die des LLM.
    # Aus bleibt er trotzdem: ein Referenz-Testserver gehoert nicht in den
    # Produktionsstart, und `npx` setzt node auf dem Host voraus.
    everything:
      enabled: false
      transport: stdio
      command: npx
      # Ohne den Versions-Pin zieht `-y` bei JEDEM Start, was gerade neu ist.
      # ACHTUNG: die npm-Version ist datumsbasiert und hat NICHTS mit der zu
      # tun, die der Server im Handshake ueber sich meldet (dort "2.0.0").
      # Ein Pin auf die gemeldete Version scheitert mit npm ENOTARGET, und
      # der Server startet gar nicht erst -- `npm view <paket> version` fragen.
      args: ["-y", "@modelcontextprotocol/server-everything@2026.8.31"]
      description: Referenz-MCP-Server des Protokolls (Beispiel + Rauchtest)
      features:
        tools: true

    # --- Derselbe Server, aber auf Platte statt auf Zuruf ---------------
    # Der Ordner external/ ist gitignored: nach einem frischen Checkout ist er
    # LEER und dieser Eintrag zeigt ins Nichts. Die Installation ist deshalb
    # ein bewusster Schritt, kein Automatismus:
    #
    #   mkdir -p external/mcp && cd external/mcp
    #   npm init -y
    #   npm install @modelcontextprotocol/server-everything@2026.8.31
    #
    # (npm legt die Version in seine package.json; wer den Ordner behalten
    # will, hat damit sein Pin.)
    #
    # `node <pfad>` statt des .bin-Shims: der ist auf Windows eine .cmd und
    # auf Linux ein Symlink, der Pfad zur dist/index.js ist auf beiden gleich.
    # Relativ zum Repo-Wurzelverzeichnis, aus dem API und CLI starten.
    #
    # Wann lohnt das gegenueber npx: gemessen 01.09.2026, Median aus je drei
    # Verbindungen -- npx 1,11s, lokal 0,18s. Faktor 6, und der Start haengt
    # nicht mehr am Netz. Dafuer muss jemand das Update anstossen.
    everything_local:
      enabled: false
      transport: stdio
      command: node
      args: ["external/mcp/node_modules/@modelcontextprotocol/server-everything/dist/index.js"]
      description: Wie 'everything', aber aus external/mcp statt ueber npx
      features:
        tools: true

    # Bruecke zu einem lokal laufenden Blender (blender-mcp 1.9.0): der
    # stdio-Server uebersetzt MCP -> Socket localhost:9876, auf dem das
    # Blender-Addon lauscht. Der Socket verbindet LAZY pro Tool-Aufruf,
    # der Handshake klappt also auch ohne laufendes Blender.
    #
    # Installation (external/ ist gitignored):
    #   uv venv external/mcp/blender_mcp/.venv
    #   uv pip install --python external/mcp/blender_mcp/.venv blender-mcp==1.9.0
    #   external/mcp/blender_mcp/.venv/Scripts/blender-mcp.exe install-addon
    # Blender-Seite (einmalig): Addon 'Interface: Blender MCP' aktivieren,
    # dann im N-Panel "BlenderMCP" -> "Start MCP Server" (Port 9876).
    #
    # Default AN, anders als die Demo-Server: mcp_client_connect kennt nur
    # enabled-Server (manager.py filtert beim Laden), ein "bei Bedarf
    # verbinden" gibt es fuer disabled also nicht. Die Bruecke ohne
    # laufendes Blender ist nur ein Leerlaufprozess -- der Socket wird
    # erst am Tool-Aufruf aufgebaut, der dann klar meldet, dass in
    # Blender der MCP-Server nicht laeuft.
    blender:
      enabled: true
      transport: stdio
      # Renders brauchen Minuten; das globale connection.timeout (5s) toetete
      # jeden execute_blender_code-Aufruf. Die Bridge selbst kappt Richtung
      # Blender bei 180s -- 300 hier heisst: ihr Fehler kommt zuerst und
      # traegt die bessere Meldung.
      timeout: 300
      command: external/mcp/blender_mcp/.venv/Scripts/blender-mcp.exe
      description: Blender-Steuerung (Szene, Objekte, Material, Code) via blender-mcp
      env:
        # Paket funkt sonst Prompts + Screenshots an ein fremdes Supabase.
        BLENDER_MCP_DISABLE_TELEMETRY: "true"
      features:
        tools: true


