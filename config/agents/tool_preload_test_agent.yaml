# Live test agent for tool_preload: the predictable opening ("work on document X" =>
# read the store) runs BEFORE the first LLM call, in code.
#
# Passes if the agent names the content without any Read triggered BY IT in its session:
# only the preload_ call may be there.
#
# To rerun, set BOTH enabled flags below to true (store AND agent), restart the API and
# create a document:
#   data/json_store/preload_store/preload-demo/mein-plan.json
#   {"namespace":"preload-demo","doc":"mein-plan","owner":"x","data":{...}}
plugins:
  servers:
    preload_store:
      type: json_store
      enabled: false
      description: "tool_preload test store"

    tool_preload_test_agent:
      type: basic_agent
      # Off so it does not appear in the agent list. Set to true and restart the API to rerun
      # the live test.
      enabled: false
      description: "Test agent: preloading the predictable opening tool call"

      agent_config:
        llm_profile: [or-deepseek-flash, chat-nostream, gemini-flash]
        llm_profile_advanced: []
        max_steps: 6

        tools:
          allowed:
            - "preload_store/*"

        hooks:
          enabled: true
          overrides:
            tool_preload.preload:
              enabled: true
              rules:
                # "... Dokument mein-plan ..." -> read on the store. namespace is fixed so that
                # preparation and agent session see the same document (otherwise session-scoped).
                - match: "Dokument\\s+(?P<doc>[\\w-]+)"
                  tool: "preload_store_manage_json"
                  params:
                    operation: "read"
                    namespace: "preload-demo"
                    doc: "{doc}"

        system_prompt: |
          Du bist ein Testagent. Beantworte Fragen zu Dokumenten aus dem
          json_store knapp und praezise.

      metadata:
        visibility: "both"
        tags:
          - test
          - preload
