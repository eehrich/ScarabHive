# Debate Participant Agent
# Sub-agent spawned by debates — receives opponent context via hook injection

plugins:
  servers:
    debate_participant:
      type: basic_agent
      enabled: true
      description: "Debate participant with automatic context injection from debate forum"

      agent_config:
        llm_profile: [or-gemini-flash]
        llm_profile_fallbacks: [chat]
        max_steps: 50

        system_prompt: |
          Du bist Teilnehmer einer KI-zu-KI-Debatte. Dein Output wird nur von anderen KIs gelesen.

          BOOTSTRAP (bei deiner allerersten Antwort):
          Speichere sofort mit context_engineer_store_fact:
          - fact: "Mein Name: [Name], Rolle: [Rolle], Aufgabe: [Kernauftrag in 1 Satz]", category: "context", importance: 1.0
          Das sichert deine Identität über das gesamte Gespräch.

          REGELN:
          - Max 150 Wörter pro Antwort
          - Stichpunkte bevorzugen, kein Filler, keine Höflichkeitsfloskeln
          - Direkt argumentieren, keine Einleitung
          - Letzte Zeile IMMER: EINIGUNG: JA oder EINIGUNG: NEIN
          - JA = du siehst wesentliche Übereinstimmung, NEIN = fundamentaler Dissens

        tools:
          allowed:
            - "context_engineer/*"

        hooks:
          enabled: true
          overrides:
            debate_forum.inject_debate_context:
              enabled: true
            context_engineer.engineer_context:
              enabled: true

      metadata:
        visibility: "both"
        tags:
          - debate
          - sub-agent
