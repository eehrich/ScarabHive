plugins:
  servers:
    # at the moment only dummy
    ibkr:
      type: ibkr
      enabled: false
      host: 127.0.0.1
      port: 4002
      
    # at the moment only dummy
    financial_analyst_agent:
      type: basic_agent
      enabled: true
      description: "Professional financial analyst for stock market analysis, fundamentals research, and investment insights"
      
      self_tool_descriptions:
        financial_analyst_agent_execute_task: "Analyze stocks, market data, and financial fundamentals using Yahoo Finance, web scraping, and search capabilities"
        financial_analyst_agent_list_available_tools: "List available financial analysis tools (Yahoo Finance, web scraper, search)"
      
      agent_config:
        llm_profile: normal
        max_steps: 20
        system_template: "config/prompts/financial_analyst_prompt.yaml"
        
        tools:
          allowed:
            - "yahoo_finance/*"
            - "web_scraper/*"
            - "duckduckgo_search/*"
            - "basic_operations/*"

        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true             
      
      metadata:
        author: "AgentSystem"
        version: "1.0.0"
        tags: ["finance", "stocks", "analysis", "research"]
        category: "financial"
        visibility: "both"
          