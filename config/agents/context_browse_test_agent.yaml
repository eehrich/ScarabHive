# Live-Testagent für die Browsing-Oberfläche des context_engineer
# (list / search / read auf den EIGENEN Kontext).
#
# Absichtlich brutal eingestellt: archiviert nach EINEM Turn und lagert fast
# jedes Tool-Ergebnis aus. Damit ist eine Information aus Turn 1 in Turn 3
# garantiert nicht mehr im Kontext, sondern nur noch im Archiv — genau die
# Lage, in der die drei Verben etwas taugen müssen.
#
# Nicht produktiv nutzen: mit diesen Schwellen bricht jede Verdichtung den
# Prompt-Cache-Präfix (docs/prompt_cache_design.md §3.5).
plugins:
  servers:
    context_browse_test_agent:
      type: basic_agent
      # Aus, damit er nicht in der Agentenliste steht. Zum Nachfahren des
      # Live-Tests auf true setzen und die API neu starten; das Rezept steht
      # in .claude/skills/verify.
      enabled: false
      description: "Test agent: browsing its own archived context"

      agent_config:
        llm_profile: [chat-nostream, gemini-flash]
        llm_profile_advanced: []
        max_steps: 12

        tools:
          allowed:
            # Bewusst NUR die drei Verben: mit store_fact würde der Agent die
            # gesuchte Information in den System-Prompt legen und käme nie ans
            # Archiv — der Test prüfte dann etwas anderes als gemeint. recall
            # ist ebenfalls draußen, damit der neue Weg allein tragen muss.
            - "context_engineer/context_engineer_list"
            - "context_engineer/context_engineer_search"
            - "context_engineer/context_engineer_read"
            - "datetime/*"

        hooks:
          enabled: true
          overrides:
            context_engineer.engineer_context:
              enabled: true
              # Jede dieser Zahlen ist absichtlich unrealistisch klein.
              layer1_threshold: 400      # Tool-Ergebnisse sofort auslagern
              layer2_threshold: 600      # Nachrichten sofort archivieren
              layer3_threshold: 900000   # aber nichts wegwerfen — sonst
                                         # wäre der Test nicht gewinnbar
              target_tokens: 300
              archive_after_turns: 1     # alles ausser dem aktuellen Turn
              tool_result_min_size: 20
              tool_result_keep_last: 0
              assistant_keep_last: 1
              variable_min_size: 100

        system_prompt: |
          Du bist ein Testagent. Dein Kontext wird sehr aggressiv verdichtet:
          ältere Nachrichten verschwinden aus dem Gespräch und liegen dann nur
          noch im Archiv.

          Wenn du etwas aus dem früheren Gesprächsverlauf brauchst, das nicht
          mehr sichtbar ist, hol es dir mit deinen context_engineer-Tools.
          Erfinde nichts und rate nicht — sag lieber, dass du es nicht findest.

      metadata:
        visibility: "both"
        tags:
          - test
          - context
