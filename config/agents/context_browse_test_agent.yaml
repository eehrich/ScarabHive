# Live test agent for the browsing surface of context_engineer
# (list / search / read on the agent's OWN context).
#
# Deliberately extreme: archives after ONE turn and offloads almost every tool result. So
# information from turn 1 is guaranteed to be only in the archive by turn 3, which is the
# situation the three verbs must handle.
#
# Not for production use: with these thresholds every compaction breaks the prompt-cache prefix.
plugins:
  servers:
    context_browse_test_agent:
      type: basic_agent
      # Off so it does not appear in the agent list. Set to true and restart the API to rerun
      # the live test.
      enabled: false
      description: "Test agent: browsing its own archived context"

      agent_config:
        llm_profile: [or-deepseek-flash, chat-nostream, gemini-flash]
        llm_profile_advanced: []
        max_steps: 12

        tools:
          allowed:
            # Deliberately ONLY the two verbs: with store_fact the agent would put the sought
            # information into the system prompt and never reach the archive. recall is excluded too, so
            # the browsing verbs must carry alone.
            - "context_engineer/context_engineer_list"
            - "context_engineer/context_engineer_read"
            - "datetime/*"

        hooks:
          enabled: true
          overrides:
            context_engineer.engineer_context:
              enabled: true
              # Each of these numbers is deliberately unrealistically small.
              layer1_threshold: 400      # offload tool results immediately
              layer2_threshold: 600      # archive messages immediately
              layer3_threshold: 900000   # but discard nothing, otherwise
                                         # the test could not be won
              target_tokens: 300
              archive_after_turns: 1     # everything except the current turn
              tool_result_min_size: 20
              tool_result_keep_last: 0

        system_prompt: |
          You are a test agent. Your context is compacted very aggressively:
          older messages leave the conversation and are then only in the
          archive.

          If you need something from earlier in the conversation that is no
          longer visible, fetch it with your context_engineer tools.
          Do not invent and do not guess; rather say that you cannot find it.

      metadata:
        visibility: "both"
        tags:
          - test
          - context
