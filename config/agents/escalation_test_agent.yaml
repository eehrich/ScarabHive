plugins:
  servers:

    esc_json:
      type: json_store
      enabled: true
      description: "escalation test store"

    # Dev harness for auto_escalate_on_stuck. Standard profile = turbo
    # (gemini-3.5-flash-lite via OpenRouter), advanced = or-deepseek-flash, then chat. This validates the
    # ESCALATION MECHANISM (the model swap fires on stuck signals), not that the
    # advanced model is stronger. Run explicitly with `agent-cli run --agent
    # escalation_test_agent` and a deliberately repetitive task.
    # `visibility: private` keeps it out of the general UI agent list; it still
    # makes real (cheap) API calls, so keep it a dev-only harness.
    escalation_test_agent:
      type: basic_agent
      enabled: true
      description: "Dev harness for stuck auto-escalation (loop detector + tool errors)"

      agent_config:
        llm_profile: [turbo]  # [standard=gemini-3.5-flash-lite via OpenRouter, advanced=or-deepseek-flash -> deepseek-chat]
        llm_profile_advanced: [or-deepseek-flash, chat]
        max_steps: 8
        system_template: "./prompts/escalation_test_prompt.md"

        auto_escalate_on_stuck: true
        escalate_rounds: 2
        escalate_max_calls: 4
        escalate_error_streak: 2

        loop_detection:
          enabled: true
          exact_match_threshold: 3

        tools:
          allowed:
            - "esc_json/*"

      metadata:
        author: "AgentSystem"
        version: "1.0.0"
        tags: ["test", "escalation"]
        category: "development"
        visibility: "private"
