# Live test agent for Pre-Layer P (compaction by message count).
#
# The token thresholds are deliberately unreachable: layers 1-3 never run, so everything that
# disappears from the conversation disappears through Pre-Layer P. A piece of information can
# only resurface if P archived it first.
#
# Not for production use: max_messages=24 breaks the prompt-cache prefix every ~12 messages.
plugins:
  servers:
    context_prune_test_agent:
      type: basic_agent
      # Off so it does not appear in the agent list. Set to true and restart the API to rerun
      # the live test.
      enabled: false
      description: "Test agent: recovering context that Pre-Layer P pruned"

      agent_config:
        llm_profile: [or-deepseek-flash, chat-nostream, gemini-flash]
        llm_profile_advanced: []
        max_steps: 12

        tools:
          allowed:
            # Only the two verbs: with store_fact the agent would put the sought information into the
            # system prompt and the test would measure something else. recall is excluded too, so that
            # list/read must carry alone.
            - "context_engineer/context_engineer_list"
            - "context_engineer/context_engineer_read"
            - "datetime/*"

        hooks:
          enabled: true
          overrides:
            context_engineer.engineer_context:
              enabled: true
              # Unreachably high: none of the three layers may run.
              layer1_threshold: 9000000
              layer2_threshold: 9000001
              layer3_threshold: 9000002
              target_tokens: 8000000
              # The only way into compact(), same as in production.
              compact_media_after_user_message: true
              min_tokens_between_compactions: 0
              # And the only mechanism that acts there.
              #
              # Do NOT lower: Pre-Layer P picks its candidates among the oldest max(2*excess, 20) messages,
              # at most up to the newer half of what remains, so the current tail (the agent's working set)
              # stays untouched. With a very small limit that half is only a few messages long, and the agent
              # evicts the retrieval answer it just fetched within the same turn. Without
              # max_messages_prune_to, P trims to half (12).
              max_messages: 24
              keep_system_messages: true

        system_prompt: |
          Du bist ein Testagent. Dein Kontext wird sehr aggressiv gekürzt:
          ältere Nachrichten verschwinden aus dem Gespräch und liegen dann nur
          noch im Archiv.

          Wenn du etwas aus dem früheren Gesprächsverlauf brauchst, das nicht
          mehr sichtbar ist, hol es dir mit deinen context_engineer-Tools.
          Erfinde nichts und rate nicht — sag lieber, dass du es nicht findest.

      metadata:
        visibility: "both"
        tags:
          - test
          - context
