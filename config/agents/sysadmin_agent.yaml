plugins:
  servers:

    # ssh utils
    ssh_control:
      type: ssh_control
      enabled: true
      machines:
        - name: hosta
          host: 192.0.2.2
          port: 22
          username: root
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3      
        - name: hostb
          host: 192.0.2.4
          port: 22
          username: root
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3
        - name: gpuhost1
          host: 192.0.2.5
          port: 22
          username: operator
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3     
        - name: gpuhost2
          host: 192.0.2.6
          port: 22
          username: operator
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3                   
        - name: controlhost
          host: 192.0.2.114
          port: 22
          username: root
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3
        - name: MCP
          host: 192.0.2.113
          port: 22
          username: root
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3
        - name: PiHole
          host: 192.0.2.25
          port: 22
          username: root
          auth_method: key
          key_path: ~/.ssh/id_rsa
          max_connections: 3

    # the agent
    sysadmin_agent:
      type: multi_turn_agent
      enabled: true
      description: "System administration agent with SSH access to manage, monitor, and troubleshoot Linux servers across production and development environments"

      # self_tool_descriptions now at ToolServerConfig level (not in agent_config)
      self_tool_descriptions:
        sysadmin_agent_execute_task: "Execute system administration tasks including server management, deployment automation, performance monitoring, security audits, and infrastructure troubleshooting via SSH"
        sysadmin_agent_list_available_tools: "List system utilities, and administrative tools available for server management"

      agent_config:
        llm_profile: [code, normal]
        llm_profile_advanced: []
        llm_params:
          "*":
            # Interaktive Multi-Turn-Session: auf Anthropic-Profilen (z.B.
            # or-claude-sonnet) markiert der Client damit das Konversationsende
            # als cache_control-Breakpoint (wachsender Verlauf cached
            # inkrementell); auf GPT-Profilen = implizites Fortsetzungs-Caching.
            prompt_cache_mode: multi_turn
        max_steps: 100
        system_template: "./prompts/system_admin_prompt.md"

        tools:
          allowed:
            - "+basic_operations/*"
            - "+datetime/*"
            - "+sequential_thinking/*"
            - "+todo/*"
            - "+tavily_search/*"
            - "+context_engineer/*"
            - "+context_summarizer/*"
            #- "+mcp_client/*"
            - "+file_ops/*"
            - "+terminal/*"            
            - "+ssh_control/*"
            - "+okf/*"                    # durable infra knowledge base (runbooks, known issues, hosts)
            - "+ask_user/*"               # ask the person in the chat before a choice that is theirs

        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true
            sequential_thinking.inject_active_sessions:
              enabled: true
            todo.inject_todo_tasks:
              enabled: true
            # OKF context injection: fold relevant infra knowledge (hosts,
            # services, runbooks, known issues) from the bundle into the prompt
            # each turn — lexical hit + its linked concepts.
            okf.okf_context_injection:
              enabled: true
              hook_bundle: "data/okf/infra"
              hook_max_concepts: 5
              hook_graph_depth: 1


      metadata:
        author: "Enrico Ehrich"
        version: "1.1.1"
        tags: ["ssh", "server", "Administrator", "security"]
        category: "it"
        visibility: "both"
        min_role: "admin"  # role gate (auth/agent_access.py): commands on the configured SSH hosts and a local shell
