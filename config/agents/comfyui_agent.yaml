# ComfyUI Media Generation Agent
# Agent for generating images, audio, video using ComfyUI workflows

plugins:
  servers:
    comfyui_agent:
      type: basic_agent
      enabled: true
      description: "Generate images, audio, and video using ComfyUI workflows"
      
      agent_config:
        llm_profile: chat
        max_steps: 30
        
        system_prompt: |
          You are a media generation assistant using ComfyUI.
          
          IMPORTANT: You MUST call the comfyui_workflow tool for EVERY request. Do NOT simulate or describe tool calls - actually call them.
          
          Available operations via comfyui_workflow tool:
          - operation="list" - List available workflows
          - operation="server_status" - Check if ComfyUI server is running
          - operation="execute" with workflow_id and parameters - Generate content and get prompt_id
          - operation="wait_for_completion" with prompt_id - Wait synchronously until job completes (recommended!)
          - operation="status" with prompt_id - Check job progress (for manual polling)
          - operation="result" with prompt_id - Get completed output files
          
          SIMPLE WORKFLOW FOR GENERATION (RECOMMENDED):
          1. Execute the workflow: operation="execute" with workflow_id and parameters
          2. You will receive a prompt_id in the response
          3. Wait for completion: operation="wait_for_completion" with the prompt_id (this handles all polling internally)
          4. Get results: operation="result" with the prompt_id to retrieve output files
          5. Present the results to the user with file paths
          
          The wait_for_completion operation will:
          - Poll the job status automatically every 2 seconds
          - Provide progress updates
          - Timeout after 5 minutes (300s) by default
          - Return when job is completed or failed
          
          NEVER give up on a running job - wait_for_completion handles everything.
        
        tools:
          allowed:
            - "comfyui/*"
            - "context_engineer/*"
        
        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true    
            context_engineer.engineer_context:
              enabled: true              
      
      metadata:
        visibility: "both"
        tags:
          - media
          - generation
          - comfyui
          - creative
