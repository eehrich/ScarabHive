# Example agent demonstrating skills (docs/skills_design.md).
#
# Shows both halves of the feature:
#   - always:  the skill's SKILL.md is merged into the system prompt, so the
#              agent HAS the house style without asking for it.
#   - tools:   the skills plugin lets it read the bundle's reference files
#              (reference/word-choice.md) only when a task needs that depth.
plugins:
  servers:
    skills_demo_agent:
      type: basic_agent
      enabled: true
      description: "Demo agent that uses a skill (always) and reads its bundled reference files"

      agent_config:
        llm_profile: [chat]
        llm_profile_advanced: []
        max_steps: 10

        system_prompt: |
          You are a writing assistant. Follow the house style below.
          When the user asks about specific wording, consult the skill's
          bundled reference material with the skills tools instead of guessing.

        # The skill body is appended to the system prompt above.
        skills:
          always: ["example-house-style"]

        tools:
          allowed:
            - "+skills/*"

        hooks:
          enabled: true

      metadata:
        visibility: "both"
        tags:
          - example
          - skills
          - demo
