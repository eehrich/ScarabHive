plugins:
  servers:
    # File Operations Test Agent - ONLY tmp/ directory access for safe testing
    file_ops_test_agent:
      type: basic_agent
      enabled: true
      description: "Test agent for file_ops plugin - RESTRICTED to data/workspace directory only for safe testing"
      
      agent_config:
        llm_profile: [normal]
        llm_profile_advanced: []
        max_steps: 200
        system_template: "./prompts/file_ops_test_prompt.md"
        
        tools:
          allowed:
            - "file_ops/*"
            - "basic_operations/*"
            - "datetime/*"
            - "terminal/*"
        
        hooks:
          enabled: true
      
      metadata:
        author: "Enrico Ehrich"
        version: "1.0.0"
        tags: ["test", "file_ops", "development"]
        category: "development"
        visibility: "ui"
        min_role: "admin"  # role gate (auth/agent_access.py): a shell on the server (terminal)
