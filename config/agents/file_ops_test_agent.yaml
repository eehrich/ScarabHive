plugins:
  servers:
    # File Operations Test Agent - ONLY tmp/ directory access for safe testing
    file_ops_test_agent:
      type: basic_agent
      enabled: true
      description: "Test agent for file_operations plugin - RESTRICTED to tmp/ directory only for safe testing"
      
      agent_config:
        llm_profile: normal
        max_steps: 20
        system_template: "config/prompts/file_ops_test_prompt.yaml"
        
        tools:
          allowed:
            - "file_operations/*"
            - "basic_operations/*"
            - "datetime/*"
        
        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true
      
      metadata:
        author: "AgentSystem"
        version: "1.0.0"
        tags: ["test", "file_operations", "development"]
        category: "development"
        visibility: "ui"
