plugins:
  servers:
    # File Operations Test Agent - ONLY tmp/ directory access for safe testing
    file_ops_test_agent:
      type: basic_agent
      enabled: true
      description: "Test agent for file_ops plugin - RESTRICTED to data/workspace directory only for safe testing"
      
      agent_config:
        llm_profile: normal
        max_steps: 200
        system_template: "config/prompts/file_ops_test_prompt.yaml"
        
        tools:
          allowed:
            - "file_ops/*"
            - "basic_operations/*"
            - "datetime/*"
            - "terminal/*"
        
        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true
      
      metadata:
        author: "Enrico Ehrich"
        version: "1.0.0"
        tags: ["test", "file_ops", "development"]
        category: "development"
        visibility: "ui"
