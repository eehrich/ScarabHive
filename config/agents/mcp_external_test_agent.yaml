plugins:
  servers:
    # Smoke test for EXTERNAL MCP servers: the only agent allowed to call tools of a foreign
    # server. Makes "external MCP still works" answerable in one run, like file_ops_test_agent
    # does for the local file layer.
    #
    # Needs `everything` in config/mcp_servers.yaml set to enabled: true. It ships as false;
    # switch it on for a test.
    mcp_external_test_agent:
      type: basic_agent
      enabled: true
      description: "Test agent for external MCP servers - may only call tools of the 'everything' reference server"

      agent_config:
        llm_profile: [normal]
        llm_profile_advanced: []
        max_steps: 10
        system_template: "config/prompts/system_prompt.md"

        tools:
          allowed:
            # Dot, not slash: external tools are named server.tool, local plugins plugin/tool. The
            # dot decides at runtime whether a call goes to a plugin or to the outside.
            - "everything.*"
            # Second install form of the same server (external/mcp instead of npx). The agent covers
            # both so the smoke test does not depend on which one is enabled.
            - "everything_local.*"
            # Slash, not dot: the management tools of the mcp_client plugin itself, so /mcp,
            # /mcp-connect etc. are also available in chat.
            - "mcp_client/*"

      metadata:
        author: "Enrico Ehrich"
        version: "1.0.0"
        tags: ["test", "mcp", "external", "development"]
        category: "development"
        visibility: "ui"
