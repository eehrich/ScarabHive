plugins:
  servers:
    meta_agent:
      type: basic_agent
      enabled: true
      description: "Meta Agent for orchestrating other agents and managing complex tasks"

      agent_config:
        llm_profile: [normal]
        llm_profile_advanced: []
        max_steps: 50

        system_template: "./prompts/meta_agent_prompt.md"

        tools:
          allowed:
            - "basic_operations/*"
            - "datetime/*"
            - "sequential_thinking/*"
            - "cognitive_stack/*"
            - "todo/*"
            - "memory/*"
            - "sub_agent_manager/*"
            - "file_ops/*"

        hooks:
          enabled: true
          overrides:
            markdown_formatter.format_markdown_output:
              enabled: true
            sub_agent_manager.inject_sub_agent_context:
              enabled: true              
            todo.inject_todo_tasks:
              enabled: true
            memory.inject_memory_context:
              enabled: true
            sequential_thinking.inject_active_sessions:
              enabled: true
            cognitive_stack.inject_stack_context:
              enabled: true

      metadata:
        author: "Enrico Ehrich"
        version: "1.0.0"
        tags: ["meta", "orchestration", "management"]
        category: "meta"
        visibility: "ui"