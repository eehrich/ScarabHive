# Live test agent for agent_continuation.required_spawns: a moderator told to answer the
# task without a reviewer. The check must send it back; it then spawns the reviewer and
# answers again.
#
# Passes if its session shows first an answer without a spawn, then the message with
# injected_by "agent_continuation.required_spawns", then a create on
# required_spawns_test_reviewer and the second answer.
#
# To rerun, set all three enabled flags to true, then:
#   .venv/Scripts/python.exe -m agent_system.agent_run --agent required_spawns_test_agent "Name a color."
plugins:
  servers:
    required_spawns_test_sam:
      type: sub_agent_manager
      enabled: false
      description: "required_spawns test manager"
      allowed_agents:
        - "required_spawns_test_reviewer"

    required_spawns_test_reviewer:
      type: basic_agent
      enabled: false
      description: "Test reviewer: one sentence on a text"
      agent_config:
        llm_profile: [or-deepseek-flash]
        llm_profile_advanced: []
        max_steps: 3
        tools:
          allowed: []
        system_prompt: |
          You are a reviewer. Judge the text you are given in exactly
          one sentence.

    required_spawns_test_agent:
      type: basic_agent
      enabled: false
      description: "Test agent: an answer without the required reviewer goes back"
      agent_config:
        llm_profile: [or-deepseek-flash]
        llm_profile_advanced: []
        max_steps: 8
        tools:
          allowed:
            - "required_spawns_test_sam/*"
        hooks:
          enabled: true
          overrides:
            agent_continuation.evaluate_completion:
              enabled: true
              strategy: rules
              default: final
              max_continuations: 2
              required_spawns:
                agents: 'review_map.get(aufgabe, [])'
                tool: required_spawns_test_sam_manage_sub_agent
                message: >-
                  The review is missing: {missing} was never spawned. Spawn it
                  now with your answer as its task, then return the answer
                  together with its verdict.
        template_vars:
          aufgabe: demo
          review_map:
            demo: [required_spawns_test_reviewer]
        system_prompt: |
          You are a test agent. Answer the question yourself right away in one
          sentence. Do not call any tool on your own.
      metadata:
        visibility: "both"
        tags:
          - test
