plugins:
  servers:

    # 3D modelling in a locally running Blender. The blender.* tools come
    # from the external MCP server 'blender' (config/mcp_servers.yaml) --
    # dot means external server tool, slash means local plugin.
    blender_agent:
      type: multi_turn_agent
      enabled: true
      description: "3D modelling and scene building in a locally running Blender via blender-mcp (objects, materials, bpy scripts)"

      agent_config:
        llm_profile: [normal]
        llm_profile_advanced: []
        llm_params:
          "*":
            prompt_cache_mode: multi_turn
        max_steps: 60
        system_template: "./prompts/blender_agent_prompt.md"

        tools:
          allowed:
            - "blender.*"          # every tool of the connected Blender server
            - "mcp_client/*"       # connect/disconnect/list + the /mcp commands
            - "datetime/*"

        hooks:
          enabled: true
          overrides:
            # Screenshots and scene dumps grow large -- keep context care on.
            context_engineer.engineer_context:
              enabled: true

      metadata:
        author: "Enrico Ehrich"
        version: "0.1.0"
        tags: ["blender", "3d", "mcp"]
        category: "creative"
        visibility: "both"
