plugins:
  servers:
  
    # Dedicated test agent for sub-agent management
    sub_agent_test_coordinator:
      type: basic_agent
      enabled: true
      description: "Test coordinator for sub-agent management system - spawns and manages sub-agents"
      
      agent_config:
        llm_profile: normal
        max_steps: 20
        system_template: "config/prompts/system_prompt.yaml"
        
        tools:
          allowed:
            - "sub_agent_manager/*"
        
        hooks:
          enabled: true
          overrides:
            sub_agent_manager.inject_sub_agent_context:
              enabled: true
            markdown_formatter.format_markdown_output:
              enabled: true
      
      metadata:
        author: "AgentSystem"
        version: "1.0.0"
        tags: ["test", "sub-agent", "coordinator", "development"]
        category: "test"
        visibility: "ui"