plugins:
  servers:

    # the sub_agent_manager to manage thinking_agent sub-agents
    thinking_agent_manager:
      type: sub_agent_manager
      enabled: true
      max_nesting_depth: 20
      allowed_agents:
        - thinking_agent
      hook_config:
        enabled: true
        inject_sub_agent_context:
          enabled: true
          max_sub_agents_shown: 10
          format: "markdown"


    # agent to creatre parallel thinking threads
    parallel_thinking_agent:
      type: basic_agent
      enabled: true
      description: "Advanced reasoning agent that decomposes complex problems into parallel sub-tasks for comprehensive analysis"

      self_tool_descriptions:
        parallel_thinking_agent_execute_task: "Solve complex problems by breaking them into parallel reasoning threads"
        parallel_thinking_agent_list_available_tools: "List available reasoning and sub-agent management tools"

      agent_config:
        llm_profile: think
        max_steps: 25

        system_prompt: |
          You are an advanced reasoning agent specialized in systematic problem decomposition and parallel analysis.

          Your Approach:
          1. Use sequential_thinking to create a structured reasoning plan
          2. Identify independent aspects that can be analyzed in parallel
          3. Use thinking_agent_manager to spawn sub-agents for parallel exploration
          4. Synthesize insights from parallel threads into coherent conclusions

          Reasoning Guidelines:
          - Break complex questions into logical components
          - Identify dependencies and parallelizable sub-problems
          - Use sub-agents to explore different perspectives simultaneously
          - Cross-reference findings from parallel threads
          - Provide well-reasoned, evidence-based conclusions
          - Acknowledge uncertainty and alternative viewpoints

          Quality Standards:
          - Be thorough but concise in each reasoning step
          - Clearly distinguish facts from inferences
          - Show your reasoning process transparently
          - Cite internal knowledge limitations honestly

          Operational Context:
          - Planning budget: {{ max_steps }} steps
          - Current date: {{ current_date | default('n/a') }}

          Note: You work with your training knowledge only. For real-time data or external resources,
          clearly state these limitations.

        tools:
          allowed:
            - "thinking_agent_manager/*"
            - "sequential_thinking/*"
            - "cognitive_stack/*"

        hooks:
          enabled: true
          overrides:
            thinking_agent_manager.inject_sub_agent_context:
              enabled: true
            sequential_thinking.inject_active_sessions:
              enabled: true
            cognitive_stack.inject_stack_context:
              enabled: true

        metadata:
        author: "Enrico Ehrich"
        version: "1.0.0"
        tags: ["qa", "thinking", "knowledge", "general"]
        category: "general"
        visibility: "both"


    # agent for deep systematic thinking
    thinking_agent:
      type: basic_agent
      enabled: true
      description: "Deep reasoning agent that uses sequential thinking to systematically analyze problems step-by-step"

      self_tool_descriptions:
        thinking_agent_execute_task: "Analyze problems through systematic step-by-step reasoning and deliberation"
        thinking_agent_list_available_tools: "List available reasoning tools"

      agent_config:
        llm_profile: think
        max_steps: 25

        system_prompt: |
          You are a deep reasoning agent specialized in systematic, step-by-step analysis.

          Your Methodology:
          - Use sequential_thinking to externalize your reasoning process
          - Break down complex questions into manageable logical steps
          - Build each conclusion on previous established facts
          - Verify assumptions and check for logical consistency
          - Synthesize findings into clear, well-supported answers

          Reasoning Principles:
          - Think aloud: Make your reasoning transparent and traceable
          - Be systematic: Follow a logical progression of thought
          - Be rigorous: Question assumptions and verify conclusions
          - Be honest: Acknowledge gaps in knowledge or reasoning
          - Be clear: Express complex ideas in accessible language

          Quality Standards:
          - Each reasoning step should be justified
          - Distinguish between facts, inferences, and speculation
          - Consider alternative explanations when appropriate
          - Provide evidence or reasoning for key claims
          - Summarize complex reasoning chains clearly

          Operational Context:
          - Planning budget: {{ max_steps }} steps
          - Current date: {{ current_date | default('n/a') }}

          Note: You work with your training knowledge. For real-time information or external data,
          clearly indicate these limitations.

        tools:
          allowed:
            - "sequential_thinking/*"
            - "cognitive_stack/*"

        hooks:
          enabled: true
          overrides:
            sequential_thinking.inject_active_sessions:
              enabled: true
            cognitive_stack.inject_stack_context:
              enabled: true

      metadata:
        author: "Enrico Ehrich"
        version: "1.0.0"
        tags: ["qa", "thinking", "knowledge", "general"]
        category: "general"
        visibility: "tool"  # Must be visible for sub_agent_manager to spawn it
        visibility: "tool"