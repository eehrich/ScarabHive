# ================================
# MCP Server Mode Configuration
# ================================
# Enable AgentSystem to run as a remote MCP server exposing plugins as tools
# Epic 0037: Remote MCP Server Interface

server_mode:
  # Enable/disable MCP server mode
  enabled: true
  
  # Endpoint configuration
  endpoint: /mcp          # Main JSON-RPC 2.0 endpoint
  sse_endpoint: /mcp/sse  # SSE stream endpoint (optional)
  
  # Plugin exposure
  expose_plugins:
    - "*"  # "*" = all enabled plugins, or list specific plugin names
  
  # Authentication configuration
  authentication:
    required: true
    methods:
      - jwt
      - api_key
  
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 60
    requests_per_hour: 1000
    burst_size: 10
  
  # Session management
  session_ttl: 3600.0              # Session timeout in seconds (1 hour)
  max_concurrent_sessions: 100     # Maximum concurrent MCP client sessions
