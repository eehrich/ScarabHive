# ================================
# Scarab AgentSystem Configuration
# ================================

name: "AgentSystem"
version: "0.2.0"
description: "Scarab Flexible AI Agent System using MCP"

# all included configs
includes:
  - llm.yaml
  - plugins.yaml
  - mcp_servers.yaml
  - mcp_server_mode.yaml
  - agents/*.yaml

# Context information automatically added to prompts
context:
  auto_datetime: true 
  timezone: "Europe/Berlin"  
  location: "Germany" 

network: # type NetworkConfig
  ssl_verify: false
  host: 127.0.0.1
  port: 8000
  disable_cache: true  


# define the agent which will be startet by default if no other agent is specified
default_agent: meta_agent

# Multi-user authentication and authorization (optional)
auth: # type AuthConfig
  enabled: true  # Set to true to enable multi-user authentication
  secret_key: "published-signing-key-replace-with-your-own-0000000000"
  algorithm: "HS256"
  access_token_expire_minutes: 30
  
  # Database settings
  database_path: "data/users.db"
  
  # Security settings
  rate_limit_enabled: false  # Disabled for development
  requests_per_minute: 60
  security_headers_enabled: true
  
  # CORS settings
  cors_enabled: true
  cors_origins:
    - "*"  # Change to specific origins in production
  cors_credentials: true
  cors_methods:
    - "*"
  cors_headers:
    - "*"
  
  # Trusted hosts (optional, uncomment and configure for production)
  # trusted_hosts:
  #   - "localhost"
  #   - "127.0.0.1"
  #   - "*.yourdomain.com"
  
  # Default admin user (created on first startup if no users exist)
  default_admin_username: "admin"
  default_admin_password: "admin"  # CHANGE THIS IMMEDIATELY IN PRODUCTION
  default_admin_email: "admin@localhost"





logging: # type LoggingConfig
  enabled: true
  level: DEBUG
  file: logs/agent.log
  file_cli: logs/cli.log
  file_api: logs/api.log

  # Cancellation system configuration
  cancellation: # type CancellationConfig
    cleanup_timeout: 10.0  # Seconds to wait for graceful cleanup before forcing termination
    monitor_interval: 1.0  # Seconds between timeout checks
 






