# ================================
# Scarab AgentSystem Configuration
# ================================

name: "AgentSystem"
version: "0.4.0"
description: "Scarab Flexible AI Agent System with plugin support"

# all included configs
includes:
  - llm.yaml
  - plugins.yaml
  - mcp_servers.yaml
  - mcp_server_mode.yaml
  - agents/*.yaml
  - agents_writer_v2/*.yaml
  - agents_trading/*.yaml
  - agents_for_dev/*.yaml

# Context information automatically added to prompts
context:
  auto_datetime: true
  timezone: "Europe/Berlin"
  location: "Germany"

# Status message system configuration
status: # type StatusConfig
  queue_maxsize: 5000  # Max events per status queue (prevents memory exhaustion with parallel sessions)
  drop_oldest_when_full: true  # Drop oldest events when queue is full (protects against slow consumers)
  sse_keepalive_interval: 15.0  # Interval for SSE keep-alive comments (seconds)
  llm_heartbeat_interval: 5.0  # Interval for heartbeat events during LLM calls (seconds)

# Vision/image processing configuration
vision: # type VisionConfig
  image_warn_size_mb: 10.0  # Warn when images exceed this size (MB)
  image_max_size_mb: null  # Maximum allowed image size (MB), null = no limit

# Network settings
network:
  ssl_verify: false
  host: 127.0.0.1
  port: 8000
  disable_cache: true
  http_connection_limit: 10  # Total HTTP connections for MCP streamable transport
  http_connection_limit_per_host: 5  # HTTP connections per host
  cli_request_timeout: 5.0  # Timeout for CLI HTTP requests (seconds)


# define the agent which will be startet by default if no other agent is specified
default_agent: meta_agent

# Multi-user authentication and authorization (optional)
auth:
  enabled: true  # Set to true to enable multi-user authentication
  secret_key: "published-signing-key-replace-with-your-own-0000000000"
  algorithm: "HS256"
  access_token_expire_minutes: 5256000  # ~10 years - essentially unlimited for dev
  refresh_token_expire_days: 3650    # 10 years (not used when access token is this long)

  # Database settings
  database_path: "data/users.db"

  # Security settings
  rate_limit_enabled: false  # Disabled for development
  requests_per_minute: 60
  security_headers_enabled: true

  # CORS settings
  cors_enabled: true
  cors_origins:
    - "*"  # Change to specific origins in production
  cors_credentials: true
  cors_methods:
    - "*"
  cors_headers:
    - "*"

  # Trusted hosts (optional, uncomment and configure for production)
  # trusted_hosts:
  #   - "localhost"
  #   - "127.0.0.1"
  #   - "*.yourdomain.com"

  # Default admin user (created on first startup if no users exist)
  default_admin_username: "admin"
  default_admin_password: "admin"  # CHANGE THIS IMMEDIATELY IN PRODUCTION
  default_admin_email: "admin@localhost"

# Logging configuration
logging:
  enabled: true
  level: DEBUG
  file: logs/agent.log
  file_cli: logs/cli.log
  file_api: logs/api.log

  # Cancellation system configuration
  cancellation: # type CancellationConfig
    cleanup_timeout: 10.0  # Seconds to wait for graceful cleanup before forcing termination
    monitor_interval: 1.0  # Seconds between timeout checks





