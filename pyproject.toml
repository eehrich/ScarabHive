[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system-mcp"
version = "0.7.1"
description = "ScarabHive - Flexible AI Agent Framework with pluggable tool servers and FastAPI UI"
authors = [{ name = "Enrico Ehrich" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies", "scripts"]

[project.urls]
Homepage = "https://github.com/eehrich/ScarabHive"
Repository = "https://github.com/eehrich/ScarabHive"
Documentation = "https://github.com/eehrich/ScarabHive/tree/main/docs"

# Dependencies are aggregated per-plugin: each plugin declares its pip
# requirements in its own plugin.toml; scripts/aggregate_plugin_deps.py
# merges them with requirements/core.txt into requirements/all.txt, which
# setuptools reads here. Keeps plugin-owned deps out of this file.
# requirements/private.txt holds what further plugin roots (src/plugins_<name>/)
# need on top; it is not part of the open-source release, and setuptools skips
# it where it does not exist. The commands are in console_scripts.cfg;
# console_scripts.private.cfg adds those of the further plugin roots the same
# way (setuptools joins the two files).
[tool.setuptools.dynamic]
dependencies = { file = ["requirements/all.txt"] }
entry-points = { file = ["console_scripts.cfg"] }

[tool.setuptools.packages.find]
where = ["src"]

# Note: templates/, static/ and docs/guides/ (the Help manual) are outside src/ so they're included via MANIFEST.in
# agent_system.ui.resources.find_resource_dir() handles multiple install scenarios
[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.toml"]

[project.optional-dependencies]
dev = [
    "wheel",
    "setuptools",
    "build",
    "ruff>=0.12",
    "mypy>=1.7",
    "smithery>=0.1.0",
    "mcp>=2.2,<3",  # 2.x: MCPError, snake_case fields, httpx2 (src/plugins/mcp_client)
    "uv>=0.8.0",
    "types-PyYAML>=6.0",
    "types-pytz>=2024.1",
    "types-tabulate>=0.9",
    "types-python-dateutil>=2.8",
    "types-aiofiles>=25.1.0",
    "types-Markdown>=3.10.0",
]
test = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=6.0.0",
    "anyio>=3.0",
]
gpu = [
    "onnxruntime-gpu>=1.20.0",  # For systems with NVIDIA GPU - replaces onnxruntime
]

[tool.ruff]
line-length = 100
exclude = [".venv", ".pytest_cache", "*.egg-info", "logs", "docs", "src/**/__pycache__"]

[tool.ruff.lint]
# Ruff's default set before 0.16 (which widened it to ~400 rules). Named here so
# that a newer ruff's default does not apply; CI pins the ruff version as well.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test files commonly re-use pytest fixture names both at module level
# (re-import for visibility) and in test signatures — F811 is a false
# positive in that pattern. Also relax test-idiomatic style: imports placed
# after a sys.path bootstrap (E402) and setup statements joined with ';'
# (E702). Matched by filename so it applies wherever tests live (root tests/
# AND colocated src/plugins*/*/tests/).
# E731 (lambda assigned to a name) and E741 (ambiguous single-letter var like
# `l`) are low-signal in test setup — relaxed for tests only.
"**/test_*.py" = ["F811", "E402", "E702", "E731", "E741"]
"tests/**/*.py" = ["F811", "E402", "E702", "E731", "E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unreachable = true
disable_error_code = ["misc"]
# Explicitly set namespace_packages to avoid duplicate module detection
namespace_packages = true
explicit_package_bases = true

