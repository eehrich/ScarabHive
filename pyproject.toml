[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system-mcp"
version = "0.6.1"
description = "ScarabHive - Flexible AI Agent Framework using MCP with pluggable servers and FastAPI UI"
authors = [{ name = "Enrico Ehrich" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/eehrich/ScarabHive"
Repository = "https://github.com/eehrich/ScarabHive"
Documentation = "https://github.com/eehrich/ScarabHive/tree/main/docs"

[project.scripts]
agent-cli = "agent_system.agent_cli:main"
agent-run = "agent_system.agent_run:main"
agent-api = "agent_system.app:run"
validate-agents = "scripts.validate_agent_configs:main"
mcp-duckduckgo-search = "plugins.duckduckgo_search.__main__:cli_main"
mcp-twitter-search = "plugins.twitter_search.__main__:cli_main"
mcp-llm-router = "plugins.llm_router.__main__:cli_main"
mcp-weather = "plugins.weather.__main__:cli_main"
mcp-datetime = "plugins.datetime.__main__:cli_main"
mcp-web-scraper = "plugins.web_scraper.__main__:cli_main"
mcp-http-server = "plugins.http_server.__main__:cli_main"
mcp-script-interpreter = "plugins.script_interpreter.__main__:cli_main"
mcp-basic-operations = "plugins.basic_operations.__main__:cli_main"
mcp-file-ops = "plugins.file_ops.__main__:main"
mcp-sqlite-query = "plugins.sqlite_query.__main__:cli_main"
audio-ops = "plugins.audio_ops.__main__:main"

# Dependencies are aggregated per-plugin: each plugin declares its pip
# requirements in its own plugin.toml; scripts/aggregate_plugin_deps.py
# merges them with requirements/core.txt into requirements/all.txt, which
# setuptools reads here. Keeps plugin-owned deps out of this file.
[tool.setuptools.dynamic]
dependencies = { file = ["requirements/all.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

# Note: templates/ and static/ are outside src/ so they're included via MANIFEST.in
# The app.py _find_resource_dir() function handles multiple install scenarios
[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.toml"]

[project.optional-dependencies]
dev = [
    "wheel",
    "setuptools",
    "build",
    "ruff>=0.12",
    "mypy>=1.7",
    "smithery>=0.1.0",
    "mcp==1.14.1",  # Pin exact version - requires pydantic>=2.11
    "uv>=0.8.0",
    "types-PyYAML>=6.0",
    "types-pytz>=2024.1",
    "types-tabulate>=0.9",
    "types-python-dateutil>=2.8",
    "types-aiofiles>=25.1.0",
    "types-Markdown>=3.10.0",
]
test = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=6.0.0",
    "anyio>=3.0",
]
gpu = [
    "onnxruntime-gpu>=1.20.0",  # For systems with NVIDIA GPU - replaces onnxruntime
]

[tool.ruff]
line-length = 100
exclude = [".venv", ".pytest_cache", "*.egg-info", "logs", "docs", "src/**/__pycache__", "src/plugins_writer_OLD"]

[tool.ruff.lint.per-file-ignores]
# Test files commonly re-use pytest fixture names both at module level
# (re-import for visibility) and in test signatures — F811 is a false
# positive in that pattern. Also relax test-idiomatic style: imports placed
# after a sys.path bootstrap (E402) and setup statements joined with ';'
# (E702). Matched by filename so it applies wherever tests live (root tests/
# AND colocated src/plugins*/*/tests/).
# E731 (lambda assigned to a name) and E741 (ambiguous single-letter var like
# `l`) are low-signal in test setup — relaxed for tests only.
"**/test_*.py" = ["F811", "E402", "E702", "E731", "E741"]
"tests/**/*.py" = ["F811", "E402", "E702", "E731", "E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unreachable = true
disable_error_code = ["misc"]
# Explicitly set namespace_packages to avoid duplicate module detection
namespace_packages = true
explicit_package_bases = true

