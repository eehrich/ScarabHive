[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system-mcp"
version = "0.1.1"
description = "Flexible AI Agent System using MCP with pluggable servers and FastAPI UI"
authors = [{ name = "Enrico Ehrich" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiohttp>=3.12",
    "requests>=2.28",
    "ddgs>=2.8.4; python_version>='3.10'",
    "duckduckgo-search>=6.1.6; python_version<'3.10'",
    "yfinance>=0.2.52",
    "curl-cffi>=0.5.0",
    "snscrape>=0.7.0",
    "openai>=1.37.0",
    "ollama>=0.3.0",
    "jinja2>=3.1",
    "pytz>=2024.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.1.0",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://example.com"

[project.scripts]
agent-cli = "agent_system.cli:main"
agent-api = "agent_system.agent.interface_api:run"
mcp-duckduckgo-search = "agent_system.servers.duckduckgo_search.__main__:cli_main"
mcp-google-search = "agent_system.servers.google_search.__main__:cli_main"
mcp-yahoo-finance = "agent_system.servers.yahoo_finance.__main__:cli_main"
mcp-twitter-search = "agent_system.servers.twitter_search.__main__:cli_main"
mcp-llm-router = "agent_system.servers.llm_router.__main__:cli_main"
mcp-weather = "agent_system.servers.weather.__main__:cli_main"
mcp-datetime = "agent_system.servers.datetime.__main__:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "wheel",
    "setuptools",
    "build",
]

