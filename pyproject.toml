[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system-mcp"
version = "0.1.1"
description = "Flexible AI Agent System using MCP with pluggable servers and FastAPI UI"
authors = [{ name = "Enrico Ehrich" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiohttp>=3.12",
    "requests>=2.28",
    "ddgs>=2.8.4; python_version>='3.10'",
    "duckduckgo-search>=6.1.6; python_version<'3.10'",
    "yfinance>=0.2.52",
    "curl-cffi>=0.5.0",
    "snscrape>=0.7.0",
    "openai>=1.37.0",
    "ollama>=0.3.0",
    "jinja2>=3.1",
    "pytz>=2024.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.1.0",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://example.com"

[project.scripts]
agent-cli = "agent_system.cli:main"
agent-api = "agent_system.agent.interface_api:run"
mcp-duckduckgo-search = "plugins.duckduckgo_search.__main__:cli_main"
mcp-google-search = "plugins.google_search.__main__:cli_main"
mcp-yahoo-finance = "plugins.yahoo_finance.__main__:cli_main"
mcp-twitter-search = "plugins.twitter_search.__main__:cli_main"
mcp-llm-router = "plugins.llm_router.__main__:cli_main"
mcp-weather = "plugins.weather.__main__:cli_main"
mcp-datetime = "plugins.datetime.__main__:cli_main"
mcp-web-research-agent = "plugins.web_research_agent.__main__:cli_main"
mcp-web-scraper = "plugins.web_scraper.__main__:main"
mcp-http-server = "plugins.http_server.__main__:cli_main"
backlog = "scripts.backlog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_system = ["static/*", "templates/*"]

[project.optional-dependencies]
dev = [
    "wheel",
    "setuptools",
    "build",
    "ruff>=0.12",
    "mypy>=1.7",
]
test = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1.0",
    "anyio>=3.0",
]

[tool.ruff]
line-length = 100
exclude = [".venv", ".pytest_cache", "*.egg-info", "logs", "docs", "src/**/__pycache__"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unreachable = true
disable_error_code = ["misc"]

