[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system-mcp"
version = "0.2.0"
description = "Flexible AI Agent System using MCP with pluggable servers and FastAPI UI"
authors = [{ name = "Enrico Ehrich" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiohttp>=3.12",
    "requests>=2.28",
    "ddgs>=2.8.4; python_version>='3.10'",
    "duckduckgo-search>=6.1.6; python_version<'3.10'",
    "yfinance>=0.2.52",
    "curl-cffi>=0.5.0",
    "snscrape>=0.7.0",
    "tweepy>=4.14.0",
    "openai>=1.37.0",
    "ollama>=0.3.0",
    "jinja2>=3.1",
    "pytz>=2024.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.1.0",
    "tabulate>=0.9",
    "sandboxed-python>=0.1",
    "ib_async>=0.9.86",
    "nest_asyncio>=1.5.0",
    "brotli>=1.1.0",
    "Pillow>=10.0.0",
    "asyncssh>=2.13.0",
    "aiofiles>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "typer>=0.9.0",
    "markdown>=3.5.0",
    "rich>=13.0.0",
    "markdownify>=0.11.0",
    "pygments>=2.15.0",
    "websockets>=15.0.0",
    "chromadb>=0.4.0",
]

[project.urls]
Homepage = "http://127.0.0.1:8000"

[project.scripts]
backlog = "scripts.backlog:main"
agent-cli = "agent_system.agent_cli:main"
agent-run = "agent_system.agent_run:main"
agent-api = "agent_system.app:run"
validate-agents = "scripts.validate_agent_configs:main"
mcp-duckduckgo-search = "plugins.duckduckgo_search.__main__:cli_main"
mcp-yahoo-finance = "plugins.yahoo_finance.__main__:cli_main"
mcp-twitter-search = "plugins.twitter_search.__main__:cli_main"
mcp-llm-router = "plugins.llm_router.__main__:cli_main"
mcp-weather = "plugins.weather.__main__:cli_main"
mcp-datetime = "plugins.datetime.__main__:cli_main"
mcp-web-research-agent = "plugins.web_research_agent.__main__:cli_main"
mcp-web-scraper = "plugins.web_scraper.__main__:cli_main"
mcp-http-server = "plugins.http_server.__main__:cli_main"
mcp-script-interpreter = "plugins.script_interpreter.__main__:cli_main"
mcp-basic-operations = "plugins.basic_operations.__main__:cli_main"
mcp-todo-management = "plugins.todo_management.__main__:cli_main"
mcp-file-ops = "plugins.file_ops.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_system = ["static/*", "templates/*"]

[project.optional-dependencies]
dev = [
    "wheel",
    "setuptools",
    "build",
    "ruff>=0.12",
    "mypy>=1.7",
    "smithery>=0.1.0",
    "mcp>=1.0.0",
    "uv>=0.8.0",
    "types-PyYAML>=6.0",
    "types-pytz>=2024.1",
    "types-tabulate>=0.9",
    "types-python-dateutil>=2.8",
]
test = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=6.0.0",
    "anyio>=3.0",
]

[tool.ruff]
line-length = 100
exclude = [".venv", ".pytest_cache", "*.egg-info", "logs", "docs", "src/**/__pycache__"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unreachable = true
disable_error_code = ["misc"]

