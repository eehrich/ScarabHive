<!doctype html>
<html>
<head><meta charset="utf-8"><title>The shell offers the released panels; the chat stays as it is</title>
<style>body { margin: 0; } iframe { width: 1280px; height: 800px; border: 0; }</style></head>
<body>
<iframe id="shell" title="shell"></iframe>
<script type="module">
  // The real shell (index.html) against the shell tests' stub app; /__stub/view sets what GET /api/ui/view answers.
  const results = {};
  const check = async (name, fn) => {
    try { results[name] = (await fn()) === true ? 'ok' : 'failed'; }
    catch (error) { results[name] = `error: ${error && error.message}`; }
  };
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  async function until(what, predicate, timeout = 15000) {
    const end = performance.now() + timeout;
    for (;;) {
      let value = null;
      try { value = await predicate(); } catch { /* not there yet */ }
      if (value) return value;
      if (performance.now() > end) throw new Error(`timed out waiting for ${what}`);
      await sleep(40);
    }
  }
  const frame = document.getElementById('shell');
  const doc = () => frame.contentDocument;
  const $ = (selector) => doc().querySelector(selector);
  const all = (selector) => [...doc().querySelectorAll(selector)];
  const go = () => new Promise((resolve) => { frame.onload = resolve; frame.src = '/'; });
  const setView = (view) => fetch('/__stub/view', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(view) });
  // opened again until it lists something: opened before the catalogue arrived, it would stay empty
  const launcherIds = async () => {
    const ids = await until('the launcher', () => {
      if ($('#launcher').matches(':popover-open')) $('#launcher').hidePopover();
      $('#launcherButton').click();
      const items = all('#launcherList [data-panel]');
      return items.length && items.map((el) => el.dataset.panel);
    });
    $('#launcher').hidePopover();
    return ids;
  };

  await check('when the server cannot say, an admin is offered every panel and anyone else what their role opens', async () => {
    const { loadView, shownPanels } = await import('/static/js/shell/views.js');
    const real = window.fetch;
    window.fetch = async () => new Response('{}', { status: 500 });
    const [none, admin, user] = [await loadView(), await loadView({ role: 'admin' }), await loadView({ role: 'user' })];
    window.fetch = real;
    const catalog = { panels: [{ id: 'a' }, { id: 'b' }] };
    return none.role === 'admin' && admin.role === 'admin' && user.role === 'user' && user.panels === null
      && shownPanels(catalog, user).length === 2;
  });

  await check('the released panels come in the order chosen, without what the catalogue lacks', async () => {
    const { shownCatalog } = await import('/static/js/shell/views.js');
    const catalog = { categories: ['x'], panels: [{ id: 'a' }, { id: 'b' }, { id: 'c' }] };
    const shown = shownCatalog(catalog, { panels: ['c', 'gone', 'a'] });
    return shown.panels.map((panel) => panel.id).join() === 'c,a' && shown.categories.join() === 'x';
  });

  await setView({ role: 'user', mode: 'simple', can_switch: false, panels: ['help', 'settings'] });
  await go();

  await check('a user is offered only the released panels in the launcher', async () => {
    const ids = await launcherIds();
    return ids.join() === 'help,settings';
  });

  await check('the chat stays as it is: the agent, model and thinking choice, the welcome, no topics', async () => {
    await until('the agents', () => frame.contentWindow.selectorModule?.agents().length);
    return !$('#agentPicker').hidden && !$('#modelPicker').hidden && !$('#thinkButton').hidden && !$('[data-topics]')
      && $('#chatWelcome h1')?.textContent === 'What should the agents work on?' && !$('#chatWelcome [data-area]')
      && $('#task').placeholder === 'Message the agent…';
  });

  await check('the palette lists only the released panels, and the agents as before', async () => {
    $('#paletteButton').click();
    const input = await until('the palette', () => $('#paletteInput'));
    input.value = 'writer';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(150);
    const agent = all('#paletteList .palette-item').some((item) => item.textContent.includes('Writes books'));
    input.value = 'Status with its reasons';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(150);
    const system = all('#paletteList .palette-item').some((item) => item.textContent.includes('Status with its reasons'));
    $('#palette').close();
    return agent && !system;
  });

  await check('the account menu tells a user who released their panels', async () => {
    return $('#viewMenu [data-view-note]').textContent.includes('released by your admins') && !$('#viewMenu [data-open-panel]');
  });

  await setView({ role: 'admin', mode: 'simple', can_switch: true, panels: null });
  await go();

  await check('an admin is offered every panel and opens the User view from the account menu', async () => {
    await until('the agents', () => frame.contentWindow.selectorModule?.agents().length);
    const ids = await launcherIds();
    return ids.length > 2 && ids.includes('system') && $('#viewMenu [data-open-panel="user_view"]') !== null
      && !$('#viewMenu [data-view-note]') && !$('[data-topics]') && !$('#agentPicker').hidden;
  });

  const setMe = (me) => fetch('/__stub/me', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(me) });
  const paletteHas = async (words) => {
    $('#paletteButton').click();
    const input = await until('the palette', () => $('#paletteInput'));
    input.value = words;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(150);
    const listed = all('#paletteList .palette-item').some((item) => item.textContent.includes(words));
    $('#palette').close();
    return listed;
  };
  const roleSees = async () => {
    await until('the agents', () => frame.contentWindow.selectorModule?.agents().length);
    return { buttons: !$('#serverButton').hidden,
      palette: await paletteHas('Restart server'), system: !$('#userMenu [data-open-panel="system"]').hidden };
  };

  await check("an admin who has not switched keeps the server buttons, the palette's actions and System", async () => {
    await setMe({ username: 'ada', full_name: 'Ada', role: 'admin' });
    await setView({ role: 'admin', mode: 'simple', can_switch: true, panels: null });
    await go();
    const seen = await roleSees();
    return seen.buttons && seen.palette && seen.system;
  });

  await check("an admin's palette finds the config reload for \"reload\", not the restart", async () => {
    $('#paletteButton').click();
    const input = await until('the palette', () => $('#paletteInput'));
    input.value = 'reload';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(150);
    const listed = all('#paletteList .palette-item').map((item) => item.textContent);
    $('#palette').close();
    return listed.length > 0 && listed[0].includes('Reload config') && !listed.some((text) => text.includes('Restart server'));
  });

  await check("a user gets no server buttons, none of the palette's actions and no System", async () => {
    await setMe({ username: 'bob', full_name: 'Bob', role: 'user' });
    await setView({ role: 'user', mode: 'simple', can_switch: false, panels: ['help', 'settings'] });
    await go();
    const seen = await roleSees();
    return !seen.buttons && !seen.palette && !seen.system;
  });

  await fetch('/__results', { method: 'POST', body: JSON.stringify(results) });
</script>
</body>
</html>
