<!doctype html>
<html lang="en" class="pk-root">
<head>
  <meta charset="utf-8">
  <title>Server controls probe</title>
  <link rel="stylesheet" href="/static/kit/kit.css">
</head>
<body>
<!-- the power button and the status item as index.html has them -->
<button id="serverButton" type="button" class="pk-btn pk-btn--ghost pk-btn--icon" hidden>power</button>
<span id="connectionState"></span>
<script type="module">
  import { ServerControls } from '/static/js/shell/server.js';
  const $ = (id) => document.getElementById(id);
  window.busy = [];
  window.controls = new ServerControls({
    button: $('serverButton'), state: $('connectionState'),
    onBusy: (busy) => window.busy.push(busy),
  });
  window.controls.show(new URLSearchParams(location.search).get('role') === 'admin');
  window.loaded = true;
</script>
</body>
</html>
