<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Server controls tests</title>
  <style>body { margin: 0; } iframe { width: 800px; height: 500px; border: 0; }</style>
</head>
<body>
<iframe id="page" title="page"></iframe>
<script type="module">
  // The real script on a probe page, driven from outside: same origin, so this page reaches into it.
  const results = {};
  const check = async (name, fn) => {
    try { results[name] = (await fn()) === true ? 'ok' : 'failed'; }
    catch (error) { results[name] = `error: ${error && error.message}`; }
  };
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  async function until(what, predicate, timeout = 10000) {
    const end = performance.now() + timeout;
    for (;;) {
      let value = null;
      try { value = await predicate(); } catch { /* not there yet */ }
      if (value) return value;
      if (performance.now() > end) throw new Error(`timed out waiting for ${what}`);
      await sleep(30);
    }
  }

  const frame = document.getElementById('page');
  const win = () => frame.contentWindow;
  const $ = (selector) => frame.contentDocument.querySelector(selector);
  let loads = 0;
  frame.addEventListener('load', () => { loads += 1; });
  let visits = 0;
  const go = async (role) => {
    const visit = ++visits;  // each visit its own address: the page before must not pass for this one
    frame.src = `/tests/ui/server_controls_probe.html?role=${role}&visit=${visit}`;
    await until('the probe page', () => win().loaded && win().location.search.endsWith(`visit=${visit}`));
  };
  const question = () => $('dialog.pk-dialog[open]');
  const answer = async (label) => {
    const dialog = await until('the question', question);
    const text = dialog.textContent;
    [...dialog.querySelectorAll('button')].find((button) => button.textContent.trim() === label).click();
    await until('the question gone', () => !question());
    return text;
  };
  const asked = async () => (await (await fetch('/__stub/asked')).json()).join();
  const state = () => $('#connectionState').textContent.trim();
  const toasts = () => [...frame.contentDocument.querySelectorAll('.pk-toasts *')].map((el) => el.textContent).join(' ');
  const cookie = (value) => { document.cookie = value ? `stub_server=${value}; path=/` : 'stub_server=; path=/; max-age=0'; };
  cookie('');

  const button = () => $('#serverButton');
  // the power button's question, answered with one of its choices
  const choose = async (label) => { button().click(); return answer(label); };

  await check('the button is there for an admin only', async () => {
    await go('user');
    const hidden = button().hidden && getComputedStyle(button()).display === 'none';
    await go('admin');
    return hidden && !button().hidden;
  });

  await check('the power button asks which action, names the running requests and starts on Cancel: cancelled, nothing is asked of the server', async () => {
    button().click();
    const dialog = await until('the question', question);
    const labels = [...dialog.querySelectorAll('.pk-dialog-actions button')].map((b) => b.textContent.trim()).join();
    const focused = frame.contentDocument.activeElement?.textContent.trim();
    const text = await answer('Cancel');
    await sleep(200);
    return labels === 'Cancel,Power off,Reload config,Restart' && focused === 'Cancel'
      && text.includes('2 requests are running: a power off or a restart ends them, a config reload does not.')
      && await asked() === '' && !button().disabled && state() === '';
  });

  await check('a double click opens one question', async () => {
    button().click();
    button().click();
    await until('the question', question);
    await sleep(300);
    const open = frame.contentDocument.querySelectorAll('dialog.pk-dialog[open]').length;
    await answer('Cancel');
    await sleep(200);
    return open === 1 && !question() && await asked() === '';
  });

  await check('a refusal of the server is shown and the button works again', async () => {
    cookie('refuses');
    try {
      await choose('Restart');
      await until('the refusal', () => toasts().includes('This server was not started by agent-api'));
      await until('the button back', () => !button().disabled);
      return await asked() === '' && win().busy.join() === 'true,false';
    } finally {
      cookie('');
    }
  });

  await check('restarting waits for the server to go and come back, then loads the page anew', async () => {
    await go('admin');
    const before = loads;
    await choose('Restart');
    await until('the wait', () => state() === 'Restarting');
    const waiting = button().disabled && loads === before;
    await until('the page loaded anew', () => loads > before && win().loaded, 15000);
    return waiting && await asked() === 'restart';
  });

  await check('a server back before it was seen down counts as restarted by its uptime', async () => {
    cookie('instant');
    try {
      await go('admin');
      const before = loads;
      await choose('Restart');
      await until('the page loaded anew', () => loads > before && win().loaded, 15000);
      return await asked() === 'restart,restart';
    } finally {
      cookie('');
    }
  });

  await check('reload config asks the server, says what changed, what failed and what waits for a restart, and leaves the page as it is', async () => {
    await go('admin');
    const before = loads;
    await choose('Reload config');
    await until('the report', () => toasts().includes('Config reloaded'));
    await until('the button back', () => !button().disabled);
    await sleep(300);
    return toasts().includes('Config reloaded: 2 servers changed; 1 failed: broken_server; auth changed on disk: takes effect on a restart')
      && (await asked()).endsWith('reload') && win().busy.join() === 'true,false' && loads === before;
  });

  await check('from the palette an action asks on its own first: cancelled, nothing is asked of the server', async () => {
    await go('admin');
    const sent = await asked();
    win().controls.reload();
    const text = await answer('Cancel');
    await sleep(200);
    return text.includes('Re-read the config files') && await asked() === sent && !button().disabled;
  });

  await check("from the palette power off and restart ask on their own too and name the running requests", async () => {
    await go('admin');
    const sent = await asked();
    win().controls.stop();
    const stopping = await answer('Cancel');
    win().controls.restart();
    const restarting = await answer('Cancel');
    await sleep(200);
    return stopping.includes('2 requests are running and end with it.') && stopping.includes('Stop the ScarabHive server?')
      && restarting.includes('2 requests are running and end with it.') && restarting.includes('Restart the ScarabHive server?')
      && await asked() === sent && !button().disabled && state() === '';
  });

  await check('power off asks the server and leaves the button off', async () => {
    await go('admin');
    await choose('Power off');
    await until('the server asked', async () => (await asked()).endsWith('stop'));
    await until('the state', () => state() === 'Stopping');
    // the page's own health poll takes over again: this script no longer holds the status item
    return button().disabled && win().busy.join() === 'true,false' && toasts().includes('The server is stopping');
  });

  cookie('');
  await fetch('/__results', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(results) });
</script>
</body>
</html>
