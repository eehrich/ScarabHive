<!doctype html>
<html class="pk-root">
<head><meta charset="utf-8"><link rel="stylesheet" href="/static/kit/kit.css"></head>
<body>
<script>
  // The panel's running intervals, counted (before the kit loads): whether a timer of the kit still runs.
  window.liveIntervals = new Set();
  const realSetInterval = window.setInterval.bind(window);
  const realClearInterval = window.clearInterval.bind(window);
  window.setInterval = (fn, ms, ...rest) => {
    const id = realSetInterval(fn, ms, ...rest);
    window.liveIntervals.add(id);
    return id;
  };
  window.clearInterval = (id) => {
    window.liveIntervals.delete(id);
    realClearInterval(id);
  };
</script>
<script type="module">
  // A panel inside a (fake) shell: what it says before the handshake must
  // arrive after it, and the handshake's visibility must take effect.
  import { setTitle, navigate, isVisible, autoRefresh } from '/static/kit/panel-kit.js';

  setTitle('Early title');
  navigate('/early/path');
  window.probeVisible = isVisible;  // the page asks once it has answered
  // a panel's timer, counted: what it does while hidden and on coming back
  window.ticks = 0;
  window.startTicking = (ms) => {
    const timer = autoRefresh(() => { window.ticks += 1; }, ms);
    timer.start();
    return timer;
  };
  // a countdown the panel draws: the kit writes its text
  window.addCountdown = (at) => {
    const clock = document.createElement('span');
    clock.dataset.pkCountdown = at;
    document.body.append(clock);
    return clock;
  };
</script>
</body>
</html>
