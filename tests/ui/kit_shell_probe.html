<!doctype html>
<html class="pk-root">
<head><meta charset="utf-8"><link rel="stylesheet" href="/static/kit/kit.css"></head>
<body>
<script type="module">
  // A panel inside a (fake) shell: what it says before the handshake must
  // arrive after it, and the handshake's visibility must take effect.
  import { setTitle, navigate, isVisible, onVisibilityChange } from '/static/kit/panel-kit.js';

  setTitle('Early title');
  navigate('/early/path');
  onVisibilityChange((visible) => {
    window.parent.postMessage({ probe: 'shell', hiddenAfterInit: visible === false && !isVisible() }, window.location.origin);
  });
</script>
</body>
</html>
