<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ScarabHive shell tests</title>
  <style>body { margin: 0; } iframe { width: 1400px; height: 900px; border: 0; }</style>
</head>
<body>
<iframe id="shell" title="shell"></iframe>
<script type="module">
  // The real shell (index.html, shell.js, the chat scripts) against a stub
  // server, driven from outside: same origin, so this page reaches into it.
  const results = {};
  const check = async (name, fn) => {
    try { results[name] = (await fn()) === true ? 'ok' : 'failed'; }
    catch (error) { results[name] = `error: ${error && error.message}`; }
  };
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  // A rendering update in the shell and time for what it sends: an IntersectionObserver
  // speaks only after the next one, so a read that must NOT happen is looked for after it.
  const painted = async () => {
    await new Promise((resolve) => win().requestAnimationFrame(() => win().requestAnimationFrame(resolve)));
    await sleep(200);
  };
  /** Resolves with the first truthy value of predicate -- which may ask the stub server, and so be async. */
  async function until(what, predicate, timeout = 10000) {
    const end = performance.now() + timeout;
    for (;;) {
      let value = null;
      try { value = await predicate(); } catch { /* not there yet */ }
      if (value) return value;
      if (performance.now() > end) throw new Error(`timed out waiting for ${what}`);
      await sleep(30);
    }
  }

  const frame = document.getElementById('shell');
  const doc = () => frame.contentDocument;
  const win = () => frame.contentWindow;
  const $ = (selector) => doc().querySelector(selector);
  const $$ = (selector) => [...doc().querySelectorAll(selector)];
  const probeFrame = () => $$('iframe.panel-frame').find((f) => f.src.includes('shell_probe_panel'));
  const probe = () => probeFrame()?.contentWindow?.probe;
  const received = (type) => probe().received.filter((m) => m.type === type);
  const panelFrame = (path) => $$('iframe.panel-frame').find((f) => f.src.includes(path));
  const sessionButton = (id, act) => $(`.session-item[data-id="${id}"] > .session-row [data-act="${act}"]`);
  const cookie = (name, value) => {
    document.cookie = value ? `${name}=${value}; path=/` : `${name}=; path=/; max-age=0`;
  };
  const account = (state) => cookie('stub_account', state);
  // A condition a check needs, failing with the condition itself as the reason -- a bare
  // `return false` reports 'failed' and leaves the reader to guess which line it was.
  const need = (ok, why) => { if (!ok) throw new Error(why); return true; };
  // The chat's display preferences, as the shell hands them on from the Settings panel.
  const CHAT_DEFAULTS = { fold_steps: 'at_end', thinking: 'collapsed', sub_agents: 'expanded' };
  const choose = (chat) => win().dispatchEvent(new (win().CustomEvent)('preferences:changed',
    { detail: { chat: { ...CHAT_DEFAULTS, ...chat } } }));
  // A step section opened, if it is folded -- by its header, as a viewer does.
  const unfold = (section) => {
    const body = section.querySelector(':scope > .container-body');
    if (body.getClientRects().length === 0) section.querySelector(':scope > .container-header').click();
    return body.getClientRects().length > 0;
  };
  const stub = (path, json) => fetch(path, json === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(json) });
  const withWidth = async (width, fn) => {
    frame.style.width = width;
    try { return await fn(); } finally { frame.style.width = ''; }
  };
  /** Pretend a request is running in the chat while fn runs. */
  const whileRunning = async (fn, { stops = true } = {}) => {
    const chat = win().chatModule;
    const original = { has: chat.hasActiveRequest, run: chat.activeRun, cancel: chat.cancelActiveRequest };
    // `state.cancels` is how a test says "and the run was left alone": leaving a
    // session no longer stops its run, and nothing else would show the difference.
    const state = { cancels: 0 };
    chat.hasActiveRequest = () => true;
    chat.activeRun = () => ({});
    chat.cancelActiveRequest = async () => { state.cancels++; return stops ? 'stopped' : 'unconfirmed'; };
    try {
      return await fn(state);
    } finally {
      Object.assign(chat, { hasActiveRequest: original.has, activeRun: original.run, cancelActiveRequest: original.cancel });
    }
  };

  /** The run of this tab a reload follows, stored with the session it runs in -- which the tab shows too. */
  const storeRun = (requestId, sessionId) => {
    sessionStorage.setItem('activeRequestId', requestId);
    sessionStorage.setItem('activeRequestSession', sessionId);
    sessionStorage.setItem('lastSessionId', sessionId);
  };
  const forgetRun = () => [...Object.keys(sessionStorage).filter((key) => key.startsWith('stoppingRequest:')),
    'activeRequestId', 'activeRequestSession', 'lastSessionId'].forEach((key) => sessionStorage.removeItem(key));
  const stopAsked = (requestId) => sessionStorage.getItem(`stoppingRequest:${requestId}`) !== null;

  function go(url) {
    return new Promise((resolve) => { frame.onload = resolve; frame.src = url; });
  }

  const hits = async (key) => (await (await stub('/__stub/hits')).json())[key] || 0;
  const runsPosted = async () => (await (await stub('/__stub/posted')).json()).length;
  /** Reload the shell and resolve once it has asked the stub server for `key` once more (e.g. its stored session). */
  async function reloadUntilAsked(key) {
    const before = await hits(key);
    await go(`/?load=${performance.now()}`);
    await until(`the shell to ask for ${key}`, async () => await hits(key) !== before, 5000);
  }
  /** The server has named the run the chat follows after a reload. */
  const reattached = () => $('#chat .reconnect-info');

  // Started means start() ran through: the welcome (or the restored session) is
  // drawn only after the catalogue and the sessions have arrived.
  async function loadShell() {
    await go(`/?load=${performance.now()}`);
    await until('the started shell', () => $('.session-item') && ($('#chatWelcome') || $('#chat .msg')));
  }

  async function openPalette(query) {
    doc().dispatchEvent(new KeyboardEvent('keydown', { key: 'k', ctrlKey: true, bubbles: true }));
    await until('the palette', () => $('#palette').open);
    const input = $('#paletteInput');
    input.value = query;
    input.dispatchEvent(new Event('input'));
    return input;
  }

  const report = () => fetch('/__results', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(results) });

  localStorage.clear();
  sessionStorage.clear();
  account(null);

  const STARTS = 'the shell starts for the owner when auth is off';
  await check(STARTS, async () => {
    await loadShell();
    await until('the health poll', () => $('#connectionState').textContent.includes('Connected'));
    await until('the agents', () => win().selectorModule.agents().length === 2 && $('#agentLabel').textContent === 'assistant');
    return $('#userMenuName').textContent === 'Owner' && $('#logoutButton').hidden
      && $('#versionLabel').textContent === 'v9.9.9' && $('#chatWelcome') !== null;
  });
  if (results[STARTS] !== 'ok') {
    await report();  // nothing below can run without a shell
    throw new Error(results[STARTS]);
  }

  await check('an empty message leaves the welcome in place', async () => {
    $('#f').requestSubmit();
    await sleep(300);
    return $('#chatWelcome') !== null;
  });

  await check('the agent and profile pickers open on the current choice, search, group by a remembered grouping and pick by click or keyboard', async () => {
    const picker = $('#picker');
    const names = () => $$('#pickerList [data-index]').map((row) => row.querySelector('.picker-name .pk-truncate').textContent);
    const headings = () => $$('#pickerList .palette-group').map((h) => h.textContent);
    const selectedName = () => $('#pickerList [aria-selected="true"] .picker-name .pk-truncate')?.textContent;
    const key = (k) => $('#pickerInput').dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    const search = (text) => { $('#pickerInput').value = text; $('#pickerInput').dispatchEvent(new Event('input')); };
    const announced = [];
    const listen = (event) => announced.push(event.detail.kind);
    win().addEventListener('selector:change', listen);
    try {
      $('#modelPicker').click();
      const opened = picker.open && $('#pickerTitle').textContent === 'Choose a model profile' && doc().activeElement === $('#pickerInput')
        && selectedName() === 'default' && $('#pickerList [aria-selected="true"] .picker-check .pk-icon') !== null
        && $('#pickerList [aria-selected="true"] .pk-badge')?.textContent === 'default'
        // by route: the host, else the provider plugin
        && headings().join('|') === 'openai_httpx|openrouter.ai' && names().join() === 'default,deep,fast';
      const pointsAtSelected = $('#pickerInput').getAttribute('aria-activedescendant') === $('#pickerList [aria-selected="true"]').id;
      search('no-such-thing');
      // nothing listed: the input points at no option that is gone
      const noneShown = $('#pickerList').textContent.includes('Nothing matches') && !$('#pickerInput').hasAttribute('aria-activedescendant');
      search('deepseek');  // the model name, not the profile name
      const found = pointsAtSelected && noneShown && names().join() === 'deep' && selectedName() === 'deep';
      key('Enter');
      const byKey = !picker.open && $('#modelLabel').textContent === 'deep' && win().selectorModule.getCurrentLLMProfile() === 'deep';
      $('#modelPicker').click();
      const onCurrent = $('#pickerInput').value === '' && selectedName() === 'deep';
      $('#pickerGroups [data-grouping="model"]').click();
      const regrouped = headings().join('|') === 'deepseek/pro|google/flash|gpt-x' && selectedName() === 'deep'
        && $('#pickerGroups [data-grouping="model"]').getAttribute('aria-pressed') === 'true';
      picker.close();
      $('#modelPicker').click();
      const remembered = headings().join('|') === 'deepseek/pro|google/flash|gpt-x';
      $$('#pickerList [data-index]').find((row) => row.textContent.includes('fast')).click();
      const byClick = !picker.open && $('#modelLabel').textContent === 'fast';

      $('#agentPicker').click();
      const agents = $('#pickerTitle').textContent === 'Choose an agent' && selectedName() === 'assistant'
        && headings().join('|') === 'tools|Other';  // no category: last, though "Other" sorts before "tools"
      key('ArrowDown');
      key('Enter');
      const agentByKey = $('#agentLabel').textContent === 'writer' && win().selectorModule.getCurrentAgent() === 'writer';
      // the slash commands are per agent: their catalogue is asked for the new one before anything is typed
      await until('the slash catalogue of the picked agent', async () => await hits('commands:writer') > 0, 3000);
      $('#pickerList').style.maxHeight = '40px';  // the current one (writer, last) lies below the fold
      $('#agentPicker').click();
      const listBox = $('#pickerList').getBoundingClientRect();
      const currentBox = $('#pickerList [aria-selected="true"]').getBoundingClientRect();
      // scrolled to: its row starts inside the list's box (a row with a description is taller than 40px)
      const inView = $('#pickerList').scrollTop > 0 && currentBox.top >= listBox.top - 1 && currentBox.top < listBox.bottom;
      $('#pickerList').style.maxHeight = '';
      search('prose');  // a tag
      const byTag = names().join() === 'writer';
      picker.close();
      return opened && found && byKey && onCurrent && regrouped && remembered && byClick && agents && agentByKey && inView && byTag
        && announced.includes('agent') && announced.includes('profile');
    } finally {
      win().removeEventListener('selector:change', listen);
      if (picker.open) picker.close();
      win().selectorModule.setAgent('assistant');
      win().selectorModule.setLLMProfile('default');
      win().localStorage.removeItem('scarabhive.pickerGrouping');
    }
  });

  await check('a picker says when its list is on its way and shows it when it comes, says when it failed, and falls back only to what it lists', async () => {
    const listText = () => $('#pickerList').textContent.replace(/\s+/g, ' ');
    try {
      cookie('stub_agents', 'slow');
      await go(`/?load=${performance.now()}`);
      await until('the picker wired', () => $('#agentLabel')?.textContent === 'Agent: Loading…' && win().selectorModule);
      await until('the picker wired', async () => { $('#agentPicker').click(); return $('#picker').open; });
      const waiting = listText().includes('Loading');
      await until('the list arriving in the open picker', () => $$('#pickerList [data-index]').length === 2, 5000);
      // on the current one (the default here), not on whatever row the empty list left selected
      const arrived = $('#pickerList [aria-selected="true"]').textContent.includes('writer')
        && $('#pickerInput').getAttribute('aria-activedescendant') === $('#pickerList [aria-selected="true"]').id;
      $('#picker').close();

      // set before the list arrived (a reattached run names its agent): taken once it is here, over the default
      await go(`/?load=${performance.now()}`);
      await until('the loading agent list', () => $('#agentLabel')?.textContent === 'Agent: Loading…' && win().selectorModule);
      const pendingAnswer = win().selectorModule.setAgent('assistant');
      await until('the agents', () => win().selectorModule.agents().length === 2, 5000);
      const pending = pendingAnswer === false && win().selectorModule.getCurrentAgent() === 'assistant'
        && $('#agentLabel').textContent === 'assistant';

      cookie('stub_agents', 'broken');
      await loadShell();
      await until('the failed agent list', () => $('#agentLabel').textContent === 'Agent: unavailable');
      $('#modelPicker').click();  // a list that loaded points the input at an option ...
      const pointed = $('#pickerInput').hasAttribute('aria-activedescendant');
      $('#picker').close();
      $('#agentPicker').click();  // ... which the failed one must not keep
      const failedPointsNowhere = pointed && !$('#pickerInput').hasAttribute('aria-activedescendant');
      const failed = listText().includes('could not be loaded') && failedPointsNowhere;
      $('#picker').close();

      cookie('stub_agents', 'nodefault');
      await loadShell();
      await until('the agents', () => win().selectorModule.agents().length === 2);
      const atLoad = $('#agentLabel').textContent === 'assistant';
      // unknown, and the server's default is not listed either: the first listed, never a name the picker cannot show
      const known = win().selectorModule.setAgent('nobody');
      return waiting && arrived && pending && failed && atLoad && known === false && win().selectorModule.getCurrentAgent() === 'assistant';
    } finally {
      cookie('stub_agents', null);
      if ($('#picker')?.open) $('#picker').close();
      await loadShell();
    }
  });

  await check('the message form never reloads the page, not even before the chat has taken it over', async () => {
    // a copy carries the markup and none of the chat's listeners
    const copy = $('#f').cloneNode(true);
    copy.querySelectorAll('[id]').forEach((element) => element.removeAttribute('id'));
    doc().body.appendChild(copy);
    let reloaded = false;
    const onLoad = () => { reloaded = true; };
    frame.addEventListener('load', onLoad);
    try {
      copy.requestSubmit();
      await sleep(500);
      return !reloaded && $('#chatWelcome') !== null;
    } finally {
      frame.removeEventListener('load', onLoad);
      copy.remove();
    }
  });

  await check('attaching files is a button the keyboard reaches', async () => {
    let picked = false;
    $('#fileInput').addEventListener('click', (event) => { picked = true; event.preventDefault(); }, { once: true });
    $('#attachButton').focus();
    const focused = doc().activeElement === $('#attachButton');
    $('#attachButton').click();
    return focused && picked;
  });

  await check('a mangled pin or recent list leaves the launcher working', async () => {
    localStorage.setItem('scarabhive.pinned', '{}');
    localStorage.setItem('scarabhive.recent', 'null');
    try {
      $('#launcherButton').click();
      await until('the open launcher', () => $('#launcher').matches(':popover-open'));
      const listed = $$('#launcherList [data-panel="probe"]').length === 1;
      $('#launcherList [data-pin="probe"]').click();
      const pins = JSON.parse(localStorage.getItem('scarabhive.pinned'));
      $('#launcher').hidePopover();
      return listed && pins.join() === 'probe';
    } finally {
      localStorage.removeItem('scarabhive.pinned');
      localStorage.removeItem('scarabhive.recent');
    }
  });

  await check('the launcher lists the catalogue by category under its button', async () => {
    $('#launcherButton').click();
    await until('the open launcher', () => $('#launcher').matches(':popover-open'));
    const groups = $$('#launcherList .launcher-group').map((g) => g.textContent);
    const items = $$('#launcherList [data-panel]').map((i) => i.dataset.panel);
    const button = $('#launcherButton').getBoundingClientRect();
    const launcher = $('#launcher').getBoundingClientRect();
    return groups.includes('Session') && groups.includes('Debugging') && items.includes('probe') && items.includes('system')
      && launcher.top >= button.bottom && Math.abs(launcher.right - button.right) < 1;
  });

  await check('instances of one plugin fold into one launcher row, lined up with the others, and only the instances indent', async () => {
    const folds = $$('#launcherList details.launcher-fold');
    const members = folds[0] && [...folds[0].querySelectorAll('[data-panel]')].map((i) => i.dataset.panel).sort().join(',');
    // the icons say where a row's content starts: the group row with the single rows, its instances further in
    folds[0].open = true;
    const iconLeft = (row) => row.querySelector('.launcher-icon').getBoundingClientRect().left;
    const single = iconLeft($('#launcherList > .launcher-item[data-panel]'));
    const lined = iconLeft(folds[0].querySelector('summary')) === single;
    const indented = [...folds[0].querySelectorAll(':scope > [data-panel]')].every((row) => iconLeft(row) > single);
    folds[0].open = false;
    return folds.length === 1 && folds[0].querySelector('summary').textContent.includes('Sub-Agents')
      && folds[0].querySelector('summary .pk-badge').textContent === '2' && members === 'sam_skills,sam_writer'
      && $$('#launcherList > [data-panel^="sam_"]').length === 0 && lined && indented;
  });

  await check('the launcher search matches description and keywords', async () => {
    const search = $('#launcherSearch');
    search.value = 'records protocol';
    search.dispatchEvent(new Event('input'));
    const items = $$('#launcherList [data-panel]').map((i) => i.dataset.panel);
    return items.length === 1 && items[0] === 'probe';
  });

  await check('a panel opens docked and the host answers pk:ready with pk:init', async () => {
    $('#launcherList [data-panel="probe"]').click();
    await until('pk:init at the probe', () => received('pk:init').length);
    const [init] = received('pk:init');
    return !$('#dock').hidden && !$('#launcher').matches(':popover-open') && $$('.dock-tab').length === 1
      && init.visible === true && init.theme === 'system' && init.session === null;
  });

  await check("a panel's dialog is shown over the whole app", async () => {
    const answer = probe().pk.confirm('Delete everything?', { danger: true });
    const dialog = await until('the dialog in the shell', () => $('dialog.pk-dialog[open]'));
    const inPanel = probeFrame().contentDocument.querySelector('dialog.pk-dialog');
    dialog.querySelector('.pk-btn--danger').click();
    return (await answer) === true && inPanel === null;
  });

  await check("a panel's title and toast reach the shell", async () => {
    $('.dock-tab [data-act="close"]').focus();
    probe().pk.setTitle('Probe · 3 new');
    probe().pk.toast('Saved', { kind: 'ok' });
    await until('the tab title', () => $('.dock-tab .dock-tab-title').textContent === 'Probe · 3 new');
    await until('the toast', () => $$('.pk-toast--ok').some((t) => t.textContent.includes('Saved')));
    // the bar was drawn anew: the keyboard focus stayed on the same button
    if (doc().activeElement.dataset.act !== 'close') return false;
    $('.dock-tab [data-act="float"]').focus();
    probe().pk.setTitle('Probe · float');
    await until('the next title', () => $('.dock-tab .dock-tab-title').textContent === 'Probe · float');
    return doc().activeElement.dataset.act === 'float';
  });

  await check('a second docked panel takes the front and the first is told it is hidden', async () => {
    $('#userButton').click();
    await until('the user menu', () => $('#userMenu').matches(':popover-open'));
    $('#userMenu [data-open-panel="settings"]').click();
    await until('the second tab', () => $$('.dock-tab').length === 2);
    await until('the hidden notice', () => received('pk:visibility').at(-1)?.visible === false);
    return probeFrame().hidden && getComputedStyle(probeFrame()).display === 'none'
      && $('.dock-tab[aria-selected="true"]').textContent.includes('Settings');
  });

  await check('a dock tab is chosen with the keyboard', async () => {
    const tab = (name) => $$('.dock-tab').find((t) => t.textContent.includes(name));
    tab('Probe').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    const probeChosen = tab('Probe').getAttribute('aria-selected') === 'true';
    tab('Settings').dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true }));
    return probeChosen && tab('Settings').getAttribute('aria-selected') === 'true' && tab('Probe').tabIndex === 0;
  });

  await check('a framed kit panel leaves its title to the tab and keeps its content', async () => {
    const settings = panelFrame('/ui/panels/settings');
    const panel = await until('the settings panel', () => settings.contentDocument.querySelector('.pk-page-title') && settings.contentDocument);
    await until('the account check', () => !panel.getElementById('noAccounts').hidden);
    const shown = (selector) => getComputedStyle(panel.querySelector(selector)).display !== 'none';
    return !shown('.pk-page-title') && !shown('#account') && shown('#noAccounts');
  });

  await check('a docked panel detaches into a window and docks back', async () => {
    $$('.dock-tab').find((t) => t.textContent.includes('Probe')).querySelector('[data-act="float"]').click();
    const window_ = await until('the window', () => $('#floatingLayer .app-window'));
    await until('pk:init in the window', () => received('pk:init').at(-1)?.visible === true);
    const detached = $$('.dock-tab').length === 1 && $('#floatingList [data-key]') !== null
      && window_.querySelector('.app-window-title').textContent === 'Probe';
    window_.querySelector('[data-act="dock"]').click();
    await until('the tab again', () => $$('.dock-tab').length === 2 && !$('#floatingLayer .app-window'));
    await until('pk:init back in the dock', () => received('pk:init').length);
    return detached && $('.dock-tab[aria-selected="true"]').textContent.includes('Probe');
  });

  await check('a window gets its size back once the browser window grows again', async () => {
    $$('.dock-tab').find((t) => t.textContent.includes('Probe')).querySelector('[data-act="float"]').click();
    const window_ = await until('the window', () => $('#floatingLayer .app-window'));
    const height = () => window_.getBoundingClientRect().height;
    const full = height();
    frame.style.height = '500px';
    try {
      await until('the squeezed window', () => height() < full);
    } finally {
      frame.style.height = '';
    }
    await until('the window at its own size', () => Math.abs(height() - full) < 1, 3000);
    window_.querySelector('[data-act="dock"]').click();
    await until('the tab again', () => !$('#floatingLayer .app-window') && received('pk:init').length);
    return true;
  });

  await check('loading a session names it in the header and tells the panels', async () => {
    sessionButton('s-1', 'open').click();
    await until('the header title', () => $('#headerSessionId').textContent === 'Refactor the kit');
    // the probe was loaded before: the session has to come as pk:session, not with pk:init
    await until('pk:session at the probe', () => received('pk:session').at(-1)?.session?.id === 's-1');
    await until('session.onChange in the probe', () => probe().sessions.at(-1)?.id === 's-1');
    return $$('#chat .msg.user').length === 1 && !$('#chatWelcome') && doc().title === 'Refactor the kit · ScarabHive'
      && sessionButton('s-1', 'open').tagName === 'BUTTON';
  });

  await check('an open branch of the session tree stays open and current when the list refreshes', async () => {
    sessionButton('s-1', 'expand').click();
    await until('the sub-session', () => $('.session-item[data-id="s-1-sub"]'));
    const expanded = sessionButton('s-1', 'expand').getAttribute('aria-expanded') === 'true';
    await stub('/__stub/children', { parent: 's-1', session_id: 's-1-sub2', title: 'Draw the logo' });  // a run spawned it
    await win().sessionManager.loadSessions();  // what every run's start and end does
    return expanded && $('.session-item[data-id="s-1-sub"]') !== null && $('.session-item[data-id="s-1-sub2"]') !== null
      && sessionButton('s-1', 'expand').getAttribute('aria-expanded') === 'true';
  });

  await check('collapse all closes every open branch and keeps the focus it was pressed with', async () => {
    // TWO branches open, not one: with a single branch "close every open branch" and
    // "close the one branch I happened to find" are the same measurement.
    const open = async (id) => {
      // Only if it is closed: a check before this one leaves a branch open, and a blind
      // click would CLOSE it -- then this waits for a row it just removed itself.
      if (sessionButton(id, 'expand').getAttribute('aria-expanded') !== 'true') {
        sessionButton(id, 'expand').click();
      }
      await until(`${id} to be open`, () => win().sessionManager.expanded.has(id), 4000);
    };
    await open('s-1');
    await until('the sub-session', () => $('.session-item[data-id="s-1-sub"]'));
    await open('s-1-sub');
    if (win().sessionManager.expanded.size !== 2) return false;
    const collapse = $('.sessions-head [data-act="collapse-all"]');
    collapse.focus();
    collapse.click();
    await until('the branch to close', () => !$('.session-item[data-id="s-1-sub"]'));
    if (sessionButton('s-1', 'expand').getAttribute('aria-expanded') !== 'false') return false;
    // EVERY branch: the nested one is gone from the DOM with its parent, so the count is
    // what says it was closed too, rather than merely hidden under a closed parent.
    if (win().sessionManager.expanded.size !== 0) return false;
    // It lives in the pane's head, which render() does not touch -- so pressing it by
    // keyboard leaves the focus on it. A version that HID itself once nothing was open
    // would take the focus of whoever just pressed it down to the body.
    if (doc().activeElement !== collapse) return false;
    // Disabling it instead does NOT lose the focus -- measured, a mutant that disabled
    // it survived this check until this line. It still may not: a disabled button
    // leaves the tab order, so the header's keyboard path would change as a side
    // effect of pressing it.
    if (collapse.disabled) return false;
    // And with nothing open it is a no-op: not an error, and not a re-render either.
    // Counting the renders is the only way to see that guard at all -- a list rebuilt
    // from the same data looks exactly like a list left alone.
    const manager = win().sessionManager;
    const realRender = manager.render.bind(manager);
    let renders = 0;
    manager.render = () => { renders += 1; realRender(); };
    try {
      collapse.click();
    } finally {
      // delete, not assign: assigning back would leave an own property shadowing the
      // class method for every check after this one.
      delete manager.render;
    }
    return renders === 0 && doc().activeElement === collapse
      && $('.session-item[data-id="s-1-sub"]') === null;
  });

      const row = step('1').querySelector('.operation-progress[data-request-id$="_003"]');
      if (!row) return false;

      const message = row.querySelector('.progress-line .progress-message');
      if (row.querySelector('.progress-line button')) return false;
      if (!row.classList.contains('has-detail')) return false;
      if (message.getAttribute('role') !== 'button') return false;
      if (message.getAttribute('tabindex') !== '0') return false;
      if (message.getAttribute('aria-expanded') !== 'false') return false;
      // and nothing explains itself in a tooltip either: the hover is the whole hint
      if (message.title) return false;

      const bodies = [...row.children].filter((el) => el.classList.contains('tool-detail-body'));
      if (bodies.length !== 1) return false;
      const parts = [...bodies[0].querySelectorAll('.tool-detail-part')];
      if (parts.length !== 2) return false;
      if (parts.map((p) => p.querySelector('.tool-detail-label').textContent).join()
          !== 'arguments,result') return false;
      // folded: a run that reads twenty files must not unfold twenty walls of JSON
      if (bodies[0].getClientRects().length > 0) return false;

      { id: 'sam_writer', asksNothingWithoutSession: true, pause: (page) => page.querySelector('pk-refresh [data-act="auto"]').click(),
        shows: (page) => {

            return agree(agent.replace('agent-s-1', '7').replace('agent-s-lagging', '3'),

    for (const panel of panels) {

        if (panel.id === 'sam_writer') await pick('s-1', 'Refactor the kit');
        await until(`${panel.id} on the kit session`, () => panel.shows(page) === '7');
        if (panel.pause) panel.pause(page);  // its own refresh stops
        const search = () => {

        if (panel.id === 'memory') {

        if (panel.id === 'memory') {

          search();  // answered late as well
        }
        await pick('s-1', 'Refactor the kit');
        await sleep(1700);  // the answers for the lagging session have come in by now
        if (panel.shows(page) !== '7') failures.push(`${panel.id} shows a late answer`);
        if (panel.id === 'memory' && page.querySelector('#memories .mm-title')) failures.push('memory shows a late search');
        // every call of the panel, whatever session it names: with none open it has nothing to ask
        const calls = async () => Object.entries(await (await stub('/__stub/hits')).json())
          .filter(([key]) => key.startsWith(`${panel.id}:`)).reduce((sum, [, count]) => sum + count, 0);

    return getComputedStyle($('#dock')).display !== 'none';
  }));

  await check('on a narrow screen a sheet opened while the shell starts stays open when the panels come back', () => withWidth('600px', async () => {
    const remembered = localStorage.getItem('scarabhive.sessionsOpen');
    cookie('stub_catalog', 'slow');  // the panels come back only after the catalogue (1 s)
    try {
      await go(`/?load=${performance.now()}`);
      await until('the session list', () => sessionButton('s-1', 'open'));
      $('#sessionsToggle').click();
      await until('the restored tabs', () => $$('.dock-tab').length > 0, 5000);
      await sleep(200);
      return $('.app-body').dataset.sessions === 'open';
    } finally {
      cookie('stub_catalog', null);
      if (remembered === null) localStorage.removeItem('scarabhive.sessionsOpen');
      else localStorage.setItem('scarabhive.sessionsOpen', remembered);
    }
  }));

  await check('on a narrow screen a window fills the screen: it is not dragged and takes its size on a wide one', async () => {
    const press = (bar) => bar.dispatchEvent(new PointerEvent('pointerdown', { button: 0, pointerId: 1, bubbles: true, cancelable: true }));
    // settings has never been a window in this browser: it has no rectangle of its own yet
    const storedRect = () => JSON.parse(localStorage.getItem('scarabhive.layout.v1')).items.find((item) => item.panelId === 'settings').rect;
    const narrow = await withWidth('600px', async () => {
      await until('the narrow layout', () => win().innerWidth === 600);
      $$('.dock-tab').find((t) => t.textContent.includes('Settings')).querySelector('[data-act="float"]').click();
      const bar = await until('the window bar', () => $('#floatingLayer .app-window .app-window-bar'));
      return { bar, rectless: storedRect() === null, drags: press(bar) === false };
    });
    const window_ = $('#floatingLayer .app-window');
    await until('the window at the panel size on the wide screen', () => window_.getBoundingClientRect().width === 520);
    // wide: the bar takes the press for a drag -- the witness that pressing it is measured at all
    const dragsWide = press(narrow.bar) === false;
    narrow.bar.dispatchEvent(new PointerEvent('lostpointercapture', { pointerId: 1 }));
    window_.querySelector('[data-act="dock"]').click();
    await until('the tab again', () => !$('#floatingLayer .app-window'));
    return narrow.rectless && !narrow.drags && dragsWide;
  });

  await check("the kit page's theme buttons switch the whole shell", async () => {
    await until('the wide layout', () => getComputedStyle($('#dock')).display !== 'none');
    $('#launcherButton').click();
    (await until('the kit entry', () => $('#launcherList [data-panel="ui_kit"]'))).click();
    // loaded to the end: its module script, which wires the buttons, has run
    const kit = await until('the kit page', () => {
      const page = panelFrame('/ui/kit')?.contentDocument;
      return page?.readyState === 'complete' && page.querySelector('[data-theme-choice="dark"]');
    });
    kit.click();
    await until('the dark shell', () => doc().documentElement.dataset.theme === 'dark');
    // posted to the panels in the same task: it arrives in a later one
    await until('pk:theme at the probe', () => received('pk:theme').at(-1)?.theme === 'dark');
    return true;
  });

  await check('a new window takes the first free step down, not the count of windows', async () => {
    // by panel id: a panel may retitle its tab (the session panel shows the session's title)
    const float = async (panelId, url) => {
      $(`.dock-tab[data-key^="${panelId}:"] [data-act="float"]`).click();
      return until(`the ${panelId} window`, () => $$('#floatingLayer .app-window')
        .find((w) => w.querySelector('iframe')?.src.includes(url)));
    };
    const top = (w) => Math.round(w.getBoundingClientRect().top - $('#floatingLayer').getBoundingClientRect().top);
    const system = await float('system', '/ui/panels/system');
    const session = await float('session', '/ui/panels/session');
    const steps = [top(system), top(session)];
    system.querySelector('[data-act="close"]').click();
    const kit = await float('ui_kit', '/ui/kit');
    const reused = top(kit) === steps[0];
    for (const window_ of $$('#floatingLayer .app-window')) window_.querySelector('[data-act="dock"]').click();
    await until('no window left', () => !$('#floatingLayer .app-window'));
    // after a reload a window without a rectangle of its own takes a step the stored ones leave free --
    // they were dragged a few pixels off theirs: one above the first step, one below the second
    const layout = JSON.parse(localStorage.getItem('scarabhive.layout.v1'));
    layout.items = [
      { panelId: 'system', place: 'float', path: '', rect: null },
      { panelId: 'probe', place: 'float', path: '', rect: { x: 600, y: 5, w: 500, h: 400 } },
      { panelId: 'settings', place: 'float', path: '', rect: { x: 560, y: 49, w: 500, h: 400 } },
    ];
    localStorage.setItem('scarabhive.layout.v1', JSON.stringify(layout));
    await loadShell();
    const restored = await until('the restored windows', () => $$('#floatingLayer .app-window').length === 3 && $$('#floatingLayer .app-window'));
    const freeStep = top(restored.find((w) => w.querySelector('iframe').src.includes('/ui/panels/system'))) === 68;
    for (const window_ of restored) window_.querySelector('[data-act="dock"]').click();
    await until('no window left again', () => !$('#floatingLayer .app-window'));
    return steps.join() === '20,44' && reused && freeStep;
  });

  await check('the docked tabs sort by drag and drop and by Shift+arrow, keep their order after a reload, and a cancelled drag changes nothing', async () => {
    const panelOf = (key) => key.slice(0, key.lastIndexOf(':'));
    const order = () => $$('.dock-tab').map((tab) => panelOf(tab.dataset.key));
    const stored = () => JSON.parse(localStorage.getItem('scarabhive.layout.v1')).items
      .filter((item) => item.place === 'dock').map((item) => item.panelId);
    const before = order();
    if (before.length < 3) return 'fixture: fewer than three docked tabs';
    const transfer = new DataTransfer();
    const drag = (type, target, clientX = 0) => target.dispatchEvent(
      new DragEvent(type, { bubbles: true, cancelable: true, dataTransfer: transfer, clientX }));
    // dropped anywhere but on the bar (or cancelled with Esc), the bar goes back to its order
    const cancelled = $('.dock-tab');
    drag('dragstart', cancelled);
    // carried as a tab, not as text a panel's input field would take
    const noText = transfer.types.includes('application/x-scarabhive-tab') && !transfer.types.includes('text/plain');
    drag('dragover', $$('.dock-tab').at(-1), $$('.dock-tab').at(-1).getBoundingClientRect().right - 1);
    const shownMoved = order().at(-1) === before[0];
    drag('dragend', cancelled);
    const keptOnCancel = noText && shownMoved && order().join() === before.join() && stored().join() === before.join()
      && !$('.dock-tab[data-dragging]');
    const first = $('.dock-tab');
    drag('dragstart', first);
    // the bar is drawn anew while the tab is on its way (a resize here; a panel's title alike)
    win().dispatchEvent(new Event('resize'));
    await sleep(100);
    const last = $$('.dock-tab').at(-1);
    const dropTarget = drag('dragover', last, last.getBoundingClientRect().right - 1) === false;  // past its middle
    drag('drop', last, last.getBoundingClientRect().right - 1);
    drag('dragend', first);
    const dropped = [...before.slice(1), before[0]];
    const byDrag = keptOnCancel && dropTarget && order().join() === dropped.join() && stored().join() === dropped.join()
      && !$('.dock-tab[data-dragging]');
    const moved = $$('.dock-tab').at(-1);
    moved.focus();
    moved.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft', shiftKey: true, bubbles: true, cancelable: true }));
    const keyed = [...dropped.slice(0, -2), dropped.at(-1), dropped.at(-2)];
    const byKey = order().join() === keyed.join() && stored().join() === keyed.join()
      && panelOf(doc().activeElement?.dataset.key || '') === before[0];
    await loadShell();
    await until('the restored tabs', () => $$('.dock-tab').length === before.length);
    return byDrag && byKey && order().join() === keyed.join();
  });

  await check('the sessions pane takes the width it was dragged or keyed to, keeps it after a reload, and stays within its bounds', async () => {
    const KEY = 'scarabhive.sessionsWidth';
    const tabs = $$('.dock-tab').length;
    const pane = () => Math.round($('#sessionsPane').getBoundingClientRect().width);
    const handle = () => $('#sessionsResizer');
    const pointer = (type, clientX) => handle().dispatchEvent(
      new PointerEvent(type, { button: 0, pointerId: 1, clientX, bubbles: true, cancelable: true }));
    const drag = (dx) => {
      const x = pane();
      pointer('pointerdown', x);
      pointer('pointermove', x + dx);
      handle().dispatchEvent(new PointerEvent('lostpointercapture', { pointerId: 1 }));
    };
    if ($('.app-body').dataset.sessions !== 'open') $('#sessionsToggle').click();
    const start = pane();
    // the handle rides the pane's right edge
    const onEdge = () => Math.abs(handle().getBoundingClientRect().left + 3 - $('#sessionsPane').getBoundingClientRect().right) <= 1;
    const edgeBefore = onEdge();
    drag(80);
    const dragged = pane() === start + 80 && localStorage.getItem(KEY) === String(start + 80) && onEdge();
    handle().focus();
    handle().dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true, cancelable: true }));
    const keyed = pane() === start + 64 && localStorage.getItem(KEY) === String(start + 64);
    const cap = Math.round(win().innerWidth * 0.4);
    drag(5000);
    handle().dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
    // a key at the cap stores the cap, not a width the pane never shows
    const capped = Math.abs(pane() - cap) <= 1 && localStorage.getItem(KEY) === String(cap);
    drag(-5000);
    const floored = pane() === 200 && localStorage.getItem(KEY) === '200';
    $('#sessionsToggle').click();
    // closed wins over the dragged width: the pane's column is gone (the pane itself keeps its 1px border)
    const closed = getComputedStyle($('.app-body')).gridTemplateColumns.startsWith('0px ') && getComputedStyle(handle()).display === 'none';
    $('#sessionsToggle').click();
    localStorage.setItem(KEY, String(start + 40));
    await loadShell();
    await until('the restored tabs', () => $$('.dock-tab').length === tabs);
    const reloaded = pane() === start + 40;
    // kept from a wider window: this one caps it
    localStorage.setItem(KEY, '5000');
    await loadShell();
    await until('the restored tabs', () => $$('.dock-tab').length === tabs);
    const cappedOnLoad = Math.abs(pane() - win().innerWidth * 0.4) <= 1;
    // a window just above the narrow layout: the pane leaves the chat and the open dock their room
    const midWidth = await withWidth('1000px', async () => {
      await until('the 1000px window', () => win().innerWidth === 1000 && getComputedStyle(handle()).display !== 'none');
      // measured before any key: the stored 5000 is capped by shell.css alone
      const fits = Math.abs(pane() - (1000 - 685)) <= 1 && $('#dock').getBoundingClientRect().right <= 1001;
      handle().focus();
      handle().dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
      return fits && localStorage.getItem(KEY) === String(1000 - 685);
    });
    localStorage.setItem(KEY, 'Infinity');
    await loadShell();
    await until('the restored tabs', () => $$('.dock-tab').length === tabs);
    const garbageIgnored = pane() === start;
    localStorage.removeItem(KEY);
    await loadShell();
    await until('the restored tabs', () => $$('.dock-tab').length === tabs);
    return edgeBefore && dragged && keyed && capped && floored && closed && reloaded && cappedOnLoad && midWidth && garbageIgnored
      && pane() === start;
  });

  await check('closing the last panel hides the dock', async () => {
    // one at a time: closing re-renders the tab bar
    while ($('.dock-tab')) $('.dock-tab [data-act="close"]').click();
    await until('the hidden dock', () => $('#dock').hidden && $('#dockResizer').hidden);
    return $$('iframe.panel-frame').length === 0 && getComputedStyle($('#dock')).display === 'none'
      && getComputedStyle($('#dockResizer')).display === 'none';
  });

  await check('a mangled stored layout does not stop the shell', async () => {
    localStorage.setItem('scarabhive.layout.v1', JSON.stringify({
      dockWidth: 'wide', active: 7,
      items: [null, { panelId: 5 }, { panelId: 'probe', place: 'float', path: ['?'], rect: { x: 'left' } }],
    }));
    await loadShell();
    const restored = await until('the probe window', () => $('#floatingLayer .app-window'));
    const ok = probeFrame().src.endsWith('/tests/ui/shell_probe_panel.html') && restored.getBoundingClientRect().width >= 320;
    restored.querySelector('[data-act="close"]').click();
    return ok;
  });

  await check('a failing catalogue leaves the chat working', async () => {
    cookie('stub_catalog', 'broken');
    try {
      await loadShell();
      $('#launcherButton').click();
      await until('the launcher message', () => $('#launcherList').textContent.includes('could not be loaded'));
      return win().selectorModule.agents().length === 2 && $$('.pk-toast--error').some((t) => t.textContent.includes('catalogue failed'));
    } finally {
      cookie('stub_catalog', null);
    }
  });

  await check('a signed-in user sees their account and can save the profile', async () => {
    // what the owner left open in this browser is not the account's layout
    localStorage.setItem('scarabhive.layout.v1', JSON.stringify({ items: [{ panelId: 'probe', place: 'dock' }] }));
    account('admin');
    await loadShell();
    const shown = $('#userMenuName').textContent === 'Ada Admin · admin' && !$('#logoutButton').hidden
      && $('#userInitials').textContent === 'AA' && $$('.dock-tab').length === 0;
    $('#userButton').click();
    $('#userMenu [data-open-panel="settings"]').click();
    const panel = await until('the profile', () => {
      const settings = panelFrame('/ui/panels/settings').contentDocument;
      return settings.getElementById('username').value === 'ada' && settings;
    });
    panel.getElementById('fullName').value = 'Ada Lovelace';
    panel.getElementById('profileForm').requestSubmit();
    await until('the saved toast', () => $$('.pk-toast--ok').some((t) => t.textContent.includes('Profile saved')));
    const patches = await (await stub('/__stub/patches')).json();
    return shown && patches.at(-1).full_name === 'Ada Lovelace' && panel.getElementById('noAccounts').hidden;
  });

  await check('the chat settings are kept on the account and apply to the chat at once', async () => {
    // The Settings panel saves each choice as it is clicked; the shell hands the saved
    // preferences to the chat, which shows what is on the page their way at once --
    // and a reload reads them back from the account, not from this browser.
    const panel = panelFrame('/ui/panels/settings').contentDocument;
    const radio = (name, value) => panel.querySelector(`#chatPreferences input[name="${name}"][value="${value}"]`);
    const thinkingShown = () => {
      const pre = $('#chat .step-thinking .thinking-content');
      return !!pre && !pre.hidden;
    };
    try {
      await until('the chat settings', () => !panel.getElementById('chatPreferences').hidden
        && radio('thinking', 'collapsed').checked, 3000);
      // a run read back, with a call that reasoned
      sessionButton('s-run', 'open').click();
      await until('the run session', () => $('#headerSessionId').textContent === 'A run read back');
      need(!(thinkingShown()), "thinkingShown()");
      radio('thinking', 'expanded').click();
      await until('the saved choice', async () => (await (await stub('/__stub/preference-puts')).json()).length === 1, 3000);
      const put = (await (await stub('/__stub/preference-puts')).json())[0];
      need(!(put.chat.thinking !== 'expanded' || put.chat.fold_steps !== 'at_end'), "put.chat.thinking !== 'expanded' || put.chat.fold_steps !== 'at_end'");
      await until('the chat following it', () => thinkingShown(), 2000);
      // read back from the account after a reload
      await loadShell();
      sessionButton('s-run', 'open').click();
      await until('the run session again', () => $('#headerSessionId').textContent === 'A run read back');
      await until('the kept choice', () => thinkingShown(), 3000);
      // asked each time: restored after the reload, the panel may still be loading its page
      const choice = (name, value) => panelFrame('/ui/panels/settings').contentDocument
        .querySelector(`#chatPreferences input[name="${name}"][value="${value}"]`);
      const pick = (value) => choice('sub_agents', value);
      await until('the settings again', () => pick('expanded')?.checked, 3000);
      // two choices inside one round trip: the second is kept with the first, not over it
      cookie('stub_preferences', 'slow');
      choice('fold_steps', 'never').click();
      choice('thinking', 'collapsed').click();
      await until('both saved', async () => (await (await stub('/__stub/preference-puts')).json()).length === 3, 4000);
      const kept = (await (await stub('/__stub/preference-puts')).json()).at(-1).chat;
      need(kept.fold_steps === 'never' && kept.thinking === 'collapsed', `the second choice undid the first: ${JSON.stringify(kept)}`);
      // a choice the account did not take is not shown as taken
      cookie('stub_preferences', 'fails');
      pick('collapsed').click();
      await until('the refusal', () => $$('.pk-toast').some((t) => t.textContent.includes('database is locked')), 3000);
      need(pick('expanded').checked && !pick('collapsed').checked, 'the refused choice still shows as chosen');
      // refused while the next click waits its turn: that one's save carries both, and the
      // radios are not put back under it
      cookie('stub_preferences', 'fails-once');
      choice('fold_steps', 'at_end').click();
      choice('thinking', 'expanded').click();
      await until('the save after the refusal', async () => (await (await stub('/__stub/preference-puts')).json()).length === 4, 4000);
      const after = (await (await stub('/__stub/preference-puts')).json()).at(-1).chat;
      return need(after.fold_steps === 'at_end' && after.thinking === 'expanded'
        && choice('fold_steps', 'at_end').checked && choice('thinking', 'expanded').checked,
      `a refused click undid the one after it: ${JSON.stringify(after)}`);
    } finally {
      cookie('stub_preferences', null);
      await stub('/__stub/preferences/reset', {});
    }
  });

  await check('logging out forgets the layout of the user who left', async () => {
    const before = localStorage.getItem('scarabhive.layout.v1:ada') !== null;
    $('#userButton').click();
    $('#logoutButton').click();
    await until('the forgotten layout', () => localStorage.getItem('scarabhive.layout.v1:ada') === null);
    const hits = await (await stub('/__stub/hits')).json();
    return before && hits.logout === 1 && localStorage.getItem('scarabhive.layout.v1') !== null;
  });

  await check('an expired or deactivated sign-in goes to the login page and comes back', async () => {
    const targets = [];
    let trap = false;
    for (const state of ['expired', 'inactive']) {
      account(state);
      await go('/?view=chat');
      await until(`the login page (${state})`, () => win().location.pathname === '/login' && $('form'));
      targets.push(new URLSearchParams(win().location.search).get('return'));
      // Back from the login page must not reach the shell that sends it there again
      trap ||= win().navigation.entries().some((entry) => entry.url.endsWith('/?view=chat'));
    }
    account('admin');
    await go(win().location.href);  // signed in again: the login page sends the user back
    await until('the shell again', () => win().location.pathname === '/' && $('#chat'));
    return targets.join(',') === '/,/' && !trap;
  });

  await check('a server failure at start is shown, not a dead page', async () => {
    account('broken');
    await go(`/?load=${performance.now()}`);
    await until('the startup error', () => $('#chat').textContent.includes('ScarabHive could not start'));
    return $('#chat').textContent.includes('database is locked') && $('#connectionState').textContent.includes('Offline');
  });

  await check('the login page returns only to this site', async () => {
    account('admin');
    // each is read by the browser's URL parser as a path starting with //, the start of another host
    for (const smuggled of ['/\t/evil.example', '/..//evil.example', '/%2e//evil.example', `//${location.host}//evil.example`]) {
      await go(`/login?return=${encodeURIComponent(smuggled)}`);
      await until(`a page of this site after ${JSON.stringify(smuggled)}`,
        () => win().location.pathname !== '/login' && win().location.host === location.host);
    }
    await go(`/login?return=${encodeURIComponent('/?from=login#chat')}`);
    await until('the shell with a local target', () => win().location.search === '?from=login');
    return win().location.hash === '#chat';
  });

  await check('without authentication the login page lets the owner straight in', async () => {
    account(null);
    await go('/login');
    await until('the shell', () => win().location.pathname === '/');
    return true;
  });

  account(null);
  await report();
</script>
</body>
</html>
