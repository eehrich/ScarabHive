<!doctype html>
<html class="pk-root" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>panel-kit.js tests</title>
  <link rel="stylesheet" href="/static/kit/kit.css">
</head>
<body>
<div class="pk-tabs" role="tablist" data-pk-tabs>
  <button class="pk-tab" role="tab" aria-selected="true" aria-controls="t-a" data-tab="a">A</button>
  <button class="pk-tab" role="tab" aria-selected="false" aria-controls="t-b" data-tab="b">B</button>
</div>
<div id="t-a" role="tabpanel">a</div>
<div id="t-b" role="tabpanel" hidden>b</div>
<!-- a row of page links too narrow for them, the current page last: wired at load (start); the short one is as wide
     as its text, so it moves the current page when Inter arrives after start -->
<div style="width: 140px"><nav class="pk-tabs" id="navRow"><a class="pk-tab" href="#first">First page</a><a class="pk-tab" href="#second">Second page</a><a class="pk-tab" href="#third">Third page</a><a class="pk-tab" href="#sql">SQL</a><a class="pk-tab" href="#here" aria-current="page">Current page</a></nav></div>
<script type="module">
  import * as pk from '/static/kit/panel-kit.js';

  const results = {};
  const check = async (name, fn) => {
    try { results[name] = (await fn()) === true ? 'ok' : 'failed'; }
    catch (error) { results[name] = `error: ${error}`; }
  };
  const nextFrame = () => new Promise((r) => setTimeout(r, 0));
  // Does a tab cut short keep five characters of its text and the ellipsis? The room from its first character to the
  // end of its box, against those six set in its font.
  const holdsFive = (box) => {
    const doc = box.ownerDocument;
    const walk = doc.createTreeWalker(box, NodeFilter.SHOW_TEXT, { acceptNode: (node) => node.data.trim() ? 1 : 3 });
    const text = walk.nextNode();
    const first = doc.createRange();
    first.setStart(text, text.data.search(/\S/));
    first.setEnd(text, text.data.search(/\S/) + 1);
    const style = doc.defaultView.getComputedStyle(box);
    const room = box.getBoundingClientRect().right - parseFloat(style.paddingRight) - first.getBoundingClientRect().left;
    const probe = doc.createElement('span');
    probe.style.cssText = `position: absolute; white-space: pre; font: ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
    probe.textContent = `${box.textContent.trim().slice(0, 5)}…`;
    doc.body.append(probe);
    const need = probe.getBoundingClientRect().width;
    probe.remove();
    return room >= need - 0.5;
  };
  // Is a whole tab no wider than its content -- a short label not padded out to the least width?
  const snug = (box) => {
    const doc = box.ownerDocument;
    const content = doc.createRange();
    content.selectNodeContents(box);
    const style = doc.defaultView.getComputedStyle(box);
    return box.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight) - content.getBoundingClientRect().width < 1;
  };

  await check('the toast region is there and open before the first toast, a live region a screen reader already knows', () => {
    const region = document.querySelector('.pk-toasts');  // no toast yet: this is the first check of the page
    return Boolean(region) && !region.childElementCount && region.matches(':popover-open')
      && region.getAttribute('role') === 'status' && region.getAttribute('aria-live') === 'polite';
  });

  await check('html escapes interpolated markup', () => {
    const out = String(pk.html`<p title="${'"><img src=x onerror=alert(1)>'}">${'<b>x</b>'}</p>`);
    return !out.includes('<img') && !out.includes('<b>') && out.includes('&quot;&gt;&lt;img');
  });

  await check('status draws a state as icon, tone and word, an unknown one as pending, and escapes what it shows', () => {
    const box = document.createElement('div');
    pk.render(box, pk.status('running', { label: true }));
    const running = box.firstElementChild;
    const labelled = running.className === 'pk-status pk-status--running'
      && running.querySelector('use').getAttribute('href').endsWith('#loader-circle')
      && running.textContent === 'Running' && running.querySelector('svg').getAttribute('aria-hidden') === 'true';
    pk.render(box, pk.status('odd<b>x</b>'));
    const odd = box.firstElementChild;
    const unknown = odd.classList.contains('pk-status--pending') && !box.querySelector('b')
      && odd.querySelector('svg').getAttribute('aria-label') === 'odd<b>x</b>' && odd.textContent === '';
    pk.render(box, pk.status('failed', { label: 'Broke', pill: true }));
    const own = box.firstElementChild.className === 'pk-status pk-status--failed pk-status--pill' && box.textContent === 'Broke';
    return labelled && unknown && own;
  });

  await check('html keeps nested html and joins arrays', () => {
    const items = ['<i>', 'b'].map((v) => pk.html`<li>${v}</li>`);
    return String(pk.html`<ul>${items}</ul>`) === '<ul><li>&lt;i&gt;</li><li>b</li></ul>';
  });

  await check('trusted markup passes unchanged', () => String(pk.html`${pk.trusted('<b>ok</b>')}`) === '<b>ok</b>');

  await check('jsonView escapes keys and strings', () => {
    const out = String(pk.jsonView({ '<k>': '<img src=x onerror=alert(1)>' }));
    return !out.includes('<img') && !out.includes('<k>') && out.includes('&lt;k&gt;');
  });

  await check('jsonView shows every level, strings as text with their line breaks, arrays as lists', () => {
    const box = document.createElement('div');
    document.body.appendChild(box);
    try {
      box.style.width = '600px';
      pk.render(box, pk.jsonView({ note: 'one\ntwo', nested: { deep: { n: 1 } }, list: ['x', { k: 'v' }], none: [], nil: null,
        short: 'beside', long: 'word '.repeat(30) }));
      const keyOf = (key) => [...box.querySelectorAll('.pk-json-key')].find((k) => k.textContent === key);
      const valueOf = (key) => keyOf(key).nextElementSibling;
      const note = valueOf('note');
      // a text starts on its key's line and wraps back to the left edge under the key -- no column right of the key
      const onKeyLine = (key) => Math.abs(valueOf(key).getClientRects()[0].top - keyOf(key).getBoundingClientRect().top) < 4;
      const flowsUnder = (key) => {
        const lines = valueOf(key).getClientRects();  // a line break may leave an empty fragment on the first line
        const last = lines[lines.length - 1];
        return onKeyLine(key) && last.top > lines[0].top && last.left <= keyOf(key).getBoundingClientRect().left + 1;
      };
      const indented = box.querySelector('.pk-json-field--nested > .pk-json-object');
      return note.textContent === 'one\ntwo' && getComputedStyle(note).whiteSpace === 'pre-wrap'
        && !box.querySelector('details') && keyOf('n').getClientRects().length > 0  // nothing folded away
        && getComputedStyle(indented).borderLeftWidth === '2px'
        && box.querySelectorAll(':scope .pk-json-list > li').length === 2
        && box.textContent.includes('no items') && !box.textContent.includes('"')  // strings without quotes
        && onKeyLine('short') && valueOf('short').getClientRects().length === 1
        && flowsUnder('note') && flowsUnder('long');
    } finally {
      box.remove();
    }
  });

  await check('yamlCode keeps the text and colours keys, values, comments, a block over blank lines and a quote over lines', () => {
    const text = [
      '# head',
      'name: "The <Night>"   # quoted',
      'count: 3',
      'on: true',
      'tools:',
      "  - '!files/*'",
      '  - !web/*',
      '  - plain text # note',
      'prompt: |',
      '  first line',
      '',
      '  key: after a blank line',
      '    deeper',
      'flow: [a, "b", {c: 1}]',
      'long: "runs',
      '  on: here"',
      'next: &anchor x',
      'url: http://host:80/a',
      '  - item: |',
      '      text',
      '    other: 1',
      '- - |-',
      '    in a list',
      '  - *anchor',
      "quote: 'it''s # not a comment'",
    ].join('\n');
    const box = document.createElement('pre');
    // a long run of spaces costs no more than a long line
    const started = performance.now();
    pk.yamlCode(`x${' '.repeat(30000)}y\nk: [x${' '.repeat(30000)}y]`);
    const fast = performance.now() - started < 100;
    pk.render(box, pk.yamlCode(text));
    const keyOf = (line) => {
      pk.render(box, pk.yamlCode(line));
      return box.querySelector('.pk-yaml-key')?.textContent;
    };
    const odd = ['a: [x\u2028y]', '{k\u2029v: 1}', '[  ,  ]', 'a#b: c'];
    const kinds = (kind) => JSON.stringify([...box.querySelectorAll(`.pk-yaml-${kind}`)].map((one) => one.textContent));
    const same = (kind, list) => kinds(kind) === JSON.stringify(list);
    return box.textContent === text && !box.innerHTML.includes('<Night>')
      && same('key', ['name', 'count', 'on', 'tools', 'prompt', 'flow', 'c', 'long', 'next', 'url', 'item', 'other', 'quote'])
      && same('string', ['"The <Night>"', "'!files/*'", '  first line', '  key: after a blank line', '    deeper', '"b"',
        '"runs', '  on: here"', '      text', '    in a list', "'it''s # not a comment'"])
      && same('comment', ['# head', '# quoted', '# note'])
      && same('number', ['3', '1', '1']) && same('word', ['true']) && same('tag', ['!web/*'])
      && same('anchor', ['&anchor', '*anchor'])
      && box.querySelectorAll('.pk-yaml-punct').length === 29
      && String(pk.yamlCode('')) === '' && String(pk.yamlCode(null)) === ''
      && odd.every((one) => pk.render(box, pk.yamlCode(one)) === undefined && box.textContent === one)
      && keyOf('a#b: c') === 'a#b' && keyOf('a\u00a0b: c') === 'a\u00a0b' && keyOf('{a\u00a0b: c}') === 'a\u00a0b' && fast;
  });

  await check('native confirm is refused, not blocking', () => window.confirm('x') === false);

  await check('a dialog resolves with the pressed action', async () => {
    const answer = pk.confirm('Delete?', { danger: true });
    await nextFrame();
    const dialog = document.querySelector('dialog.pk-dialog[open]');
    dialog.querySelector('.pk-btn--danger').click();
    return (await answer) === true && !document.querySelector('dialog.pk-dialog');
  });

  await check('a prompt resolves with the typed text', async () => {
    const answer = pk.prompt('Name?', { value: 'old' });
    await nextFrame();
    const field = document.querySelector('dialog.pk-dialog[open] input[name="value"]');
    field.value = 'new name';
    document.querySelector('dialog.pk-dialog[open] .pk-btn--primary').click();
    return (await answer) === 'new name';
  });

  await check('dismissing a dialog resolves null', async () => {
    const answer = pk.alert('Hi');
    await nextFrame();
    document.querySelector('dialog.pk-dialog[open]').close();
    return (await answer) === null;
  });

  await check('tabs switch their panels', () => {
    document.querySelector('[data-tab="b"]').click();
    return document.getElementById('t-a').hidden && !document.getElementById('t-b').hidden
      && document.querySelector('[data-tab="b"]').getAttribute('aria-selected') === 'true';
  });

  await check('the arrow keys pass over a hidden tab', () => {
    const box = document.createElement('div');
    box.innerHTML = `<div class="pk-tabs" role="tablist" data-pk-tabs>
      <button class="pk-tab" role="tab" aria-selected="true" aria-controls="h-a" data-tab="a">A</button>
      <button class="pk-tab" role="tab" aria-selected="false" aria-controls="h-b" data-tab="b" hidden>B</button>
      <button class="pk-tab" role="tab" aria-selected="false" aria-controls="h-c" data-tab="c">C</button></div>
      <div id="h-a" role="tabpanel">a</div><div id="h-b" role="tabpanel" hidden>b</div><div id="h-c" role="tabpanel" hidden>c</div>`;
    document.body.append(box);
    pk.initTabs(box);
    const press = (key) => box.querySelector('[aria-selected="true"]').dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    press('ArrowRight');
    const onward = box.querySelector('[aria-selected="true"]').dataset.tab === 'c' && box.querySelector('#h-b').hidden;
    press('ArrowRight');
    const round = box.querySelector('[aria-selected="true"]').dataset.tab === 'a';
    press('ArrowLeft');
    const back = box.querySelector('[aria-selected="true"]').dataset.tab === 'c';
    box.querySelector('[data-tab="a"]').hidden = true;
    box.querySelector('[data-tab="c"]').hidden = false;
    let told = 0;
    box.addEventListener('tabchange', () => { told += 1; });
    press('ArrowRight');
    box.remove();
    return onward && round && back && told === 0;
  });

  await check('tabs are as wide as their text while they fit, give way down to five characters, then the row scrolls; the wheel turns it and a chosen tab comes into sight', async () => {
    await document.fonts.load('500 13px Inter');  // the widths below are Inter's: with a stand-in font they measure that one
    const box = document.createElement('div');
    const labels = ['Running requests', 'Tool servers and their state', '<span class="pk-dot"></span> Machines',
      '<svg class="pk-icon"></svg> LLM requests per session', 'Settings', 'SQL'];
    box.innerHTML = `<div class="pk-tabs" role="tablist" data-pk-tabs>${labels.map((label, i) =>
      `<button class="pk-tab" role="tab" aria-selected="${i === 0}" data-tab="w${i}">${label} <span class="pk-tab-count">${i}</span></button>`).join('')}</div>`;
    document.body.append(box);
    const list = box.firstElementChild;
    const tabs = [...list.children];
    const whole = (tab) => tab.scrollWidth <= tab.clientWidth;
    try {
      pk.initTabs(box);
      box.style.width = '2000px';
      const wide = tabs.every((tab) => whole(tab) && snug(tab)) && list.scrollWidth <= list.clientWidth;
      box.style.width = `${Math.round(tabs.reduce((sum, tab) => sum + tab.offsetWidth, 0) * 0.7)}px`;
      const giving = !tabs.every(whole) && list.scrollWidth <= list.clientWidth;
      box.style.width = '120px';
      // the long labels are cut down to five characters, the short one (SQL) keeps its own width
      const short = tabs.at(-1);
      const scrolling = list.scrollWidth > list.clientWidth && tabs.slice(0, -1).every((tab) => !whole(tab) && holdsFive(tab))
        && whole(short) && snug(short);
      const wheel = new WheelEvent('wheel', { deltaY: 100, bubbles: true, cancelable: true });
      list.dispatchEvent(wheel);
      const turned = list.scrollLeft > 0 && wheel.defaultPrevented;
      tabs.at(-1).click();
      const last = tabs.at(-1).getBoundingClientRect();
      const row = list.getBoundingClientRect();
      const inSight = last.left >= row.left - 0.5 && last.right <= row.right + 0.5;
      // at its end the row lets the wheel go on to the page, and Ctrl+wheel stays the browser's zoom
      list.scrollLeft = list.scrollWidth;
      const atEnd = new WheelEvent('wheel', { deltaY: 100, bubbles: true, cancelable: true });
      list.dispatchEvent(atEnd);
      list.scrollLeft = 0;
      const zoom = new WheelEvent('wheel', { deltaY: 100, ctrlKey: true, bubbles: true, cancelable: true });
      list.dispatchEvent(zoom);
      const handsOn = !atEnd.defaultPrevented && !zoom.defaultPrevented && list.scrollLeft === 0;
      // a tab cut short says its whole text on hover
      tabs[1].dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
      const told = tabs[1].title === 'Tool servers and their state 1';
      return wide && giving && scrolling && turned && inSight && handsOn && told;
    } finally {
      box.remove();
    }
  });

  await check('a tab row in a column short of room keeps its height', () => {
    const box = document.createElement('div');
    box.style.cssText = 'display: flex; flex-direction: column; max-height: 120px; overflow: auto; width: 300px';
    box.innerHTML = `<div class="pk-tabs" role="tablist" data-pk-tabs><button class="pk-tab" role="tab" aria-selected="true">One</button>
      <button class="pk-tab" role="tab" aria-selected="false">Two</button></div><div style="height: 600px; flex-shrink: 0"></div>`;
    document.body.append(box);
    try {
      pk.initTabs(box);
      const list = box.firstElementChild;
      return list.offsetHeight >= list.firstElementChild.offsetHeight && list.firstElementChild.offsetHeight > 0;
    } finally {
      box.remove();
    }
  });

  await check('scrollerOf finds the box that scrolls an element up and down, else the page', () => {
    const outer = document.createElement('div');
    outer.style.cssText = 'height: 100px; overflow: auto';
    outer.innerHTML = '<div style="overflow: visible"><p>inside</p></div><div style="height: 300px"></div>';
    // set to scroll, but as tall as what it holds: it does not scroll, the page does
    const grown = document.createElement('div');
    grown.style.cssText = 'overflow: auto';
    grown.innerHTML = '<p>grown</p>';
    const loose = document.createElement('p');
    document.body.append(outer, grown, loose);
    try {
      return pk.scrollerOf(outer.querySelector('p')) === outer
        && pk.scrollerOf(grown.querySelector('p')) === document.scrollingElement
        && pk.scrollerOf(loose) === document.scrollingElement;
    } finally {
      outer.remove(); grown.remove(); loose.remove();
    }
  });

  await check('keepInSight brings an item into sight in a list that scrolls up and down, and in the page itself', () => {
    const list = document.createElement('div');
    list.style.cssText = 'height: 100px; overflow: auto; width: 200px';
    list.innerHTML = '<div style="height: 400px"></div><div style="height: 20px">far</div><div style="height: 400px"></div>';
    const tall = document.createElement('div');
    tall.style.cssText = 'height: 3000px';
    const deep = document.createElement('div');
    deep.textContent = 'deep';
    document.body.append(list, tall, deep);
    const page = document.scrollingElement;
    const before = page.scrollTop;
    try {
      const far = list.children[1];
      pk.keepInSight(list, far);
      const inList = list.scrollTop > 0 && far.getBoundingClientRect().bottom <= list.getBoundingClientRect().bottom + 0.5;
      pk.keepInSight(page, deep);  // the page's box is the viewport, not the whole document
      const shown = deep.getBoundingClientRect();
      const inPage = page.scrollTop > before && shown.top >= -0.5 && shown.bottom <= innerHeight + 0.5;
      return inList && inPage;
    } finally {
      list.remove(); tall.remove(); deep.remove();
      page.scrollTop = before;
    }
  });

  await check('a row of page links scrolls as tabs do: its current page in sight from the start, the wheel turns it', async () => {
    await document.fonts.ready;  // the page as it stands once Inter is in
    await nextFrame();
    const nav = document.getElementById('navRow');
    const here = nav.querySelector('[aria-current="page"]').getBoundingClientRect();
    const row = nav.getBoundingClientRect();
    const inSight = nav.scrollWidth > nav.clientWidth && nav.scrollLeft > 0
      && here.left >= row.left - 0.5 && here.right <= row.right + 0.5;
    nav.scrollLeft = 0;
    const wheel = new WheelEvent('wheel', { deltaY: 60, bubbles: true, cancelable: true });
    nav.dispatchEvent(wheel);
    return inSight && nav.scrollLeft > 0 && wheel.defaultPrevented;
  });

  await check('autoRefresh starts and stops', () => {
    const control = pk.autoRefresh(() => {}, 1000);
    control.start();
    const started = control.running;
    control.stop();
    return started && !control.running;
  });

  await check('api turns an HTTP error into ApiError', async () => {
    try {
      await pk.api('/static/kit/does-not-exist.json', { quiet: true });
      return false;
    } catch (error) {
      return error instanceof pk.ApiError && error.status === 404;
    }
  });

  await check('overlays cast a shadow', () => {
    const menu = document.createElement('div');
    menu.className = 'pk-menu';
    document.body.appendChild(menu);
    const shadow = getComputedStyle(menu).boxShadow;
    menu.remove();
    return shadow !== 'none' && shadow !== '';
  });

  await check('an empty tab list does not break the kit', () => {
    const list = document.createElement('div');
    list.setAttribute('data-pk-tabs', '');
    document.body.appendChild(list);
    pk.initTabs();
    return true;
  });

  await check('tabs are wired once however often initTabs runs', () => {
    let changes = 0;
    const list = document.querySelector('[data-pk-tabs][role="tablist"]');
    list.addEventListener('tabchange', () => { changes += 1; });
    pk.initTabs();
    document.querySelector('[data-tab="a"]').click();
    return changes === 1;
  });

  await check('pk-refresh falls back to a sane interval', () => {
    const control = document.createElement('pk-refresh');
    control.setAttribute('interval', '0');
    document.body.appendChild(control);
    // off by default: the interval it would refresh at is in the title, the pill says off
    const title = control.querySelector('[data-act="auto"]').title;
    control.remove();
    return title.includes('5s');
  });

  await check('icon escapes its size', () => !String(pk.icon('bug', { size: '"><img src=x>' })).includes('<img'));

  await check('api reports a broken body like any other failure', async () => {
    const before = document.querySelectorAll('.pk-toast').length;
    try {
      await pk.api('/tests/ui/kit_broken.json');
      return false;
    } catch (error) {
      return error instanceof SyntaxError && document.querySelectorAll('.pk-toast').length === before + 1;
    }
  });

  await check('a frame that is not the shell answers dialogs itself', () => new Promise((resolve) => {
    window.addEventListener('message', (event) => {
      if (event.data && event.data.probe === 'frame') resolve(event.data.ok === true);
    });
    const frame = document.createElement('iframe');
    frame.src = '/tests/ui/kit_frame_probe.html';
    document.body.appendChild(frame);
  }));

  await check('tabs rendered later still switch', () => {
    const list = document.querySelector('[data-pk-tabs][role="tablist"]');
    list.insertAdjacentHTML('beforeend', '<button class="pk-tab" role="tab" aria-selected="false" aria-controls="t-c" data-tab="c">C</button>');
    document.body.insertAdjacentHTML('beforeend', '<div id="t-c" role="tabpanel" hidden>c</div>');
    document.querySelector('[data-tab="c"]').click();
    return !document.getElementById('t-c').hidden && document.getElementById('t-a').hidden;
  });

  await check('the handshake delivers early calls and visibility', () => new Promise((resolve) => {
    const seen = [];
    let frame;
    let held = false;
    window.addEventListener('message', (event) => {
      if (!frame || event.source !== frame.contentWindow) return;
      const m = event.data || {};
      if (m.type === 'pk:ready') {
        seen.push('ready');
        setTimeout(() => {  // a late answer: what the panel says meanwhile has to wait for it
          held = seen.length === 1;
          frame.contentWindow.postMessage({ type: 'pk:init', theme: 'dark', visible: false, session: null }, location.origin);
        }, 50);
      } else if (m.type === 'pk:title' || m.type === 'pk:navigate') {
        seen.push(m.type === 'pk:title' ? m.text : m.path);
        // the last held call: by now the panel has taken the answer's visibility too
        if (m.path === '/early/path') resolve(held && seen.includes('Early title') && frame.contentWindow.probeVisible() === false);
      }
    });
    frame = document.createElement('iframe');
    frame.src = '/tests/ui/kit_shell_probe.html';
    document.body.appendChild(frame);
    setTimeout(() => resolve(false), 5000);  // a call held for good
  }));

  await check('a tick missed while the panel was out of sight is caught up once it is back', () => new Promise((resolve) => {
    // Nothing happened on coming back: the panel showed what it knew when it went away
    // until its next tick, and a click on refresh looked like what made auto-refresh work.
    let frame;
    const done = (ok) => { if (frame) frame.remove(); resolve(ok); };
    window.addEventListener('message', async function onReady(event) {
      if (!frame || event.source !== frame.contentWindow || (event.data || {}).type !== 'pk:ready') return;
      window.removeEventListener('message', onReady);
      const panel = frame.contentWindow;
      panel.postMessage({ type: 'pk:init', theme: 'light', visible: false, session: null }, location.origin);
      await new Promise((r) => setTimeout(r, 50));
      const timer = panel.startTicking(1000);
      await new Promise((r) => setTimeout(r, 1300));      // one tick, while hidden
      const whileHidden = panel.ticks;
      panel.postMessage({ type: 'pk:visibility', visible: true }, location.origin);
      await new Promise((r) => setTimeout(r, 150));       // long before the next tick
      const onReturn = panel.ticks;
      await new Promise((r) => setTimeout(r, 700));       // past the old beat's tick at 2 s
      const once = panel.ticks;

        && form.querySelector('legend').textContent === 'Icon';
      return picked && clicked && fallback && named;
    } finally {
      form.remove();
    }
  });

  const editTable = (rows) => pk.html`<table class="pk-table" data-pk-edit data-pk-select><thead><tr><th>Label</th><th class="pk-num">Amount</th></tr></thead>
    <tbody>${rows.map(([id, label, amount]) => pk.html`<tr data-id="${id}">
      <td data-edit="label" data-value="${label}">${label}</td>
      <td class="pk-num" data-edit="amount" data-type="number" data-min="0" data-value="${amount}">${amount} €</td></tr>`)}</tbody></table>`;
  const key = (target, name, extra = {}) => target.dispatchEvent(new KeyboardEvent('keydown', { key: name, bubbles: true, cancelable: true, ...extra }));

  await check('an editable cell opens on a click, Enter hands a number on as a number, Escape drops what was typed', async () => {
    const box = document.createElement('div');
    document.body.append(box);
    try {
      pk.render(box, editTable([['r1', 'Miete', '1200']]));
      const edits = [];
      box.querySelector('table').addEventListener('celledit', (event) => edits.push(event.detail));
      let chosen = 0;
      box.querySelector('table').addEventListener('rowselect', () => { chosen += 1; });
      const cell = () => box.querySelector('td[data-edit="amount"]');
      cell().click();
      const input = cell().querySelector('input');
      const opened = document.activeElement === input && input.type === 'number' && input.value === '1200'
        && input.getAttribute('aria-label') === 'Amount' && chosen === 0;  // the cell's click, not the row's
      input.value = '1500';
      key(input, 'Enter');
      const taken = edits.length === 1 && edits[0].id === 'r1' && edits[0].field === 'amount' && edits[0].value === 1500
        && edits[0].previous === 1200 && cell().textContent === '1500' && document.activeElement === cell();
      key(cell(), 'F2');
      cell().querySelector('input').value = '9';
      key(cell().querySelector('input'), 'Escape');
      const dropped = edits.length === 1 && cell().textContent === '1500' && !cell().querySelector('input');
      // typing opens the cell empty and lets the key go on into it (a synthetic key types nothing: the input stays empty)
      const passed = key(cell(), '7');
      const typed = passed && document.activeElement === cell().querySelector('input') && cell().querySelector('input').value === '';
      key(cell().querySelector('input'), 'Escape');
      if (!(opened && taken && dropped && typed)) throw new Error(JSON.stringify({ opened, taken, dropped, typed, edits: edits.map((e) => [e.value, e.previous]), text: cell().textContent, active: document.activeElement?.tagName }));
      return true;
    } finally {
      box.remove();
    }
  });

  await check('Tab takes the cell and opens the next one, the arrows move between cells, a rejected save puts the old value back', async () => {
    const box = document.createElement('div');
    document.body.append(box);
    try {
      pk.render(box, editTable([['r1', 'Miete', '1200'], ['r2', 'Strom', '80']]));
      box.querySelector('table').addEventListener('celledit', (event) => event.detail.wait(Promise.reject(new Error('409'))));
      const first = box.querySelector('tr[data-id="r1"] td[data-edit="label"]');
      first.click();
      first.querySelector('input').value = 'Büro';
      key(first.querySelector('input'), 'Tab');
      const next = box.querySelector('tr[data-id="r1"] td[data-edit="amount"]');
      const moved = document.activeElement === next.querySelector('input');
      key(next.querySelector('input'), 'Escape');
      await new Promise((r) => setTimeout(r, 0));  // the rejection settles
      const restored = first.textContent.trim() === 'Miete' && first.dataset.value === 'Miete';
      key(next, 'ArrowDown');
      const down = document.activeElement === box.querySelector('tr[data-id="r2"] td[data-edit="amount"]');
      key(document.activeElement, 'ArrowLeft');
      const left = document.activeElement === box.querySelector('tr[data-id="r2"] td[data-edit="label"]');
      return moved && restored && down && left;
    } finally {
      box.remove();
    }
  });

  await check('a cell below its minimum stays open on Enter; while a cell is open update() waits and draws when it closes', async () => {
    const box = document.createElement('div');
    document.body.append(box);
    try {
      pk.update(box, editTable([['r1', 'Miete', '1200']]));
      const cell = box.querySelector('td[data-edit="amount"]');
      cell.click();
      const input = cell.querySelector('input');
      input.value = '-5';
      key(input, 'Enter');
      const kept = cell.querySelector('input') === input;
      input.value = '1300';
      const held = pk.update(box, editTable([['r1', 'Neu', '1200']])) === false && box.querySelector('td[data-edit="label"]').textContent === 'Miete';
      key(input, 'Escape');
      const drawn = box.querySelector('td[data-edit="label"]').textContent === 'Neu';
      return kept && held && drawn;
    } finally {
      box.remove();
    }
  });

  await check('a select cell offers its options and shows the label of the one picked', async () => {
    const box = document.createElement('div');
    document.body.append(box);
    try {
      pk.render(box, pk.html`<table class="pk-table" data-pk-edit><tbody><tr data-id="r1">
        <td data-edit="kind" data-type="select" data-options='[["fixed","Festbetrag"],["qty","Menge × Preis"]]' data-value="fixed">Festbetrag</td>
      </tr></tbody></table>`);
      let edit = null;
      box.querySelector('table').addEventListener('celledit', (event) => { edit = event.detail; });
      const cell = box.querySelector('td');
      cell.click();
      const select = cell.querySelector('select');
      const offered = [...select.options].map((o) => o.textContent).join('|') === 'Festbetrag|Menge × Preis' && select.value === 'fixed';
      select.value = 'qty';
      key(select, 'Enter');
      return offered && edit?.value === 'qty' && edit.previous === 'fixed' && cell.textContent === 'Menge × Preis';
    } finally {
      box.remove();
    }
  });

  await check('a held-back draw comes before the value taken, and a draw that went stale meanwhile is dropped', async () => {
    const box = document.createElement('div');
    document.body.append(box);
    try {
      const edits = [];
      box.addEventListener('celledit', (event) => edits.push(event.detail));
      pk.update(box, editTable([['r1', 'Miete', '1200']]));
      const amount = () => box.querySelector('td[data-edit="amount"]');
      amount().click();
      amount().querySelector('input').value = '1300';
      pk.update(box, editTable([['r1', 'Neu', '1200']]));  // held back: made before this edit
      key(amount().querySelector('input'), 'Enter');
      const fresh = box.querySelector('td[data-edit="label"]').textContent === 'Neu' && amount().textContent === '1300'
        && amount().dataset.value === '1300' && edits.length === 1 && edits[0].value === 1300;
      pk.update(box, editTable([['r1', 'A', '1']]));
      amount().click();
      pk.update(box, editTable([['r1', 'B', '1']]));  // held back
      pk.update(box, editTable([['r1', 'A', '1']]));  // the same as shown again: B is stale
      key(amount().querySelector('input'), 'Escape');
      const stale = box.querySelector('td[data-edit="label"]').textContent === 'A';
      return fresh && stale;
    } finally {
      box.remove();
    }
  });

  await check('a required cell refuses empty, an unchanged odd value is not handed on, a hidden cell is skipped by Tab', async () => {
    const box = document.createElement('div');
    document.body.append(box);
    try {
      const edits = [];
      pk.render(box, pk.html`<table class="pk-table" data-pk-edit="t"><tbody><tr data-id="r1">
        <td data-edit="a" data-type="number" data-required data-value="5">5</td>
        <td data-edit="hidden" style="display: none" data-value="x">x</td>
        <td data-edit="d" data-type="date" data-value="not a date">not a date</td></tr></tbody></table>`);
      box.addEventListener('celledit', (event) => edits.push(event.detail));
      const [a, , d] = box.querySelectorAll('td');
      a.click();
      a.querySelector('input').value = '';
      key(a.querySelector('input'), 'Enter');
      const refused = !!a.querySelector('input');
      a.querySelector('input').value = '5';
      key(a.querySelector('input'), 'Tab');
      const skipped = document.activeElement === d.querySelector('input');
      key(d.querySelector('input'), 'Enter');  // opened as '' (not a date), left as it was: no change
      return refused && skipped && edits.length === 0 && d.textContent === 'not a date';
    } finally {
      box.remove();
    }
  });

  await check('a save rejected while its cell is open again leaves the open input alone; two tables keep their keys apart', async () => {
    const box = document.createElement('div');
    document.body.append(box);
    try {
      let reject;
      pk.render(box, pk.html`${editTable([['r1', 'Miete', '1200']])}<table class="pk-table" data-pk-edit="other"><tbody>
        <tr data-id="r1"><td data-edit="label" data-value="Zweite">Zweite</td></tr></tbody></table>`);
      const [first, second] = box.querySelectorAll('table');
      first.addEventListener('celledit', (event) => event.detail.wait(new Promise((_, no) => { reject = no; })));
      const cell = first.querySelector('td[data-edit="label"]');
      cell.click();
      cell.querySelector('input').value = 'Büro';
      key(cell.querySelector('input'), 'Enter');
      cell.click();  // open again while the save runs
      reject(new Error('400'));
      await new Promise((r) => setTimeout(r, 0));
      const kept = !!cell.querySelector('input');
      key(cell.querySelector('input'), 'Escape');
      const other = second.querySelector('td');
      other.click();
      key(other.querySelector('input'), 'Escape');
      return kept && document.activeElement === other;
    } finally {
      box.remove();
    }
  });

  await check('a cell left by a mouse press draws after the click, so the click lands on what was under the pointer', async () => {
    const box = document.createElement('div');
    document.body.append(box);
    try {
      const edits = [];
      box.addEventListener('celledit', (event) => {  // a save that has not answered yet
        edits.push(event.detail.value);
        event.detail.wait(new Promise(() => {}));
      });
      pk.update(box, editTable([['r1', 'Miete', '1200']]));
      const cell = box.querySelector('td[data-edit="amount"]');
      cell.click();
      cell.querySelector('input').value = '1300';
      pk.update(box, editTable([['r1', 'Neu', '1200']]));  // held back while the cell is open
      const label = box.querySelector('td[data-edit="label"]');
      await new Promise((r) => setTimeout(r, 0));  // the opening click's own release is through
      document.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
      cell.querySelector('input').blur();  // the press takes the focus away: the cell closes
      // handed on at once (a dialog the click opens sees its save), but not yet drawn: the click still finds it
      const untouched = label.isConnected && edits.join() === '1300';
      window.dispatchEvent(new PointerEvent('pointerup'));  // released anywhere: the window hears it
      await new Promise((r) => setTimeout(r, 0));
      const drawn = !label.isConnected && box.querySelector('td[data-edit="label"]').textContent === 'Neu'
        && box.querySelector('td[data-edit="amount"]').textContent === '1300' && edits.join() === '1300';
      // a press whose release never came (outside the window) counts no more after a second: no draw waits for it
      document.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
      const realNow = performance.now.bind(performance);
      performance.now = () => realNow() + 5000;
      try {
        const again = box.querySelector('td[data-edit="amount"]');
        again.click();
        pk.update(box, editTable([['r1', 'Veraltet', '1300']]));  // held back while it is open
        again.querySelector('input').value = '1400';
        again.querySelector('input').blur();
      } finally {
        performance.now = realNow;
      }
      const stale = edits.join() === '1300,1400' && box.querySelector('td[data-edit="label"]').textContent === 'Veraltet';
      return untouched && drawn && stale;
    } finally {
      box.remove();
    }
  });

  await check('stat draws a figure with its label, value, sub-line and tone, a button only to click or toggle, and escapes what it shows', () => {
    const box = document.createElement('div');
    pk.render(box, pk.stat('<b>Open</b>', 0, { key: 'open', sub: '3 new', hint: 'All open', tone: 'warn' }));
    const figure = box.firstElementChild;
    const value = figure.querySelector('.pk-stat-value');
    const drawn = figure.tagName === 'DIV' && figure.className === 'pk-stat' && figure.dataset.stat === 'open'
      && figure.dataset.key === 'open' && figure.title === 'All open' && !box.querySelector('b')
      && figure.querySelector('.pk-stat-label').textContent === '<b>Open</b>'
      && value.textContent === '0' && value.classList.contains('pk-text--warn')
      && figure.querySelector('.pk-stat-sub').textContent === '3 new';
    pk.render(box, pk.stat('Open', 3, { pressed: false }));
    const off = box.firstElementChild;
    const toggleOff = off.tagName === 'BUTTON' && off.type === 'button' && off.getAttribute('aria-pressed') === 'false'
      && !off.hasAttribute('data-stat') && !off.hasAttribute('title') && !box.querySelector('.pk-stat-sub');
    pk.render(box, pk.stat('Open', 3, { pressed: true }));
    const toggleOn = box.firstElementChild.getAttribute('aria-pressed') === 'true';
    pk.render(box, pk.stat('Open', 3, { onClickable: true }));
    const plainButton = box.firstElementChild.tagName === 'BUTTON' && !box.firstElementChild.hasAttribute('aria-pressed');
    pk.render(box, pk.stat('Open', 3, { key: '"><img src=x>', hint: '"><img src=y>' }));
    const escaped = !box.querySelector('img') && box.firstElementChild.dataset.stat === '"><img src=x>'
      && box.firstElementChild.title === '"><img src=y>';
    return drawn && toggleOff && toggleOn && plainButton && escaped;
  });

  await check('dueBadge says overdue, soon or later against a fixed clock, a date is due by its end, in the page language', () => {
    const declared = document.documentElement.lang;
    const now = Date.parse('2026-11-02T12:00:00Z');
    const day = 86400e3;
    const box = document.createElement('div');
    const draw = (at, options = {}) => {
      pk.render(box, pk.dueBadge(at, { now, ...options }));
      return box.firstElementChild;
    };
    try {
      document.documentElement.lang = 'en';
      const over = draw('2026-10-30T12:00:00Z');
      const soon = draw(new Date(now + 2 * day));
      const later = draw(now + 30 * day);
      const english = over.classList.contains('pk-badge--danger') && over.dataset.due === 'overdue'
        && over.textContent === 'overdue 3 days ago' && over.title !== ''
        && soon.classList.contains('pk-badge--warn') && soon.dataset.due === 'soon' && soon.textContent === 'due in 2 days'
        && later.className === 'pk-badge' && later.dataset.due === 'later' && later.textContent === 'due in 30 days';
      const widened = draw(now + 30 * day, { soon: 60 * day }).dataset.due === 'soon';
      const endOfDay = draw('2026-11-02').dataset.due === 'soon';  // today: due by midnight, not overdue since its start
      const own = draw(now - day, { words: { overdue: 'expired' } }).textContent === 'expired yesterday';
      pk.render(box, pk.dueBadge(''));
      const none = box.innerHTML === '' && String(pk.dueBadge('not a date')) === '';
      document.documentElement.lang = 'de';
      const german = draw('2026-10-30T12:00:00Z').textContent === 'überfällig vor 3 Tagen'
        && draw(now + 2 * day).textContent === 'fällig übermorgen';
      return english && widened && endOfDay && own && none && german;
    } finally {
      document.documentElement.lang = declared;
    }
  });

  await check('a countdown ticks every second only while the panel is in sight, on one timer that stops when the last one goes', () => new Promise((resolve) => {
    let frame;
    const done = (ok) => { if (frame) frame.remove(); resolve(ok); };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    window.addEventListener('message', async function onReady(event) {
      if (!frame || event.source !== frame.contentWindow || (event.data || {}).type !== 'pk:ready') return;
      window.removeEventListener('message', onReady);
      const panel = frame.contentWindow;
      panel.postMessage({ type: 'pk:init', theme: 'light', visible: false, session: null }, location.origin);
      await wait(50);
      const ahead = panel.addCountdown(new Date(Date.now() + 3600e3).toISOString());
      const past = panel.addCountdown(new Date(Date.now() - 5000).toISOString());
      await wait(1300);
      const quietWhileHidden = ahead.textContent === '' && past.textContent === '' && panel.liveIntervals.size === 0;
      panel.postMessage({ type: 'pk:visibility', visible: true }, location.origin);
      await wait(100);
      const atOnce = /^00:59:5\d left$/.test(ahead.textContent) && /^overdue by 00:00:0\d$/.test(past.textContent)
        && past.hasAttribute('data-pk-overdue') && !ahead.hasAttribute('data-pk-overdue');
      const shown = ahead.textContent;
      await wait(1100);
      const ticked = ahead.textContent !== shown && panel.liveIntervals.size === 1;  // one timer for both
      panel.postMessage({ type: 'pk:visibility', visible: false }, location.origin);
      await wait(50);
      const frozen = ahead.textContent;
      const stoppedHidden = panel.liveIntervals.size === 0;
      await wait(1200);
      const stillFrozen = ahead.textContent === frozen;
      panel.postMessage({ type: 'pk:visibility', visible: true }, location.origin);
      await wait(100);
      const backAgain = ahead.textContent !== frozen && panel.liveIntervals.size === 1;
      ahead.remove();
      past.remove();
      await wait(100);
      const stoppedEmpty = panel.liveIntervals.size === 0;
      done(quietWhileHidden && atOnce && ticked && stoppedHidden && stillFrozen && backAgain && stoppedEmpty);
    });
    frame = document.createElement('iframe');
    frame.src = '/tests/ui/kit_shell_probe.html';
    document.body.appendChild(frame);
    setTimeout(() => done(false), 8000);
  }));

  await check('folderPicker lists folders, moves and opens with the keys, goes up, says a refusal in the dialog, and resolves the choice or null', async () => {
    const realFetch = window.fetch;
    const asked = [];
    const tree = { '': [['/r', '/r']], '/r': [['a', '/r/a'], ['b', '/r/b']], '/r/a': [] };
    window.fetch = async (address) => {
      const path = new URL(address, location.href).searchParams.get('path');
      asked.push(path);
      const answer = (status, body) => ({ ok: status === 200, status, statusText: 'Unprocessable',
        headers: new Headers({ 'content-type': 'application/json' }), json: async () => body });
      if (path === '/r/b') return answer(422, { detail: '/r/b is private' });
      if (!(path in tree)) return answer(422, { detail: `${path} lies outside` });
      return answer(200, { path, parent: path === '' ? null : path === '/r' ? '' : '/r',
        dirs: tree[path].map(([name, full]) => ({ name, path: full })), truncated: false });
    };
    const settle = () => new Promise((r) => setTimeout(r, 30));
    const key = (element, name) => element.dispatchEvent(new KeyboardEvent('keydown', { key: name, bubbles: true, cancelable: true }));
    const optionsOf = (dialog) => [...dialog.querySelectorAll('[role="option"]')].map((one) => one.textContent.trim()).join();
    const before = document.querySelectorAll('.pk-toast').length;
    try {
      const picked = pk.folderPicker({ url: '/kit-dirs', title: 'Pick', start: '/r' });
      await settle();
      const dialog = document.querySelector('dialog.pk-dialog[open]');
      const list = dialog.querySelector('[role="listbox"]');
      const where = () => dialog.querySelector('.pk-folders-path').textContent;
      const callout = dialog.querySelector('.pk-callout');
      const started = asked[0] === '/r' && optionsOf(dialog) === 'a,b' && where() === '/r' && document.activeElement === list
        && dialog.querySelector('.pk-dialog-title').textContent === 'Pick' && !dialog.querySelector('[data-act="choose"]').disabled;
      key(list, 'ArrowDown');
      key(list, 'ArrowDown');
      key(list, 'ArrowDown');  // past the end stays on the last
      const current = list.querySelector('[aria-selected="true"]');
      const moved = current?.textContent.trim() === 'b' && list.getAttribute('aria-activedescendant') === current.id;
      key(list, 'Enter');  // b is refused
      await settle();
      const refused = callout.textContent === '/r/b is private' && !callout.hidden && optionsOf(dialog) === 'a,b' && where() === '/r';
      key(list, 'Home');
      key(list, 'Enter');
      await settle();
      const opened = where() === '/r/a' && optionsOf(dialog) === '' && callout.hidden
        && !dialog.querySelector('.pk-help').hidden && !dialog.querySelector('[data-act="up"]').disabled;
      dialog.querySelector('[data-act="up"]').click();
      await settle();
      const wentUp = where() === '/r' && asked.at(-1) === '/r';
      key(list, 'Home');
      key(list, 'Enter');
      await settle();
      const reopened = where() === '/r/a';
      key(list, 'Backspace');
      await settle();
      const backspaced = reopened && where() === '/r' && asked.at(-1) === '/r';
      list.querySelector('[data-index="0"]').click();
      dialog.querySelector('[data-act="choose"]').click();
      const chosen = (await picked) === '/r/a' && !document.querySelector('dialog.pk-dialog');

      const shownPick = pk.folderPicker({ url: '/kit-dirs', start: '/r/a' });  // none selected: the folder shown
      await settle();
      document.querySelector('dialog.pk-dialog[open] [data-act="choose"]').click();
      const shownChosen = (await shownPick) === '/r/a';

      const cancelled = pk.folderPicker({ url: '/kit-dirs' });
      await settle();
      const top = document.querySelector('dialog.pk-dialog[open]');
      const atTop = top.querySelector('[data-act="choose"]').disabled && top.querySelector('[data-act="up"]').disabled
        && top.querySelector('.pk-folders-path').textContent === 'The allowed folders' && optionsOf(top) === '/r';
      top.close();  // what Escape ends in
      const none = (await cancelled) === null;

      const stale = pk.folderPicker({ url: '/kit-dirs', start: '/gone' });
      await settle();
      await settle();
      const fallback = document.querySelector('dialog.pk-dialog[open]');
      const fellBack = fallback.querySelector('.pk-callout').textContent === '/gone lies outside'
        && !fallback.querySelector('.pk-callout').hidden && optionsOf(fallback) === '/r';
      fallback.querySelector('[data-act="cancel"]').click();
      const staleNone = (await stale) === null;
      const quiet = document.querySelectorAll('.pk-toast').length === before;  // the dialog says it, not a toast
      return started && moved && refused && opened && wentUp && backspaced && chosen && shownChosen && atTop && none && fellBack && staleNone && quiet;
    } finally {
      window.fetch = realFetch;
      document.querySelectorAll('dialog.pk-dialog').forEach((one) => one.remove());
    }
  });

  await fetch('/__results', { method: 'POST', body: JSON.stringify(results) });
</script>
