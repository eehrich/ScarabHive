<!doctype html>
<html class="pk-root" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>panel-kit.js tests</title>
  <link rel="stylesheet" href="/static/kit/kit.css">
</head>
<body>
<div class="pk-tabs" role="tablist" data-pk-tabs>
  <button class="pk-tab" role="tab" aria-selected="true" aria-controls="t-a" data-tab="a">A</button>
  <button class="pk-tab" role="tab" aria-selected="false" aria-controls="t-b" data-tab="b">B</button>
</div>
<div id="t-a" role="tabpanel">a</div>
<div id="t-b" role="tabpanel" hidden>b</div>
<script type="module">
  import * as pk from '/static/kit/panel-kit.js';

  const results = {};
  const check = async (name, fn) => {
    try { results[name] = (await fn()) === true ? 'ok' : 'failed'; }
    catch (error) { results[name] = `error: ${error}`; }
  };
  const nextFrame = () => new Promise((r) => setTimeout(r, 0));

  await check('html escapes interpolated markup', () => {
    const out = String(pk.html`<p title="${'"><img src=x onerror=alert(1)>'}">${'<b>x</b>'}</p>`);
    return !out.includes('<img') && !out.includes('<b>') && out.includes('&quot;&gt;&lt;img');
  });

  await check('html keeps nested html and joins arrays', () => {
    const items = ['<i>', 'b'].map((v) => pk.html`<li>${v}</li>`);
    return String(pk.html`<ul>${items}</ul>`) === '<ul><li>&lt;i&gt;</li><li>b</li></ul>';
  });

  await check('trusted markup passes unchanged', () => String(pk.html`${pk.trusted('<b>ok</b>')}`) === '<b>ok</b>');

  await check('jsonView escapes keys and strings', () => {
    const out = String(pk.jsonView({ '<k>': '<img src=x onerror=alert(1)>' }));
    return !out.includes('<img') && !out.includes('<k>') && out.includes('&lt;k&gt;');
  });

  await check('jsonView shows every level, strings as text with their line breaks, arrays as lists', () => {
    const box = document.createElement('div');
    document.body.appendChild(box);
    try {
      box.style.width = '600px';
      pk.render(box, pk.jsonView({ note: 'one\ntwo', nested: { deep: { n: 1 } }, list: ['x', { k: 'v' }], none: [], nil: null,
        short: 'beside', long: 'word '.repeat(30) }));
      const keyOf = (key) => [...box.querySelectorAll('.pk-json-key')].find((k) => k.textContent === key);
      const valueOf = (key) => keyOf(key).nextElementSibling;
      const note = valueOf('note');
      // a text starts on its key's line and wraps back to the left edge under the key -- no column right of the key
      const onKeyLine = (key) => Math.abs(valueOf(key).getClientRects()[0].top - keyOf(key).getBoundingClientRect().top) < 4;
      const flowsUnder = (key) => {
        const lines = valueOf(key).getClientRects();  // a line break may leave an empty fragment on the first line
        const last = lines[lines.length - 1];
        return onKeyLine(key) && last.top > lines[0].top && last.left <= keyOf(key).getBoundingClientRect().left + 1;
      };
      const indented = box.querySelector('.pk-json-field--nested > .pk-json-object');
      return note.textContent === 'one\ntwo' && getComputedStyle(note).whiteSpace === 'pre-wrap'
        && !box.querySelector('details') && keyOf('n').getClientRects().length > 0  // nothing folded away
        && getComputedStyle(indented).borderLeftWidth === '2px'
        && box.querySelectorAll(':scope .pk-json-list > li').length === 2
        && box.textContent.includes('no items') && !box.textContent.includes('"')  // strings without quotes
        && onKeyLine('short') && valueOf('short').getClientRects().length === 1
        && flowsUnder('note') && flowsUnder('long');
    } finally {
      box.remove();
    }
  });

  await check('native confirm is refused, not blocking', () => window.confirm('x') === false);

  await check('a dialog resolves with the pressed action', async () => {
    const answer = pk.confirm('Delete?', { danger: true });
    await nextFrame();
    const dialog = document.querySelector('dialog.pk-dialog[open]');
    dialog.querySelector('.pk-btn--danger').click();
    return (await answer) === true && !document.querySelector('dialog.pk-dialog');
  });

  await check('a prompt resolves with the typed text', async () => {
    const answer = pk.prompt('Name?', { value: 'old' });
    await nextFrame();
    const field = document.querySelector('dialog.pk-dialog[open] input[name="value"]');
    field.value = 'new name';
    document.querySelector('dialog.pk-dialog[open] .pk-btn--primary').click();
    return (await answer) === 'new name';
  });

  await check('dismissing a dialog resolves null', async () => {
    const answer = pk.alert('Hi');
    await nextFrame();
    document.querySelector('dialog.pk-dialog[open]').close();
    return (await answer) === null;
  });

  await check('tabs switch their panels', () => {
    document.querySelector('[data-tab="b"]').click();
    return document.getElementById('t-a').hidden && !document.getElementById('t-b').hidden
      && document.querySelector('[data-tab="b"]').getAttribute('aria-selected') === 'true';
  });

  await check('autoRefresh starts and stops', () => {
    const control = pk.autoRefresh(() => {}, 1000);
    control.start();
    const started = control.running;
    control.stop();
    return started && !control.running;
  });

  await check('api turns an HTTP error into ApiError', async () => {
    try {
      await pk.api('/static/kit/does-not-exist.json', { quiet: true });
      return false;
    } catch (error) {
      return error instanceof pk.ApiError && error.status === 404;
    }
  });

  await check('overlays cast a shadow', () => {
    const menu = document.createElement('div');
    menu.className = 'pk-menu';
    document.body.appendChild(menu);
    const shadow = getComputedStyle(menu).boxShadow;
    menu.remove();
    return shadow !== 'none' && shadow !== '';
  });

  await check('an empty tab list does not break the kit', () => {
    const list = document.createElement('div');
    list.setAttribute('data-pk-tabs', '');
    document.body.appendChild(list);
    pk.initTabs();
    return true;
  });

  await check('tabs are wired once however often initTabs runs', () => {
    let changes = 0;
    const list = document.querySelector('[data-pk-tabs][role="tablist"]');
    list.addEventListener('tabchange', () => { changes += 1; });
    pk.initTabs();
    document.querySelector('[data-tab="a"]').click();
    return changes === 1;
  });

  await check('pk-refresh falls back to a sane interval', () => {
    const control = document.createElement('pk-refresh');
    control.setAttribute('interval', '0');
    document.body.appendChild(control);
    const label = control.querySelector('[data-act="auto"]').textContent;
    control.remove();
    return label === '5s';
  });

  await check('icon escapes its size', () => !String(pk.icon('bug', { size: '"><img src=x>' })).includes('<img'));

  await check('api reports a broken body like any other failure', async () => {
    const before = document.querySelectorAll('.pk-toast').length;
    try {
      await pk.api('/tests/ui/kit_broken.json');
      return false;
    } catch (error) {
      return error instanceof SyntaxError && document.querySelectorAll('.pk-toast').length === before + 1;
    }
  });

  await check('a frame that is not the shell answers dialogs itself', () => new Promise((resolve) => {
    window.addEventListener('message', (event) => {
      if (event.data && event.data.probe === 'frame') resolve(event.data.ok === true);
    });
    const frame = document.createElement('iframe');
    frame.src = '/tests/ui/kit_frame_probe.html';
    document.body.appendChild(frame);
  }));

  await check('tabs rendered later still switch', () => {
    const list = document.querySelector('[data-pk-tabs][role="tablist"]');
    list.insertAdjacentHTML('beforeend', '<button class="pk-tab" role="tab" aria-selected="false" aria-controls="t-c" data-tab="c">C</button>');
    document.body.insertAdjacentHTML('beforeend', '<div id="t-c" role="tabpanel" hidden>c</div>');
    document.querySelector('[data-tab="c"]').click();
    return !document.getElementById('t-c').hidden && document.getElementById('t-a').hidden;
  });

  await check('the handshake delivers early calls and visibility', () => new Promise((resolve) => {
    const seen = [];
    let frame;
    window.addEventListener('message', (event) => {
      if (!frame || event.source !== frame.contentWindow) return;
      const m = event.data || {};
      if (m.type === 'pk:ready') {
        seen.push('ready');
        frame.contentWindow.postMessage({ type: 'pk:init', v: 1, theme: 'dark', visible: false, session: null }, location.origin);
      } else if (m.type === 'pk:title' || m.type === 'pk:navigate') {
        seen.push(m.type === 'pk:title' ? m.text : m.path);
      } else if (m.probe === 'shell') {
        setTimeout(() => resolve(m.hiddenAfterInit === true && seen.includes('Early title')
          && seen.includes('/early/path') && seen[0] === 'ready'), 50);
      }
    });
    frame = document.createElement('iframe');
    frame.src = '/tests/ui/kit_shell_probe.html';
    document.body.appendChild(frame);
  }));

  await check('a menu opens at its button', async () => {
    document.body.insertAdjacentHTML('beforeend', `
      <button id="menu-left" popovertarget="kit-menu-left" style="position:fixed;left:40px;top:60px">Left</button>
      <div id="kit-menu-left" class="pk-menu" popover><button class="pk-menu-item">One</button></div>
      <button id="menu-right" popovertarget="kit-menu-right" style="position:fixed;right:30px;top:60px">Right</button>
      <div id="kit-menu-right" class="pk-menu" popover><button class="pk-menu-item">Two</button></div>`);
    const at = (id) => {
      document.getElementById(`menu-${id}`).click();
      const button = document.getElementById(`menu-${id}`).getBoundingClientRect();
      const menu = document.getElementById(`kit-menu-${id}`).getBoundingClientRect();
      document.getElementById(`kit-menu-${id}`).hidePopover();
      return { button, menu };
    };
    const left = at('left');
    const right = at('right');
    return Math.abs(left.menu.top - (left.button.bottom + 4)) < 1 && Math.abs(left.menu.left - left.button.left) < 1
      && Math.abs(right.menu.right - right.button.right) < 1;
  });

  await check('a menu stays inside the window however wide or tall it is', async () => {
    document.body.insertAdjacentHTML('beforeend', `
      <button id="menu-edge" popovertarget="kit-menu-edge" style="position:fixed;right:10px;bottom:20px">Edge</button>
      <div id="kit-menu-edge" class="pk-menu" popover style="width:4000px">
        ${Array.from({ length: 80 }, (_, i) => `<button class="pk-menu-item">Item ${i}</button>`).join('')}
      </div>`);
    document.getElementById('menu-edge').click();
    const element = document.getElementById('kit-menu-edge');
    const menu = element.getBoundingClientRect();
    // the cap is only half of it: the items below it have to be reachable, not painted out of the window
    element.scrollTop = element.scrollHeight;
    const last = element.lastElementChild.getBoundingClientRect();
    const scrolled = element.scrollTop > 0 && last.bottom <= menu.bottom + 1 && last.top >= menu.top - 1;
    element.hidePopover();
    const room = { width: document.documentElement.clientWidth, height: document.documentElement.clientHeight };
    return menu.left >= 0 && menu.right <= room.width && menu.top >= 0 && menu.bottom <= room.height && scrolled;
  });

  await check('a theme change reaches its listeners once', () => {
    const seen = [];
    const stop = pk.onThemeChange((theme) => seen.push(theme));
    pk.setTheme('light');
    pk.setTheme('light');
    pk.setTheme('dark');
    stop();
    pk.setTheme('system');
    return seen.join(',') === 'light,dark';
  });

  await check('a destructive dialog starts on the safe button', async () => {
    const answer = pk.confirm('Delete everything?', { danger: true, confirmLabel: 'Delete' });
    await nextFrame();
    const focused = document.activeElement.textContent.trim();
    document.querySelector('dialog.pk-dialog[open]').close();
    return focused === 'Cancel' && (await answer) === false;
  });

  await check('pk-refresh with auto refreshes from the start, and its button stops it', () => {
    const control = document.createElement('pk-refresh');
    control.setAttribute('auto', '');
    document.body.appendChild(control);
    const toggle = control.querySelector('[data-act="auto"]');
    const startedOn = control.auto.running && toggle.getAttribute('aria-pressed') === 'true';
    toggle.click();
    const stopped = !control.auto.running && toggle.getAttribute('aria-pressed') === 'false';
    control.remove();
    localStorage.removeItem(`pk.refresh:${location.pathname}`);  // the pause above was remembered: this is a viewer who chose nothing
    const plain = document.createElement('pk-refresh');
    document.body.appendChild(plain);
    const plainOff = !plain.auto.running && plain.querySelector('[data-act="auto"]').getAttribute('aria-pressed') === 'false';
    plain.remove();
    return startedOn && stopped && plainOff;
  });

  await check('pk-refresh remembers the viewer\'s interval and pause per page', async () => {
    const key = `pk.refresh:${location.pathname}`;
    localStorage.removeItem(key);
    const make = (attrs) => {
      const control = document.createElement('pk-refresh');
      for (const [name, value] of Object.entries(attrs)) control.setAttribute(name, value);
      document.body.appendChild(control);
      return control;
    };
    const state = (control) => ({
      label: control.querySelector('[data-act="auto"]').textContent,
      pressed: control.querySelector('[data-act="auto"]').getAttribute('aria-pressed'),
      running: control.auto.running,
      checked: [...control.querySelectorAll('[data-interval][aria-pressed="true"]')].map((item) => item.dataset.interval).join(),
      steps: [...control.querySelectorAll('[data-interval]')].map((item) => item.dataset.interval).join(),
    });
    const first = make({ interval: '15', auto: '' });
    const defaults = state(first);
    first.querySelector('[data-act="interval"]').click();
    await nextFrame();
    const menu = first.querySelector('.pk-menu');
    const opened = menu.matches(':popover-open');
    menu.querySelector('[data-interval="60"]').click();
    const picked = { ...state(first), closed: !menu.matches(':popover-open') };
    first.remove();
    const again = make({ interval: '15' });  // no auto: the stored choice wins over the template
    const restored = state(again);
    again.querySelector('[data-act="interval"]').click();
    await nextFrame();
    again.querySelector('[data-interval="off"]').click();
    const paused = { ...state(again), closed: !again.querySelector('.pk-menu').matches(':popover-open') };
    again.remove();
    const third = make({ interval: '15', auto: '' });
    const stillPaused = state(third);
    third.querySelector('[data-act="auto"]').click();
    const resumed = JSON.parse(localStorage.getItem(key));
    third.remove();
    localStorage.setItem(key, '{"interval": 0, "on": true}');
    const broken = make({ interval: '10' });
    const brokenState = state(broken);
    broken.remove();
    localStorage.removeItem(key);
    return defaults.label === '15s' && defaults.running && defaults.checked === '15' && defaults.steps === '5,10,15,30,60,off'
      && opened && picked.label === '1m' && picked.running && picked.checked === '60' && picked.closed
      && restored.label === '1m' && restored.running && restored.pressed === 'true'
      && restored.steps === '5,10,15,30,60,off'  // the page's own 15s stays on offer next to the viewer's 1m
      && !paused.running && paused.checked === 'off' && paused.label === '1m' && paused.closed
      && !stillPaused.running && stillPaused.label === '1m' && stillPaused.pressed === 'false'
      && resumed.on === true && resumed.interval === 60
      && brokenState.label === '10s' && !brokenState.running;
  });

  await check('a refresh says whether the viewer or the timer asked', () => {
    const control = document.createElement('pk-refresh');
    document.body.appendChild(control);
    let detail = null;
    control.addEventListener('refresh', (event) => { detail = event.detail; });
    control.querySelector('[data-act="now"]').click();
    control.remove();
    return detail && detail.auto === false;
  });

  await check('hidden hides whatever display a component sets', () => {
    const card = document.createElement('div');
    card.className = 'pk-stack';
    card.hidden = true;
    document.body.appendChild(card);
    const display = getComputedStyle(card).display;
    card.remove();
    return display === 'none';
  });

  await check('a panel pushed narrow scrolls sideways with its scrollbar in view, and prose tables still wrap', async () => {
    const cell = (text) => `<td style="white-space: nowrap">${text}</td>`;
    const rows = Array.from({ length: 60 }, (_, i) => `<tr>${cell(`row ${i} ${'wide '.repeat(12)}`)}${cell('more wide text here')}</tr>`).join('');
    const frame = document.createElement('iframe');
    frame.style.cssText = 'width: 320px; height: 400px; border: 0';
    frame.srcdoc = `<!doctype html><html class="pk-root"><head><link rel="stylesheet" href="/static/kit/kit.css"></head>
      <body class="pk-panel"><header class="pk-page-header"><h1 class="pk-page-title">T</h1></header>
      <main class="pk-page-body">
        <div class="pk-table-wrap" id="prose"><table class="pk-table"><tr><td>${'word '.repeat(200)}</td></tr></table></div>
        <pre class="pk-code" id="code">${'line\n'.repeat(30)}</pre>
        <div class="pk-table-wrap" id="wide"><table class="pk-table"><thead><tr><th>Name</th><th>More</th></tr></thead>${rows}</table></div>
      </main></body></html>`;
    await new Promise((resolve) => { frame.onload = resolve; document.body.appendChild(frame); });
    const doc = frame.contentDocument;
    const body = doc.querySelector('.pk-page-body');
    const wide = doc.getElementById('wide');
    const code = doc.getElementById('code');
    // the body scrolls, not the page: the header stays where it is, and the body's scrollbar ends in view
    const header = doc.querySelector('.pk-page-header');
    body.scrollLeft = 60;
    const scrollsSideways = body.scrollLeft === 60 && header.getBoundingClientRect().left === 0
      && doc.scrollingElement.scrollWidth === doc.scrollingElement.clientWidth && body.getBoundingClientRect().bottom <= 400;
    // scrolled down past the table's top, its head stays at the top of the body
    body.scrollTop = wide.offsetTop + 300;
    const th = wide.querySelector('th');
    const headSticks = Math.abs(th.getBoundingClientRect().top - body.getBoundingClientRect().top) <= 1;
    // a row the keyboard moves to while it sits under the stuck head is scrolled clear of it
    const row = wide.querySelectorAll('tbody tr')[30];
    row.tabIndex = 0;
    body.scrollTop += row.getBoundingClientRect().top - body.getBoundingClientRect().top - 10;
    const underHead = row.getBoundingClientRect().top < th.getBoundingClientRect().bottom;
    row.focus();
    const focusClear = underHead && row.getBoundingClientRect().top >= th.getBoundingClientRect().bottom;
    body.scrollTop = 0;
    body.scrollLeft = 0;
    // the table box is no scroller of its own: its scrollbar would sit at the table's end, far below the view
    const boxScrollsNot = wide.scrollWidth === wide.clientWidth && wide.getBoundingClientRect().height > 400;
    const proseWraps = doc.getElementById('prose').getBoundingClientRect().width <= body.clientWidth;
    // a clipping child keeps its height in the scrolling column instead of being squeezed
    const codeKept = code.getBoundingClientRect().height === Math.min(code.scrollHeight, 480);
    frame.remove();
    return scrollsSideways && headSticks && focusClear && boxScrollsNot && proseWraps && codeKept;
  });

  // sortable tables: a table as a panel renders it, and what a viewer sees of it
  const sortableTable = (name, head, body) => pk.trusted(
    `<table class="pk-table" data-pk-sort="${name}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`);
  const size = (value, shown = value) => `<td class="pk-num" data-sort-value="${value}">${shown}</td>`;
  const column = (box, i) => [...box.querySelectorAll('tbody tr')].map((tr) => tr.cells[i].textContent).join('|');
  const head = (box, text) => [...box.querySelectorAll('th')].find((th) => th.textContent.trim() === text);
  const clickHead = (box, text) => head(box, text).querySelector('.pk-sort').click();

  await check('a sortable table sorts by the head the viewer clicks: numbers biggest first, text A to Z, a second click reverses', () => {
    const box = document.createElement('div');
    document.body.appendChild(box);
    pk.render(box, sortableTable('t-click', '<th>Name</th><th class="pk-num">Size</th><th data-pk-nosort>Note</th><th></th>',
      `<tr><td>B10</td>${size(9)}<td>x</td><td></td></tr><tr><td>b9</td>${size(1000, '1,000')}<td>x</td><td></td></tr>`
      + `<tr><td>a</td>${size(10)}<td>x</td><td></td></tr>`));
    const untouched = column(box, 0) === 'B10|b9|a';
    const buttons = [...box.querySelectorAll('th')].map((th) => Boolean(th.querySelector(':scope > button.pk-sort')));
    clickHead(box, 'Size');
    const biggestFirst = column(box, 1) === '1,000|10|9';
    clickHead(box, 'Size');
    const reversed = column(box, 1) === '9|10|1,000';
    head(box, 'Name').click();  // the cell around the text sorts too
    const natural = column(box, 0) === 'a|b9|B10';
    const marked = head(box, 'Name').getAttribute('aria-sort') === 'ascending' && !head(box, 'Size').hasAttribute('aria-sort');
    box.remove();
    return untouched && buttons.join() === 'true,true,false,false' && biggestFirst && reversed && natural && marked;
  });

  await check('a chosen order holds through a re-render and follows its head when a column comes or goes, empty cells last', () => {
    const box = document.createElement('div');
    document.body.appendChild(box);
    pk.render(box, sortableTable('t-keep', '<th>Name</th><th class="pk-num">Size</th>',
      `<tr><td>a</td>${size(1)}</tr><tr><td>b</td>${size(3)}</tr>`));
    clickHead(box, 'Size');
    // the next load: other rows, sizes missing or dashed, and a column shown in front of the others
    pk.render(box, sortableTable('t-keep', '<th>Session</th><th>Name</th><th class="pk-num">Size</th>',
      `<tr><td>s</td><td>c</td>${size(2)}</tr><tr><td>s</td><td>d</td>${size('', '–')}</tr>`
      + `<tr><td>s</td><td>e</td>${size(5)}</tr><tr><td>s</td><td>f</td><td class="pk-num">–</td></tr>`));
    const kept = column(box, 1) === 'e|c|d|f' && head(box, 'Size').getAttribute('aria-sort') === 'descending';
    clickHead(box, 'Size');
    const emptiesLast = column(box, 1) === 'c|e|d|f';
    // a panel that renders only the rows
    pk.render(box.querySelector('tbody'), pk.trusted(`<tr><td>s</td><td>g</td>${size(9)}</tr><tr><td>s</td><td>h</td>${size(4)}</tr>`));
    const intoBody = column(box, 1) === 'h|g';
    box.remove();
    return kept && emptiesLast && intoBody;
  });

  await check('the order the markup names holds until the viewer picks one, and ties keep the rendered order', () => {
    const box = document.createElement('div');
    document.body.appendChild(box);
    pk.render(box, sortableTable('t-marked', '<th>Name</th><th class="pk-num" aria-sort="descending">Size</th>',
      `<tr><td>a</td>${size(1)}</tr><tr><td>b</td>${size(7)}</tr><tr><td>c</td>${size(1)}</tr><tr><td>d</td>${size(7)}</tr>`));
    const ordered = column(box, 0) === 'b|d|a|c';
    clickHead(box, 'Name');
    clickHead(box, 'Name');  // Z to A: d c b a
    clickHead(box, 'Size');  // back to the sizes: equal ones in the order they came, not the order Z to A left
    const ties = column(box, 0) === 'b|d|a|c';
    box.remove();
    return ordered && ties;
  });

  await check('timestamps sort as points in time, with or without a fraction of a second, in any offset, and without one as UTC', () => {
    const box = document.createElement('div');
    document.body.appendChild(box);
    const at = (name, iso) => `<tr><td>${name}</td><td data-sort-value="${iso}">${name}</td></tr>`;
    pk.render(box, sortableTable('t-time', '<th>Name</th><th>When</th>',
      at('half-past', '2026-09-16T10:00:00.500000+00:00') + at('on-the-second', '2026-09-16T10:00:00+00:00')
      + at('earliest', '2026-09-16T11:30:00+02:00')));
    clickHead(box, 'When');
    const ascending = column(box, 0);
    // read as local time, half-past-ten would move before 12:15 at +02:00 east of UTC and after 05:45 at -05:00 west
    // of it; where the clocks go forward on 29 March (as on this machine), the last two would turn round as well
    pk.render(box, sortableTable('t-utc', '<th>Name</th><th>When</th>',
      at('half-past-ten', '2026-09-16 10:30:00') + at('quarter-past-noon-at-two', '2026-09-16T12:15:00+02:00')
      + at('quarter-to-six-at-minus-five', '2026-09-16T05:45:00-05:00')
      + at('ten-past-three', '2026-03-29 03:10:00') + at('half-past-two', '2026-03-29 02:30:00')));
    clickHead(box, 'When');
    const utc = column(box, 0);
    box.remove();
    return ascending === 'earliest|on-the-second|half-past'
      && utc === 'half-past-two|ten-past-three|quarter-past-noon-at-two|half-past-ten|quarter-to-six-at-minus-five';
  });

  await check('a column sorts as numbers only when all its values but the blank ones are numbers, else all as text, whatever order the rows came in', () => {
    const box = document.createElement('div');
    document.body.appendChild(box);
    const ascending = (values) => {
      pk.render(box, sortableTable('t-mixed', '<th>Value</th>', values.map((value) => `<tr><td>${value}</td></tr>`).join('')));
      if (!head(box, 'Value').hasAttribute('aria-sort')) clickHead(box, 'Value');
      return column(box, 0);
    };
    // pair by pair "-10" < "-5" as numbers, but "-5" < "-5x" < "-10" as text: no order at all
    const orders = [['-10', '-5', '-5x'], ['-5x', '-10', '-5'], ['-5', '-5x', '-10']].map(ascending);
    // blank cells have no say: decimals still sort as numbers -- as text "1.5" would come before "1.25"
    pk.render(box, sortableTable('t-decimals', '<th>Value</th>', ['1.5', '–', '1.25', ''].map((value) => `<tr><td>${value}</td></tr>`).join('')));
    clickHead(box, 'Value');
    const decimals = column(box, 0);
    box.remove();
    return orders.every((order) => order === '-5|-5x|-10') && decimals === '1.25|1.5|–|';
  });

  await check('a head holding a control of its own is left as it is', () => {
    const box = document.createElement('div');
    document.body.appendChild(box);
    pk.render(box, sortableTable('t-control', '<th><input type="checkbox" aria-label="Select all"> All</th>'
      + '<th><a href="#top">Name</a></th><th>Size</th>', '<tr><td></td><td>b</td><td>1</td></tr><tr><td></td><td>a</td><td>2</td></tr>'));
    const buttons = [...box.querySelectorAll('th')].map((th) => Boolean(th.querySelector('.pk-sort')));
    box.querySelector('th input').click();
    const unsorted = column(box, 1) === 'b|a' && !box.querySelector('th[aria-sort]');
    box.remove();
    return buttons.join() === 'false,false,true' && unsorted;
  });

  await check('the keyboard stays on the column head it sorted with when the table is drawn anew', () => {
    const box = document.createElement('div');
    document.body.appendChild(box);
    const draw = (rows) => pk.render(box, sortableTable('t-focus', '<th>Name</th><th class="pk-num">Size</th>', rows));
    draw(`<tr><td>a</td>${size(1)}</tr>`);
    const button = head(box, 'Size').querySelector('.pk-sort');
    button.focus();
    button.click();
    draw(`<tr><td>a</td>${size(1)}</tr><tr><td>b</td>${size(2)}</tr>`);
    const focused = document.activeElement;
    const kept = focused !== button && focused.classList.contains('pk-sort') && focused.textContent === 'Size'
      && box.contains(focused) && column(box, 0) === 'b|a';
    // a head the keyboard is not on is left alone
    focused.blur();
    draw(`<tr><td>c</td>${size(3)}</tr>`);
    const untouched = !box.contains(document.activeElement);
    box.remove();
    return kept && untouched;
  });

  await fetch('/__results', { method: 'POST', body: JSON.stringify(results) });
</script>
</body>
</html>
