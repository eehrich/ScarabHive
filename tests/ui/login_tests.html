<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login page tests</title>
  <style>body { margin: 0; } iframe { width: 600px; height: 700px; border: 0; }</style>
</head>
<body>
<iframe id="page" title="page"></iframe>
<script type="module">
  // The real login page against a stub server (test_login_browser.py).
  const results = {};
  const check = async (name, fn) => {
    try { results[name] = (await fn()) === true ? 'ok' : 'failed'; }
    catch (error) { results[name] = `error: ${error && error.message}`; }
  };
  const need = (ok, why) => { if (!ok) throw new Error(why); return true; };
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  async function until(what, predicate, timeout = 10000) {
    const end = performance.now() + timeout;
    for (;;) {
      let value = null;
      try { value = await predicate(); } catch { /* not there yet */ }
      if (value) return value;
      if (performance.now() > end) throw new Error(`timed out waiting for ${what}`);
      await sleep(30);
    }
  }
  const frame = document.getElementById('page');
  const doc = () => frame.contentDocument;
  const $ = (id) => doc().getElementById(id);
  const visible = (id) => $(id) && !$(id).hidden;
  const sent = async () => (await fetch('/__stub/sent')).json();
  let opened = 0;
  async function open(query = '', hash = '') {
    const loaded = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
    // a query of its own each time: a change of the fragment alone would not load the page anew
    frame.src = `/login?n=${++opened}${query ? `&${query}` : ''}${hash}`;
    await loaded;
    await until('the page script', () => $('loginForm') && doc().readyState === 'complete');
    await sleep(100);  // the module has run
    return doc();
  }
  function type(id, value) {
    $(id).value = value;
    $(id).dispatchEvent(new Event('input', { bubbles: true }));
  }

  await check('forgot password asks for the address and brings the answer back to the sign-in form', async () => {
    await open();
    need(visible('loginForm') && !visible('forgotForm'), 'the sign-in form first');
    type('username', 'alice@example.com');
    $('forgotLink').click();
    need(visible('forgotForm') && !visible('loginForm'), 'the address form');
    need($('forgotEmail').value === 'alice@example.com', 'the address typed as username is carried over');
    $('forgotButton').click();
    await until('the answer', () => visible('loginNotice'));
    const [last] = (await sent()).slice(-1);
    return need(visible('loginForm') && $('loginNotice').textContent.includes('on its way')
      && $('loginNotice').textContent.includes('30 minutes'), 'the answer on the sign-in form')
      && need(last.path === 'request' && last.email === 'alice@example.com', `sent ${JSON.stringify(last)}`);
  });

  await check('a reset link opens the new password form and takes the token out of the address bar', async () => {
    await open('return=%2Fx', '#reset=good');
    const { search, hash } = frame.contentWindow.location;
    return need(visible('resetForm') && !visible('loginForm'), 'the new password form')
      && need(hash === '' && search.includes('return'), `the address bar keeps ${search}${hash}`);
  });

  await check('two different passwords are refused before anything is sent', async () => {
    const before = (await sent()).length;
    type('newPassword', 'newpassword456');
    type('newPasswordAgain', 'newpassword457');
    $('resetButton').click();
    await until('the refusal', () => visible('loginError'));
    await sleep(300);
    return need($('loginError').textContent.includes('differ'), 'says why')
      && need((await sent()).length === before, 'something was sent');
  });

  await check('the reset link sets the password and sends the user to sign in', async () => {
    type('newPasswordAgain', 'newpassword456');
    $('resetButton').click();
    await until('the answer', () => visible('loginNotice'));
    const [last] = (await sent()).slice(-1);
    return need(visible('loginForm') && !visible('resetForm'), 'back on the sign-in form')
      && need($('loginNotice').textContent.includes('sign in with it'), 'says so')
      && need(last.path === 'reset' && last.token === 'good' && last.new_password === 'newpassword456',
        `sent ${JSON.stringify(last)}`);
  });

  await check('a spent link says so and sets nothing', async () => {
    await open('', '#reset=spent');
    type('newPassword', 'newpassword456');
    type('newPasswordAgain', 'newpassword456');
    $('resetButton').click();
    await until('the refusal', () => visible('loginError'));
    return need($('loginError').textContent.includes('not valid any more'), 'the server says why')
      && need(visible('resetForm'), 'the form stays');
  });

  await check('someone signed in who opens a reset link stays to set the password', async () => {
    document.cookie = 'stub_me=in; path=/';
    try {
      await open('', '#reset=good');
      await sleep(500);  // past /auth/me
      return need(frame.contentWindow.location.pathname === '/login' && visible('resetForm'), 'sent away');
    } finally {
      document.cookie = 'stub_me=; path=/; max-age=0';
    }
  });

  await fetch('/__results', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(results) });
</script>
</body>
</html>
